}

  function scroller(child, label) {
    var d = el("div", "sc"); d.tabIndex = 0; d.setAttribute("role", "region"); d.setAttribute("aria-label", label);
    d.appendChild(child); return d;
  }

  // ---- copy, with a visible fallback and a polite announcement ------------------------
  var live = el("p", "sr"); live.setAttribute("role", "status");
  function say(t) { live.textContent = ""; setTimeout(function () { live.textContent = t; }, 30); }
  function flash(btn, t) {
    if (!btn.dataset.o) btn.dataset.o = btn.textContent;
    btn.textContent = t; clearTimeout(btn._t);
    btn._t = setTimeout(function () { btn.textContent = btn.dataset.o; btn.dataset.o = ""; }, 1200);
  }
  function copy(text, btn) {
    var ok = function () { flash(btn, "copied"); say("Copied"); };
    var fail = function () {
      var inp = el("input", "pick"); inp.readOnly = true; inp.value = text; inp.setAttribute("aria-label", "Command to copy");
      btn.parentNode.insertBefore(inp, btn.nextSibling); inp.focus(); inp.select();
      inp.addEventListener("blur", function () { inp.remove(); });
      say("Copy failed. The command is selected: " + text);
    };
    try { navigator.clipboard.writeText(text).then(ok, fail); } catch (e) { fail(); }
  }

  // ---- source chips: a link when a durable https target exists, always a copy button -----
  // ref = {file?, lines?, sha?, url?, cmd?, label?, v?: "ok"|"gone", snip?}
  function ref(r) {
    if (!r || typeof r !== "object") return document.createTextNode("");
    var repo = https(G && G.repo); if (repo) repo = repo.replace(/\.git$/, "");
    var lines = r.lines ? "#L" + str(r.lines).replace("-", "-L") : "";
    var href = https(r.url) || (repo && r.sha && r.file ? repo + "/blob/" + r.sha + "/" + r.file + lines : (repo && r.sha ? repo + "/commit/" + r.sha : null));
    var label = r.label || (r.file ? str(r.file).split("/").pop() + (r.lines ? ":" + r.lines : "") : (r.sha ? str(r.sha).slice(0, 7) : "link"));
    var cmd = r.cmd || (r.sha && r.file ? "git show " + q(r.sha + ":" + r.file) : r.sha ? "git show " + q(r.sha)
      : r.file ? "open -R " + q((G && G.root ? G.root + "/" : "") + r.file) : https(r.url) || "");
    var wrap = el("span", "ref" + (r.v === "gone" ? " gone" : ""));
    var l = href ? el("a", "lbl", label) : el("span", "lbl", label);
    if (href) { l.href = href; l.target = "_blank"; l.rel = "noopener"; }
    if (r.snip) l.title = str(r.snip);
    wrap.appendChild(l);
    if (r.v === "gone") wrap.appendChild(el("span", "why", " gone"));
    if (cmd) {
      var b = el("button", "cp", "⧉"); b.type = "button"; b.title = cmd;
      b.setAttribute("aria-label", "Copy command for " + label);
      b.onclick = function () { copy(cmd, b); }; wrap.appendChild(b);
    }
    return wrap;
  }
  function plain(li, t) { // a string, or {t, ref}
    if (t == null) return;
    if (typeof t !== "object") { li.textContent = str(t); return; }
    li.appendChild(document.createTextNode(str(t.t) + " "));
    if (t.ref) li.appendChild(ref(t.ref));
  }
  function addRef(parent, r) { if (r) { parent.appendChild(document.createTextNode(" ")); parent.appendChild(ref(r)); } }

  // ---- screenshots and the lightbox (built once, so focus stays put) ------------------
  var SHOTS = {}, ORDER = [];
  D.shots.forEach(function (s) { if (s && s.id) { SHOTS[s.id] = s; if (imgSrc(s.src) && !s.gone) ORDER.push(s.id); } });
  var dlg = el("dialog", "lb"); dlg.setAttribute("aria-label", "Screenshot viewer");
  var lbBody = el("div", "lb-body"), lbImg = el("div", "lb-img"), bar = el("div", "lb-bar");
  var capEl = el("div", "grow"); capEl.setAttribute("aria-live", "polite");
  var btnCopy = el("button", null, "copy path"), btnPrev = el("button", null, "prev"), btnNext = el("button", null, "next"), btnClose = el("button", null, "close");
  [btnCopy, btnPrev, btnNext, btnClose].forEach(function (b) { b.type = "button"; });
  bar.appendChild(capEl); bar.appendChild(btnCopy); bar.appendChild(btnPrev); bar.appendChild(btnNext); bar.appendChild(btnClose);
  lbBody.appendChild(lbImg); lbBody.appendChild(bar); dlg.appendChild(lbBody);
  var cur = 0;
  function show(i) {
    cur = (i + ORDER.length) % ORDER.length;
    var s = SHOTS[ORDER[cur]];
    lbImg.textContent = "";
    var im = el("img"); im.src = imgSrc(s.src); im.alt = str(s.caption); lbImg.appendChild(im);
    capEl.textContent = "";
    capEl.appendChild(el("b", null, str(s.caption)));
    capEl.appendChild(el("span", "why", " · " + str(s.kind) + " · " + str(s.when) + " · " + (cur + 1) + "/" + ORDER.length + " · "));
    capEl.appendChild(el("span", "mono", str(s.path)));
    btnCopy.onclick = function () { copy(str(s.path), btnCopy); };
    btnPrev.hidden = btnNext.hidden = ORDER.length < 2;
  }
  btnPrev.onclick = function () { show(cur - 1); };
  btnNext.onclick = function () { show(cur + 1); };
  btnClose.onclick = function () { dlg.close(); };
  dlg.addEventListener("keydown", function (e) {
    if (ORDER.length > 1 && e.key === "ArrowLeft") { show(cur - 1); e.preventDefault(); }
    if (ORDER.length > 1 && e.key === "ArrowRight") { show(cur + 1); e.preventDefault(); }
  });
  function openShot(id) { var i = ORDER.indexOf(id); if (i < 0 || !dlg.showModal) return; show(i); dlg.showModal(); }
  function thumb(id) {
    var s = SHOTS[id]; if (!s) return null;
    if (!imgSrc(s.src) || s.gone) return el("div", "gone", "image gone");
    var b = el("button", "thumb"); b.type = "button"; b.setAttribute("aria-label", "Open: " + str(s.caption));
    var im = el("img"); im.src = imgSrc(s.src); im.alt = ""; im.loading = "lazy";
    b.appendChild(im); b.onclick = function () { openShot(id); }; return b;
  }

  // ---- dates ------------------------------------------------------------------------
  function isoDay(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(str(s)); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function daysSince(d) { var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate()); return Math.max(0, Math.floor((t - d) / 864e5)); }

  // ---- header --------------------------------------------------------------------------
  var head = el("header");
  head.appendChild(el("h1", null, str(D.title) || "Session digest"));
  var la = isoDay(D.last_active), agoTxt = "";
  if (la) { var dd = daysSince(la); agoTxt = "last active " + str(D.last_active).slice(0, 10) + (dd ? " (" + dd + " day" + (dd === 1 ? "" : "s") + " ago)" : " (today)"); }
  var subParts = [str(D.window), agoTxt, D.scope ? "read: " + str(D.scope) : ""].filter(Boolean);
  if (subParts.length) head.appendChild(el("div", "sub", subParts.join(" · ")));
  if (G && G.head) {
    var gl = el("div", "sub gen"), at = new Date(G.at);
    gl.appendChild(document.createTextNode("digest " + (isNaN(at) ? "" : at.toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) + " ") + "at "));
    gl.appendChild(ref({ sha: G.head, label: str(G.head) }));
    gl.appendChild(document.createTextNode(" " + str(G.branch) + (G.dirty ? " + uncommitted" : "")));
    var ageH = isNaN(at) ? NaN : daysSince(new Date(at.getFullYear(), at.getMonth(), at.getDate()));
    var fr = isNaN(ageH) ? ["?", "idle", "age unknown"] : ageH < 2 ? ["✓", "good", "fresh"] : ageH < 7 ? ["◐", "wip", "aging"] : ["!", "bad", "stale"];
    var fc = el("span", "chip " + fr[1]); var fg = el("span", null, fr[0]); fg.setAttribute("aria-hidden", "true");
    fc.appendChild(fg); fc.appendChild(document.createTextNode(" " + fr[2])); gl.appendChild(fc);
    gl.appendChild(document.createTextNode("drift check:"));
    gl.appendChild(ref({ label: "git log " + str(G.head) + "..HEAD", cmd: "git log " + q(str(G.head) + "..HEAD") + " --oneline" }));
    head.appendChild(gl);
  }
  root.appendChild(head);

  // ---- where you were (first), then goals --------------------------------------------------
  if (D.resume && typeof D.resume === "object") {
    var rs = el("section", "panel resume");
    rs.appendChild(el("h2", null, "Where you were"));
    var rp = el("p"); rp.appendChild(el("span", "k", "state")); rp.appendChild(document.createTextNode(str(D.resume.where) || "—")); rs.appendChild(rp);
    var rn = el("p"); rn.appendChild(el("span", "k", "next")); plain(rn, D.resume.next || D.next_step || "—"); rs.appendChild(rn);
    var bl = arr(D.resume.blocked);
    if (bl.length) {
      var rb = el("div"); rb.appendChild(el("span", "k", "waiting on you"));
      var CAUSE = { decision: [FLAG, "wip"], approval: [FLAG, "wip"], input: [FLAG, "wip"], review: [FLAG, "wip"], external: [PAUSE, "idle"] };
      rb.appendChild(list(bl, function (li, b) {
        var o = typeof b === "object" && b ? b : { t: b }, c = CAUSE[o.cause];
        li.className = "lead";
        if (c) { var cc = el("span", "chip " + c[1]); var cg = el("span", null, c[0]); cg.setAttribute("aria-hidden", "true"); cc.appendChild(cg); cc.appendChild(document.createTextNode(" " + o.cause)); li.appendChild(cc); }
        else li.appendChild(el("span", "why", "—"));
        var bb = el("span"); plain(bb, { t: o.t, ref: o.ref }); li.appendChild(bb);
      }));
      rs.appendChild(rb);
    }
    root.appendChild(rs);
  }
  if (D.goals.length) {
    root.appendChild(panel("What you were solving", list(D.goals, function (li, g) {
      g = g || {}; li.className = "lead"; li.appendChild(chip(g.state));
      var gb = el("span"); gb.appendChild(document.createTextNode(str(g.problem) + " "));
      if (g.quote) gb.appendChild(el("span", "why", "“" + str(g.quote) + "”"));
      li.appendChild(gb);
    })));
  }
  var navSlot = el("nav", "jump"); navSlot.setAttribute("aria-label", "Sections");
  root.appendChild(navSlot);

  // ---- state strip ------------------------------------------------------------------------
  var unlogged = D.decisions.filter(function (d) { return d && !d.logged_in; }).length;
  var strip = el("div", "strip");
  [["done", D.done.length, "good"], ["undone", D.undone.length, "bad"], ["deferred", D.deferred.length, "idle"],
   ["decisions unlogged", unlogged, unlogged ? "bad" : "good"], ["open for you", D.owner_open.length, "wip"]
  ].forEach(function (s) {
    var d = el("div", "stat " + s[2]); d.appendChild(el("b", null, String(s[1]))); d.appendChild(el("span", null, s[0])); strip.appendChild(d);
  });
  root.appendChild(strip);

  // ---- map ---------------------------------------------------------------------------------
  if (D.timeline.length) {
    var mp = el("ol", "map");
    D.timeline.forEach(function (n) {
      n = n || {};
      var s = STATE[n.state] || ["·", "idle"], nd = el("li", "node " + s[1] + (n.now ? " now" : ""));
      var dot = el("span", "dot", s[0]); dot.setAttribute("aria-hidden", "true"); nd.appendChild(dot);
      nd.appendChild(el("span", "sr", str(n.state) + ": "));
      nd.appendChild(el("span", "when", str(n.when) + (n.now ? " · now" : "")));
      nd.appendChild(el("span", "what", str(n.label)));
      if (n.ref) nd.appendChild(ref(n.ref));
      var nth = n.shot ? thumb(n.shot) : null;
      if (nth) { var mini = el("div", "mini"); mini.appendChild(nth); nd.appendChild(mini); }
      mp.appendChild(nd);
    });
    root.appendChild(panel("Map", scroller(mp, "Map, scrolls sideways")));
  }

  // ---- evolution, visuals, wording ---------------------------------------------------------------
  if (D.evolution.length) {
    var ev = el("div");
    D.evolution.forEach(function (e) {
      e = e || {};
      ev.appendChild(el("h3", "subject", str(e.subject)));
      var fm = el("ol", "film");
      arr(e.steps).forEach(function (st, i) {
        st = st || {};
        var li = el("li", "step");
        if (i) { var ar = el("span", "arrow", "→"); ar.setAttribute("aria-hidden", "true"); li.appendChild(ar); }
        var fr2 = el("div", "frame"), th = st.shot ? thumb(st.shot) : null;
        if (th) fr2.appendChild(th);
        var cp = el("div", "cap"); cp.appendChild(el("b", null, str(st.label))); cp.appendChild(document.createTextNode(str(st.note)));
        fr2.appendChild(cp); li.appendChild(fr2); fm.appendChild(li);
      });
      ev.appendChild(scroller(fm, str(e.subject) + ", scrolls sideways"));
    });
    root.appendChild(panel("Evolution", ev));
  }
  var shotIds = D.shots.filter(function (s) { return s && s.id; });
  if (shotIds.length) {
    var sh = el("div", "sheet");
    shotIds.forEach(function (s) {
      var box = el("div", "shot");
      box.appendChild(thumb(s.id));
      box.appendChild(el("span", "cap", str(s.caption)));
      box.appendChild(el("span", "meta", str(s.kind) + " · " + str(s.when) + (!imgSrc(s.src) || s.gone ? " · gone" : "")));
      if (!imgSrc(s.src) || s.gone) { var pr = el("span", "meta mono", str(s.path)); box.appendChild(pr); }
      sh.appendChild(box);
    });
    root.appendChild(panel("Visuals", sh));
  }
  if (D.wording.length) {
    var wd = el("div", "wd");
    D.wording.forEach(function (w) {
      w = w || {};
      var r = el("div", "row"); r.appendChild(el("span", "where", str(w.where)));
      var p = el("div");
      var del = el("del"); del.appendChild(el("span", "sr", "was: ")); del.appendChild(document.createTextNode(str(w.before)));
      var arw = el("span", null, "  →  "); arw.setAttribute("aria-hidden", "true");
      var ins = el("ins"); ins.appendChild(el("span", "sr", "now: ")); ins.appendChild(document.createTextNode(str(w.after)));
      p.appendChild(del); p.appendChild(arw); p.appendChild(ins); addRef(p, w.ref);
      r.appendChild(p); wd.appendChild(r);
    });
    root.appendChild(panel("Wording changed", wd));
  }

  // ---- week roll-up, or before/after ----------------------------------------------------------------
  if (D.mode === "week") {
    var wt = el("table"), whr = el("tr");
    [["session"], ["state"], ["product"], ["feature"], ["design"], ["implementation"]].forEach(function (h) { var th = el("th", null, h[0]); th.scope = "col"; whr.appendChild(th); });
    wt.appendChild(whr);
    D.sessions.forEach(function (s) {
      s = s || {};
      var tr = el("tr"), t1 = el("th", null, str(s.title)); t1.scope = "row"; t1.style.fontWeight = "400"; t1.style.color = "inherit"; tr.appendChild(t1);
      var st = el("td"); st.appendChild(chip(s.state)); tr.appendChild(st);
      ["product", "feature", "design", "implementation"].forEach(function (a) {
        var v = s.axes && s.axes[a]; v = v && typeof v === "object" ? v.chose : v; tr.appendChild(el("td", null, str(v) || "—"));
      });
      wt.appendChild(tr);
    });
    root.appendChild(panel("Sessions by axis", D.sessions.length ? scroller(wt, "Sessions by axis, scrolls sideways") : el("p", "empty", "none")));
  } else {
    var g1 = el("div", "grid");
    g1.appendChild(panel("Before", list(D.before, plain)));
    g1.appendChild(panel("After", list(D.after, plain)));
    root.appendChild(g1);
  }

  // ---- reviews and decisions ----------------------------------------------------------------------------
  var g2 = el("div", "grid");
  (function () {
    var wrap = el("div");
    if (!D.reviews.length) wrap.appendChild(el("p", "empty", "no review run"));
    else {
      var t = el("table"), hr = el("tr");
      [["rd", "round"], ["reviewer", "reviewer"], ["H", "high"], ["M", "medium"], ["L", "low"], ["unclassified", "unclassified"]].forEach(function (h) {
        var th = el("th"); th.scope = "col";
        if (h[0] === h[1]) th.textContent = h[0]; else { var ab = el("abbr", null, h[0]); ab.title = h[1]; th.appendChild(ab); }
        hr.appendChild(th);
      });
      t.appendChild(hr);
      D.reviews.forEach(function (r) {
        r = r || {};
        var tr = el("tr"); tr.appendChild(el("td", "mono", str(r.round))); tr.appendChild(el("td", null, str(r.reviewer)));
        ["H", "M", "L", "U"].forEach(function (k) {
          var c = Array.isArray(r[k]) ? r[k] : [Number(r[k]) || 0, 0];
          var f = Number(c[0]) || 0, u = Number(c[1]) || 0, td = el("td"), sq = el("span", "sq"), shown = 0;
          sq.setAttribute("aria-hidden", "true");
          for (var i = 0; i < f && shown < 12; i++, shown++) sq.appendChild(el("i", "f"));
          for (var j = 0; j < u && shown < 12; j++, shown++) sq.appendChild(el("i", "u"));
          td.appendChild(sq);
          td.appendChild(el("span", "num", f + u ? f + " fixed / " + u + " unfixed" : "—"));
          tr.appendChild(td);
        });
        t.appendChild(tr);
      });
      wrap.appendChild(scroller(t, "Reviews, scrolls sideways"));
      var lg = el("div", "legend"); lg.appendChild(el("span", null, "■ fixed")); lg.appendChild(el("span", null, "□ unfixed (red edge)")); wrap.appendChild(lg);
    }
    g2.appendChild(panel("Reviews", wrap));
  })();
  g2.appendChild(panel("Decisions", list(D.decisions, function (li, d) {
    d = d || {};
    li.appendChild(document.createTextNode(str(d.text) + " "));
    if (d.logged_in) li.appendChild(el("span", "why", "→ " + str(d.logged_in))); else li.appendChild(chip("nowhere"));
    addRef(li, d.ref);
  })));
  root.appendChild(g2);

  // ---- artefacts and rejected ideas ---------------------------------------------------------------------------
  var g3 = el("div", "grid");
  g3.appendChild(panel("Mockups & artefacts", list(D.artefacts, function (li, a) {
    a = a || {}; li.className = "lead"; li.appendChild(chip(a.unverified ? "unverified" : a.state));
    var ab = el("span"); ab.appendChild(ref(a.ref || { file: a.path, label: str(a.path), v: a.gone ? "gone" : undefined }));
    ab.appendChild(el("span", "why", " · " + str(a.kind) + (a.unverified ? " · " + str(a.state) : ""))); li.appendChild(ab);
  })));
  g3.appendChild(panel("Ideas rejected", list(D.rejected, function (li, r) {
    r = r || {}; li.appendChild(document.createTextNode(str(r.idea) + " "));
    if (r.why) li.appendChild(el("span", "why", "— " + str(r.why)));
    addRef(li, r.ref);
  })));
  root.appendChild(g3);

  // ---- checks and axes ---------------------------------------------------------------------------------------------
  var g4 = el("div", "grid");
  g4.appendChild(panel("Checks you made", list(D.checks, function (li, c) {
    c = c || {};
    var ans = { evidence: ["✓", "good"], conceded: ["!", "wip"], assertion: ["?", "wip"], open: ["○", "bad"] }[c.answered] || ["·", "idle"];
    li.className = "lead";
    var ch = el("span", "chip " + ans[1]); var cg = el("span", null, ans[0]); cg.setAttribute("aria-hidden", "true");
    ch.appendChild(cg); ch.appendChild(document.createTextNode(" " + str(c.answered))); li.appendChild(ch);
    var cb = el("span"); cb.appendChild(document.createTextNode(str(c.pattern) + " "));
    if (c.times) cb.appendChild(el("span", "num", "×" + str(c.times)));
    if (c.note) cb.appendChild(el("span", "why", " — " + str(c.note)));
    addRef(cb, c.ref); li.appendChild(cb);
  })));
  var ax = el("div", "axes");
  ["product", "feature", "design", "implementation"].forEach(function (k) {
    var a = D.axes[k] || {}, box = el("div", "axis");
    box.appendChild(el("h3", null, k));
    [["chose", a.chose], ["undone", a.undone], ["deferred", a.deferred]].forEach(function (r) {
      var p = el("p"); p.appendChild(el("b", null, r[0] + " ")); p.appendChild(document.createTextNode(str(r[1]) || "—")); box.appendChild(p);
    });
    ax.appendChild(box);
  });
  g4.appendChild(panel("Where it landed", ax));
  root.appendChild(g4);

  // ---- done / undone / deferred ----------------------------------------------------------------------------------------
  var tri = el("div", "three");
  tri.appendChild(panel("Done", list(D.done, plain)));
  tri.appendChild(panel("Undone", list(D.undone, plain)));
  tri.appendChild(panel("Deferred", list(D.deferred, function (li, d) {
    if (typeof d !== "object" || !d) { plain(li, d); return; }
    li.appendChild(document.createTextNode(str(d.item || d.t) + " "));
    if (d.trigger) li.appendChild(el("span", "why", "— " + str(d.trigger)));
    if (d.age != null) li.appendChild(el("span", "num", str(d.age) + "d"));
    addRef(li, d.ref);
  })));
  root.appendChild(tri);

  // ---- open for you, not verified --------------------------------------------------------------------------------------------
  var g5 = el("div", "grid");
  g5.appendChild(panel("Open for you", list(D.owner_open, plain)));
  if (!D.resume || D.unverified.length) {
    var nx = el("div");
    if (!D.resume) nx.appendChild(el("p", null, str(D.next_step) || "—"));
    if (D.unverified.length) nx.appendChild(list(D.unverified, function (li, t) { li.className = "foot"; plain(li, typeof t === "object" ? t : "? " + str(t)); }));
    g5.appendChild(panel(D.resume ? "Not verified" : "Next", nx));
  }
  root.appendChild(g5);

  document.body.appendChild(dlg);
  document.body.appendChild(live);

  // ---- jump nav, built from the panel titles (stable, de-duplicated ids) -------------------------------------------------------------
  var seen = {};
  Array.prototype.forEach.call(root.querySelectorAll("section.panel"), function (p) {
    var h = p.querySelector("h2"); if (!h) return;
    var slug = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "section";
    seen[slug] = (seen[slug] || 0) + 1; if (seen[slug] > 1) slug += "-" + seen[slug];
    p.id = slug;
    var a = el("a", null, h.textContent); a.href = "#" + slug;
    a.addEventListener("click", function (e) { e.preventDefault(); p.scrollIntoView({ block: "start" }); });
    navSlot.appendChild(a);
  });
})();
</script>
