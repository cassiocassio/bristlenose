# Bristlenose Dependabot config.
#
# Policy lives in docs/design-platform-policy.md.
# Selective major-ignore: only deps that empirically caused rework when
# auto-bumped. New entries land in the register with a reason and a
# re-check date in the policy doc.
#
# Security advisories bypass `ignore` rules. Dependabot still opens a PR
# for any CVE-flagged version regardless of the version-update filter.
#
# Before merging a batch of these PRs (or a coordinated tooling sprint),
# run `/cassandra` — it pre-mortems the blast radius of the bumps and
# records the prophecy for later calibration.
# See docs/design-dependency-premortem.md.

version: 2

updates:
  # Every third-party action is SHA-pinned (23 Aug 2026) because a mutable tag
  # inside a job holding id-token: write or contents: write is a supply-chain
  # hole that the pypi approval gate does NOT close — the gate controls when the
  # job starts, so compromised action code would run after approval, holding the
  # OIDC token.
  #
  # Pinning without this block only trades a moving tag for a stale one, and a
  # stale pin is the failure mode people cite when arguing against pinning at
  # all. Dependabot proposes the SHA bumps; a human takes them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # 15, not the default 5. The workflows reference 13 distinct third-party
    # actions, so 5 truncates a full sweep -- and truncation is not merely
    # slow, it is unsafe for a CHAIN. github/codeql-action's init, autobuild
    # and analyze enforce version consistency on each other; on 3 Sep 2026 the
    # cap let Dependabot raise init (#129) and autobuild (#132) while silently
    # withholding analyze, so merging either alone would have stranded analyze
    # on v3 and reddened CodeQL. See docs/dependency-premortem-log.md Entry 7.
    open-pull-requests-limit: 15
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    assignees:
      - "cassiocassio"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps for runtime/foundation packages that drag the
      # ecosystem with them. Bump in coordinated tooling sprints, not
      # one-off PRs. Leave most pip majors flowing — Python wheel
      # ecosystem is more stable major-to-major than npm.
      # For any future CEILING in pyproject.toml: use `versions:`, NOT
      # `update-types:` — measured 3 Sep 2026. A ceiling produces an "Update
      # <dep> requirement" PR that widens the constraint, and
      # `update-types: [version-update:semver-major]` does not suppress that
      # shape. The anthropic `<1` rule carried update-types from 27 Aug and never
      # once stopped the PR: #134 stood for a week under it, and #139 was raised
      # while it was still in force. `versions:` is the form that works (it is
      # what the retired tokenizers rule used). The anthropic and mcp ceilings
      # were lifted 5 Sep 2026 and their `versions:` rules retired with them —
      # docs/dependency-premortem-log.md § Held register.
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      # spaCy ecosystem cluster — HELD, not dead-pinned. Re-measured 3 Sep
      # 2026: spaCy 3.8.x pins thinc<8.4; thinc 9 is the spaCy-4 line and is
      # the resolver-red. weasel and confection GRADUATED the same day — spaCy
      # 3.8.16 already requires weasel<2 and confection<2, and 1.x of both is
      # installed and clean — so their major-ignores below block only the 2.x
      # generation. A lone thinc major would take the Presidio PII path down.
      #   Release-condition (lifts the thinc ignore): spacy floats its
      #   thinc<8.4 cap (one deps.dev GetRequirements field), then take
      #   spacy + thinc together. NOT "spaCy 4 reaches GA": that predicate
      #   could never fire — the 4.0 line is three dev releases, the newest
      #   2 years old, two of them yanked. Re-checked by `/cassandra --watch`.
      #   See docs/dependency-premortem-log.md § Held register.
      - dependency-name: "thinc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "weasel"
        update-types: ["version-update:semver-major"]
      - dependency-name: "confection"
        update-types: ["version-update:semver-major"]
      # tokenizers hold RETIRED 2026-09-03 -- it had become a tombstone twice
      # over. (1) The predicate was met: transformers 5.16.1 now requires
      # `tokenizers<0.24.0,>=0.23.1`, so 0.23.1 is its FLOOR, not a violation.
      # (2) The coupling has no referent here anyway: transformers is not
      # installed in either venv, is absent from pyproject.toml and from
      # bristlenose-sidecar.spec, and nothing under bristlenose/ imports it.
      # The real dependent is faster-whisper, whose cap is `tokenizers<1,>=0.13`
      # -- wide open. Meanwhile 0.23.1 was already installed, so the rule was
      # blocking a version we ship while forbidding its successor.
      # See docs/dependency-premortem-log.md § Held register.
      # WTForms hold GRADUATED 2026-06-09: sqladmin 0.27.2 (2026-06-08)
      # floated its cap to `wtforms>=3.1,<3.3`. Pair (sqladmin 0.27.2 +
      # WTForms 3.2.2) taken; ignore dropped. See
      # docs/dependency-premortem-log.md § `--watch` 2026-06-09.

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    assignees:
      - "cassiocassio"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Tied to Node major: bumping these uncoordinated has caused
      # rework historically. See CHANGELOG v0.14.5 for jsdom + Node 25.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # ESLint / typescript-eslint move with Node and TypeScript;
      # cap-mismatches caused npm-ci failures in v0.14.5. Take majors
      # deliberately, alongside the Node bump.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      # Added 2026-09-03: the eslint hold was being enforced on one member of a
      # three-package PEER chain, so the other two could walk it past the pin.
      # `@eslint/js@10` declares `peerDependencies: {eslint: "^10.0.0"}` while
      # eslint is major-ignored at 9.x, and `eslint-plugin-jsx-a11y@6.10.2`
      # (latest) peer-caps eslint at ^9 with no eslint-10 release available --
      # so taking @eslint/js 10 alone is an ERESOLVE at `npm ci`, not a warning.
      # This repo already paid for it once: landed 2 Jul 2026 (7cc28c44),
      # reverted 3 Jul (e449aad3); see frontend/CLAUDE.md:23.
      #   Release-condition: jsx-a11y ships eslint-10 support, then bump
      #   eslint + @eslint/js + eslint-plugin-jsx-a11y in ONE commit.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-jsx-a11y"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Notable allow-list: react / react-dom / react-router /
      # react-router-dom / i18next / react-i18next majors continue to
      # flow as PRs. Most have been painless (react-i18next 17 was a
      # one-line peer-dep tightening). Hand-review each one.

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    assignees:
      - "cassiocassio"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Lighthouse 13 requires Node ≥22.19; CI's Node is whatever
      # .tool-versions says (the SSOT — this comment deliberately does not
      # restate it, which is how it rotted once already: it said "CI is on
      # 20" for two months after the pin moved). Major still ignored pending a deliberate audit
      # of the bundled-Chromium channel and any audit-ID drift; no e2e spec
      # asserts on Lighthouse audit IDs today (grep clean), so the cost of
      # taking it is mostly a perf-baseline re-pin. Drop this ignore when
      # someone runs `/cassandra` on a Lighthouse 13 PR.
      - dependency-name: "lighthouse"
        update-types: ["version-update:semver-major"]
      # Playwright majors occasionally rotate the bundled Chromium /
      # WebKit channel and break the e2e fixtures; coordinate.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major"]
