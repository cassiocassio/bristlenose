name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # allow release.yml to invoke this workflow
    inputs:
      strict-macos:
        description: >-
          Fail the run when a macOS test cell fails. Daily pushes leave this
          off (macOS stays informational); release.yml passes true, because a
          release gate that ignores the platform Homebrew/pip Mac users run on
          is certifying the wrong thing.
        type: boolean
        required: false
        default: false
  # Same input, hand-triggerable — exists so the strict path can be exercised
  # without cutting a release (trigger, watch it parse and spawn jobs, cancel).
  workflow_dispatch:
    inputs:
      strict-macos:
        description: 'Fail the run on macOS test failures (release-gate mode)'
        type: boolean
        required: false
        default: false

# Silence the per-step "actions/checkout@v4 is running on Node 20"
# deprecation chatter and run JS actions on Node 24 ahead of the June
# 2026 default switch.  Matches the Node version pinned for local dev.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least-privilege default: the automatic GITHUB_TOKEN is read-only for every
# job unless a job opts into more. Without this, the token inherits the repo
# default (often read/write), so a compromised dependency in any step could
# push commits or open releases. Supply-chain hardening 2026-06-04.
permissions:
  contents: read

jobs:
  # Every gate is its own matrix cell, so one failing gate cannot hide another.
  # Before 3 Sep 2026 these were sequential steps in a single `lint` job, and a
  # failing step SKIPPED the rest — which is how the inventory gate's first CI
  # appearance came back "skipped" and proved nothing about itself while looking
  # like it had passed. fail-fast: false is the whole point; do not remove it.
  #
  # Each cell pays its own install. On a public repo standard runners are free
  # and the cells run in parallel, so this costs runner-minutes rather than
  # wall-clock, and buys one status check per gate.
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: ruff
            run: ruff check .
          - gate: inventory
            run: python scripts/gen-test-inventory.py --check
          - gate: gate-policy
            run: python scripts/check-gate-policy.py
          - gate: gate-proofs
            run: python scripts/check-gate-proofs.py --stale 180
          - gate: ratchet
            run: python scripts/check-ratchet.py
          - gate: manpage
            run: |
              VERSION=$(python3 -c "import bristlenose; print(bristlenose.__version__)")
              grep -q "$VERSION" man/bristlenose.1 || {
                echo "man page does not mention $VERSION"; exit 1; }
          - gate: mypy
            run: mypy bristlenose/ --ignore-missing-imports
            soft: true
    name: ${{ matrix.gate }}
    continue-on-error: ${{ matrix.soft == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .tool-versions
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"
      - name: ${{ matrix.gate }}
        run: ${{ matrix.run }}

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .tool-versions
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"
      - name: Audit dependencies for known vulnerabilities
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit
      - name: Generate Python SBOM
        continue-on-error: true
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom-python.json
      - name: Upload Python SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-python
          path: sbom-python.json
          retention-days: 90

  test:
    # Deliberately NOT `needs:` the gates. Gating the suite on the linters means
    # a trivial ruff error hides every test result — the same masking this split
    # exists to remove, moved up a level. Runner minutes are free on a public
    # repo, and release.yml gates on the WORKFLOW's conclusion, so every job
    # still has to be green before a tag can publish.
    runs-on: ${{ matrix.os }}
    # macOS is informational on daily pushes (catches platform bugs without
    # blocking merges) but BLOCKING when strict-macos is passed — release.yml
    # passes it, so "CI green" on a release means green on both platforms.
    # It used to mean "green on Linux" for a Mac-first product: every macOS
    # cell could fail and needs:ci still let publish run. The macOS cells are
    # the only automated coverage the Homebrew/pip-on-Mac audience has — the
    # human walk covers the .app, nobody hand-tests the Mac CLI.
    #
    # Expression note: on push/PR events the inputs context is empty, so
    # `inputs.strict-macos != true` is `null != true` → true → informational.
    # Via workflow_call/dispatch with strict-macos: true it is false → blocking.
    continue-on-error: ${{ matrix.os == 'macos-latest' && inputs.strict-macos != true }}

    strategy:
      fail-fast: false
      matrix:
        # Multi-version test matrix. Lower bound must match
        # pyproject.toml `requires-python` (currently ">=3.10"). Primary dev
        # version lives in .tool-versions; this matrix is intentionally
        # independent of it.
        #
        # TWO KINDS OF CELL, and the difference matters when they ever get
        # expensive again — do not read every entry as tracking a channel.
        #
        #   SHIPPED — some channel puts this interpreter in front of users:
        #     3.10  the `requires-python` floor
        #     3.12  Homebrew (python@3.12), Snap (core24), the macOS sidecar
        #     3.14  the Fedora Copr, which bundles it outright
        #   ANTICIPATED — nothing ships these, and they are here because
        #   `requires-python` has NO ceiling, so pipx/uv install onto whatever
        #   the user happens to have, and 3.11 and 3.13 are both ordinary
        #   things to have:
        #     3.11, 3.13
        #
        # 3.14 was added 28 Aug 2026 as a SHIPPED cell. The matrix had stopped
        # at 3.13 out of habit while the Copr shipped 3.14 and every pipx user
        # already on 3.14 — a larger group than Fedora users — ran untested.
        # Verified green before adding (4244 passed, identical to 3.12) so it
        # could not redden the release train, and affordable because -n auto had
        # just taken a cell from ~32 minutes to ~5.
        #
        # Rule: a channel adopting a Python version puts it in the SHIPPED set,
        # and that is a trigger, not a calendar. If cells ever have to be cut,
        # cut from ANTICIPATED first — those are a hedge; the shipped ones are
        # code somebody is running today.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"

      - name: Run tests
        # Coverage was paid by all 8 cells and read from 1 — the upload step
        # below has always been conditional; the cost never was. Scoped to the
        # same cell, with COVERAGE_CORE=sysmon (PEP 669) where it runs, and
        # -n auto everywhere. ~32 min → ~5-6, measured in
        # docs/design-test-performance.md. Coverage has no fail_under, so it is
        # informational; if it ever becomes a gate, diff xdist against serial
        # first (that parity is explicitly unverified).
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python-version }}" = "3.12" ]; then
            COVERAGE_CORE=sysmon pytest --tb=short -q -m "not slow" -n auto \
              --cov --cov-report=term-missing --cov-report=xml:coverage.xml
          else
            pytest --tb=short -q -m "not slow" -n auto
          fi

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 90

  release-suites:
    # 385 assertions across eight suites had never run anywhere but one Mac —
    # one shell, one userland, one git config — while two of the scripts they
    # cover already execute on Linux in CI with nothing behind them. They need
    # no network, no keys and no release: they drive the real drivers against
    # fake step tables and stubbed binaries, and finish in seconds.
    #
    # The venv is not ceremony. check-doc-surfaces.sh resolves the CLI it
    # enumerates flags from at $ROOT/.venv/bin/bristlenose, and two of
    # test-doc-surfaces.sh's assertions call it unstubbed — without a venv they
    # fail as "gate is blind", which is a true statement about a missing venv
    # and a false one about the gate.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: '.tool-versions'

      - name: Install the CLI into the venv the gates expect
        # [dev,serve] rather than bare `-e .`: the suites were written against
        # the local venv, which has both. The smoke line is not decoration — it
        # is the diagnostic for the one failure a base install produced on the
        # first Linux run, where check-doc-surfaces.sh enumerated zero
        # subcommands from `--help` and correctly refused rather than passing
        # on an empty set.
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e ".[dev,serve]"
          echo "--- bristlenose --help, as the doc gate sees it ---"
          .venv/bin/bristlenose --help 2>&1 | sed -n '/Commands/,$p' | head -25

      - name: Run the release-chain suites
        # </dev/null on every suite: release.sh's bare `run` now prompts for a
        # typed confirmation, and a suite that inherits an open stdin blocks
        # forever instead of failing. That hung a local run on 28 Aug 2026.
        run: |
          rc=0
          for s in test-release-sh test-release-e2e test-verify-channels \
                   test-preflight-gates test-preflight-substance test-doc-surfaces \
                   test-sink; do
            echo "::group::$s"
            bash "scripts/$s.sh" </dev/null || { echo "::error::$s failed"; rc=1; }
            echo "::endgroup::"
          done
          # The board's suite is Python (unittest, stdlib); the venv above is the
          # interpreter it documents. One line, because the loop is bash-only.
          echo "::group::test-release-board"
          .venv/bin/python scripts/test-release-board.py </dev/null || { echo "::error::test-release-board failed"; rc=1; }
          echo "::endgroup::"
          exit $rc

  frontend-lint-type-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.tool-versions'
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Release board — the page's live half, in jsdom
        # scripts/test-release-board-dom.js renders board.html and the replay
        # in jsdom (a frontend devDependency) and drives the in-place patch, the
        # tick and the fault band — the third of the board no Python test can
        # reach. It runs here because this is the job with node_modules; it
        # exits 3 and says SKIPPED when jsdom is absent, which must not be green.
        run: |
          python3 -m venv .venv && .venv/bin/pip install --quiet -e . >/dev/null 2>&1 || true
          node scripts/test-release-board-dom.js

      - name: Frontend lint
        # Blocking gate. Cleared to zero errors on 30 Jun 2026 (jsx-a11y
        # plugin registered, react-compiler lints triaged). Errors fail CI;
        # warnings (exhaustive-deps, react-compiler advisories) don't.
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Audit frontend dependencies for known vulnerabilities
        # Informational — flags known CVEs in the log but doesn't block
        # the build. Production deps are the future blocking gate;
        # full audit (incl. dev deps like Vite) is informational because
        # dev deps execute during build and produce shipped artifacts.
        continue-on-error: true
        working-directory: frontend
        run: |
          echo "=== Production dependencies ==="
          npm audit --omit=dev
          echo ""
          echo "=== All dependencies (including build-time) ==="
          npm audit || true

      - name: Generate frontend SBOM
        continue-on-error: true
        working-directory: frontend
        run: npm sbom --sbom-format cyclonedx > sbom-frontend.json

      - name: Upload frontend SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-frontend
          path: frontend/sbom-frontend.json
          retention-days: 90

      - name: Frontend tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Budgets what index.html makes a first-load visitor fetch, NOT a
      # filename allow-list. The old size-limit config was one glob plus 22
      # negations naming individual chunks, which Rolldown renames between vite
      # minors: on 5 Sep 2026 it failed vite 8.2.2 by 24 kB while the build
      # actually shipped 5.7 kB LESS and made 14 fewer requests. It was also
      # excluding locale chunks that index.html was eagerly loading, so users
      # paid for bytes the budget did not count. Wrong in both directions.
      # Pure stdlib, so it needs no venv. Proof: scripts/test-bundle-budget.py.
      - name: Check bundle size
        working-directory: frontend
        run: npm run size

  e2e:
    needs: [test, frontend-lint-type-test]
    runs-on: ubuntu-latest
    # Fail fast instead of burning the default 6h job ceiling. A hung
    # Playwright download (see the install step) once stalled this job for
    # 6h on 2026-06-03, which auto-cancelled the parent CI + Perf workflows.
    # Rule + postmortem: docs/design-ci.md § Timeouts and external-download
    # resilience.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: '.tool-versions'

      - name: Install Python dependencies (including serve extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.tool-versions'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        # `playwright install` has no internal download deadline: a half-open
        # CDN socket hangs forever (it stalled 6h on 2026-06-03). Bound each
        # attempt with `timeout` — a healthy download finishes in seconds, so
        # 5m is generous — and retry to ride out a transient CDN stall.
        # `--with-deps` also shells to apt-get, which fails *fast* (exit 100, not a
        # hang, so `timeout` can't catch it) when the runner's background apt /
        # unattended-upgrades holds the dpkg lock — so wait the lock out first.
        # See docs/design-ci.md § Timeouts and external-download resilience.
        timeout-minutes: 18
        run: |
          n=0
          until [ "$n" -ge 3 ]; do
            sudo bash -c 'w=0; while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 && [ "$w" -lt 36 ]; do echo "dpkg lock held — waiting"; sleep 5; w=$((w+1)); done'
            timeout 5m npx playwright install chromium webkit --with-deps && exit 0
            n=$((n + 1))
            echo "::warning::playwright browser install attempt $n stalled or failed; retrying in 15s"
            sleep 15
          done
          echo "::error::playwright browser install failed after 3 attempts"
          exit 1

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true
          # Pin the server's auth token so Node-side fetch() in fixtures and
          # in-browser fetch() in page.evaluate() can send the same bearer.
          # See frontend/CLAUDE.md and root CLAUDE.md for the consuming paths.
          _BRISTLENOSE_AUTH_TOKEN: test-token

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # Tier 0 of the release cadence: build what we ship, publish nothing.
  #
  # Added 8 Aug 2026. Until now CI ran the tests but never built the PACKAGE, so
  # a broken sdist or wheel — a bad `pyproject.toml`, a file missing from the
  # wheel's package list, invalid metadata — was only discovered by release.yml
  # AFTER a tag had been pushed. That is the worst possible moment: the tag is
  # public, and PyPI versions are immutable, so a version can be burned learning
  # something a 60-second job could have said on the commit that caused it.
  #
  # ⚠️ COUPLED TO release.yml's `build` JOB — keep the steps in step.
  # This deliberately mirrors that job's build path (frontend → `python -m build`)
  # rather than extracting a shared reusable workflow, because release.yml also
  # carries SBOM generation, Sigstore attestation and Trusted Publishing, and
  # refactoring the thing that ships in order to add a check to the thing that
  # doesn't is the wrong risk trade. The cost is a second copy of four steps.
  # If you change how release.yml builds, change this too — the failure mode is
  # CI passing while the release breaks, which is exactly the drift this job
  # exists to prevent, one level up.
  #
  # What is NOT duplicated, on purpose: SBOMs and attestation (release-only, and
  # meaningless for an artifact that is thrown away).
  #
  # Note release.yml reuses this whole workflow (`uses: ./.github/workflows/ci.yml`),
  # so a release now builds the package twice — once here as a gate, once for real.
  # That is ~2 minutes well spent: a packaging failure stops the release in the
  # `ci` job, before the tag's build job has done anything.
  package:
    name: Build wheel + sdist (no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: '.tool-versions'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.tool-versions'

      # The wheel ships bristlenose/server/static/. Building the frontend first
      # is what makes this a real package check rather than a pyproject syntax
      # check — without it the wheel builds happily and is missing the SPA.
      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install build tools
        run: pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      # `python -m build` succeeding does not mean PyPI would accept it. twine
      # check validates the metadata PyPI actually parses — a malformed README
      # or classifier fails here, not at upload.
      - name: Validate package metadata
        run: twine check dist/*

      # The wheel is the artifact users get. Assert the SPA actually made it in:
      # a wheel that builds, passes twine, and ships no frontend is precisely the
      # confidently-wrong green this job exists to prevent.
      - name: Assert the wheel carries the built frontend
        run: |
          wheel=$(ls dist/*.whl)
          echo "inspecting $wheel"
          if ! python -m zipfile -l "$wheel" | grep -q 'bristlenose/server/static/index.html'; then
            echo "::error::wheel is missing bristlenose/server/static/index.html — the SPA did not make it into the package" >&2
            python -m zipfile -l "$wheel" | head -30 >&2
            exit 1
          fi
          echo "✓ SPA present in the wheel"

# perf-gate moved to .github/workflows/perf.yml (post-merge only on main).
# See that file + docs/private/handoffs/ci-reshape.md for rationale.
