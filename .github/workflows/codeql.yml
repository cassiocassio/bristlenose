name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan — Mondays at 06:17 UTC (off-minute to reduce fleet load)
    - cron: "17 6 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least privilege by default. The analyse job below declares the
# security-events: write it genuinely needs, which fully overrides this.
# Every other workflow in this directory already carried this line; codeql.yml
# was the one that did not, so it inherited whatever the repository default
# happens to be — a setting that lives outside the tree and can change without
# a commit.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]
        # "javascript" covers both JS and TypeScript — do NOT add
        # "typescript" as a separate entry (CodeQL would error).

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85  # v3.37.8
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # security-extended: broader coverage than default suite.
          # Known limitation: does not cover LLM prompt injection
          # (f-string concatenation into prompt templates) or YAML
          # safe_load regressions. Use manual security-review agent
          # or future Semgrep rules for those.

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85  # v3.37.8
        with:
          category: "/language:${{ matrix.language }}"
