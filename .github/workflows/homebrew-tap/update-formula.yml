name: Update Homebrew formula

# Triggered by repository_dispatch from the bristlenose release workflow.
#
# NOTE: The formula in the tap repo should include:
#   man1.install "man/bristlenose.1"
# The man page is included in the sdist tarball and attached as a GitHub
# Release asset.

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Fetch sdist URL and sha256 from PyPI
        id: pypi
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          # Retry loop — PyPI CDN may need a few seconds after publish.
          for i in 1 2 3 4 5; do
            response=$(curl -sf "https://pypi.org/pypi/bristlenose/${VERSION}/json") && break
            echo "Attempt $i: PyPI not ready, retrying in 30s..."
            sleep 30
          done

          if [ -z "$response" ]; then
            echo "::error::Failed to fetch release metadata from PyPI after 5 attempts"
            exit 1
          fi

          url=$(echo "$response" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for f in data['urls']:
              if f['packagetype'] == 'sdist':
                  print(f['url'])
                  break
          ")

          sha256=$(echo "$response" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for f in data['urls']:
              if f['packagetype'] == 'sdist':
                  print(f['digests']['sha256'])
                  break
          ")

          filename=$(echo "$response" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for f in data['urls']:
              if f['packagetype'] == 'sdist':
                  print(f['filename'])
                  break
          ")

          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Found sdist: $url"
          echo "SHA256: $sha256"

      # ── The gate. Runs BEFORE the formula is touched, and fails closed. ──
      #
      # WHY A SHA256 FROM PYPI IS NOT ENOUGH
      #
      # The step above fetches the sdist URL and its sha256 from the same place
      # it fetches the artifact. That is integrity in transit: it proves the
      # download matches what PyPI served, and nothing whatever about whether
      # what PyPI served is ours. Anyone who reaches PyPI — a compromised
      # dependency executing during a build, a mutable action tag inside the
      # publish job — gets Homebrew for free, automatically, within minutes.
      #
      # brew is also the channel with the LEAST platform defence: no
      # notarisation, no Gatekeeper, no App Sandbox. It is a pip install in a
      # trench coat, and it was the only channel trusting a hash it fetched
      # alongside the thing the hash describes.
      #
      # PEP 740 provenance was already being generated by release.yml's publish
      # step (id-token: write + pypa/gh-action-pypi-publish) and simply never
      # checked. It is a Sigstore-backed statement binding the file to a
      # workflow in a repository, which is the claim that actually matters.
      - name: Verify PyPI provenance (PEP 740)
        env:
          VERSION: ${{ github.event.client_payload.version }}
          FILENAME: ${{ steps.pypi.outputs.filename }}
        run: |
          set -euo pipefail

          EXPECT_REPO="cassiocassio/bristlenose"
          EXPECT_WORKFLOW="release.yml"

          URL="https://pypi.org/integrity/bristlenose/${VERSION}/${FILENAME}/provenance"

          # Retry: provenance can lag the file by a few seconds after publish.
          prov=""
          for i in 1 2 3 4 5; do
            if prov=$(curl -sf --max-time 30 "$URL"); then break; fi
            echo "Attempt $i: provenance not available yet, retrying in 30s..."
            prov=""
            sleep 30
          done

          # Fail CLOSED. An unreachable endpoint is not an absent attestation,
          # but it is equally not a verified one, and this is the last gate
          # before a formula every `brew install` user will execute.
          if [ -z "$prov" ]; then
            echo "::error::No PEP 740 provenance for ${FILENAME} after 5 attempts."
            echo "::error::Refusing to update the formula. This is the gate working:"
            echo "::error::either the publish did not attest, or PyPI is unreachable."
            exit 1
          fi

          printf '%s' "$prov" > provenance.json
          python3 - <<'VERIFY'
          import json, os, sys

          expect_repo = "cassiocassio/bristlenose"
          expect_workflow = "release.yml"

          with open("provenance.json") as fh:
              doc = json.load(fh)

          bundles = doc.get("attestation_bundles") or []
          if not bundles:
              sys.exit("::error::provenance document contains no attestation bundles")

          seen = []
          for bundle in bundles:
              pub = bundle.get("publisher") or {}
              repo = pub.get("repository")
              workflow = pub.get("workflow")
              seen.append(f"{pub.get('kind')}:{repo}:{workflow}")
              if (
                  pub.get("kind") == "GitHub"
                  and repo == expect_repo
                  and workflow == expect_workflow
                  and bundle.get("attestations")
              ):
                  print(f"provenance OK — attested by {repo} via {workflow}")
                  break
          else:
              sys.exit(
                  "::error::provenance does not name the expected publisher.\n"
                  f"::error::expected GitHub:{expect_repo}:{expect_workflow}\n"
                  f"::error::got {seen}"
              )
          VERIFY

      - name: Update formula
        env:
          VERSION: ${{ github.event.client_payload.version }}
          # Passed through the environment rather than interpolated into the
          # script. A ${{ }} expression is substituted into the shell source
          # BEFORE bash parses it, so any quote in the value becomes syntax —
          # the standard Actions script-injection shape. These come from a
          # network response, which is exactly the kind of value not to splice
          # into a command.
          SDIST_URL: ${{ steps.pypi.outputs.url }}
          SDIST_SHA: ${{ steps.pypi.outputs.sha256 }}
        run: |
          set -euo pipefail

          # VERSION arrives on a repository_dispatch payload and is written into
          # a file that every brew user executes. Validate the shape before it
          # reaches sed. Same guard, and the same reasoning, as
          # upload-dmg.sh:123-131 in the main repo.
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::refusing: unexpected version shape '$VERSION'"; exit 1 ;;
          esac
          case "$SDIST_SHA" in
            [0-9a-f]*) [ ${#SDIST_SHA} -eq 64 ] || { echo "::error::sha256 wrong length"; exit 1 ;} ;;
            *) echo "::error::refusing: sha256 is not hex"; exit 1 ;;
          esac
          case "$SDIST_URL" in
            https://files.pythonhosted.org/*) : ;;
            *) echo "::error::refusing: sdist URL is not on files.pythonhosted.org"; exit 1 ;;
          esac

          sed -i "s|url \".*\"|url \"${SDIST_URL}\"|" Formula/bristlenose.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SDIST_SHA}\"|" Formula/bristlenose.rb
          sed -i "s|version \".*\"|version \"${VERSION}\"|" Formula/bristlenose.rb

      - name: Commit and push
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bristlenose.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "bristlenose ${VERSION}"
          git push
