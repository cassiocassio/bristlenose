name: i18n check

on:
  push:
    branches: [main]
    paths:
      - "bristlenose/locales/**"
  pull_request:
    branches: [main]
    paths:
      - "bristlenose/locales/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least-privilege default — GITHUB_TOKEN read-only (this workflow only reads
# and validates locale files). Supply-chain hardening 2026-06-04.
permissions:
  contents: read

jobs:
  validate-locales:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version-file: '.tool-versions'

      - name: Validate locale files
        # --strict since 3 Sep 2026. Without it, genuine missing keys are
        # WARNINGS and the job exits 0, so a gap ships unless a human reads
        # the output. The tree has been warning-free since 21 Aug 2026, which
        # made this free to take — and every day it stayed soft was a day it
        # could get more expensive. `docs/i18n-defects.md` Decision 2.
        run: python scripts/check-locales.py --strict
