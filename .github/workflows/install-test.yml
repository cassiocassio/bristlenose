name: Install & Smoke Test

# Verifies install instructions work on clean VMs.
# Each job follows the documented install steps, then runs:
#   bristlenose --version (entry-point + import smoke — no API key needed)
#   bristlenose doctor    (dependency check — no API key needed)
# Deeper functional coverage (real transcribe→analyse→render on representative
# input) is the keyed `full-run` job's domain, not the per-push install gate.

on:
  # Weekly Monday 6am UTC — catches breakage from upstream deps
  schedule:
    - cron: "0 6 * * 1"

  # Manual trigger from Actions tab
  workflow_dispatch:

  # When install docs or this workflow change
  push:
    branches: [main]
    paths:
      - "INSTALL.md"
      - "README.md"
      - ".github/workflows/install-test.yml"
      - "tests/fixtures/smoke-test/**"
      - "scripts/windows/**"
  pull_request:
    branches: [main]
    paths:
      - "INSTALL.md"
      - "README.md"
      - ".github/workflows/install-test.yml"
      - "tests/fixtures/smoke-test/**"
      - "scripts/windows/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least-privilege default — GITHUB_TOKEN read-only. Install/smoke jobs only
# check out and run; the full-run job reads ANTHROPIC_API_KEY from secrets,
# not the repo token. Supply-chain hardening 2026-06-04.
permissions:
  contents: read

jobs:

  # ── Linux: pip install from source ──────────────────────────────

  linux-pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies (following INSTALL.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: '.tool-versions'

      - name: Install bristlenose from local source
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify CLI is available
        run: bristlenose --version

      - name: Run doctor (skip API key check)
        # Doctor will warn about missing API key — that's expected.
        # We just want to verify FFmpeg and Python deps are found.
        run: bristlenose doctor || true

  # ── Linux: pipx install from source ─────────────────────────────

  linux-pipx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pipx
          pipx ensurepath

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: '.tool-versions'

      - name: Install bristlenose via pipx
        run: pipx install .

      - name: Verify CLI
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bristlenose --version

  # ── macOS: pip install from source ──────────────────────────────

  windows-pipx:
    # The route INSTALL.md gives Windows users, from a clean runner. Plain
    # `pipx install` with no extra: since 5 Oct 2026 the serve packages are
    # core dependencies, and `pipx runpip ... show` proves they arrived — the
    # other jobs' `doctor || true` would not notice if they hadn't.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: '.tool-versions'

      - name: Install pipx (following INSTALL.md)
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath
          # ensurepath edits the user PATH for new terminals; CI steps need it
          # handed over explicitly.
          python -m pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"

      - name: Install bristlenose via pipx
        run: python -m pipx install .

      - name: Verify CLI and serve packages
        env:
          PYTHONIOENCODING: utf-8
        run: |
          bristlenose --version
          # Count, don't trust the exit code: `pip show a missing` exits 0
          # (measured 5 Oct 2026), so a bare `show` passes the broken install.
          found=$(python -m pipx runpip bristlenose show fastapi uvicorn sqlalchemy sqladmin openpyxl alembic | grep -c '^Name:')
          echo "serve packages found: $found of 6"
          test "$found" -eq 6

  windows-install-ps1:
    # The one-line installer (scripts/windows/install.ps1), run as a file on a
    # clean runner, twice: the first run installs, the second must upgrade.
    # It installs the checkout rather than PyPI, so the installer is tested
    # against the code it ships with. The runner's winget is unreliable, so the
    # first run forces the pinned-zip FFmpeg path (the one with a checksum to
    # keep honest) and the second takes whatever `auto` finds.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: PSScriptAnalyzer
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          # Write-Host is right for an installer: it talks to a person, and
          # under `irm | iex` there is no pipeline to write to.
          $found = Invoke-ScriptAnalyzer -Path scripts/windows/install.ps1 `
            -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          $found | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($found) { throw "PSScriptAnalyzer: $(@($found).Count) finding(s)" }

      - name: First run (installs)
        env:
          BRISTLENOSE_INSTALL_SPEC: ${{ github.workspace }}
          BRISTLENOSE_INSTALL_FFMPEG: zip
        # Windows PowerShell 5.1, which is what a user's Win+X terminal runs
        # the one-liner in on a machine that never installed PowerShell 7.
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/install.ps1
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }

      - name: Second run (upgrades)
        env:
          BRISTLENOSE_INSTALL_SPEC: ${{ github.workspace }}
        run: |
          $log = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/install.ps1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }
          if ($log -notmatch 'upgrading') { throw 'second run did not take the upgrade path' }

      - name: PATH persists for new windows
        # A new terminal reads PATH from the registry; a CI step does not, so
        # ask the registry what a new window would get.
        run: |
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$user;$([Environment]::GetEnvironmentVariable('Path', 'Machine'))"
          $env:Path = [Environment]::ExpandEnvironmentVariables($env:Path)
          foreach ($exe in 'uv', 'ffmpeg', 'ffprobe', 'bristlenose') {
            $cmd = Get-Command $exe -CommandType Application -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "$exe is not on the PATH a new window would get" }
            Write-Host "$exe -> $($cmd.Source)"
          }
          # The first run forced the zip, so that is the ffmpeg a new window
          # must find: proof the pinned download and its PATH entry both work.
          $ff = (Get-Command ffmpeg -CommandType Application).Source
          if ($ff -notlike "$env:LOCALAPPDATA\Programs\bristlenose-ffmpeg\*") { throw "ffmpeg resolved to $ff, not the installer's copy" }
          bristlenose --version
          if ($LASTEXITCODE -ne 0) { throw 'bristlenose --version failed' }

  macos-pip:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install FFmpeg via Homebrew
        run: brew install ffmpeg

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: '.tool-versions'

      - name: Install bristlenose
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify CLI
        run: bristlenose --version

      - name: Run doctor
        run: bristlenose doctor || true

  # ── macOS: Homebrew tap install ─────────────────────────────────

  macos-brew:
    # Schedule only — brew installs the published release from PyPI, which
    # needs time to propagate after a release (tap update + PyPI index).
    # By the weekly Monday run, the tap is always current. Manual dispatch
    # skips this job to avoid false negatives on release day.
    if: github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install bristlenose via Homebrew
        run: brew install cassiocassio/bristlenose/bristlenose

      - name: Verify CLI
        run: bristlenose --version

      - name: Run doctor
        run: bristlenose doctor || true

  # ── Full pipeline run with real API key (weekly only) ───────────

  full-run:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Skip if no API key
        if: env.HAS_KEY != 'true'
        run: echo "Skipping — ANTHROPIC_API_KEY not configured"

      - name: Install system dependencies
        if: env.HAS_KEY == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: env.HAS_KEY == 'true'
        with:
          python-version-file: '.tool-versions'

      - name: Install bristlenose
        if: env.HAS_KEY == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -m spacy download en_core_web_sm

      - name: Run full pipeline on VTT fixtures
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bristlenose run tests/fixtures/multi_participant/ -p "CI Full Run"

      - name: Verify full pipeline output
        if: env.HAS_KEY == 'true'
        run: |
          ls -la tests/fixtures/multi_participant/bristlenose-output/
          test -f tests/fixtures/multi_participant/bristlenose-output/bristlenose-ci-full-run-report.html
          echo "Full pipeline report generated successfully"
