name: Mac Build

# Compiles the macOS app AND runs BristlenoseTests against a clean checkout.
# Does NOT sign, bundle, or launch the app.
#
# The test half is a cheque written in docs/design-ci.md and left uncashed for
# three months. That doc specified a "Run Swift tests" step with its rationale;
# what shipped on 20 May 2026 (ci-reshape.md item 6, half-day timebox, scoped to
# compile drift) was the build half alone, and nothing reconciled the plan to
# what landed. The consequence: `TabLeftPanelTests` was red for 10 commits and
# v0.29.0 shipped on all nine channels with it red, every signal green.
#
# It calls desktop/scripts/test-swift.sh — the same entry point as /end-session
# Phase 1 step 4 and build-all.sh step 1c — so all three read the verdict the
# one correct way. See that script's header for the two ways it lies.
#
# Path-filtered: skipped on Python-only PRs. Don't add as a required
# status check — non-desktop PRs would block forever.

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/mac-build.yml']
  pull_request:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/mac-build.yml']

# Least-privilege default — GITHUB_TOKEN read-only (compile-only; nothing here
# writes to the repo). Supply-chain hardening 2026-06-04.
permissions:
  contents: read

# EVERY `run` step gets pipefail. GitHub's default shell is `bash -e {0}` —
# WITHOUT pipefail — so `xcodebuild ... | tee log` exits with *tee's* status,
# which is always 0. This workflow was structurally incapable of failing from
# 20 May to 2 Sep 2026: its last "success" carried 16 compile errors. Setting
# the shell here rather than on the one step means a pipe added later cannot
# reintroduce it. Same bug class as the `&& ok` gates and the piped pytest
# already documented in CLAUDE.md.
defaults:
  run:
    shell: bash

jobs:
  build:
    # macos-26 (arm64, standard => free on a public repo; NOT the -xlarge variants,
    # which are billed even here). macos-15 ships Xcode 16.4 / macOS 15 SDK, which
    # cannot compile the macOS 26 APIs the codebase now uses — StatusPill's
    # `sharedBackgroundVisibility` and SeamLabView's `backgroundExtensionEffect`.
    # `#available(macOS 26.0, *)` gates RUNTIME availability; the symbol still has
    # to exist in the SDK at compile time. Deployment target stays 15.0.
    runs-on: macos-26
    timeout-minutes: 30  # compile ~4 min + 1400-test suite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          cd desktop/Bristlenose && xcodebuild -list

      - name: Stub bundled sidecar input path
        # The "Copy Sidecar Resources" Build Phase declares the sidecar
        # binary as a hard input — Xcode bails at dependency analysis if
        # missing, before Swift compile. Real PyInstaller bundle is
        # ~400 MB and gitignored; for compile-only, an existing path is
        # all Xcode needs.
        run: |
          mkdir -p desktop/Bristlenose/Resources/bristlenose-sidecar
          touch desktop/Bristlenose/Resources/bristlenose-sidecar/bristlenose-sidecar
          chmod +x desktop/Bristlenose/Resources/bristlenose-sidecar/bristlenose-sidecar

      - name: Generate build-info source
        # `GeneratedBuildInfo.swift` is gitignored and normally written by a
        # pre-compile Run Script phase. But PBXFileSystemSynchronizedRootGroup
        # snapshots the Compile Sources list BEFORE that phase runs, so on a tree
        # that has never been built the file is invisible to the very build that
        # creates it — `cannot find 'GeneratedBuildInfo' in scope`. Locally you
        # re-run and it passes; CI checks out fresh every time, so every run hit
        # it, and the masked exit code above meant every run still said success.
        # The script falls back to a repo-relative path when SRCROOT is unset.
        run: desktop/scripts/generate-build-info.sh

      - name: Build and test
        # The sidecar is stubbed above (a 0-byte file), so "Ensure Sidecar Fresh"
        # correctly calls it stale and tries to rebuild it — which wants
        # frontend/node_modules, a venv and PyInstaller, none of which exist here
        # and none of which compiling needs. The script bypasses it, exactly as
        # build-all.sh does for the release archive, passing both vars TWICE
        # (env AND xcodebuild setting) because the build phase's own shell does
        # not see plain env. That only surfaced once pipefail was fixed — the
        # phase was failing before too, silently.
        #
        # Blocking, not informational. design-ci.md proposed "informational
        # initially — promote to blocking once stable" and the promotion never
        # happened; a soft gate with no expiry is how this hole opened. The suite
        # is green and this workflow is deliberately not a required status check,
        # so a red run is loud without wedging unrelated PRs.
        env:
          BN_LOG_DIR: ${{ github.workspace }}/desktop/build/swift-test-logs
        run: desktop/scripts/test-swift.sh

      - name: Upload build + test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: swift-build-test-logs
          path: desktop/build/swift-test-logs/
          retention-days: 30
