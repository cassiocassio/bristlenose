name: Mac Release Archive

# Rehearse both RELEASE archives, unsigned, on every desktop push to main.
#
# Mac Build compiles and tests DEBUG on every desktop push. Both release lanes
# archive RELEASE (build-all.sh for the App Store; build-dmg.sh with
# DEVELOPER_ID_BETA for the .dmg), and until 8 Oct 2026 nothing compiled that
# configuration before release night — so a Release-only break was found by a
# thirty-minute release step. This runs desktop/scripts/check-release-archive.sh
# on the push that could cause one, and on demand.
#
# No schedule, by decision (8 Oct 2026). A nightly run was tried first, to catch
# the runner image moving without a commit — but that image is GitHub's Xcode,
# not the one the release Mac builds with (0.35.0 shipped from Xcode 27.0), so
# its drift says little about what ships, and a week without pushes would have
# spent seven runs re-proving an unchanged tree.
#
# It does NOT sign: an ad-hoc archive of the app fails without a provisioning
# profile (measured 8 Oct 2026), so signing, entitlements, notarisation and
# Gatekeeper remain release-night facts. The script header says what it can
# and cannot see.
#
# Never a required check, and it blocks no push. A red run reaches the owner as
# GitHub's failed-run email and in the release preflight, which lists this
# workflow in WF_ADVISORY (scripts/project.conf): one red run warns, three in a
# row stop a release.

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/mac-release-archive.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # pipefail on every step — see mac-build.yml's note

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 45   # two Release compiles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Show toolchain
        run: |
          sw_vers -productVersion
          xcodebuild -version

      - name: Stub bundled sidecar input path
        # Same reason as mac-build.yml: the copy phase declares the sidecar binary
        # as a hard input; compiling needs only that the path exists.
        run: |
          mkdir -p desktop/Bristlenose/Resources/bristlenose-sidecar
          touch desktop/Bristlenose/Resources/bristlenose-sidecar/bristlenose-sidecar
          chmod +x desktop/Bristlenose/Resources/bristlenose-sidecar/bristlenose-sidecar

      - name: Generate build-info source
        run: desktop/scripts/generate-build-info.sh

      - name: Archive Release — App Store and Developer-ID configurations
        env:
          BN_ARCHIVE_DIR: ${{ github.workspace }}/desktop/build/release-archive-check
        run: desktop/scripts/check-release-archive.sh both

      - name: Upload archive logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-archive-logs
          path: desktop/build/release-archive-check/*.log
          retention-days: 30
