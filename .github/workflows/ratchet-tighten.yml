name: ratchet tighten

# Lower a ratchet ceiling to what CI actually measures, from CI.
#
# WHY THIS IS A WORKFLOW AND NOT A COMMAND
#
# `mypy_errors` carries `authority: ci` in scripts/check-ratchet.py, because the
# number is a property of the toolchain as much as of the code: pyproject pins
# `mypy>=1.13` — a floor, not a version — so a fresh install resolves whatever is
# newest. Identical source measured 238 on the dev Mac and 239 in CI on 3 Sep
# 2026, and the ceiling set from the Mac failed its first real CI run. So
# `--tighten` refuses to lower such a metric locally, and the only honest way to
# move it is to measure here.
#
# WHY IT IS DISPATCHED AND NOT AUTOMATIC
#
# Tightening on every green push would track the floor perfectly and would also
# lock in a dip that nothing caused — a laxer mypy release under-reports, the
# ceiling follows it down, and the next release fails the gate on unchanged
# source. That is the 238/239 incident with the human removed. So the mechanical
# half is automated (measure, compute, write, commit) and the judgement stays a
# person's: is this number real, and is now the time to spend the slack?
#
# The ordinary `ratchet` cell in ci.yml annotates any run whose ceiling has
# headroom, naming this workflow, so nobody has to remember it exists.
#
# WHAT IT DOES NOT PROVE
#
# A push by GITHUB_TOKEN does not trigger workflows, so the commit this makes
# gets no CI run of its own; the post-condition below re-checks in-process
# instead. That closes the write path, not the toolchain drift — a later run
# resolving a different mypy can still exceed a ceiling this one set. Pinning
# mypy exactly is the real fix and is a dependency-policy decision
# (docs/design-platform-policy.md), not this file's to make.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Measure and show the diff, but commit nothing'
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least-privilege by default, as everywhere else in this tree; the one job that
# needs to write says so itself.
permissions:
  contents: read

jobs:
  tighten:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version-file: .tool-versions
          cache: pip

      - name: Install dependencies
        # Byte-for-byte the ci.yml `gates` recipe. It has to be: a ceiling
        # measured by a different install is a ceiling the gate never agreed to.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"

      - name: Prove the write path before using it
        # This job is the first caller of --tighten that no human reads before
        # it lands, and --tighten had a silent data-loss bug at exactly that
        # moment: it rebuilt each entry from code, deleting the `note` that
        # argues why a number is what it is. Runs in seconds, stubs every
        # metric, touches nothing tracked. If it fails, nothing is written.
        run: python scripts/test-check-ratchet.py

      - name: Record the toolchain that produced the number
        # The fact wanted first when a later run disagrees with this ceiling.
        # Not `mypy --version | tee`: the default shell is `bash -e` with no
        # pipefail, so that reports tee's status and a failed mypy would leave
        # the commit message's toolchain line blank while the step went green.
        run: |
          set -euo pipefail
          MYPY_VERSION=$(mypy --version)
          echo "$MYPY_VERSION"
          echo "MYPY_VERSION=$MYPY_VERSION" >> "$GITHUB_ENV"

      - name: Tighten
        run: |
          set -euo pipefail
          python scripts/check-ratchet.py --tighten | tee tighten.log

      - name: Show what changed
        run: git --no-pager diff -- docs/testing/ratchet.json

      - name: Post-condition — the written ceilings hold
        # Same measurement in the same process, so this cannot catch toolchain
        # drift. It catches the write path putting a ceiling BELOW what was
        # measured, which is the failure that would otherwise reach main and
        # redden the next push for reasons nobody could see here.
        run: python scripts/check-ratchet.py

      - name: Commit and push
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          # `git diff --quiet` alone compares the worktree to the INDEX, which is
          # the one question that cannot answer "is there anything to commit" —
          # it announced a commit it never made during the 0.29.1 release. Name
          # HEAD explicitly.
          if git diff --quiet HEAD -- docs/testing/ratchet.json; then
            echo "no ceiling moved; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `paste -sd'; '` would be the obvious join and is wrong on both
          # userlands: -d takes a LIST of delimiters used cyclically, so three
          # metrics join as "a;b c". awk, and no second platform to remember.
          # [^:] and not [a-z_]: `e2e_allowlist_entries` has a digit in it, and
          # a class that cannot match it drops that metric from the subject with
          # no error — a commit message that under-reports what it changed.
          # Measured against a three-metric log before this shipped.
          SUBJECT=$(sed -n 's/^tightened \([^:]*\): /\1 /p' tighten.log \
            | awk '{printf "%s%s", sep, $0; sep="; "} END {print ""}')
          if [ -z "$SUBJECT" ]; then
            echo "::error::ratchet.json changed but --tighten named no move; refusing to commit"
            exit 1
          fi
          git add docs/testing/ratchet.json
          git commit -F - <<MSG
          ratchet: ${SUBJECT}

          Measured on a fresh CI install, which is the authority for the metrics
          marked so in scripts/check-ratchet.py — the count moves with whatever
          mypy a fresh resolve picks, so a ceiling set from a dev machine breaks
          its own gate.

            ${MYPY_VERSION}
            run   ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
            from  ${GITHUB_SHA}
          MSG
          # No --force, ever. If main moved under us the push is refused, which
          # is the correct outcome: the number was measured against a tree that
          # is no longer the tip, and the fix is to dispatch again.
          git push origin "HEAD:${GITHUB_REF_NAME}"
