name: ratchet tighten

# Measure the ratchet's CI-owned numbers here, so a ceiling can follow them down.
#
# WHY THIS IS A WORKFLOW AND NOT A COMMAND
#
# `mypy_errors` carries `authority: ci` in scripts/check-ratchet.py, because the
# number is a property of the toolchain as much as of the code: pyproject pins
# `mypy>=1.13` — a floor, not a version — so a fresh install resolves whatever is
# newest. Identical source measured 238 on the dev Mac and 239 in CI on 3 Sep
# 2026, and the ceiling set from the Mac failed its first real CI run. So
# `--tighten` refuses to lower such a metric locally, and the only honest way to
# move it is to measure here.
#
# WHY IT UPLOADS INSTEAD OF COMMITTING
#
# It cannot commit. `main` requires the status check `ci / lint`, and no job has
# emitted that since the lint job became the gates matrix in 5058bec0;
# `enforce_admins` is false, so the maintainer pushes straight through and
# github-actions[bot] never could. A job that pushed would be red every time it
# worked. It also wants no write token, which is the better shape regardless:
# CI owns the number, a person owns the commit.
#
# WHY IT IS DISPATCHED AND NOT AUTOMATIC
#
# Tightening on every green push would track the floor perfectly and would also
# lock in a dip that nothing caused — a laxer mypy release under-reports, the
# ceiling follows it down, and the next release fails the gate on unchanged
# source. That is the 238/239 incident with the human removed. The mechanical
# half is automated; the judgement stays a person's.
#
# The ordinary `ratchet` cell in ci.yml annotates any run whose ceiling has
# headroom, naming this workflow, so nobody has to remember it exists.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Reads and measures. Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  tighten:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .tool-versions
          cache: pip

      - name: Install dependencies
        # Byte-for-byte the ci.yml `gates` recipe. It has to be: a ceiling
        # measured by a different install is a ceiling the gate never agreed to.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"

      - name: Prove the write path before using it
        # --tighten had a silent data-loss bug: it rebuilt each entry from code,
        # deleting the `note` that argues why a number is what it is. Seconds,
        # stubbed metrics, nothing tracked touched. If it fails, nothing is
        # measured and no artifact misleads anyone.
        run: python scripts/test-check-ratchet.py

      - name: Record the toolchain that produced the number
        # Not `mypy --version | tee`: the default shell is `bash -e` with no
        # pipefail, so that reports tee's status and a failed mypy would leave
        # this blank while the step went green.
        run: |
          set -euo pipefail
          MYPY_VERSION=$(mypy --version)
          echo "$MYPY_VERSION"
          echo "MYPY_VERSION=$MYPY_VERSION" >> "$GITHUB_ENV"

      - name: Tighten
        run: |
          set -euo pipefail
          python scripts/check-ratchet.py --tighten | tee tighten.log

      - name: Show what changed
        run: git --no-pager diff -- docs/testing/ratchet.json

      - name: Post-condition — the written ceilings hold
        # Same measurement in the same process, so this cannot catch toolchain
        # drift. It catches the write path putting a ceiling BELOW what was
        # measured, which is the failure that would otherwise be adopted and
        # redden the next push for reasons nobody could see here.
        run: python scripts/check-ratchet.py

      - name: Publish the measured ceilings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ratchet-ceilings
          path: docs/testing/ratchet.json
          retention-days: 30

      - name: Say how to adopt it
        # The run page is where somebody will be standing, so the incantation
        # goes there with the run id already in it. `--adopt` re-checks the
        # provenance stamp, so a hand-edited file cannot be passed off as this
        # one; it copies only the ceiling and the stamp, so prose edited since
        # this run survives.
        run: |
          set -euo pipefail
          {
            echo "## Ratchet"
            echo
            if [ -s tighten.log ] && grep -q '^tightened ' tighten.log; then
              echo '```'
              cat tighten.log
              echo '```'
              echo
              echo "Measured with \`${MYPY_VERSION}\`. Adopt it:"
              echo
              echo '```bash'
              echo "gh run download ${GITHUB_RUN_ID} -n ratchet-ceilings -D /tmp/ratchet-${GITHUB_RUN_ID}"
              echo "scripts/check-ratchet.py --adopt /tmp/ratchet-${GITHUB_RUN_ID}/ratchet.json"
              echo '```'
            else
              echo "Nothing to tighten — every ceiling already sits at its measured value."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
