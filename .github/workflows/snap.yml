name: Snap Build & Publish

# BUILD on every push; PUBLISH only when asked. Restored 8 Aug 2026.
#
# History: auto-triggers were disabled May 2026 because the Snap build had been
# failing on every push since 2026-04-17 and was adding noise to PR check status
# during the alpha-critical path. That was the right call then. The cost since is
# that NOTHING has built the snap for three months, so its build health is
# unknown and any breakage will be discovered at release time — the worst moment.
#
# The distinction that makes restoring safe: **what was parked is the trigger,
# not the publish.** The `build` job produces an artifact and publishes nothing.
# So push/pull_request give back build coverage at zero publish risk.
#
# ⚠️ Restoring `push` alone would NOT have been safe. `publish-edge` used to read
# `(main && push) || workflow_dispatch`, so the moment the push trigger came back
# it would have started auto-publishing to edge on every commit to main. That
# clause had been dead code since May and is removed below — see publish-edge.
#
# Publishing remains deliberate, and the ref is the channel selector:
#   gh workflow run snap.yml --ref main       → edge
#   gh workflow run snap.yml --ref vX.Y.Z     → stable
#
# This job is NOT a required status check. A red X here is information — the
# build has been unverified since April and may well fail — and it must not block
# a merge. Fix it or read it; don't add continue-on-error, which would convert
# "broken" into "green".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least-privilege default — GITHUB_TOKEN read-only. Publish jobs authenticate
# to the Snap Store with SNAPCRAFT_STORE_CREDENTIALS (a secret), not the repo
# token, so no job needs write here. Supply-chain hardening 2026-06-04.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Tags, so the stamp below can tell a release build from a drifted
          # one. The default shallow checkout fetches none.
          fetch-depth: 0

      - name: Stamp the version suffix
        # Empty when HEAD is exactly a release tag; "+git.<sha>" when it is not.
        # snapcraft reads this from the part source, because environment does not
        # cross into the LXD build — the answer has to travel as a file.
        run: |
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            : > .snap-version-suffix
            echo "HEAD is $(git describe --exact-match --tags HEAD) — clean version"
          else
            printf '+git.%s' "$(git rev-parse --short=7 HEAD)" > .snap-version-suffix
            echo "HEAD is not a release tag — version gets $(cat .snap-version-suffix)"
          fi

      # SHA-pinned (supply-chain) — immutable commit, version tracked in comment.
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79  # v1.3.0
        id: snapcraft

      - name: Assert the snap says what the tree is
        # The suffix reaches snapcraft as a file in the part source. If that copy
        # ever stops happening the version comes out CLEAN — the exact wrong
        # answer, silently, and indistinguishable from a real release build. So
        # assert the outcome rather than trust the mechanism. Snapcraft names the
        # file bristlenose_<version>_<arch>.snap, so the name is the claim.
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' bristlenose/__init__.py)
          want="$v$(cat .snap-version-suffix)"
          got=$(basename "${{ steps.snapcraft.outputs.snap }}" | sed -E 's/^bristlenose_(.+)_[^_]+\.snap$/\1/')
          echo "want $want / got $got"
          [ "$want" = "$got" ] || { echo "::error::snap version is '$got', expected '$want' — the suffix did not reach snapcraft"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: snap-amd64
          path: ${{ steps.snapcraft.outputs.snap }}

  publish-edge:
    # Dispatch ONLY. The `(main && push)` arm was removed 8 Aug 2026 when the
    # push trigger was restored for build coverage: it had been dead code since
    # May, and leaving it would have silently converted "build on every commit"
    # into "publish to edge on every commit" — the exact autoupdate behaviour we
    # want to avoid. Publishing is a decision, not a side effect of committing.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_CREDS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        if: env.HAS_CREDS == 'true'
        with:
          name: snap-amd64

      # action-publish passes `snap:` straight to `snapcraft upload` without
      # shell-globbing, so a literal "*.snap" fails ("not a valid file").
      # Resolve the concrete filename from the downloaded artifact instead.
      - name: Resolve snap path
        id: snap
        if: env.HAS_CREDS == 'true'
        run: echo "path=$(ls *.snap | head -1)" >> "$GITHUB_OUTPUT"

      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40  # v1.2.0 (SHA-pinned)
        if: env.HAS_CREDS == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: edge

      # Both publish jobs run ONLY on a deliberate trigger — publish-edge on
      # workflow_dispatch, publish-stable on a tag ref. A missing credential is
      # therefore never "nothing was asked of me"; it is "you asked me to publish
      # and I could not". Skipping green reports a publish that did not happen,
      # on the one path where that reading matters.
      - name: Fail — no store credentials
        if: env.HAS_CREDS != 'true'
        run: |
          echo "::error::SNAPCRAFT_STORE_CREDENTIALS is not set — cannot publish."
          echo "This job only runs when publishing was explicitly requested, so a"
          echo "silent skip would report success having published nothing."
          exit 1

  publish-stable:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_CREDS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        if: env.HAS_CREDS == 'true'
        with:
          name: snap-amd64

      # Reached by dispatching against a tag ref: `gh workflow run snap.yml --ref vX.Y.Z`.
    # See publish-edge: resolve the concrete filename; action-publish does not
      # shell-glob the `snap:` input.
      - name: Resolve snap path
        id: snap
        if: env.HAS_CREDS == 'true'
        run: echo "path=$(ls *.snap | head -1)" >> "$GITHUB_OUTPUT"

      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40  # v1.2.0 (SHA-pinned)
        if: env.HAS_CREDS == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: stable

      # Both publish jobs run ONLY on a deliberate trigger — publish-edge on
      # workflow_dispatch, publish-stable on a tag ref. A missing credential is
      # therefore never "nothing was asked of me"; it is "you asked me to publish
      # and I could not". Skipping green reports a publish that did not happen,
      # on the one path where that reading matters.
      - name: Fail — no store credentials
        if: env.HAS_CREDS != 'true'
        run: |
          echo "::error::SNAPCRAFT_STORE_CREDENTIALS is not set — cannot publish."
          echo "This job only runs when publishing was explicitly requested, so a"
          echo "silent skip would report success having published nothing."
          exit 1
