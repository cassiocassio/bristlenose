title = "Bristlenose gitleaks config"

# Start from gitleaks' built-in rule set, then allowlist this repo's known-safe
# placeholders and synthetic fixtures. The Feb-2026 secret audit confirmed the
# tree and full history are clean of live secrets — every match below is a
# documented format example, a redactor regex, or a deliberately-fake fixture.
# Keep this list TIGHT: allowlist specific dummy strings, not whole source dirs,
# so a genuinely new secret still trips the scan.

[extend]
useDefault = true

[[allowlists]]
description = "Documented / dummy / test-fixture key strings (none are live)"
regexes = [
  '''sk-ant-api03-A{20,}''',                              # walkthrough dummy (all-A padding)
  '''sk-ant-(xxx|test|example|BROKEN|INVALID|placeholder)[-A-Za-z0-9]*''',
  '''sk-ant-test-key''',
  '''sk-fromenv''',
  '''AIzaSy[AX]{2,}''',                                   # AIzaSyXXX… doc placeholder
  '''AIzaSyTest[0-9]+''',                                 # tests/test_gemini.py synthetic key (19-char, real ones are 39)
  '''env-injected-key''',
  '''test-integration-key-12345''',                       # docs/design-keychain.md dummy
  '''Norman/Garrett/Plato/UXR''',                         # CLAUDE.md prose (design-thinker names, not a key)
  '''EXAMPLEtokenNOTREALa{20,}''',                        # MCP mockup bearer (all-a padding, same shape as the sk-ant dummy above)
  # RETIRED, and only reachable in history: two MCP bearer strings that sat in
  # the connect mockups (893ab183, 30 Jul 2026 — the walkthrough — and the
  # extension mockup). Both were scrubbed from the working tree on 1 Aug 2026
  # and the durable one ROTATED, so neither opens anything. Listed by literal
  # value rather than by path so a NEW token in a mockup still trips the scan —
  # which is the whole point of keeping this list tight.
  '''kJ8fwR2vXqLmN0aYt5uBcE7dHs9gPzW1oT4iM6xA3nQ''',
  '''0riCOVDy8ncTbq59t0QIA69m4PWKbbZjbRZc2WnyHDc''',
]

[[allowlists]]
description = "Paths that only ever hold placeholders or synthetic fixtures"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)tests/fixtures/pii_horror_[^/]*$''',            # Presidio stress-test PII (declared fiction)
  '''(^|/)docs/walkthroughs/c3-smoke-test\.md$''',
]
