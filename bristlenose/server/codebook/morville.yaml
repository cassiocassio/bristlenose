# Morville codebook — the User Experience Honeycomb (Semantic Studios, 21 June 2004).
#
# HOW TO CHANGE THIS FILE. Every wording decision carries a dated `# M-xx`
# comment pointing at the register in docs/design-codebook-morville.md. A
# decision is reopened by a WITNESS QUOTE that fails in the golden fixture
# (tests/fixtures/codebook-golden/morville.json), never by a hunch. Before
# rewording a tag: read its M-xx entry, add or change the witness, then change
# the words, and bump `version:`.
#
# RENAMES. A tag that absorbed earlier names carries `renamed_from:`;
# `codebook_sync` renames the installed rows in place so applied tags and
# AutoCode proposals survive.
#
# Scope rule (M-01): the source is a one-page essay with seven facets and no
# sub-facets. A sub-tag exists here only where his paragraph, his books
# (Rosenfeld & Morville; Ambient Findability) or the source he cites by name
# (Stanford's credibility guidelines) supports it; everything else lives in
# apply_when as examples. v1 had 7 × 4 = 28 tags, 17 of them from Nielsen,
# Fogg, Microsoft, Cialdini and elsewhere — the four-per-group padding the
# Norman audit found. 2.0 is 15, uneven, and the unevenness is his.
id: morville
title: The User Experience Honeycomb
author: Peter Morville
enabled: true
version: "2.0"  # M-02: bumped on every accepted wording change

description: >
  Seven facets of user experience — useful, usable, desirable, findable,
  accessible, credible, valuable — drawn as a honeycomb so that each can
  be "a singular looking glass" on a product. Morville drew it to move
  the conversation beyond usability and to help teams define priorities:
  the facets are not a checklist, and which ones matter most depends on
  the balance of context, content and users. Broader than Garrett's
  planes or Norman's principles; the place where credibility, findability
  and value to the sponsor get named at all.

author_bio: >
  Pioneer of information architecture and author of the User Experience
  Honeycomb (2004). Co-author of "Information Architecture for the World
  Wide Web" (the polar bear book; 4th ed. 2015 with Rosenfeld and Arango)
  and author of "Ambient Findability" (2005). Founded Semantic Studios in
  2001.

author_links:
  - label: semanticstudios.com
    url: https://semanticstudios.com
  - label: User Experience Design (2004)
    url: https://semanticstudios.com/user_experience_design/
  - label: Amazon US — Information Architecture
    url: https://www.amazon.com/dp/1491911689
  - label: Amazon UK — Information Architecture
    url: https://www.amazon.co.uk/dp/1491911689
  - label: Amazon US — Ambient Findability
    url: https://www.amazon.com/dp/0596007655
  - label: Amazon UK — Ambient Findability
    url: https://www.amazon.co.uk/dp/0596007655

preamble: >
  The following tags name the seven facets of Morville's honeycomb. They
  ask whether an experience is useful, usable, desirable, findable,
  accessible, credible and valuable — and Morville's point is that a
  team must choose which of these matter most for its context, content
  and users; the honeycomb is a tool for setting priorities, not a
  checklist to be satisfied in full. The facets overlap by design: when a
  quote touches two, choose the one the participant is primarily reacting
  to. If the participant is not discussing a designed product, service or
  information system, do not apply any tag from this codebook.

groups:
  # -------------------------------------------------------------------
  # Useful — "whether our products and systems are useful"
  # -------------------------------------------------------------------
  - name: Useful
    subtitle: Is the product useful — does it do something the person needs done?
    colour_set: ux
    tags:
      # M-03 (R). His one thought: "the courage to ask whether our products and systems are useful". v1's relevance / utility / problem-solution fit / feature gap were four ways of saying one word (Nielsen's "utility", lean-startup "problem-solution fit"); feature gap is UXR unmet need / feature request.
      - name: usefulness
        renamed_from: [relevance, utility, problem-solution fit, feature gap]
        definition: >
          Whether the product does something the participant actually
          needs done — it solves the problem they came with, or fails to,
          regardless of how well it works in other respects.
        apply_when: >
          The participant judges the product by whether it helps with
          their real task: it does the thing, it does not do the thing,
          it does a thing they never needed, or it is missing the thing
          they came for. Look for "this is exactly what I needed," "it
          doesn't actually help me with," "I don't need any of this,"
          "there's no way to do the one thing I came for."
        not_this: >
          If the product does the right thing but is hard to operate,
          that is ease of use. If the participant is asking for a
          specific feature that does not exist, that is a feature request
          in the UXR codebook — usefulness is the judgement that the
          product, as it stands, does or does not serve the need. If the
          comment is about whether the product is worth its cost or the
          organisation's while, that is a Valuable tag.

  # -------------------------------------------------------------------
  # Usable — "Ease of use remains vital"
  # -------------------------------------------------------------------
  - name: Usable
    subtitle: Can the person use it — is it easy, and does it stay out of the way?
    colour_set: emo
    tags:
      # M-04 (R). "Ease of use remains vital, and yet the interface-centered methods and perspectives of human-computer interaction do not address all dimensions." His own words, and his own deferral: v1's learnability / efficiency / error tolerance were Nielsen's 1993 usability attributes imported into the facet he was declining to decompose. Rescued: learnability → UXR learning curve; efficiency and error tolerance → Nielsen H7, H3/H5/H9.
      - name: ease of use
        renamed_from: [learnability, efficiency, error tolerance]
        definition: >
          Whether the participant can operate the product without
          unnecessary difficulty — it is easy to pick up, quick to get
          through, forgiving when they slip. Morville's "ease of use",
          the whole usable facet in one tag.
        apply_when: >
          The participant comments on how easy or hard the product is to
          use: getting started, getting through a task, recovering from
          a wrong turn, the effort it takes. Look for "that was easy,"
          "so many steps," "I had to learn how it wanted me to," "it let
          me undo that," "I keep getting it wrong." Positive and negative
          both belong here.
        not_this: >
          If the product does the wrong thing rather than doing the right
          thing awkwardly, that is usefulness. If the difficulty is
          finding something, that is a Findable tag. If the participant is
          anxious about making a mistake rather than describing one, that
          is anxiety in the UXR codebook or hesitation in Nielsen's.
          Finer usability distinctions — learnability, efficiency, error
          handling — are Nielsen's heuristics and live there.

  # -------------------------------------------------------------------
  # Desirable — "image, identity, brand, and other elements of emotional design"
  # -------------------------------------------------------------------
  - name: Desirable
    subtitle: Do people want it — image, identity, brand, emotional design?
    colour_set: opp
    tags:
      # M-05 (R). "brand" and "identity" are his words. v1 said "brand perception".
      - name: brand and identity
        renamed_from: brand perception
        definition: >
          How the product's image and identity — the brand, the
          organisation it belongs to, what using it says about the
          person — colour the participant's wish to use it.
        apply_when: >
          The participant reacts to the brand or to the identity the
          product projects: it feels like the company, it does not, they
          like being associated with it, they are embarrassed to be. Look
          for "it feels very them," "this doesn't look like a real
          [company]," "I'd be happy to be seen using this," "it's a bit
          cheap-looking for a bank."
        not_this: >
          If the reaction is to the look and feel itself rather than to
          whose it is, that is emotional design. If the participant is
          judging whether to trust what the product tells them, that is a
          Credible tag. Brand and identity is about wanting it because of
          who it is from and what it stands for.

      # M-06 (R). "other elements of emotional design" — his citation of Norman's Emotional Design (2004). v1 split this into emotional appeal + aesthetic quality, and added "engagement", which has no source.
      - name: emotional design
        renamed_from: [emotional appeal, aesthetic quality, engagement]
        definition: >
          Whether the product's look, feel and behaviour create a positive
          emotional response — the visceral pull of something attractive,
          the pleasure of something that feels good to use, the pride of
          owning it. Morville's "elements of emotional design".
        apply_when: >
          The participant expresses feeling about the product's design as
          such: delight, warmth, disgust, indifference, "it's gorgeous," "I
          love how this feels," "it looks polished," "it's ugly," "it just
          leaves me cold." Look for reactions to appearance, texture, motion
          and tone.
        not_this: >
          If the feeling attaches to the brand or organisation rather than
          the design, that is brand and identity. If beauty is being read
          as a reason to trust, that is trustworthiness (Credible). If the
          participant is describing what the product does for them rather
          than how it makes them feel, that is usefulness. Emotional
          design is the feeling the design itself produces.

  # -------------------------------------------------------------------
  # Findable — "navigable web sites and locatable objects"
  # -------------------------------------------------------------------
  - name: Findable
    subtitle: Can people find what they need — navigation, search, labels?
    colour_set: task
    tags:
      # M-07 (A). Essay: "design navigable web sites"; Ambient Findability: the degree to which a system "supports navigation and retrieval". The one group where every v1 tag traced to him; all four kept.
      - name: navigation clarity
        definition: >
          Whether the participant can move through the product's structure
          and know where they are — the navigation supports getting from
          here to there and back.
        apply_when: >
          The participant comments on moving around: menus that make sense
          or don't, knowing where they are, getting back, getting lost.
          Look for "I can see where I am," "how do I get back to," "I'm
          lost," "the menu is clear."
        not_this: >
          If they are typing a query, that is search effectiveness. If the
          thing they want is present but they cannot tell it is there, that
          is content discoverability. If the words on the navigation are
          the problem, that is labelling. Navigation clarity is the
          structure of movement.

      # M-07 (A). "retrieval" (Ambient Findability); "search systems" is one of Rosenfeld & Morville's four IA systems; Search Patterns (2010) is his.
      - name: search effectiveness
        definition: >
          Whether searching returns what the participant is looking for —
          the query is understood, the results are relevant, the ranking
          puts the right thing in reach.
        apply_when: >
          The participant searches and judges the result: found it, got
          nothing, got the wrong things, had to rephrase. Look for "it
          found it straight away," "no results," "these aren't what I
          meant," "I had to try three different words."
        not_this: >
          If they are browsing rather than searching, that is navigation
          clarity or content discoverability. If the result was right but
          the page it led to was wrong for them, that is usefulness.
          Search effectiveness is the query and its results.

      # M-07 (A). Essay: "locatable objects"; Ambient Findability: "easy to discover or locate".
      - name: content discoverability
        definition: >
          Whether content and features the participant would want are
          surfaced where they would look — or sit unseen even though they
          exist.
        apply_when: >
          The participant discovers something they did not know was there,
          or fails to see something that was, or comments that useful
          things are hidden or well placed. Look for "I didn't know that
          was there," "oh, there's a whole section for that," "why is
          this buried," "good, it's right where I'd expect."
        not_this: >
          If they are navigating a known structure, that is navigation
          clarity. If they used search, that is search effectiveness. If
          they saw it but the word for it misled them, that is labelling.
          Content discoverability is presence versus visibility.

      # M-07 (A). "Labeling systems" — one of the four IA systems in Rosenfeld & Morville.
      - name: labelling
        definition: >
          Whether the words the product uses for its sections, controls
          and content match what the participant would call them — labels
          that lead the right way, or mislead.
        apply_when: >
          The participant reads a label and is helped or misled by it, or
          comments on the vocabulary: "I'd never have called it that,"
          "what does 'workspace' mean," "the heading told me exactly what
          was in there," "it says 'archive' but it means delete."
        not_this: >
          If the problem is where a thing sits rather than what it is
          called, that is navigation clarity or content discoverability.
          If the label is jargon the participant cannot decode at all,
          Nielsen's jargon barrier also applies; here the question is
          whether the word led them to the right place.

  # -------------------------------------------------------------------
  # Accessible — "accessible to people with disabilities"
  # -------------------------------------------------------------------
  - name: Accessible
    subtitle: Can people with disabilities use it?
    colour_set: trust
    tags:
      # M-08 (R). His sentence: "our web sites should be accessible to people with disabilities (more than 10% of the population)". v1's four tags widened this to Microsoft's persona spectrum ("situational access", "and contexts") and to cognitive load ("cognitive accessibility", which is Nielsen H8 / Yablonski). Rescued: device and context → UXR device/channel; cognitive load → Yablonski Sweller.
      - name: accessibility
        renamed_from: [inclusive design, assistive compatibility, cognitive accessibility, situational access]
        definition: >
          Whether people with disabilities can use the product — it works
          with a screen reader, keyboard or other assistive technology,
          text can be read and enlarged, contrast is sufficient, media
          are captioned. Morville's accessible facet, scoped as he scoped
          it.
        apply_when: >
          The participant names a disability or an assistive technology
          and reports what worked or failed, or comments on contrast,
          text size, captions, keyboard operation, focus order, timing.
          Look for "my screen reader just says 'button'," "I can't read
          that grey text," "there are no captions," "I can't tab to it,"
          "I need it bigger."
        not_this: >
          If the participant is not describing a disability or assistive
          need, this facet does not apply: a small screen or a noisy
          room is device/channel in the UXR codebook; too much to take in
          is cognitive overload in Yablonski's. If the difficulty is
          general rather than access-related, that is ease of use.

  # -------------------------------------------------------------------
  # Credible — "whether users trust and believe what we tell them"
  # -------------------------------------------------------------------
  - name: Credible
    subtitle: Do people trust and believe what the product tells them?
    colour_set: emo
    tags:
      # M-09 (R). "trust and believe what we tell them"; Stanford guideline 4 (honest, trustworthy people behind the site) and 3 (visible expertise) fold in. The essay points readers at "Stanford's ten guidelines", so the Credible sub-tags are one step from him — the one group where sub-tags come from a source he names. v1's "social proof" (Cialdini) is UXR social influence.
      - name: trustworthiness
        renamed_from: social proof
        definition: >
          Whether the participant believes there are honest, competent
          people behind the product and that it will do what it says —
          the overall judgement of trust, and the cues that build or
          break it.
        apply_when: >
          The participant expresses or withholds trust: "I believe them,"
          "this looks dodgy," "I wouldn't put my card details in here,"
          "they clearly know what they're doing," "it feels legit." Also
          expertise on display, or its absence.
        not_this: >
          If the doubt is specifically about a fact being right or up to
          date, that is content accuracy. If it is about who is behind it
          or how to reach them, that is transparency. If the participant
          is relying on other people's reviews or ratings, that is social
          influence in the UXR codebook. Trustworthiness is the
          participant's own judgement of the product's good faith.

      # M-09 (A). Stanford guidelines 1 ("make it easy to verify the accuracy of the information") and 8 ("update your site's content often").
      - name: content accuracy
        definition: >
          Whether the participant believes the information is correct and
          current — facts check out, prices are right, nothing is stale
          or contradicted elsewhere.
        apply_when: >
          The participant questions or confirms a fact, spots something
          out of date, notices two pages disagree, or says they would
          check elsewhere. Look for "is that still right," "that's not
          what the other page said," "this looks out of date," "I'd
          double-check that."
        not_this: >
          If the doubt is about the organisation's honesty rather than a
          specific fact, that is trustworthiness. If information is
          missing rather than wrong, that is usefulness or content
          discoverability. Content accuracy is about the truth and
          currency of what is shown.

      # M-09 (A, reworded). Stanford guidelines 2 (a real organisation behind the site), 5 (easy to contact), 9 (restraint with promotional content). v1's "algorithms, business model, data collection" was 2010s privacy vocabulary, not the 2002 guidelines he cites.
      - name: transparency
        definition: >
          Whether the participant can tell who is behind the product, how
          to reach them, and what is being sold — a real organisation,
          contact details, promotion kept in proportion.
        apply_when: >
          The participant looks for or comments on the people and
          organisation behind the product, ways to contact them, physical
          presence, or the honesty of its promotional tone. Look for
          "who actually runs this," "there's no way to contact anyone,"
          "at least they say who they are," "it's a bit salesy."
        not_this: >
          If the participant trusts or distrusts the product as a whole,
          that is trustworthiness. If they are questioning a specific
          fact, that is content accuracy. Transparency is about the
          organisation showing itself.

  # -------------------------------------------------------------------
  # Valuable — "deliver value to our sponsors"
  # -------------------------------------------------------------------
  - name: Valuable
    subtitle: Does it deliver value to the sponsor — the mission, the bottom line, customer satisfaction?
    colour_set: opp
    tags:
      # M-10 (R). Essay: for-profits, the experience "must contribute to the bottom line and improve customer satisfaction"; non-profits, "advance the mission". v1 inverted the facet to user-side cost-benefit (worth it, competitive value, time well spent — Tristan Harris 2013 — and return intent). The participant-side evidence for the sponsor's value is what they say they would pay, switch, recommend, or came away with.
      - name: customer satisfaction
        renamed_from: [worth it, time well spent]
        definition: >
          Whether the experience left the participant satisfied — their
          overall verdict on whether it was worth their time and money,
          the thing Morville names as the for-profit sponsor's second
          measure of value.
        apply_when: >
          The participant sums up: happy with it, not happy, worth the
          money, not worth the bother, would use it again. Look for "I'm
          really pleased with that," "that was worth it," "not worth the
          hassle," "I'd use this again," "I feel a bit cheated."
        not_this: >
          If the verdict is specifically about paying, switching or
          recommending, that is bottom line. If it is about the outcome
          the organisation exists to produce, that is mission. If it is a
          judgement about one facet (it was easy, it was pretty), use that
          facet. Customer satisfaction is the overall verdict.

      # M-10 (R). "contribute to the bottom line". Evidence from the participant: what they would pay for, switch for, recommend, or leave over.
      - name: bottom line
        renamed_from: [return intent, competitive value]
        definition: >
          Whether the participant's behaviour would contribute to the
          sponsor's commercial success — they would pay, come back,
          switch to it, recommend it, or take their business elsewhere.
        apply_when: >
          The participant states an intention that has commercial weight:
          "I'd pay for this," "I'd switch from what I use now," "I'd
          tell my friends," "I'd cancel," "I'll go back to the other one."
          Comparisons to competitors on the same footing belong here.
        not_this: >
          If the participant is satisfied but says nothing about paying,
          returning or recommending, that is customer satisfaction. If the
          value they describe is the outcome the organisation exists for
          rather than revenue, that is mission. Bottom line is the
          commercial consequence of the experience.

      # M-10 (R, new). "The user experience must advance the mission." No predecessor in v1 — the tag that makes the honeycomb usable for public-sector, charity and clinical research, where the sponsor's value is not revenue.
      - name: mission
        definition: >
          Whether the experience advanced what the organisation exists to
          do — the participant got the benefit the service is there to
          deliver: the appointment booked, the claim made, the lesson
          learned, the help received.
        apply_when: >
          The participant reports that the outcome the service is for was
          reached, or not: "I got my prescription sorted," "I still don't
          know if I'm eligible," "I understand my rights now," "I gave
          up before I could apply." Applies to non-profit, public and
          internal services above all, and to any product whose purpose
          is an outcome rather than a sale.
        not_this: >
          If the value is commercial — paying, switching, recommending —
          that is bottom line. If it is the participant's overall
          contentment without reference to the outcome, that is customer
          satisfaction. If the product simply did what they needed in the
          moment, usefulness may fit better; mission is about the
          organisation's purpose being served.
