<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bristlenose player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #111; color: #e5e7eb; font-family: system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
#status { padding: 0.4rem 0.75rem; font-size: 0.8rem; color: #9ca3af;
           font-family: "SF Mono", "Fira Code", "Consolas", monospace;
           border-bottom: 1px solid #333; flex-shrink: 0; min-height: 1.8rem; }
#status.error { color: #ef4444; }
video { flex: 1; width: 100%; min-height: 0; background: #000; }
/* Subtitles: the clips' styling — white on a 75% black box, other speakers in
   the BBC colours (the .vtt's <c.yellow> etc.). Set here rather than trusting
   each engine's built-in colour classes; the viewer's system caption style
   can still override. */
::cue { color: #fff; background: rgba(0, 0, 0, 0.75); }
::cue(.yellow) { color: #ff0; }
::cue(.cyan) { color: #0ff; }
::cue(.lime) { color: #0f0; }
</style>
</head>
<body>
<div id="status">No video loaded</div>
<video id="bristlenose-video" controls preload="none"></video>
<script>
(function() {
  var video = document.getElementById('bristlenose-video');
  var status = document.getElementById('status');
  var currentUri = null;
  var currentPid = null;
  var openerOrigin = '*';

  // Subtitles. The report fetches a session's WebVTT (it holds the auth
  // token; a <track src> cannot send one) and posts the text here with the
  // recording it belongs to. Shown or hidden by the viewer's setting, which
  // arrives as `setSubtitles` and may come before any video is loaded.
  var wantSubtitles = false;
  // Received subtitles, by recording. Kept per recording rather than "latest",
  // so a slow reply for the previous recording can't displace the current one.
  var subtitlesBySrc = {};   // src -> { vtt, lang, label }
  var subtitleUrl = null;    // blob: URL of the attached track
  var trackEl = null;
  var attached = null;       // the entry trackEl was built from

  // Our track only: a recording can carry captions of its own, and turning
  // those on beside ours would stack two layers of text.
  function applySubtitleMode() {
    if (trackEl && trackEl.track) trackEl.track.mode = wantSubtitles ? 'showing' : 'hidden';
  }

  // The viewer used the video's own CC control. Adopt their choice and tell
  // the report, so the setting (and the Mac menu's checkmark) follows it and
  // the next recording doesn't undo it. Our own mode changes land here too,
  // but then the mode already equals wantSubtitles and nothing is sent.
  video.textTracks.addEventListener('change', function() {
    if (!trackEl || !trackEl.track) return;
    var showing = trackEl.track.mode === 'showing';
    if (showing === wantSubtitles) return;
    wantSubtitles = showing;
    _notify('bristlenose-subtitles-mode', { show: showing });
  });

  function detachSubtitles() {
    if (trackEl && trackEl.parentNode) trackEl.parentNode.removeChild(trackEl);
    if (subtitleUrl) URL.revokeObjectURL(subtitleUrl);
    trackEl = null;
    subtitleUrl = null;
    attached = null;
  }

  // Attach the current recording's subtitles. Unchanged ones are left in
  // place: every timecode click re-sends them, and rebuilding the track would
  // flicker the cue on screen and re-parse the whole session.
  function attachSubtitlesIfCurrent() {
    var subtitles = currentUri ? subtitlesBySrc[currentUri] : null;
    if (subtitles && subtitles === attached && trackEl) { applySubtitleMode(); return; }
    detachSubtitles();
    if (!subtitles || !subtitles.vtt) return;
    attached = subtitles;
    subtitleUrl = URL.createObjectURL(new Blob([subtitles.vtt], { type: 'text/vtt' }));
    trackEl = document.createElement('track');
    trackEl.kind = 'subtitles';
    trackEl.srclang = subtitles.lang || 'und';
    trackEl.label = subtitles.label || 'Subtitles';
    trackEl.src = subtitleUrl;
    trackEl.addEventListener('load', applySubtitleMode);
    video.appendChild(trackEl);
    applySubtitleMode();
  }

  function fmtTC(s) {
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = Math.floor(s % 60);
    var mm = (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
    return h ? (h < 10 ? '0' : '') + h + ':' + mm : mm;
  }

  function loadAndSeek(pid, fileUri, seconds) {
    currentPid = pid;
    if (fileUri !== currentUri) {
      currentUri = fileUri;
      attachSubtitlesIfCurrent();  // drops the previous recording's track
      video.src = fileUri;
      video.addEventListener('loadeddata', function onLoad() {
        video.removeEventListener('loadeddata', onLoad);
        video.currentTime = seconds;
        video.play().catch(function() {});
      });
      video.load();
    } else {
      video.currentTime = seconds;
      video.play().catch(function() {});
    }
    status.className = '';
    status.textContent = pid + ' @ ' + fmtTC(seconds);
    document.title = pid + ' \u2014 Bristlenose';
  }

  // Called by the report window to load + seek
  window.bristlenose_seekTo = function(pid, fileUri, seconds) {
    loadAndSeek(pid, fileUri, seconds);
  };

  // Read video source and seek time from URL hash
  function handleHash() {
    var hash = window.location.hash.substring(1);
    if (!hash) return;
    var params = {};
    hash.split('&').forEach(function(part) {
      var kv = part.split('=');
      if (kv.length === 2) params[kv[0]] = decodeURIComponent(kv[1]);
    });
    if (params.src) {
      loadAndSeek(params.pid || '', params.src, parseFloat(params.t) || 0);
    }
  }

  // Listen for postMessage from the report window
  window.addEventListener('message', function(e) {
    // Only accept messages from our own origin (or "null" for file:// URIs)
    if (e.origin !== window.location.origin && e.origin !== 'null') return;
    openerOrigin = e.origin;
    var d = e.data;
    if (d && d.type === 'bristlenose-seek' && d.src) {
      loadAndSeek(d.pid || '', d.src, parseFloat(d.t) || 0);
    } else if (d && d.type === 'bristlenose-subtitles' && d.src) {
      var prev = subtitlesBySrc[d.src];
      if (!(prev && prev.vtt === d.vtt && prev.lang === d.lang && prev.label === d.label)) {
        subtitlesBySrc[d.src] = { vtt: d.vtt || '', lang: d.lang, label: d.label };
      }
      if (d.src === currentUri) attachSubtitlesIfCurrent();
    } else if (d && d.type === 'bristlenose-command' && d.command === 'setSubtitles') {
      // Before the no-video guard: the setting can arrive first.
      wantSubtitles = !!(d.payload && d.payload.show);
      applySubtitleMode();
    } else if (d && d.type === 'bristlenose-command') {
      if (!currentUri) return; // No video loaded — ignore commands
      var p = d.payload || {};
      switch (d.command) {
        case 'playPause':
          video.paused ? video.play().catch(function(){}) : video.pause();
          break;
        case 'skipRelative':
          video.currentTime = Math.max(0, video.currentTime + (p.seconds || 0));
          break;
        case 'setSpeed':
          video.playbackRate = p.rate;
          break;
        case 'speedStep':
          video.playbackRate = Math.max(0.25, Math.min(4,
            Math.round((video.playbackRate + (p.delta || 0)) * 100) / 100));
          break;
        case 'volumeStep':
          video.volume = Math.max(0, Math.min(1,
            Math.round((video.volume + (p.delta || 0)) * 100) / 100));
          break;
        case 'toggleMute':
          video.muted = !video.muted;
          break;
        case 'togglePip':
          if (document.pictureInPictureElement) document.exitPictureInPicture().catch(function(){});
          else if (video.requestPictureInPicture) video.requestPictureInPicture().catch(function(){});
          break;
        case 'toggleFullscreen':
          if (document.fullscreenElement) document.exitFullscreen().catch(function(){});
          else if (video.requestFullscreen) video.requestFullscreen().catch(function(){});
          break;
      }
    }
  });

  // Handle initial load from URL hash
  handleHash();

  // Post messages back to the opener window for playback-synced glow.
  // Uses postMessage (not window.opener function calls) because browsers
  // block window.opener access for file:// URIs.
  // BroadcastChannel fallback: WKWebView popouts may have window.opener=null.
  var channel = (!window.opener && typeof BroadcastChannel !== 'undefined')
      ? new BroadcastChannel('bristlenose-player') : null;

  function _notify(type, extra) {
    var msg = { type: type, pid: currentPid };
    if (extra) { for (var k in extra) { msg[k] = extra[k]; } }
    if (window.opener) {
      try { window.opener.postMessage(msg, openerOrigin); } catch(e) {}
    }
    if (channel) {
      try { channel.postMessage(msg); } catch(e) {}
    }
  }

  video.addEventListener('timeupdate', function() {
    if (currentPid) {
      status.textContent = currentPid + ' @ ' + fmtTC(video.currentTime);
      _notify('bristlenose-timeupdate', { seconds: video.currentTime, playing: !video.paused });
    }
  });

  video.addEventListener('play', function() {
    _notify('bristlenose-playstate', { playing: true });
  });

  video.addEventListener('pause', function() {
    _notify('bristlenose-playstate', { playing: false });
  });

  video.addEventListener('error', function() {
    status.className = 'error';
    status.textContent = 'Cannot play this format \u2014 try converting to .mp4';
  });

  // Tell the report this window can now take messages. Anything it posted
  // before this page loaded (the subtitle setting, the subtitles themselves)
  // was lost, so it sends them again on hearing this.
  _notify('bristlenose-ready', { src: currentUri });
})();
</script>
</body>
</html>
