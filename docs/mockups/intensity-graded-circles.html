<!doctype html>
<html lang="en" data-color-theme="default"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intensity mark: graded circles</title>
<style>
/* ════ bristlenose/theme/tokens.css, tokens-typography.css, colors/palette-default.css, colors/palette-edo.css (verbatim, index.css order) ════ */
/* Design tokens — the single source of truth for all visual decisions.

   This file contains STRUCTURAL tokens (layout, spacing, radii, transitions),
   ANALYTICAL tokens (sentiment colours, codebook tag colours, heatmap), and
   SEMANTIC ALIASES that name a decision rather than a value (the inline
   edit-field set below). An alias points at a palette token, so it costs no
   per-palette maintenance and cannot drift from the palette it borrows from.

   TYPOGRAPHY tokens are in tokens-typography.css (web) / tokens-desktop.css (macOS).
   COLOUR PALETTE tokens are in colors/palette-default.css and colors/palette-edo.css.

   Override palette tokens with data-color-theme="<name>" on <html>.
   Override platform tokens with data-platform="desktop" on <html>. */

:root {
    /* Sentiment colours (v0.7+ taxonomy) — analytical, NOT theme-overridable.
       See docs/academic-sources.html for theoretical foundations. */

    /* Negative sentiments */
    --bn-sentiment-frustration: #ea580c;
    --bn-sentiment-frustration-bg: #fff7ed;
    --bn-sentiment-confusion: #dc2626;
    /* Error text — sentiment-frustration (#ea580c) is a fill hue, only 3.56:1
       on white as body text; this darker shade clears WCAG AA (4.5:1). */
    --bn-colour-error-text: #c2410c;
    --bn-sentiment-confusion-bg: #fef2f2;
    --bn-sentiment-doubt: #7c3aed;
    --bn-sentiment-doubt-bg: #f5f3ff;

    /* Neutral (investigation flag) */
    --bn-sentiment-surprise: #d97706;
    --bn-sentiment-surprise-bg: #fffbeb;

    /* Positive sentiments */
    --bn-sentiment-satisfaction: #16a34a;
    --bn-sentiment-satisfaction-bg: #f0fdf4;
    --bn-sentiment-delight: #059669;
    --bn-sentiment-delight-bg: #ecfdf5;
    --bn-sentiment-confidence: #2563eb;
    --bn-sentiment-confidence-bg: #eff6ff;

    /* Analysis heatmap — OKLCH colour ramp tokens */
    --bn-heat-frustration-h: 55;
    --bn-heat-confusion-h: 30;
    --bn-heat-doubt-h: 295;
    --bn-heat-surprise-h: 75;
    --bn-heat-satisfaction-h: 155;
    --bn-heat-delight-h: 170;
    --bn-heat-confidence-h: 260;
    --bn-heat-chroma: 0.12;
    --bn-heat-l-min: 95%;
    --bn-heat-l-max: 45%;
    --bn-heat-depleted-h: 75;
    --bn-heat-depleted-chroma: 0.08;

    /* Codebook user-tag colours — OKLCH v5 pentadic palette.
       5 sets at ~72° hue anchors, ±25° per set, ~12° steps.
       Light mode: washed (pale bg, dark text).
       Dark mode: saturated (mid-dark bg, white text).
       See immutable-chasing-patterson plan for rationale. */

    /* UX set (blue, H=225-275, anchor 250) */
    --bn-ux-1-bg: oklch(94% 0.03 225);
    --bn-ux-2-bg: oklch(94% 0.03 237);
    --bn-ux-3-bg: oklch(94% 0.03 250);
    --bn-ux-4-bg: oklch(94% 0.03 263);
    --bn-ux-5-bg: oklch(94% 0.03 275);

    /* Emotion set (red-pink, H=340-40, anchor 10) */
    --bn-emo-1-bg: oklch(94% 0.03 340);
    --bn-emo-2-bg: oklch(94% 0.03 352);
    --bn-emo-3-bg: oklch(94% 0.03 4);
    --bn-emo-4-bg: oklch(94% 0.03 16);
    --bn-emo-5-bg: oklch(94% 0.03 28);
    --bn-emo-6-bg: oklch(94% 0.03 40);

    /* Task set (green-teal, H=130-180, anchor 155) */
    --bn-task-1-bg: oklch(94% 0.03 130);
    --bn-task-2-bg: oklch(94% 0.03 142);
    --bn-task-3-bg: oklch(94% 0.03 155);
    --bn-task-4-bg: oklch(94% 0.03 168);
    --bn-task-5-bg: oklch(94% 0.03 180);

    /* Trust set (purple, H=275-325, anchor 300) */
    --bn-trust-1-bg: oklch(94% 0.03 275);
    --bn-trust-2-bg: oklch(94% 0.03 287);
    --bn-trust-3-bg: oklch(94% 0.03 300);
    --bn-trust-4-bg: oklch(94% 0.03 313);
    --bn-trust-5-bg: oklch(94% 0.03 325);

    /* Opportunity set (amber, H=50-100, anchor 75) */
    --bn-opp-1-bg: oklch(94% 0.03 50);
    --bn-opp-2-bg: oklch(94% 0.03 62);
    --bn-opp-3-bg: oklch(94% 0.03 75);
    --bn-opp-4-bg: oklch(94% 0.03 88);
    --bn-opp-5-bg: oklch(94% 0.03 100);

    /* Sentiment set — numeric aliases for the codebook colour system.
       Maps index-based getTagBg() to the existing named sentiment vars. */
    --bn-sentiment-1-bg: var(--bn-sentiment-frustration-bg);
    --bn-sentiment-2-bg: var(--bn-sentiment-confusion-bg);
    --bn-sentiment-3-bg: var(--bn-sentiment-doubt-bg);
    --bn-sentiment-4-bg: var(--bn-sentiment-surprise-bg);
    --bn-sentiment-5-bg: var(--bn-sentiment-satisfaction-bg);
    --bn-sentiment-6-bg: var(--bn-sentiment-delight-bg);
    --bn-sentiment-7-bg: var(--bn-sentiment-confidence-bg);

    /* Custom / ungrouped */
    --bn-custom-bg: oklch(94% 0.005 260);

    /* Group card background tints (very subtle set tint for codebook panel) */
    --bn-group-ux:        oklch(97% 0.015 250);
    --bn-group-emo:       oklch(97% 0.015 10);
    --bn-group-task:      oklch(97% 0.015 155);
    --bn-group-trust:     oklch(97% 0.015 300);
    --bn-group-opp:       oklch(97% 0.015 75);
    --bn-group-sentiment: oklch(97% 0.010 200);

    /* Micro histogram bar colours (slightly more saturated than badge bg) */
    --bn-bar-ux:        oklch(70% 0.08 250);
    --bn-bar-emo:       oklch(70% 0.08 10);
    --bn-bar-task:      oklch(70% 0.06 155);
    --bn-bar-trust:     oklch(70% 0.07 300);
    --bn-bar-opp:       oklch(72% 0.07 75);
    --bn-bar-sentiment: oklch(65% 0.06 200);

    /* Set indicator dots (saturated anchors for codebook panel) */
    --bn-set-ux-dot: oklch(50% 0.12 250);
    --bn-set-emo-dot: oklch(50% 0.12 10);
    --bn-set-task-dot: oklch(50% 0.10 155);
    --bn-set-trust-dot: oklch(50% 0.11 300);
    --bn-set-opp-dot: oklch(52% 0.11 75);

    /* Legacy sentiment colours (deprecated — kept for backward compat) */
    --bn-colour-confusion: var(--bn-sentiment-confusion);
    --bn-colour-confusion-bg: var(--bn-sentiment-confusion-bg);
    --bn-colour-frustration: var(--bn-sentiment-frustration);
    --bn-colour-frustration-bg: var(--bn-sentiment-frustration-bg);
    --bn-colour-delight: var(--bn-sentiment-delight);
    --bn-colour-delight-bg: var(--bn-sentiment-delight-bg);

    /* Layout */
    --bn-max-width: 52rem;
    --bn-quote-max-width: 23rem;   /* card reading measure — ~5 words/line */
    --bn-grid-gap: 1.25rem;        /* gap between grid columns */
    --bn-flow-tolerance: 5em;      /* grid-lanes masonry: how much height imbalance
                                      to tolerate before breaking reading order.
                                      Safari 26.4+ only. Provisional — tuned on the
                                      Phase-1 mockup, pending real-corpus validation. */
    --bn-toolbar-height: 3rem;

    /* Sidebar layout (serve-mode dual-sidebar with resizable panels) */
    --bn-sidebar-width: 280px;   /* default panel width */
    --bn-sidebar-min: 200px;     /* minimum resize bound */
    --bn-sidebar-max: 480px;     /* maximum resize bound */
    --bn-rail-width: 36px;       /* collapsed icon rail width */
    --bn-minimap-width: 5rem;    /* minimap column incl. breathing room (80px; ~56px content + 12px each side) */
    --bn-overlay-duration: 0.3s;   /* overlay open/close animation speed */

    /* Dialogs (atoms/modal.css, components/Dialog.tsx) — the macOS sheet, measured
       24 Oct 2026 from a stock Save sheet in light mode on macOS 27: the window
       behind is pulled towards a light grey rather than covered in black (no
       blur), the sheet has a ~20 pt radius and a shadow offset downward, and it
       slides 32 pt down into place while it fades in. Dark values below are
       a judgement, not a measurement. */
    --bn-overlay-scrim: rgb(170 170 170 / 0.59);
    --bn-overlay-z: 1000;
    --bn-toast-z: 1100;                     /* a notification stays above a dialog */
    --bn-modal-bg: var(--bn-colour-bg);
    --bn-modal-radius: 20px;
    --bn-modal-hairline: rgb(0 0 0 / 0.1);
    --bn-modal-shadow-colour: rgb(0 0 0 / 0.3);
    --bn-modal-shadow: 0 0 0 1px var(--bn-modal-hairline), 0 10px 40px var(--bn-modal-shadow-colour);
    --bn-modal-offset: 32px;                /* the sheet drops this far into place */
    --bn-modal-enter: 230ms;                /* the drop, and the backdrop dimming */
    --bn-modal-enter-fade: 100ms;           /* solid early; the drop carries on */
    --bn-modal-enter-ease: cubic-bezier(0, 0, 0.58, 1);
    --bn-modal-exit: 240ms;                 /* rise, fade and backdrop together, linear */
    --bn-gutter-left: 2rem;        /* gap: rail/sidebar → center content */
    --bn-gutter-right: 0.5rem;     /* gap: center content → minimap column */

    /* (--bn-first-baseline retired 25 Jul 2026. It was a cross-seam datum
       aligning webview baselines to the native sidebar's "Project" row — an
       alignment the red-background test proved unrealisable (the webview's
       layout viewport starts at the toolbar seam, below that native baseline).
       With the toolbar-inset residual now 0, content and the flanking inspector
       share one web-internal datum of --bn-space-xl below the seam; the base
       .tag-sidebar bleed and the body top-pad already agree. See
       organisms/sidebar.css § "First-baseline datum".) */

    /* Breakpoints — reference values for @media queries across the system.
       CSS @media can't consume var(), so use these values directly in
       media queries and reference the token name in a comment.
       When adding a new media query, pick from this list or add a new entry. */
    --bn-breakpoint-compact:  500px;   /* help overlay, single-column fallback */
    --bn-breakpoint-toolbar:  600px;   /* toolbar collapse (planned) */
    --bn-breakpoint-content:  1100px;  /* transcript annotation margin layout */
    --bn-breakpoint-wide:     1400px;  /* 16"+ / wide displays — dashboard featured quotes go to 5 across */

    /* Spacing scale */
    --bn-space-xs: 0.15rem;
    --bn-space-sm: 0.35rem;
    --bn-space-md: 0.75rem;
    --bn-space-lg: 1.5rem;
    --bn-space-xl: 2rem;
    --bn-space-2xl: 3rem;

    /* Signals lens — semantic spacing aliases. The card keeps one generous
       reading rhythm even when it is one member of a compound location. */
    --bn-signal-card-inset: var(--bn-space-2xl);
    --bn-signal-card-section-gap: var(--bn-space-xl);
    --bn-signal-card-evidence-gap: var(--bn-space-md);
    --bn-signal-card-quote-inset: var(--bn-space-md);
    --bn-signal-card-footer-gap: var(--bn-space-lg);
    --bn-signal-card-assertion-gap: var(--bn-space-sm);

    /* "New"-material highlighter (Phase 3 placeholder) — a fixed marker green,
       the same in light and dark; the dark text reads on it in both modes. */
    --bn-colour-new-highlight: #75fb4c;
    --bn-colour-new-highlight-text: #0f2b08;

    /* Radii */
    --bn-radius-sm: 3px;
    --bn-radius-md: 6px;
    --bn-radius-lg: 8px;
    --bn-radius-pill: 999px;

    /* ── Inline edit fields — READ THIS BEFORE STYLING A NEW ONE ──────────
     *
     * An inline edit field is a piece of text the researcher can click into
     * and retype: a theme heading, a session name, a code group's title, a
     * code. There are exactly TWO treatments and the choice is mechanical,
     * decided by the GROUND the field sits on, not by which lens you are in:
     *
     *   field on page background  →  --bn-field-edit-fill-on-page  (tints up)
     *   field on a tinted surface →  --bn-field-edit-fill-on-tint  (blanks to
     *                                                               neutral)
     *
     * Both carry --bn-field-edit-edge at 1px. The fill inverts because the
     * ground does; the edge never changes, so the signal is one signal.
     * Border or outline is yours to pick — outline for a span in running
     * prose (it costs no layout and will not reflow the line), border for
     * something that already has a box. That is a mechanism, not a meaning.
     *
     * DO NOT invent a third fill. Two surfaces got one each before these
     * tokens existed (a quote-bg tint, a page-bg blank) and two more got
     * nothing at all, which is how "is this field live?" came to have four
     * answers on one screen.
     *
     * THE ONE EXEMPTION is quote cropping — `.crop-editable` and the bracket
     * handles in molecules/editable-text.css. That is not "edit this text",
     * it is "move this boundary", it was designed as a single signal with the
     * burnt-amber brackets, and it keeps --bn-colour-crop-bg. Do not reach
     * for that yellow for anything else, and do not restyle crop to match
     * these: a different verb is allowed a different look. The token was
     * called --bn-colour-editing-bg until 20 Sep 2026; it was renamed
     * because a token named for a state it must not be used in is how the
     * four-answers-on-one-screen problem started. */
    --bn-field-edit-edge: var(--bn-colour-accent);
    --bn-field-edit-fill-on-page: var(--bn-colour-quote-bg);
    --bn-field-edit-fill-on-tint: var(--bn-colour-bg);
    --bn-field-edit-radius: var(--bn-radius-sm);
    --bn-field-edit-offset: 1px;

    /* Section-divider keyline — the colour of the h2 / .section-heading /
       .framework-section-header bottom rules and the header <hr>. Aliases
       --bn-colour-border by default (visible); set to `transparent`
       (globally here, or per-surface) to hide every section divider WITHOUT
       moving anything — the 1px box still lays out, it just stops painting.
       The reversible borders-off experiment. Table-header (th) rules keep
       --bn-colour-border (data-grid chrome, not a section divider).
       See docs/design-lens-template.md § Keylines. */
    --bn-colour-keyline: var(--bn-colour-border);

    /* Transitions */
    --bn-transition-fast: 0.15s ease;
    --bn-transition-normal: 0.2s ease;
    --bn-transition-slow: 0.3s ease;

    /* Focus Mode — the distraction-free reading state (templates/focus-mode.css,
       docs/design-focus-mode.md). Structural, NOT palette-overridable: the whole
       transform is colour-free by design, which is what lets it compose with
       every palette × appearance with zero per-palette overrides. Deliberately
       here and not in colors/_contract.css — a Focus token in the contract would
       oblige every future palette author to answer a question the feature
       doesn't ask. "Dusk, not a light-switch": no overshoot, no bounce — the
       wrong register for reading evidence. */
    --bn-focus-ghost-opacity: 0.14;
    --bn-focus-heading-opacity: 0.4;
    --bn-focus-dur: 320ms;
    --bn-focus-ease: ease-in-out;
    /* How much of a receded card's outline survives — the border is mixed
       toward transparent by the remainder. One number for both lenses (the
       quote card's left edge, the signal card's box and fused seam); it was a
       literal 40% in two places until the Signals lens made it three. */
    --bn-focus-outline-mix: 40%;

    /* Arrival — the "you are here" cue on the thing a link landed on: a
       transcript paragraph, a quote card, a group heading
       (atoms/arrival.css, docs/design-arrival-flash.md). Seconds, not the
       Acknowledge range, because the eye is still travelling when it starts.
       Structural, like Focus: the colour is an alias of the palette's
       highlight, so every palette × appearance answers through the contract
       it already keeps. */
    --bn-arrival-colour: var(--bn-colour-highlight);
    --bn-arrival-duration: 5s;
    --bn-arrival-easing: ease-out;

    /* Thinking-shimmer — the "work in progress" travelling-sheen for text.
       Shared cross-surface spec, locked 18 Jul 2026 (docs/design-motion.md
       §4.7.1). Consuming surfaces set --bn-shimmer-base (resting text colour)
       and --bn-shimmer-peak (the pole the band moves toward: white where text
       is dark, the surface background where text is light) so the sheen has
       headroom in every theme. See atoms/shimmer.css. */
    --bn-shimmer-contrast: 5%;    /* band peak = 5% from base toward the peak pole */
    --bn-shimmer-band: 34%;       /* feathered band width, as % of the gradient */
    --bn-shimmer-angle: 100deg;   /* slight off-horizontal tilt */
    --bn-shimmer-sweep: 1800ms;   /* travel time (documentation; keyframe encodes the split) */
    --bn-shimmer-gap: 900ms;      /* dark hold between sweeps (documentation) */
    --bn-shimmer-period: 2700ms;  /* sweep + gap — the animation duration */
    --bn-shimmer-easing: ease-in-out;

    /* Legacy aliases — used by inline styles in generated HTML.
       Theme authors: override the --bn-* versions above;
       these aliases follow automatically. */
    --font-body: var(--bn-font-body);
    --font-mono: var(--bn-font-mono);
    --colour-bg: var(--bn-colour-bg);
    --colour-text: var(--bn-colour-text);
    --colour-muted: var(--bn-colour-muted);
    --colour-border: var(--bn-colour-border);
    --colour-accent: var(--bn-colour-accent);
    --colour-quote-bg: var(--bn-colour-quote-bg);
    --colour-badge-bg: var(--bn-colour-badge-bg);
    --colour-badge-text: var(--bn-colour-badge-text);
    --colour-confusion: var(--bn-colour-confusion);
    --colour-frustration: var(--bn-colour-frustration);
    --colour-delight: var(--bn-colour-delight);
    --colour-suggestion: var(--bn-colour-suggestion);
    --max-width: var(--bn-max-width);
}

/* Dark mode overrides for analytical tokens.
   Palette colours are handled in their own palette-*.css files. */

@supports (color: light-dark(#000, #fff)) {
    :root {
        color-scheme: light dark;

        /* Sentiment colours (v0.7+ taxonomy) — foreground hues lighter on dark */
        --bn-sentiment-frustration:      light-dark(#ea580c, #fb923c);
        --bn-sentiment-frustration-bg:   light-dark(#fff7ed, #2d1d0e);
        --bn-sentiment-confusion:        light-dark(#dc2626, #f87171);
        --bn-colour-error-text:          light-dark(#c2410c, #fb923c);
        --bn-sentiment-confusion-bg:     light-dark(#fef2f2, #2d1515);
        --bn-sentiment-doubt:            light-dark(#7c3aed, #a78bfa);
        --bn-sentiment-doubt-bg:         light-dark(#f5f3ff, #1e1533);
        --bn-sentiment-surprise:         light-dark(#d97706, #fbbf24);
        --bn-sentiment-surprise-bg:      light-dark(#fffbeb, #2d2305);
        --bn-sentiment-satisfaction:     light-dark(#16a34a, #4ade80);
        --bn-sentiment-satisfaction-bg:  light-dark(#f0fdf4, #0f2918);
        --bn-sentiment-delight:          light-dark(#059669, #34d399);
        --bn-sentiment-delight-bg:       light-dark(#ecfdf5, #0d261c);
        --bn-sentiment-confidence:       light-dark(#2563eb, #60a5fa);
        --bn-sentiment-confidence-bg:    light-dark(#eff6ff, #111d2e);

        /* Analysis heatmap — dark mode overrides */
        --bn-heat-chroma: light-dark(0.12, 0.10);
        --bn-heat-l-min: light-dark(95%, 30%);
        --bn-heat-l-max: light-dark(45%, 75%);
        --bn-heat-depleted-chroma: light-dark(0.08, 0.06);

        /* Codebook user-tag colours — dark mode: saturated bg, white text */
        --bn-ux-1-bg: light-dark(oklch(94% 0.03 225), oklch(50% 0.12 225));
        --bn-ux-2-bg: light-dark(oklch(94% 0.03 237), oklch(48% 0.11 237));
        --bn-ux-3-bg: light-dark(oklch(94% 0.03 250), oklch(53% 0.12 250));
        --bn-ux-4-bg: light-dark(oklch(94% 0.03 263), oklch(55% 0.10 263));
        --bn-ux-5-bg: light-dark(oklch(94% 0.03 275), oklch(49% 0.11 275));
        --bn-emo-1-bg: light-dark(oklch(94% 0.03 340), oklch(50% 0.12 340));
        --bn-emo-2-bg: light-dark(oklch(94% 0.03 352), oklch(48% 0.11 352));
        --bn-emo-3-bg: light-dark(oklch(94% 0.03 4), oklch(53% 0.10 4));
        --bn-emo-4-bg: light-dark(oklch(94% 0.03 16), oklch(49% 0.12 16));
        --bn-emo-5-bg: light-dark(oklch(94% 0.03 28), oklch(55% 0.10 28));
        --bn-emo-6-bg: light-dark(oklch(94% 0.03 40), oklch(51% 0.11 40));
        --bn-task-1-bg: light-dark(oklch(94% 0.03 130), oklch(50% 0.10 130));
        --bn-task-2-bg: light-dark(oklch(94% 0.03 142), oklch(48% 0.09 142));
        --bn-task-3-bg: light-dark(oklch(94% 0.03 155), oklch(53% 0.09 155));
        --bn-task-4-bg: light-dark(oklch(94% 0.03 168), oklch(49% 0.10 168));
        --bn-task-5-bg: light-dark(oklch(94% 0.03 180), oklch(51% 0.09 180));
        --bn-trust-1-bg: light-dark(oklch(94% 0.03 275), oklch(50% 0.11 275));
        --bn-trust-2-bg: light-dark(oklch(94% 0.03 287), oklch(48% 0.10 287));
        --bn-trust-3-bg: light-dark(oklch(94% 0.03 300), oklch(53% 0.10 300));
        --bn-trust-4-bg: light-dark(oklch(94% 0.03 313), oklch(49% 0.11 313));
        --bn-trust-5-bg: light-dark(oklch(94% 0.03 325), oklch(51% 0.10 325));
        --bn-opp-1-bg: light-dark(oklch(94% 0.03 50), oklch(52% 0.11 50));
        --bn-opp-2-bg: light-dark(oklch(94% 0.03 62), oklch(50% 0.10 62));
        --bn-opp-3-bg: light-dark(oklch(94% 0.03 75), oklch(54% 0.12 75));
        --bn-opp-4-bg: light-dark(oklch(94% 0.03 88), oklch(48% 0.10 88));
        --bn-opp-5-bg: light-dark(oklch(94% 0.03 100), oklch(51% 0.11 100));
        --bn-custom-bg: light-dark(oklch(94% 0.005 260), oklch(52% 0.02 260));
        /* Group card background tints */
        --bn-group-ux:        light-dark(oklch(97% 0.015 250), oklch(22% 0.025 250));
        --bn-group-emo:       light-dark(oklch(97% 0.015 10),  oklch(22% 0.025 10));
        --bn-group-task:      light-dark(oklch(97% 0.015 155), oklch(22% 0.020 155));
        --bn-group-trust:     light-dark(oklch(97% 0.015 300), oklch(22% 0.025 300));
        --bn-group-opp:       light-dark(oklch(97% 0.015 75),  oklch(22% 0.022 75));
        --bn-group-sentiment: light-dark(oklch(97% 0.010 200), oklch(22% 0.015 200));

        /* Micro histogram bar colours */
        --bn-bar-ux:        light-dark(oklch(70% 0.08 250), oklch(55% 0.08 250));
        --bn-bar-emo:       light-dark(oklch(70% 0.08 10),  oklch(55% 0.08 10));
        --bn-bar-task:      light-dark(oklch(70% 0.06 155), oklch(55% 0.06 155));
        --bn-bar-trust:     light-dark(oklch(70% 0.07 300), oklch(55% 0.07 300));
        --bn-bar-opp:       light-dark(oklch(72% 0.07 75),  oklch(57% 0.07 75));
        --bn-bar-sentiment: light-dark(oklch(65% 0.06 200), oklch(50% 0.06 200));

        --bn-set-ux-dot: light-dark(oklch(50% 0.12 250), oklch(60% 0.10 250));
        --bn-set-emo-dot: light-dark(oklch(50% 0.12 10), oklch(60% 0.10 10));
        --bn-set-task-dot: light-dark(oklch(50% 0.10 155), oklch(60% 0.08 155));
        --bn-set-trust-dot: light-dark(oklch(50% 0.11 300), oklch(60% 0.09 300));
        --bn-set-opp-dot: light-dark(oklch(52% 0.11 75), oklch(62% 0.09 75));

        /* Legacy aliases (deprecated) */
        --bn-colour-confusion:        var(--bn-sentiment-confusion);
        --bn-colour-confusion-bg:     var(--bn-sentiment-confusion-bg);
        --bn-colour-frustration:      var(--bn-sentiment-frustration);
        --bn-colour-frustration-bg:   var(--bn-sentiment-frustration-bg);
        --bn-colour-delight:          var(--bn-sentiment-delight);
        --bn-colour-delight-bg:       var(--bn-sentiment-delight-bg);

        /* Dialogs in dark: the page dims towards black, and the sheet is a raised
           surface, lighter than the page, with a light hairline, the way a dark
           macOS sheet reads. Without the lift a dark card vanished into the dimmed
           dark report (docs/mockups/modal-crash-way-out.html, dark frame). */
        --bn-overlay-scrim:        light-dark(rgb(170 170 170 / 0.59), rgb(0 0 0 / 0.5));
        --bn-modal-bg:             light-dark(var(--bn-colour-bg), color-mix(in srgb, var(--bn-colour-bg), white 9%));
        --bn-modal-hairline:       light-dark(rgb(0 0 0 / 0.1), rgb(255 255 255 / 0.14));
        --bn-modal-shadow-colour:  light-dark(rgb(0 0 0 / 0.3), rgb(0 0 0 / 0.6));
    }

    /* Explicit overrides — lock theme regardless of OS preference */
    [data-theme="light"]:root { color-scheme: light; }
    [data-theme="dark"]:root  { color-scheme: dark; }
}

/* Typography tokens — web defaults (Inter Variable from Google Fonts).
   Desktop overrides are in tokens-desktop.css.

   Scale D — 8 stops. Semantic intent:
   - label (13px) = app's voice (chrome, UI labels, navigation, context)
   - body  (15px) = participant's voice (quote text, transcript segments)

   Archive of previous scale: tokens-typography-v1.css */

:root {
    /* Font family — Inter Variable loaded from Google Fonts (see index.html).
       Fallback chain: Segoe UI Variable (Win 11), Segoe UI (Win 10),
       system-ui, SF Pro (macOS), CJK families. */
    --bn-font-body: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system,
        "Hiragino Kaku Gothic ProN", "Hiragino Sans",   /* macOS Japanese */
        "Yu Gothic UI",                                  /* Windows Japanese */
        "Malgun Gothic",                                 /* Windows Korean */
        "Apple SD Gothic Neo",                           /* macOS Korean */
        "Noto Sans CJK JP", "Noto Sans CJK KR",         /* Linux CJK */
        sans-serif;
    /* One mono stack for both scales (docs/design-monospace-roles.md §4, §6). No "SF Mono" by
       name: it resolves only on Macs with Apple's developer download, so it made the developer's
       view differ from every researcher's. WebKit reaches the system SF Mono via ui-monospace;
       Chromium on a Mac has no ui-monospace and takes Menlo; Windows 11 Cascadia Mono, Windows 10
       Consolas; Linux DejaVu. The generic is last and reached nowhere measured: it is Courier in
       Chromium on a Mac and Courier New in Windows 10's Edge. */
    --bn-font-mono: ui-monospace, Menlo, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
    --bn-font-editorial: Georgia, "Times New Roman", serif;

    /* Font weight scale — tuned for variable fonts (Inter, SF Pro, Segoe UI Variable).
       On static fonts (Win 10 Segoe UI), 370/420→400 and 490→400 — acceptable degradation. */
    --bn-weight-light: 370;      /* subordinate text (sidebar nav links, secondary lists) */
    --bn-weight-normal: 420;     /* body text, descriptions, quote content */
    --bn-weight-emphasis: 490;   /* headings, labels, section titles */
    --bn-weight-starred: 520;    /* starred quotes — pop above emphasis, below strong */
    --bn-weight-semibold: 600;   /* a chosen word in a text-only switch (picker scope) */
    --bn-weight-strong: 700;     /* delete buttons, page title, action glyphs */

    /* Icon stroke = the stem of the text beside it, as a fraction of the font size
       (docs/design-icon-system.md § Weight; measured on Inter and SF Pro, which agree
       to 2%). A context set in a heavier weight sets --bn-icon-stem beside its
       font-weight. No light value: the SPA's Inter is served 400..700, so 370 renders 400. */
    --bn-icon-stem-normal: 0.092;
    --bn-icon-stem-emphasis: 0.106;
    --bn-icon-stem-starred: 0.111;
    --bn-icon-stem-semibold: 0.127;
    --bn-icon-stem-strong: 0.146;
    --bn-icon-stem: var(--bn-icon-stem-normal);

    /* Monospace weights — three values, chosen against measured rendering on every face the
       stack reaches (docs/design-monospace-roles.md §6). 400–490 is Regular in Menlo, Consolas
       and Cascadia Mono and varies only in SF Mono; Windows matches the nearest weight, so
       Consolas turns Bold at 550 and Cascadia SemiBold at 500. */
    --bn-weight-mono: 400;          /* every mono role at rest */
    --bn-weight-mono-tag: 460;      /* tags, light appearance: SF Mono +9%, Regular elsewhere; 400 in dark (below) */
    --bn-weight-mono-emphasis: 560; /* the one step up (a path that names the screen): Bold in Menlo and Consolas */

    /* Typography scale — 8 stops, size + line-height pairs.
       Line-height decreases as size increases (Bringhurst principle:
       large letterforms provide visual anchoring, need less leading). */
    --bn-text-micro:       0.6rem;      /* 9.6px  — delete ×, confidence badges */
    --bn-text-micro-lh:    1.2;
    --bn-text-badge:       0.72rem;     /* 11.5px — badges, group headers, tag counts */
    --bn-text-badge-lh:    1.3;
    --bn-text-caption:     0.75rem;     /* 12px   — footnotes, footer, modal footer, kbd */
    --bn-text-caption-lh:  1.4;
    --bn-text-label:       0.8125rem;   /* 13px   — toolbar, filters, context, timecodes (app voice) */
    --bn-text-label-lh:    1.45;
    --bn-text-body:        0.9375rem;   /* 15px   — quote text, transcript segments (participant voice) */
    --bn-text-body-lh:     1.5;
    --bn-text-heading:     1.125rem;    /* 18px   — section headings, h3, modal titles */
    --bn-text-heading-lh:  1.3;
    --bn-text-title:       1.375rem;    /* 22px   — page titles, h2, logotype */
    --bn-text-title-lh:    1.25;
    --bn-text-display:     1.75rem;     /* 28px   — report h1 */
    --bn-text-display-lh:  1.2;

    /* Signal card finding hierarchy. The title is a compact app heading;
       the claim is the generous editorial statement beneath it. */
    --bn-text-signal-title: 0.9375rem;
    --bn-text-signal-title-lh: 1.5;
    --bn-track-signal-title: 0;
    --bn-weight-signal-title: var(--bn-weight-strong);
    --bn-text-signal-claim: 1.29375rem;
    --bn-text-signal-claim-lh: 1.4;
    --bn-track-signal-claim: -0.005em;
    --bn-weight-signal-claim: 500;
}

/* Tags drop to Regular in the dark appearance: light text on a dark tint already reads heavier,
   and dark tags measure 6.2–9.3:1 against light's 3.1–5.2:1 (docs/design-monospace-roles.md).
   font-weight cannot follow light-dark(), so the token follows the two scopes the palettes use. */
[data-theme="dark"] {
    --bn-weight-mono-tag: var(--bn-weight-mono);
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bn-weight-mono-tag: var(--bn-weight-mono);
    }
}

/* palette-default — Bristlenose's standard blue/grey colour theme.
   This is the web-mode default palette, loaded as :root fallback.
   Tokens defined here are overridden by any active [data-color-theme] palette.

   To create a new theme: copy this file, change the selector to
   [data-color-theme="your-theme"], and remap every token.
   See _contract.css for the full list of required tokens. */

:root,
[data-color-theme="default"] {
    /* Colour palette */
    --bn-colour-bg: #ffffff;
    --bn-colour-text: #1a1a1a;
    --bn-colour-muted: #6b7280;
    --bn-colour-border: #e5e7eb;
    --bn-colour-accent: #007aff;
    --bn-colour-hover: #e8f0fe;
    --bn-colour-inspector-bg: #f9f9fa;          /* Inspector chrome — Xcode Tahoe's flat inspector tint (~2% off white) */

    /* Semantic surfaces */
    --bn-colour-quote-bg: #f9fafb;
    --bn-colour-paper: #f6f7f8;                 /* Transcript ground: a cool neutral, 1.07:1 under the sheet */
    --bn-colour-sheet: #ffffff;                 /* A quote lifted off the paper */
    --bn-colour-badge-bg-paper: #ebedf0;        /* Badges on the paper (#f3f4f6 vanishes there) */
    --bn-colour-badge-bg: #f3f4f6;
    --bn-colour-badge-text: #374151;
    --bn-colour-user-tag-bg: #f3f4f6;
    --bn-colour-user-tag-text: #4b5563;
    --bn-colour-crop-bg: #fffbe6;
    --bn-crop-handle-colour: #c4850a;
    --bn-crop-handle-hover: #a06d08;
    --bn-colour-active-bg: #f0fdf4;
    --bn-colour-highlight: #fef08a;

    /* Destructive action */
    --bn-colour-negative: #dc2626;

    /* Success and caution — the other two semantic kinds */
    --bn-colour-positive: #16a34a;
    --bn-colour-warning: #f59e0b;

    /* Playback-sync glow */
    --bn-glow-colour: rgba(0, 122, 255, 0.06);
    --bn-glow-colour-strong: rgba(0, 122, 255, 0.11);

    /* Minimap */
    --bn-minimap-quote: #e5e7eb;
    --bn-minimap-heading: #b0b5bd;
    --bn-minimap-viewport-bg: rgba(0, 122, 255, 0.15);
    --bn-minimap-viewport-border: rgba(0, 122, 255, 0.3);

    /* Transcript coverage bar */
    --bn-coverage-report: #93b4f4;
    --bn-coverage-moderator: #d97706;
    --bn-coverage-omitted: #d1d5db;

    /* Group card background tints */
    --bn-group-none: #f9fafb;

    /* Micro histogram bar — neutral */
    --bn-bar-none: #d1d5db;

    /* Interactive elements */
    --bn-colour-border-hover: #d1d5db;
    --bn-colour-icon-idle: #c9ccd1;
    --bn-colour-starred: #999;
    --bn-colour-shadow: rgba(0, 0, 0, 0.1);

    /* Focus state */
    --bn-focus-shadow: 0 3px 12px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05);
    --bn-focus-ring: 0 0 0 2px rgba(0, 122, 255, 0.12);

    /* Hover backgrounds */
    --bn-hover-bg: rgba(0, 0, 0, 0.04);
    --bn-hover-bg-subtle: rgba(0, 0, 0, 0.03);

    /* Selection state */
    --bn-selection-bg: #eef4fc;
    --bn-selection-border: #007aff;
    --bn-selection-bg-inactive: #e5e7eb;
    --bn-selection-border-inactive: #9ca3af;
    /* Sidebar nav selected-row capsule — NSColor unemphasizedSelectedContentBackgroundColor,
       sampled (no canonical Apple hex; dynamic + vibrant composite). Re-sample at OS bumps. */
    --bn-nav-selection-bg: #efefef;

    /* Sidebar overlay */
    --bn-overlay-shadow: 4px 0 16px rgba(0, 0, 0, 0.08);

    /* Legacy aliases */
    --bn-colour-suggestion: #007aff;
    --bn-colour-suggestion-bg: #eff6ff;
}

/* Dark mode — uses light-dark() with the color-scheme property.
   Browsers without light-dark() support (~13%) fall back to the
   plain light values above. */

@supports (color: light-dark(#000, #fff)) {
    :root,
    [data-color-theme="default"] {
        /* Colour palette */
        --bn-colour-bg:               light-dark(#ffffff, #111111);
        --bn-colour-text:             light-dark(#1a1a1a, #e5e7eb);
        --bn-colour-muted:            light-dark(#6b7280, #9ca3af);

        --bn-colour-inspector-bg:     light-dark(#f9f9fa, #1c1c1e);   /* Inspector chrome — one step up from the #111 editor (Apple systemGray6 dark) */

        /* Semantic surfaces */
        --bn-colour-quote-bg:         light-dark(#f9fafb, #1a1a1a);
        --bn-colour-paper:            light-dark(#f6f7f8, #111111);   /* Transcript ground; dark is the page itself */
        --bn-colour-sheet:            light-dark(#ffffff, #1c1c1e);   /* A quote lifted: 1.07:1 / 1.11:1 off the paper */

        --bn-colour-badge-text:       light-dark(#374151, #d1d5db);
        --bn-colour-user-tag-bg:      light-dark(#f3f4f6, #252525);
        --bn-colour-user-tag-text:    light-dark(#4b5563, #d1d5db);
        --bn-colour-crop-bg:          light-dark(#fffbe6, #2a2614);
        --bn-crop-handle-colour:      light-dark(#c4850a, #f0b830);
        --bn-crop-handle-hover:       light-dark(#a06d08, #f5cc60);
        --bn-colour-active-bg:        light-dark(#f0fdf4, #0f2918);
        --bn-colour-highlight:        light-dark(#fef08a, #854d0e);
        --bn-colour-cited-bg:         light-dark(#fef9c3, #3b2f05);

        /* Playback-sync glow */
        --bn-glow-colour:             light-dark(rgba(0, 122, 255, 0.06), rgba(10, 132, 255, 0.12));
        --bn-glow-colour-strong:      light-dark(rgba(0, 122, 255, 0.11), rgba(10, 132, 255, 0.2));

        /* Minimap */
        --bn-minimap-quote:           light-dark(#e5e7eb, #333333);

        --bn-minimap-viewport-bg:     light-dark(rgba(0, 122, 255, 0.15), rgba(10, 132, 255, 0.2));
        --bn-minimap-viewport-border: light-dark(rgba(0, 122, 255, 0.3), rgba(10, 132, 255, 0.4));

        /* Transcript coverage bar */

        --bn-coverage-moderator: light-dark(#d97706, #fbbf24);
        --bn-coverage-omitted:   light-dark(#d1d5db, #4b5563);

        /* Group card — neutral */
        --bn-group-none:      light-dark(#f9fafb, #1e1e1e);

        /* Micro histogram bar — neutral */
        --bn-bar-none:      light-dark(#d1d5db, #4b5563);

        /* Destructive action */
        --bn-colour-negative:         light-dark(#dc2626, #ef4444);

        /* Success and caution */
        --bn-colour-positive:         light-dark(#16a34a, #22c55e);
        --bn-colour-warning:          light-dark(#f59e0b, #fbbf24);

        /* Interactive elements */
        --bn-colour-border-hover:     light-dark(#d1d5db, #4b5563);
        --bn-colour-icon-idle:        light-dark(#c9ccd1, #595959);
        --bn-colour-starred:          light-dark(#999, #ccc);
        --bn-colour-shadow:           light-dark(rgba(0,0,0,0.1), rgba(0,0,0,0.4));

        /* Focus and selection */
        --bn-focus-ring:              0 0 0 2px light-dark(rgba(0, 122, 255, 0.12), rgba(10, 132, 255, 0.2));
        --bn-selection-bg:            light-dark(#eef4fc, #1a2838);
        --bn-selection-border:        light-dark(#007aff, #0a84ff);
        --bn-selection-bg-inactive:     light-dark(#e5e7eb, #262626);
        --bn-selection-border-inactive: light-dark(#9ca3af, #4b5563);
        --bn-nav-selection-bg:          light-dark(#efefef, #2b2b2b);

        /* Hover backgrounds */
        --bn-hover-bg:                light-dark(rgba(0,0,0,0.04), rgba(255,255,255,0.06));
        --bn-hover-bg-subtle:         light-dark(rgba(0,0,0,0.03), rgba(255,255,255,0.04));

        /* Legacy aliases (deprecated) */
        --bn-colour-suggestion:       light-dark(#007aff, #0a84ff);
        --bn-colour-suggestion-bg:    light-dark(#eff6ff, #111d2e);
    }
}

/* palette-edo — Edo-period Japanese art colour theme.
   Sampled from three artworks seen at the British Museum Samurai exhibition,
   1 Mar 2026. See docs/mockups/edo-colour-palette.html for source analysis.

   Pigments: rokusho (verdigris), sumi (iron-gall ink), cinnabar vermillion,
   bero-ai (Prussian blue), yellow ochre.

   Desktop default. Activate: data-color-theme="edo" on <html>.
   Env/CLI: BRISTLENOSE_PALETTE=edo or --palette edo (canonical; BRISTLENOSE_COLOR_THEME
   is the deprecated alias). Internal <html> attribute stays data-color-theme (glossary §Display settings).

   ── v1 decisions (Jul 2026) ──
   Accent uses Prussian blue's vivid UNDERTONE (#0f5c9e), not the dull masstone
   sampled off aged prints — that masstone reads too low-chroma for links/icons/selection.
   Dark accent is vivid blue (#4d9fe0), not verdigris. Background is bright Paper
   White (#fdfbf7). Body ink is passport navy (#1b2230 / #e8e3d6 dark).

   Alternatives considered — for future edo2/edo3 variants (explore in
   docs/mockups/edo-theme-studio.html):
     paper  — Snow White #fdfbf7, Warm off-white #f0e9d8, Washi Cream #ede5d1 (warmer/more washi)
     accent — masstone Prussian #0f5c9e, midpoint #164e80, electric #2a7ac0; dark verdigris #7ba8a0
     ink    — Sumi Black #1b2230 light / Sail Parchment #d4c9a8 dark; Moonlight #e4e6ea (cool dark ink)
   Known follow-up: warm surfaces (quote-bg #f0e9d8, hover #ede5d1, badge #e8dfc9)
   now read warmer against the brighter paper — revisit surface harmony next pass. */

[data-color-theme="edo"] {
    /* Colour palette — warm paper with indigo/verdigris accents */
    --bn-colour-bg: #fdfbf7;                    /* Paper White — bright near-white */
    --bn-colour-text: #1b2230;                   /* Passport navy — near-black, indigo whisper */
    --bn-colour-muted: #4a698a;                  /* Storm Slate — atmospheric grey-blue (AA 4.5:1 on paper + quote-bg) */
    --bn-colour-border: #d4c9a8;                 /* Sail Parchment — warm border */
    --bn-colour-accent: #0f5c9e;                 /* Vivid Prussian — bero-ai undertone */
    --bn-colour-hover: #ede5d1;                  /* Washi Cream tint — warm hover */
    --bn-colour-inspector-bg: #f7f2e6;           /* Inspector chrome — warm washi; the mirror of Xcode's #f9f9fa (Apple cools the neutral, Edo warms the paper). One notch off Paper White, lighter than quote-bg so it reads as chrome not content */

    /* Semantic surfaces */
    --bn-colour-quote-bg: #f0e9d8;              /* Warm off-white */
    --bn-colour-paper: #f7f2e6;                 /* Transcript ground: washi under Paper White */
    --bn-colour-sheet: #fdfbf7;                 /* A quote lifted: Paper White, 1.08:1 off the washi */
    --bn-colour-badge-bg-paper: #e8dfc9;        /* Edo's badge already reads on washi (1.19:1) */
    --bn-colour-badge-bg: #e8dfc9;              /* Parchment badge */
    --bn-colour-badge-text: #2d3654;            /* Court Indigo */
    --bn-colour-user-tag-bg: #e8dfc9;
    --bn-colour-user-tag-text: #3d4a5c;
    --bn-colour-crop-bg: #f5ecd0;               /* Gold Ochre tint */
    --bn-crop-handle-colour: #b5432a;           /* Vermillion */
    --bn-crop-handle-hover: #8b3a3a;            /* Bengara Red */
    --bn-colour-active-bg: #e8f0e4;             /* Pine Green tint */
    --bn-colour-highlight: #c4a96a;             /* Gold Ochre highlight */

    /* Destructive action — vermillion */
    --bn-colour-negative: #b5432a;

    /* Success — Pine Green (matsuba-iro), the hue active-bg already tints toward.
       Caution — Gold Ochre, deepened for legibility on paper. */
    --bn-colour-positive: #4a6b4a;
    --bn-colour-warning: #a8842c;

    /* Playback-sync glow — Prussian Blue based */
    --bn-glow-colour: rgba(15, 92, 158, 0.08);
    --bn-glow-colour-strong: rgba(15, 92, 158, 0.15);

    /* Minimap — warm parchment tones */
    --bn-minimap-quote: #d4c9a8;
    --bn-minimap-heading: #9e8b6e;
    --bn-minimap-viewport-bg: rgba(15, 92, 158, 0.12);
    --bn-minimap-viewport-border: rgba(15, 92, 158, 0.25);

    /* Transcript coverage bar */
    --bn-coverage-report: #5a7d9b;
    --bn-coverage-moderator: #c4a96a;
    --bn-coverage-omitted: #d4c9a8;

    /* Group card — neutral */
    --bn-group-none: #f0e9d8;

    /* Micro histogram bar — neutral */
    --bn-bar-none: #c4b898;

    /* Interactive elements */
    --bn-colour-border-hover: #b8ad91;
    --bn-colour-icon-idle: #b8ad91;
    --bn-colour-starred: #9e8b6e;
    --bn-colour-shadow: rgba(30, 20, 10, 0.12);

    /* Focus state */
    --bn-focus-shadow: 0 3px 12px rgba(30, 20, 10, 0.12), 0 0 0 1px rgba(30, 20, 10, 0.06);
    --bn-focus-ring: 0 0 0 2px rgba(15, 92, 158, 0.15);

    /* Hover backgrounds */
    --bn-hover-bg: rgba(30, 20, 10, 0.05);
    --bn-hover-bg-subtle: rgba(30, 20, 10, 0.03);

    /* Selection state — Prussian Blue */
    --bn-selection-bg: #e0e8f0;
    --bn-selection-border: #0f5c9e;
    --bn-selection-bg-inactive: #e8e2d4;
    --bn-selection-border-inactive: #b8ad91;
    /* Sidebar nav selected-row capsule — warm parchment grey (edo's native-grey analogue) */
    --bn-nav-selection-bg: #e6ddc9;

    /* Sidebar overlay */
    --bn-overlay-shadow: 4px 0 16px rgba(30, 20, 10, 0.10);

    /* Legacy aliases */
    --bn-colour-suggestion: #0f5c9e;
    --bn-colour-suggestion-bg: #e0e8f0;
}

/* Dark mode — Sumi Black bg, warm parchment text */

@supports (color: light-dark(#000, #fff)) {
    [data-color-theme="edo"] {
        /* Colour palette */
        --bn-colour-bg:               light-dark(#fdfbf7, #1a1816);
        --bn-colour-text:             light-dark(#1b2230, #e8e3d6);
        --bn-colour-muted:            light-dark(#4a698a, #7ba8a0);
        --bn-colour-border:           light-dark(#d4c9a8, #2d2820);
        --bn-colour-accent:           light-dark(#0f5c9e, #4d9fe0);
        --bn-colour-hover:            light-dark(#ede5d1, #252118);
        --bn-colour-inspector-bg:     light-dark(#f7f2e6, #211e18);   /* Inspector chrome — warm washi light / one warm step off Sumi dark */

        /* Semantic surfaces */

<style>
:root { color-scheme: light dark; }

.frame { border:1px solid var(--bn-colour-border); border-radius:8px; padding:12px 14px; margin-bottom:10px; background:var(--bn-colour-bg); color:var(--bn-colour-text); }
.frame.dark { color-scheme:dark; } .frame.light { color-scheme:light; }

.chartrow svg { --dot-colour:var(--bn-colour-text); display:block; }
.mk-quote { background:var(--bn-colour-quote-bg); border-radius:var(--bn-radius-md); padding:10px 14px; margin:0 0 6px; font-size:var(--bn-text-body); line-height:var(--bn-text-body-lh); max-width:520px; }
.mk-quote .intensity-dots { float:right; width:46px; cursor:help; margin:var(--bn-space-xs) 0 var(--bn-space-xs) var(--bn-space-md); --dot-colour:var(--bn-colour-muted); }
.mk-quote .intensity-dots svg { display:block; }
.pager { display:flex; gap:22px; align-items:center; }
.pg { display:flex; align-items:center; } .pg i { display:block; border-radius:50%; background:var(--bn-colour-text); margin:0 3px; }
.com { margin-top:26px; padding:14px 18px; background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(128,128,128,.10) 6px 7px); border-left:3px solid var(--bn-colour-muted); font-size:13px; line-height:1.5; max-width:980px; }
.com h2 { font:600 11px var(--bn-font-mono); text-transform:uppercase; letter-spacing:.06em; color:var(--bn-colour-muted); margin:0 0 8px; }
.com table { border-collapse:collapse; width:100%; font-size:12px; } .com th,.com td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--bn-colour-border); }

</style></head><body>
<h1>Intensity mark: graded circles</h1>
<div class="frame light" style="max-width:700px"><div class="pager" id="pagers"></div></div>
<div class="grid" id="grid"><div class="hd"></div><div class="hd">Light</div><div class="hd">Dark</div></div>
<div class="com"><h2>Commentary: the cone, drawn large (6x), tangents dashed</h2>
<div class="big" id="big"></div><div id="meas"></div></div>
<script>

const W = 46, H = 12, CY = 6, RMAX = 5.4;
// A variant is {radii:[r1,r2,r3], pitch: centre-to-centre (number) | null (equal edge gap), gap, ghost:true|false}
const VARS = {
  shipped: {name:'Shipped: equal circles', radii:[5,5,5], pitch:16, ring:true},
  cone:    {name:'B · Cone: radius linear, equal centre pitch', radii:[2,3.7,5.4], pitch:11},
  coneT:   {name:'B2 · Cone, tighter pitch', radii:[2,3.7,5.4], pitch:9.6},
  area:    {name:'C · Area-honest: radius ∝ √value, equal edge gap', radii:[RMAX*Math.sqrt(1/3),RMAX*Math.sqrt(2/3),RMAX], gap:2.2},
  steven:  {name:'D · Perceptual: radius ∝ value^0.71, equal edge gap', radii:[RMAX*Math.pow(1/3,.71),RMAX*Math.pow(2/3,.71),RMAX], gap:2.2},
  mid:     {name:'CD · Between C and D: radius ∝ value^0.6, equal edge gap', radii:[RMAX*Math.pow(1/3,.6),RMAX*Math.pow(2/3,.6),RMAX], gap:2.2},
  midCone: {name:'CD-cone · same radii snapped linear (2.8/4.1/5.4), equal pitch', radii:[2.8,4.1,5.4], pitch:10.6},
  coneG:   {name:'G · Gentle cone: radius linear 3.8/4.6/5.4, equal pitch', radii:[3.8,4.6,5.4], pitch:11.5},
  cumul:   {name:'H · Perceptually linear (cumulative): 3.8/4.9/5.4, equal edge gap', radii:[3.82,4.89,5.4], gap:2.2},
  coneNG:  {name:'E · Cone, no ceiling (only the value is drawn)', radii:[2,3.7,5.4], pitch:11, noGhost:true},
  bubble:  {name:'F · One bubble sized by value (no row)', single:true},
};
const frac = (v,i) => Math.max(0, Math.min(1, v - i));
function centres(vr) {
  const r = vr.radii, xs = [];
  if (vr.pitch) { const tot = vr.pitch*2; let x0 = W - 2 - r[2] - tot; for (let i=0;i<3;i++) xs.push(x0 + i*vr.pitch); }
  else { const tot = 2*(r[0]+r[1]+r[2]) + 2*vr.gap; let x = W - 2 - tot + r[0]; xs.push(x); x += r[0]+vr.gap+r[1]; xs.push(x); x += r[1]+vr.gap+r[2]; xs.push(x); }
  return xs;
}
let uid = 0;
function drawG(key, v, size, ink, onlyOn) {
  const vr = VARS[key], k = size === 's' ? 0.95 : 1; let s = '';
  if (vr.single) {   // radius from 0.45..1 of RMAX interpolated on √ area between v=1 and 3, halves are free
    const r = k*RMAX*Math.sqrt(Math.max(.5, v)/3), cx = W-2-RMAX;
    s += `<circle cx="${cx}" cy="${CY}" r="${k*RMAX}" fill="none" stroke="${ink}" stroke-width="1" opacity="${onlyOn?0:.3}"/>`;
    s += `<circle cx="${cx}" cy="${CY}" r="${r}" fill="${ink}" opacity=".8"/>`;
    return wrap(key, v, size, s);
  }
  const xs = centres(vr);
  for (let i=0;i<3;i++) {
    const r = vr.radii[i]*k, cx = xs[i], f = frac(v,i);
    const ghostOp = (vr.noGhost || onlyOn) ? 0 : (vr.ring ? .35 : .22);
    if (vr.ring) s += `<circle cx="${cx}" cy="${CY}" r="${r}" fill="none" stroke="${ink}" stroke-width="1.2" opacity="${ghostOp}"/>`;
    else if (ghostOp) s += `<circle cx="${cx}" cy="${CY}" r="${r}" fill="${ink}" opacity="${ghostOp}"/>`;
    if (f >= 1) s += `<circle cx="${cx}" cy="${CY}" r="${r}" fill="${ink}" opacity=".8"/>`;
    else if (f > 0) { const id='g'+(++uid); s += `<clipPath id="${id}"><rect x="${cx-r}" y="0" width="${r}" height="12"/></clipPath><circle cx="${cx}" cy="${CY}" r="${r}" fill="${ink}" opacity=".8" clip-path="url(#${id})"/>`; }
  }
  return wrap(key, v, size, s);
}
function wrap(key, v, size, inner) {
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Intensity ${v}/3" data-dir="${key}" data-size="${size}">${inner}</svg>`;
}
// Cone guide: the two tangent lines of the B variant, for the commentary figure only
function coneGuide(key) {
  const vr = VARS[key], xs = centres(vr), r = vr.radii;
  const sl = (r[2]-r[0])/(xs[2]-xs[0]), ax = xs[0] - r[0]/sl;
  const L = (sign) => `<line x1="${ax}" y1="${CY}" x2="${xs[2]+r[2]/Math.sqrt(1+sl*sl)}" y2="${CY+sign*(r[2]/Math.sqrt(1+sl*sl)*sl + (xs[2]-ax)*sl - r[2]/Math.sqrt(1+sl*sl)*sl)}" stroke="currentColor" stroke-width=".4" stroke-dasharray="1 1"/>`;
  return `<line x1="${ax}" y1="6" x2="${xs[2]+8}" y2="${6-(xs[2]+8-ax)*sl*1.0}" stroke="currentColor" stroke-width=".35" stroke-dasharray="1 1"/><line x1="${ax}" y1="6" x2="${xs[2]+8}" y2="${6+(xs[2]+8-ax)*sl*1.0}" stroke="currentColor" stroke-width=".35" stroke-dasharray="1 1"/>`;
}

const QUOTE = 'I just wanted it to tell me where the file had gone. It said saved, and then I could not find it anywhere and I felt a bit stupid, honestly, like I had missed something obvious on the screen.';
const vals = [1,1.5,2,2.5,3];
// pager comparators (reference only, not candidates): equal dots, and the overflow pager whose edge dots shrink
const eq = [0,1,2,3,4].map(i => `<i style="width:6px;height:6px;opacity:${i==1?.85:.25}"></i>`).join('');
const ig = [3,5,7,7,7,5,3].map((d,i) => `<i style="width:${d}px;height:${d}px;opacity:${i==3?.85:.25}"></i>`).join('');
document.getElementById('pagers').innerHTML = '<span style="font:11px var(--bn-font-mono);color:var(--bn-colour-muted)">pagers for comparison:</span><span class="pg">'+eq+'</span><span class="pg">'+ig+'</span>';
const grid = document.getElementById('grid');
for (const [key,vr] of Object.entries(VARS)) {
  const l = document.createElement('div'); l.className='rowlabel'; l.textContent = vr.name; grid.appendChild(l);
  for (const theme of ['light','dark']) {
    const f = document.createElement('div'); f.className='frame '+theme;
    f.innerHTML = '<div class="chartrow">'+vals.map(v=>`<span><span class="v">${v}</span><br>${drawG(key,v,'m','var(--dot-colour)')}</span>`).join('')+'</div>'
      + [1,2,3].map(v=>`<blockquote class="mk-quote" style="margin-inline:0"><span class="intensity-dots" title="Intensity ${v}/3">${drawG(key,v,'s','var(--dot-colour)')}</span><span class="quote-text">${QUOTE}</span></blockquote>`).join('');
    grid.appendChild(f);
  }
}
document.getElementById('big').innerHTML = ['cone','coneG'].map(k => drawG(k,3,'m','currentColor').replace('</svg>', coneGuide(k)+'</svg>')).join('<br>');
</script></body></html>
