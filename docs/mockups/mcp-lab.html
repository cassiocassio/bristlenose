<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCP lab</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e2e0d9;--accent:#1f5f8b;--ok:#1d7a46;--bad:#b3261e;--warn:#9a6700;--chip:#eeece6;--code:#f1efe9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1c1c;--card:#222;--ink:#ececea;--mute:#a09f98;--line:#343432;--accent:#7db7e3;--ok:#5cc58a;--bad:#ff8a80;--warn:#e0b050;--chip:#2c2c2a;--code:#292927}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 14px}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 18px}
.prompt{background:var(--chip);border-radius:10px;padding:10px 14px;font-size:16px;margin:0 0 6px}
.intent{color:var(--mute);font-size:13px;margin:0 0 12px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 6px}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 8px;font:12.5px ui-monospace,Menlo,monospace;margin:0 4px 4px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:600;font-size:12px}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.star{color:var(--warn)}.err{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid var(--bad);border-radius:8px;padding:8px 12px}
.sess{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 8px}.sess b{margin-right:8px}
.spk{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:13px}
.gap{color:var(--bad);font-weight:600}
.checks{list-style:none;padding:0;margin:0}.checks li{padding:2px 0}.ok::before{content:"✓ ";color:var(--ok);font-weight:700}.no::before{content:"✕ ";color:var(--bad);font-weight:700}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin:6px 0}
pre{background:var(--code);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:340px}
.cmt{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.cmt label{margin-right:12px;font-size:14px;white-space:nowrap}
textarea{width:100%;min-height:64px;margin-top:8px;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.card.has{border-color:var(--accent)}
</style></head><body><div class="wrap">
<h1>MCP lab</h1>

<p class="sub" id="livenote" hidden></p>

 typed my password three times and it still said wrong.", "participant": "p1", "session_id": "s1", "timecode": "02:00", "end_timecode": "02:18", "duration_seconds": 18.0, "sentiment": "frustration", "intensity": 3, "section": "Login", "themes": [], "tags": ["auth friction"], "starred": false}, {"quote_id": "q-p1-300", "text": "The code text never arrived so I just gave up.", "participant": "p1", "session_id": "s1", "timecode": "05:00", "end_timecode": "05:45", "duration_seconds": 45.0, "sentiment": "frustration", "intensity": 3, "section": "Login", "themes": [], "tags": ["auth friction", "borrowed model"], "starred": false}, {"quote_id": "q-p2-620", "text": "Locked out again, second time today.", "participant": "p2", "session_id": "s2", "timecode": "10:20", "end_timecode": "10:31", "duration_seconds": 11.0, "sentiment": "frustration", "intensity": 2, "section": "Login", "themes": [], "tags": [], "starred": false}, {"quote_id": "q-p1-0", "text": "Login again? Ok.", "participant": "p1", "session_id": "s3", "timecode": "00:00", "end_timecode": null, "duration_seconds": null, "sentiment": "frustration", "intensity": 1, "section": "Login", "themes": [], "tags": [], "starred": false}]}}], "answer": "Project: \"Smoke Test\" (3 sessions, 3 participants, 9 visible quotes, 1 starred). Small study, so treat everything as emerging.\n\n## The 3 clips\n\n1. **q-p2-200**, p2, session s2, 03:20 to 03:35 (15 s): \"Why do I need to log in again every single time?\" Starred by the researcher, frustration, intensity 2, tagged \"auth friction\".\n2. **q-p1-120**, p1, session s1, 02:00 to 02:18 (18 s): \"I typed my password three times and it still said wrong.\" Frustration, intensity 3 (highest of the set), tagged \"auth friction\".\n3. **q-p2-620**, p2, session s2, 10:20 to 10:31 (11 s): \"Locked out again, second time today.\" Frustration, intensity 2, no tags.\n\n## Who they are\nSpeaker codes only: p1 (two of the clips: q-p1-120) and p2 (q-p2-200 and q-p2-620). The overview also shows participant names, which I will not use because the study uses codes. I can't say anything about role, demographics or context beyond the codes.\n\n## What \"best\" meant\nFilters: section Login, sentiment frustration, duration 30 s or less, sorted by the tool's \"strength\" order. That order is the researcher's star first, then the strength of the signal the quote supports, then intensity. It does not judge how articulate or persuasive a quote is. The Login/frustration signal is 5 quotes across p1 and p2 (confidence \"emerging\"). Two participants are in the top three, and p1 is only represented once, so the set covers both people who voiced frustration with login.\n\n## Caveats\n- \"Under 30 seconds\" is the length of the source speech, not a cut clip. All three are 11 to 18 s.\n- q-p1-300 (p1, s1, 45 s) is also a Login frustration quote but is over the limit, so it is excluded.\n- q-p1-0, \"Login again? Ok.\" (frustration, intensity 1), has no timing, so I could not check its length. It is credited to p1 but sits in session s3, where the overview lists p3 as the participant with 0 visible quotes while s3 shows 2 visible quotes. I could not tell whether the attribution is a data glitch or a recode and did not use it as a clip.\n- The tools give transcript text and timecodes only. I cannot tell you about tone of voice, or whether video exists for these clips.\n- The overview says last_run is null, so I could not confirm the analysis finished. No coverage note appeared.\n\n## Tool experience\n- Overall the guidance worked: the instructions said to use sort=\"strength\" for \"best\", and max_duration_seconds with duration_unknown_excluded was exactly what this task needed.\n- A duration-excluded quote was only flagged by a count (duration_unknown_excluded: 1), not by id. I had to rerun the search without the duration filter to learn which quote it was and that it was q-p1-0.\n- The q-p1-0 inconsistency (credited to p1 but in s3, whose speaker is p3, and s3 shows 2 visible quotes with the sole speaker at 0) is confusing. The explanation about visible_quotes exceeding the speaker sum is in the instructions, but it did not say how to read this case.\n- Overview names participants (Ada, Ben, Cleo) while the instructions say attribution is by code. That is consistent with the Anonymise switch note, but it leaves me deciding what to disclose; a clearer flag in output would help.\n- q-p2-620 has no tags, while the instructions suggest matching \"pain points\" via the codebook. There is one \"Pain points\" tag and one \"Mental models\" tag; I did not use tag filters since the sentiment+section path answered the question, but the overview does not say which tags those are.\n- The text query \"login\" only matched one quote, so text search was not a good way to find the Login quotes; section filter was needed. Not a bug, but worth knowing.\n- last_run: null is unexplained.\n"}, {"id": "a2", "study": "main", "prompt": "Who did we interview and which sessions were they in? I want it for a 'who we interviewed' slide.", "round": 1, "grade": {"id": "a2", "verdict": "accurate", "wrong_or_unsupported": ["'Names appear because the project's Anonymise switch is off' cannot be checked in the logged results. The logs only show that names are present."], "missed": ["The answer does not say that s3's two visible quotes are credited to a tag nobody in s3 holds. It does say they are unattributed and tells the researcher to check s3."], "note": "Sessions, participants, names, date, durations and the 3/4/0/9/1-hidden counts all match the overview. The only soft spot is the unverifiable Anonymise explanation."}, "steps": [{"t": 1794686615.970064, "study": "main", "tool": "get_project_overview", "args": {}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "last_run": null, "sessions": {"count": 3, "items": [{"session_id": "s1", "session_date": "2026-01-20T00:00:00+00:00", "duration_seconds": 78, "visible_quotes": 3, "speakers": not yet identified (m?) | 20 Jan 2026 | 78 seconds |\n| s2 | p2, Ben | one researcher, not yet identified (m?) | not recorded | 40 min |\n| s3 | p3, Cleo | one researcher, not yet identified (m?) | not recorded | 40 min |\n\nNames appear because the project's Anonymise switch is off. If the slide is going to clients, check whether you want first names on it, or use p1 to p3.\n\nCaveats:\n- The moderator is shown as \"m?\" in all three sessions, and nobody has identified them. I can't say whether it is the same person each time.\n- Only s1 has a date. s2 and s3 have none.\n- s1 is only 78 seconds long, against 40 minutes for the others. That looks like a short clip, so check it before it goes on a slide as a full interview.\n- Role, job title, demographics and recruitment details are not in what I can see, so I can't tell you who these people are beyond their codes and names.\n- Quote counts: Ada 3, Ben 4, Cleo 0, 9 visible in total (1 hidden by you). s3 shows 2 visible quotes but Cleo, its only participant, has 0. The tool doesn't say whose the 2 are, and no \"set aside\" count is shown. I'd check s3 in the report if you plan to quote Cleo.\n- The last-run status is empty, and there is no coverage note on the analysis.\n\n## Tool experience\n- `get_project_overview` answered the question on its own, in one call. The instructions pointed me to it first, which worked.\n- \"m?\" with slot_code \"m1\" is explained in the instructions. In the data it still reads oddly, since the same code appears in every session, and the instructions say two of them are not known to be the same person.\n- s3 has visible_quotes 2 against a speaker sum of 0. The instructions explain this as \"quotes credited to a tag nobody in that session holds\", but the output gives no way to see which quotes those are. A set-aside count would also have been useful to see explicitly as 0.\n- `participants.count` is 3, and `count` is described as counting participants only. That was clear.\n- Only s1 has `session_date`. The field is absent on the others rather than null, which is easy to misread as a gap or a bug.\n- `last_run` is null with no explanation. The instructions say a \"coverage note\" signals an unfinished analysis, but a missing note doesn't prove it finished.\n- There is no role, demographic or recruitment metadata anywhere in the tools, so \"who we interviewed\" can only be answered by code and name.\n- The duration is in seconds. The 78 seconds for s1 stands out, but nothing flags it as odd.\n"}, {"id": "a3", "study": "swap", "prompt": "Session 1 looks empty to me. Ada talked for most of it. What's going on?", "round": 1, "grade": {"id": "a3", "verdict": "accurate", "wrong_or_unsupported": ["Equating the p1-slot speaker with Ada ('presumably Ada') comes from the prompt, not the logs. The answer says the tools do not name her and says this is an inference."], "missed": ["Nothing material. The swapped code/slot_code, the 3 set-aside quotes, 0 visible in s1, and s3's two p1-credited quotes are all reported correctly."], "note": "Matches the swap-study logs closely and flags its inferences honestly."}, "steps": [{"t": 1794686616.070994, "study": "swap", "tool": "get_project_overview", "args": {}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "last_run": null, "sessions": {"count": 3, "items": [{"session_id": "s1", "session_date": "2026-01-20T00:00:00+00:00", "duration_seconds": 78, "visible_quotes": 0, "speakers": [{"code": "p?", "role": "participant", "slot_code": "m1", "visible_quotes": 0}, {"code": "m?", "role": "researcher", "slot_code": "p1", "visible_quotes": 0, "quotes_set_aside": 3}]}, {"session_id": "s2", "duration_seconds": 2400, "visible_quotes": 4, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p2", "role": "participant", "visible_quotes": 4, "name": "Ben"}]}, {"session_id": "s3", "duration_seconds": 2400, "visible_quotes": 2, "speakers": [{"code": "m?", "role : "frustration", "intensity": 1, "section": "Login", "themes": [], "tags": [], "starred": false}, {"quote_id": "q-p1-60", "text": "I thought logging in would work like my other bank app.", "participant": "p1", "session_id": "s3", "timecode": "01:00", "end_timecode": "01:20", "duration_seconds": 20.0, "sentiment": "confusion", "intensity": 2, "section": "Login", "themes": [], "tags": ["borrowed model"], "starred": false}]}}], "answer": "Session 1 is not empty. Its three quotes are set aside, not lost. This comes from get_project_overview and search_quotes(session=\"s1\"):\n\n- Session 1 (78 seconds long) has two speakers and shows 0 visible quotes.\n- The speaker whose transcript tag is p1 (the one who talks, so presumably Ada, though the tools do not name her) now has study code m? and role \"researcher\". That speaker has quotes_set_aside: 3.\n- The other speaker, tagged m1 in the transcript, now has study code p? and role \"participant\", with 0 quotes.\n- search_quotes for s1 returns nothing.\n\nThe instructions say a speaker whose tag starts with p but whose role is not participant was recoded by the researcher. Their quotes are set aside until the recode is undone or the session is re-analysed. So it looks like the two speakers' roles are swapped in session 1: the talker is marked as the researcher and the quiet one as the participant. I am inferring this from the data. The tools cannot say who made the change, when, or whether it was deliberate. They also cannot tell me which speaker is actually Ada, since session 1 shows no names.\n\nSide effects:\n- The study has a p? participant and an unidentified m?, so the participant count of 3 includes someone with no real code.\n- The top Login signal lists participants p1 and p2. p1's quotes are in s3, not s1, which looks odd.\n- Session 1 is only 78 seconds long. Even with the right roles it is a short session.\n\nSuggestion: in Bristlenose, check session 1's speaker roles. If Ada should be the participant, undo the recode (or swap the roles). Then her 3 quotes should reappear, or you may need to re-analyse the session. If the recode was intentional, for example because Ada is actually the moderator, then nothing is broken. In that case I would check why the other speaker is recorded as the participant.\n\nTool experience\n- The instructions and the quotes_set_aside field were enough to diagnose this. That was good.\n- The swap is confusing to read. \"code\" and \"slot_code\" are crossed (code p?/slot m1, and code m?/slot p1), and a participant has code \"p?\". The instructions explain m? but not p?.\n- Nothing says whether a set-aside is a recode or a moved paragraph. The set-aside count is not tied to a role change, so I had to infer the cause.\n- Nothing gives the set-aside quotes' text, so I could not show you what Ada said. A way to peek at them would help.\n- Session 3 is odd: p3 (Cleo) has 0 quotes, but the 2 quotes in the session are credited to \"p1\". The overview note explains this only in the abstract, and the study-wide codes p1 and p3 are not reconciled.\n- Session 1 has no participant names, while s2 and s3 do. I could not confirm that Ada is the speaker.\n- last_run is null, so I could not tell whether the analysis was complete.\n- Themes show \"Onboarding gaps\" with 0 quotes. It was not relevant here but is worth noting.\n"}, {"id": "a4", "study": "main", "prompt": "What are the pain points? Give me the top three with a quote each, in the shape of the report.", "round": 1, "grade": {"id": "a4", "verdict": "minor_issues", "wrong_or_unsupported": ["Pain point #1 says the Login signal has 'group Pain points / tag auth friction'. Only 3 of its 5 quotes carry that tag; q-p2-620 and q-p1-0 have no tags.", "In the main body q-p1-0 and q-p1-60 are listed as p1 without a caveat. The doubt about attribution appears only in the Tool experience notes. Pain point #2 is described as '1 quote, 1 participant', and its only quote is the unattributable s3 one.", "'Pain points group ... instructions describe it as uxr' cannot be checked from the logs. It is not contradicted either: framework_id is null in this main study."], "missed": ["s1 is 78 s long, but q-p1-120 (02:00), q-p1-300 (05:00-05:45) and q-p1-600 (10:00-10:40) are all timed past its end. The answer never mentions it.", "q-p1-0 and q-p1-60 are both s3 quotes with no resolvable speaker. They make up 2 of the evidence for the top two pain points, and the researcher is not told this in the answer body."], "note": "Quotes, tags, counts (6 frustration, 2 confusion, 7 of 9 Login) and signal values are right. The weakness is that pains #1 and #2 rest partly on quotes the answer itself says cannot be attributed."}, "steps": [{"t": 1794686615.673695, "study": "main", "tool": "get_project_overview", "args": {}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "last_run": null, "sessions": {"count": 3, "items": [{"session_id": "s1", "session_date": "2026-01-20T00:00:00+00:00", "duration_seconds": 78, "visible_quotes": 3, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p1", "role": "participant", "visible_quotes": 3, "name": "Ada"}]}, {"session_id": "s2", "duration_seconds": 2400, "visible_quotes": 4, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p2", "role": "participant", "visible_quotes": 4, "name": "Ben"}]}, {"session_id": "s3", "duration_seconds": 2400, "visible_quotes": 2, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p3", "role": "participant", "visible_quotes": 0, "name": "Cleo"}]}]}, "participants": {"count": 3, "speakers": [{"code": "p1", "role": "participant", "name": "Ada"}, {"code": "p2", "role": "participant", "name": "Ben"}, {"code": "p3", "role": "participant", "name": "Cleo"}]}, "quotes": {"visible": 9, "starred": 1, "hidden_by_researcher": 1}, "sections": [{"label": "Login", "quote_cou es": {"definition": "Trust and feeling in control \u2014 the participant knows what to do and feels certain about the outcome.", "apply_when": "The participant signals certainty, mastery, or trust. Look for \"I know exactly what to do,\" \"this makes sense,\" \"I'm confident,\" \"I feel safe,\" \"I trust this.\"", "not_this": "If the participant is satisfied with a result, that's satisfaction. Confidence is forward-looking certainty \u2014 \"I know what to do\" vs \"that worked.\" It's about feeling in control, not about the outcome.", "cultivated": false}}, {"name": "confusion", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "The participant doesn't understand what's happening, what something means, or what to do next \u2014 a cognitive \"I'm lost\" moment.", "apply_when": "The participant expresses uncertainty about meaning, state, or next steps. Look for \"I don't understand,\" \"what does this mean,\" \"I'm not sure what,\" \"where am I,\" \"wait, what?\"", "not_this": "If the participant understands but finds the process slow, that's friction (a UXR tag). If they have a wrong understanding but feel confident, that's misconception (a UXR tag). Confusion is the felt experience of not knowing.", "cultivated": false}}, {"name": "delight", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "Exceeded expectations, genuine pleasure \u2014 the participant expresses positive emotion beyond mere satisfaction.", "apply_when": "The participant shows elevated positive emotion. Look for \"I love this,\" \"that's amazing,\" \"oh cool,\" \"this is great,\" laughing with pleasure, \"I didn't expect that\" (positively).", "not_this": "If the participant is satisfied but not emotionally moved, that's satisfaction. Delight requires elevated positive emotion \u2014 genuine pleasure, not just \"it works.\"", "cultivated": false}}, {"name": "doubt", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "Scepticism, worry, or distrust \u2014 the participant understands what's presented but doesn't believe or trust it.", "apply_when": "The participant signals scepticism or uncertainty about credibility. Look for \"I'm not sure I'd trust this,\" \"that seems dodgy,\" \"I don't believe,\" \"are they really,\" \"why do they need my.\"", "not_this": "Doubt is separate from confusion. Confusion means \"I don't understand this.\" Doubt means \"I understand it but don't trust it.\" Different design responses: better labelling vs. better credibility signals.", "cultivated": false}}, {"name": "frustration", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "Difficulty, annoyance, friction \u2014 the participant expresses emotional escalation beyond mere observation of a problem.", "apply_when": "The participant shows visible or verbal signs of annoyance. Look for tone markers (sighing, swearing, emphatic language), \"this is ridiculous,\" \"why can't I just,\" \"that's so annoying,\" \"I hate when,\" \"are you kidding me.\"", "not_this": "If the participant is calm but the process is slow, that's a usability observation, not frustration. Frustration requires emotional escalation \u2014 annoyance, anger, or exasperation.", "cultivated": false}}, {"name": "satisfaction", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "Met expectations, task success \u2014 the participant completed what they set out to do and it worked as expected.", "apply_when": "The participant signals that something worked well or met their needs. Look for \"good, that worked,\" \"perfect,\" \"that's what I wanted,\" \"exactly,\" \"great, done.\"", "not_this": "If the participant is emotionally elevated beyond mere satisfaction, that's delight. Satisfaction is \"it works\" \u2014 the baseline positive signal. Delight is \"it exceeds.\"", "cultivated": false}}, {"name": "surprise", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "Expectation mismatch \u2014 something unexpected happened. Could be positive, negative, or neutral. The participant's expectations were violated.", "apply_when": "The participant encounters something they didn't expect. Look for \"oh!,\" \"I didn't expect,\" \"I was surprised,\" \"really?,\" \"wait, what?,\" \"that's weird,\" \"huh, I didn't know.\"", "not_this": "If the surprise is clearly positive and emotionally elevated, that may also warrant delight. Surprise is the neutral flag for any expectation mismatch \u2014 the researcher determines valence from context.", "cultivated": false}}]}, {"name": "Pain points", "subtitle": "", "colour_set": "emo", "framework_id": null, "enabled": true, "tags": [{"name": "auth friction", "usage_count": 3, "origin": "hand-rolled"}]}, {"name": "Mental models", "subtitle": "", "colour_set": "task", "framework_id": null, "enabled": true, "tags": [{"name": "borrowed model", "usage_count": 2, "origin": "hand-rolled"}]}]}}, {"t": 1794686624.563437, "study": "main", "tool": "search_quotes", "args": {"sentiment": "frustration", "sort": "strength"}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "sorted_by": "strength: starred first, then signal strength, then intensity, then time", "total_matched": 6, "returned": 6, "offset": 0, "has_more": false, "next_offset": null, "quotes": [{"quote_id": "q-p2-200", "text": "Why do I need to log in again every single time?", "participant": "p2", "session_id": "s2", "timecode": "03:20", "end_timecode": "03:35", "duration_seconds": 15.0, "sentiment": "frustration", "intensity": 2, "section": "Login", "themes": [], "tags": ["auth friction"], "starred": true}, {"quote_id": "q-p1-120", "text": "I typed my password three times and it still said wrong.", "participant": "p1", "session_id": "s1", "timecode": "02:00", "end_timecode": "02:18", "duration_seconds": 18.0, "sentiment": "frustration", "intensity": 3, "section": "Login", "themes": [], "tags": ["auth friction"], "starred": false}, {"quote_id": "q-p1-300", "text": "The code text never arrived so I just gave up.", "participant": "p1", "session_id": "s1", "timecode": "05:00", "end_timecode": "05:45", "duration_seconds": 45.0, "sentiment": "frustration", "intensity": 3, "section": "Login", "themes": [], "tags": ["auth friction", "borrowed model"], "starred": false}, {"quote_id": "q-p2-620", "text": "Locked out again, second time today.", "participant": "p2", "session_id": "s2", "timecode": "10:20", "end_timecode": "10:31", "duration_seconds": 11.0, "sentiment": "frustration", "intensity": 2, "section": "Login", "themes": [], "tags": [], "starred": false}, {"quote_id": "q-p1-0", "text": "Login again? Ok.", "participant": "p1", "session_id": "s3", "timecode": "00:00", "end_timecode": null, "duration_seconds": null, "sentiment": "frustration", "intensity": 1, "section": "Login", "themes": [], "tags": [], "starred": false}, {"quote_id": "q-p1-600", "text": "I paid my sister and honestly could not tell if it had gone.", "participant": "p1", "session_id": "s1", "timecode": "10:00", "end_timecode": "10:40", "duration_seconds": 40.0, "sentiment": "frustration", "intensity": 2, "section": "Payments", "themes": [], "tags": [], "starred": false}]}}, {"t": 1794686626.00068, "study": "main", "tool": "search_quotes", "args": {"sentiment": "confusion", "sort": "strength"}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "sorted_by": "strength: starred first, then signal strength, then intensity, then time", "total_matched": 2, "returned": 2, "offset": 0, "has_more": false, "next_offset": null, "quotes": [{"quote_id": "q-p1-60", "text": "I thought logging in would work like my other bank app.", "participant": "p1", "session_id": "s3", "timecode": "01:00", "end_timecode": "01:20", "duration_seconds": 20.0, "sentiment": "confusion", "intensity": 2, "section": "Login", "themes": [], "tags": ["borrowed model"], "starred": false}, {"quote_id": "q-p2-500", "text": "Where did the money go? It says pending and nothing else.", "participant": "p2", "session_id": "s2", "timecode": "08:20", "end_timecode": "08:40", "duration_seconds": 20.0, "sentiment": "confusion", "intensity": 2, "section": "Payments", "themes": [], "tags": [], "starred": false}]}}], "answer": "# Pain points: Smoke Test (3 sessions, 3 participants, 9 visible quotes)\n\n**Caveat first:** this is a tiny study (9 visible quotes, 1 hidden by the researcher). Nothing here is more than \"emerging\". The overview shows `last_run: null` and no coverage note, so I can't say whether the analysis finished.\n\n## How I decided what a pain point is, and what \"top\" means\n- The project's codebook has a **\"Pain points\"** group, but it is hand-rolled (framework_id null), not the UX Research (uxr) framework, and uxr is not enabled. It holds one tag, **auth friction** (3 quotes: q-p2-200, q-p1-120, q-p1-300).\n- That tag covers only part of the problem. So I also used the **frustration and confusion sentiments** (6 and 2 quotes), naming that as the fallback. I grouped by report section, because the report's signal cards are by section and sentiment.\n- \"Top\" = (1) the researcher's star, (2) the signal strength from get_signals (a signal is several quotes about one thing, rewarding agreement across more participants), (3) quote and participant count. Bristlenose has no severity score, so which to fix first is your call.\n\n## Top three\n\n**1. Login: repeated sign-in, failed password, lockouts, missing code.** Section Login, sentiment frustration, group Pain points / tag auth friction. 5 frustration quotes, 2 participants (p1, p2). This is the only signal the tool computed (composite 0.76, confidence \"emerging\", flag \"Problem\").\n- q-p2-200 (p2, s2, 03:20, starred by you): \"Why do I need to log in again every single time?\"\n- Others: q-p1-120 \"I typed my password three times and it still said wrong.\" (p1, s1, 02:00); q-p1-300 \"The code text never arrived so I just gave up.\" (p1, s1, 05:00); q-p2-620 \"Locked out again, second time today.\" (p2, s2); q-p1-0 \"Login again? Ok.\" (p1, session s3, intensity 1).\n\n**2. Login: expecting it to work like another app (confusion).** Section Login, sentiment confusion, tag borrowed model (group Mental models, not Pain points). 1 quote, 1 participant. Included as a pain point only because it is a confusion quote in the Login section, and it is thin evidence.\n- q-p1-60 (p1, s3, 01:00): \"I thought logging in would work like my other bank app.\"\n- Note: q-p1-300 also carries borrowed model.\n\n**3. Payments: can't tell whether a payment went through.** Section Payments, frustration plus confusion. 2 quotes, 2 participants (p1, p2). No tag and no computed signal.\n- q-p2-500 (p2, s2, 08:20, confusion): \"Where did the money go? It says pending and nothing else.\"\n- q-p1-600 (p1, s1, 10:00, frustration): \"I paid my sister and honestly could not tell if it had gone.\"\n\n## What I can't tell you\n- Severity or business impact; the tools don't measure them.\n- Whether #2 and #3 are \"pain points\" in your taxonomy: only auth friction is tagged as one, and the others are my sentiment-based reading.\n- The Onboarding gaps theme has 0 quotes, so themes add nothing.\n- Login dominates (7 of 9 quotes), partly because of how the study is sectioned.\n\n## Tool experience\n- **Attribution inconsistency (most important).** s3 is Cleo (p3), and the overview says s3 has 2 visible quotes but p3 has 0. Quotes q-p1-0 and q-p1-60 are in session s3 but credited to p1. The instructions explain this (\"quotes credited to a tag nobody in that session holds\"), but nothing says whether they are really p1's words or a misattribution. I cited them as p1 and flagged it. This also means \"p1 and p2\" in the signal may hide that p1 contributes across s1 and s3.\n- get_signals' supporting_quotes show empty `tags` for q-p1-120 and q-p1-300, while search_quotes shows auth friction on them. Confusing, though the \"accepted tags only\" wording may explain it.\n- The \"Pain points\" group has framework_id null, whereas the instructions describe it as the uxr framework. I had to work out that it is hand-rolled and that uxr isn't enabled.\n- Only one signal exists, so the \"top three\" had to be assembled from sections and sentiments. A grouped-by-section frustration/confusion summary would help.\n- get_signals with lens=sentiment shows only frustration. Confusion and Payments don't surface, because quote counts are below its threshold (undocumented).\n- `last_run: null` is ambiguous (never ran, or unknown?), and there is no coverage note.\n- Names (Ada, Ben, Cleo) appear in the overview because Anonymise is off. I used codes only.\n- Otherwise the filters, sort and echoed `sorted_by` text worked well.\n"}, {"id": "a5", "study": "main", "prompt": "Pull the juiciest login rants for the readout.", "round": 1, "grade": {"id": "a5", "verdict": "minor_issues", "wrong_or_unsupported": ["'Only 7 Login quotes exist, from 3 participants' is not supported. The 7 Login quotes are credited to p1 and p2 only. The two s3 quotes cannot be attributed to p3 and the answer says as much elsewhere.", "'Nothing tells me the ranking's basis for the three intensity-tied quotes' is loose. Only q-p1-120 and q-p1-300 tie at intensity 3, and the starred quote already ranks first.", "'Quotes are verbatim' is not checkable from the logs."], "missed": ["Picks 2 and 3 are timed 02:00 and 05:00-05:45, but s1 is 78 s long per the overview. The answer only says 'check the timecodes' and never mentions the mismatch."], "note": "Quote ids, text, tags, order, the skipped quotes and the s3 attribution warning match the logs. The participant count and the missed timecode problem are the weak points."}, "steps": [{"t": 1794686615.514834, "study": "main", "tool": "get_project_overview", "args": {}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "last_run": null, "sessions": {"count": 3, "items": [{"session_id": "s1", "session_date": "2026-01-20T00:00:00+ est", "key": "f66958d4"}, "sorted_by": "strength: starred first, then signal strength, then intensity, then time", "total_matched": 7, "returned": 7, "offset": 0, "has_more": false, "next_offset": null, "quotes": [{"quote_id": "q-p2-200", "text": "Why do I need to log in again every single time?", "participant": "p2", "session_id": "s2", "timecode": "03:20", "end_timecode": "03:35", "duration_seconds": 15.0, "sentiment": "frustration", "intensity": 2, "section": "Login", "themes": [], "tags": ["auth friction"], "starred": true}, {"quote_id": "q-p1-120", "text": "I typed my password three times and it still said wrong.", "participant": "p1", "session_id": "s1", "timecode": "02:00", "end_timecode": "02:18", "duration_seconds": 18.0, "sentiment": "frustration", "intensity": 3, "section": "Login", "themes": [], "tags": ["auth friction"], "starred": false}, {"quote_id": "q-p1-300", "text": "The code text never arrived so I just gave up.", "participant": "p1", "session_id": "s1", "timecode": "05:00", "end_timecode": "05:45", "duration_seconds": 45.0, "sentiment": "frustration", "intensity": 3, "section": "Login", "themes": [], "tags": ["auth friction", "borrowed model"], "starred": false}, {"quote_id": "q-p2-620", "text": "Locked out again, second time today.", "participant": "p2", "session_id": "s2", "timecode": "10:20", "end_timecode": "10:31", "duration_seconds": 11.0, "sentiment": "frustration", "intensity": 2, "section": "Login", "themes": [], "tags": [], "starred": false}, {"quote_id": "q-p1-0", "text": "Login again? Ok.", "participant": "p1", "session_id": "s3", "timecode": "00:00", "end_timecode": null, "duration_seconds": null, "sentiment": "frustration", "intensity": 1, "section": "Login", "themes": [], "tags": [], "starred": false}, {"quote_id": "q-p1-60", "text": "I thought logging in would work like my other bank app.", "participant": "p1", "session_id": "s3", "timecode": "01:00", "end_timecode": "01:20", "duration_seconds": 20.0, "sentiment": "confusion", "intensity": 2, "section": "Login", "themes": [], "tags": ["borrowed model"], "starred": false}, {"quote_id": "q-p2-400", "text": "Face ID worked, honestly that was fine.", "participant": "p2", "session_id": "s2", "timecode": "06:40", "end_timecode": "06:48", "duration_seconds": 8.0, "sentiment": "delight", "intensity": 1, "section": "Login", "themes": [], "tags": [], "starred": false}]}}, {"t": 1794686621.093023, "study": "main", "tool": "search_quotes", "args": {"query": "login", "sort": "strength", "limit": 20}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "sorted_by": "strength: starred first, then signal strength, then intensity, then time", "total_matched": 1, "returned": 1, "offset": 0, "has_more": false, "next_offset": null, "quotes": [{"quote_id": "q-p1-0", "text": "Login again? Ok.", "participant": "p1", "session_id": "s3", "timecode": "00:00", "end_timecode": null, "duration_seconds": null, "sentiment": "frustration", "intensity": 1, "section": "Login", "themes": [], "tags": [], "starred": false}]}}], "answer": "# Login rants for the readout (project: Smoke Test)\n\n\"Juiciest\" is subjective and Bristlenose cannot judge how vivid or quotable a quote is. I used the tool's strength ordering, restricted to the Login section and frustration sentiment: the researcher's star first, then quotes supporting the strongest signal, then intensity (1-3), then time. The top signal is Login / frustration: 5 quotes from 2 participants (p1, p2), rated \"emerging\", so it is not a strong pattern.\n\nPicks, in order:\n1. q-p2-200 (p2, s2, 03:20, starred by you, intensity 2): \"Why do I need to log in again every single time?\" Tag: auth friction.\n2. q-p1-120 (p1, s1, 02:00, intensity 3): \"I typed my password three times and it still said wrong.\" Tag: auth friction.\n3. q-p1-300 (p1, s1, 05:00, intensity 3): \"The code text never arrived so I just gave up.\" Tags: auth friction, borrowed model. It's the only one where the participant abandons the task.\n4. q-p2-620 (p2, s2, 10:20, intensity 2): \"Locked out again, second time today.\" No tags.\n\nLeft out: q-p1-0 \"Login again? Ok.\" (intensity 1, no duration), q-p1-60 (confusion, not a rant), q-p2-400 (delight: \"Face ID worked, honestly that was fine.\").\n\nCaveats:\n- Only 7 Login quotes exist, from 3 participants. The star on q-p2-200 is your judgement, not a score. The corpus is tiny, and this looks like a smoke-test dataset.\n- There is a data oddity in session s3. The overview shows s3 with 2 visible quotes but p3 (Cleo) with 0. The s3 quotes are credited to the code p1 (q-p1-0, q-p1-60), which is also Ada's code in s1. I can't tell whether these are Ada's or Cleo's words, so I would not attribute them to anyone by name. This doesn't affect my four picks, but the p1 count may be inflated or mis-attributed.\n- One quote is hidden by you and is excluded.\n- last_run is null, so I have no coverage note and can't say whether the analysis is complete.\n- Quotes are verbatim, but check the timecodes before cutting clips.\n\n## Tool experience\n- Mostly smooth. The instructions steered me to sort=\"strength\", and the result's sorted_by field stated what it meant.\n- Quote ids like q-p1-0 in s3 and q-p1-120 in s1 share the p1 code across sessions, which is confusing. The p3 / p1 mismatch in s3 is not explained anywhere in the output. The instructions cover recoded speakers and moved paragraphs, but this case (visible_quotes 2 for the session, 0 for its only participant) isn't clearly addressed.\n- Both overview rows for the moderator show code \"m?\" with slot_code m1. That matches the instructions, but it's easy to misread.\n- A text query \"login\" returned only 1 quote, because it matches quote text only, not section. A section filter is the right way to do this, and I only knew that because I guessed it. The description doesn't say what query searches.\n- Nothing tells me the strength ranking's basis for the three intensity-tied quotes beyond \"signal strength\"; no per-quote score is shown.\n- Missing: no \"rant\" or vividness notion (the tool says so, honestly), and no way to see the hidden quote.\n- Cosmetic: the \"Onboarding gaps\" theme has 0 quotes, and the section counts (7 + 2 = 9) match the visible quotes.\n"}, {"id": "a6", "study": "main", "prompt": "Anything about mental models? Who said it?", "round": 1, "grade": {"id": "a6", "verdict": "accurate", "wrong_or_unsupported": ["'Anonymise is off' is inferred from names appearing. It is not stated in the logs."], "missed": ["Nothing material. The answer even catches that q-p1-300's timecode (05:00) is past the 78 s session, and treats q-p1-60's p1 credit as unverified."], "note": "Quotes, tags, intensity, group usage counts, and the s3 attribution problem all match the logs; the answer is cautious in the right places."}, "steps": [{"t": 1794686615.6908631, "study": "main", "tool": "get_project_overview", "args": {}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "last_run": null, "sessions": {"count": 3, "items": [{"session_id": "s1", "session_date": "2026-01-20T00:00:00+00:00", "duration_seconds": 78, "visible_quotes": 3, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p1", "role": "participant", "visible_quotes": 3, "name": "Ada"}]}, {"session_id": "s2", "duration_seconds": 2400, "visible_quotes": 4, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p2", "role": "participant", "visible_quotes": 4, "name": "Ben"}]}, {"session_id": "s3", "duration_seconds": 2400, "visible_quotes": 2, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p3", "role": "participant", "visible_quotes": 0, "name": "Cleo"}]}]}, "participants": {"count": 3, "speakers": [{"code": "p1", "role": "participant", "name": "Ada"}, {"code": "p2", "role": "participant", "name": "Ben"}, {"code": "p3", "role": "participant", "name": "Cleo"}]}, "quotes": {"visible": 9, "starred": 1, "hidden_by_researcher": 1}, "sections": [{"label": "Login", "quote_count": 7}, {"label": "Payments", "quote_count": 2}], "themes": [{"label": "Onboarding gaps", "quote_count": 0}], "codebook": {"groups": [{"name": "Sentiment", "colour_set": "sentiment", "framework_id": "sentiment", "tag_count": 7}, {"name": "Pain points", "colour_set": "emo", "framework_id": null, "tag_count": 1}, {"name": "Mental models", "colour_set": "task", "framework_id": null, "tag_count": 1}], "applied_frameworks": [{"framework_id": "sentiment", "enabled": true}], "available_framework_ids": ["sentiment", "uxr", "cli-ux", "garrett", "morville", "nielsen", "norman", "yablonski", "plato", "codebook"]}, "top_signals": [{"location": "Login", "source_type": "section", "sentiment": "frustration", "quote_count": 5, "participants": ["p1", "p2"], "composite_signal": 0.7555, "confidence": "emerging"}]}}, {"t": 1794686619.8694642, "study": "main", "tool": "search_quotes", "args": {"group": "Mental models"}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "sorted_by": "time", "total_matched": 2, "returned": 2, "offset": 0, "has_more": false, "next_offset": null, "quotes": [{"quote_id": "q-p1-300", "text": "The code text never arrived so I just gave up.", "participant": "p1", "session_id": "s1", "timecode": "05:00", "end_timecode": "05:45", "duration_seconds": 45.0, "sentiment": "frustration", "intensity": 3, "section": "Login", "themes": [], "tags": ["auth friction", "borrowed model"], "starred": false}, {"quote_id": "q-p1-60", "text": "I thought logging in would work like my other bank app.", "participant": "p1", "session_id": "s3", "timecode": "01:00", "end_timecode": "01:20", "duration_seconds": 20.0, "sentiment": "confusion", "intensity": 2, "section": "Login", "themes": [], "tags": ["borrowed model"], "starred": false}], "groups_matched": [{"name": "Mental models", "framework_id": null}]}}, {"t": 1794686621.437417, "study": "main", "tool": "get_framework", "args": {"framework_id": "codebook"}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "kind": "live_codebook", "id": "codebook", "title": "This project's codebook", "description": "The researcher's live taxonomy: framework-imported and hand-rolled codes, with cultivated boundaries where they exist and per-tag usage counts over the curated corpus.", "groups": [{"name": "Sentiment", "subtitle": "AI-detected emotional responses", "colour_set": "sentiment", "framework_id": "sentiment", "enabled": true, "tags": [{"name": "confidence", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "Trust and feeling in control \u2014 the participant knows what to do and feels certain about the outcome.", "apply_when": "The participant signals certainty, mastery, or trust. Look for \"I know exactly what to do,\" \"this makes sense,\" \"I'm confident,\" \"I feel safe,\" \"I trust this.\"", "not_this": "If the participant is satisfied with a result, that's satisfaction. Confidence is forward-looking certainty \u2014 \"I know what to do\" vs \"that worked.\" It's about feeling in control, not about the outcome.", "cultivated": false}}, {"name": "confusion", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "The participant doesn't understand what's happening, what something means, or what to do next \u2014 a cognitive \"I'm lost\" moment.", "apply_when": "The participant expresses uncertainty about meaning, state, or next steps. Look for \"I don't understand,\" \"what does this mean,\" \"I'm not sure what,\" \"where am I,\" \"wait, what?\"", "not_this": "If the participant understands but finds the process slow, that's friction (a UXR tag). If they have a wrong understanding but feel confident, that's misconception (a UXR tag). Confusion is the felt experience of not knowing.", "cultivated": false}}, {"name": "delight", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "Exceeded expectations, genuine pleasure \u2014 the participant expresses positive emotion beyond mere satisfaction.", "apply_when": "The participant shows elevated positive emotion. Look for \"I love this,\" \"that's amazing,\" \"oh cool,\" \"this is great,\" laughing with pleasure, \"I didn't expect that\" (positively).", "not_this": "If the participant is satisfied but not emotionally moved, that's satisfaction. Delight requires elevated positive emotion \u2014 genuine pleasure, not just \"it works.\"", "cultivated": false}}, {"name": "doubt", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "Scepticism, worry, or distrust \u2014 the participant understands what's presented but doesn't believe or trust it.", "apply_when": "The participant signals scepticism or uncertainty about credibility. Look for \"I'm not sure I'd trust this,\" \"that seems dodgy,\" \"I don't believe,\" \"are they really,\" \"why do they need my.\"", "not_this": "Doubt is separate from confusion. Confusion means \"I don't understand this.\" Doubt means \"I understand it but don't trust it.\" Different design responses: better labelling vs. better credibility signals.", "cultivated": false}}, {"name": "frustration", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "Difficulty, annoyance, friction \u2014 the participant expresses emotional escalation beyond mere observation of a problem.", "apply_when": "The participant shows visible or verbal signs of annoyance. Look for tone markers (sighing, swearing, emphatic language), \"this is ridiculous,\" \"why can't I just,\" \"that's so annoying,\" \"I hate when,\" \"are you kidding me.\"", "not_this": "If the participant is calm but the process is slow, that's a usability observation, not frustration. Frustration requires emotional escalation \u2014 annoyance, anger, or exasperation.", "cultivated": false}}, {"name": "satisfaction", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "Met expectations, task success \u2014 the participant completed what they set out to do and it worked as expected.", "apply_when": "The participant signals that something worked well or met their needs. Look for \"good, that worked,\" \"perfect,\" \"that's what I wanted,\" \"exactly,\" \"great, done.\"", "not_this": "If the participant is emotionally elevated beyond mere satisfaction, that's delight. Satisfaction is \"it works\" \u2014 the baseline positive signal. Delight is \"it exceeds.\"", "cultivated": false}}, {"name": "surprise", "usage_count": 0, "origin": "framework", "boundaries": {"definition": "Expectation mismatch \u2014 something unexpected happened. Could be positive, negative, or neutral. The participant's expectations were violated.", "apply_when": "The participant encounters something they didn't expect. Look for \"oh!,\" \"I didn't expect,\" \"I was surprised,\" \"really?,\" \"wait, what?,\" \"that's weird,\" \"huh, I didn't know.\"", "not_this": "If the surprise is clearly positive and emotionally elevated, that may also warrant delight. Surprise is the neutral flag for any expectation mismatch \u2014 the researcher determines valence from context.", "cultivated": false}}]}, {"name": "Pain points", "subtitle": "", "colour_set": "emo", "framework_id": null, "enabled": true, "tags": [{"name": "auth friction", "usage_count": 3, "origin": "hand-rolled"}]}, {"name": "Mental models", "subtitle": "", "colour_set": "task", "framework_id": null, "enabled": true, "tags": [{"name": "borrowed model", "usage_count": 2, "origin": "hand-rolled"}]}]}}], "answer": "Yes, a little. Project \"Smoke Test\" (3 sessions, 9 visible quotes). I matched your question to your own codebook: the group **Mental models** (hand-rolled, one accepted tag, `borrowed model`, used on 2 quotes). I filtered search_quotes by that group, so these two are everything carrying it.\n\n- **q-p1-60** (p1, session s3, 01:00): \"I thought logging in would work like my other bank app.\" Section Login, sentiment confusion, intensity 2, tag `borrowed model`.\n- **q-p1-300** (p1, session s1, 05:00): \"The code text never arrived so I just gave up.\" Section Login, sentiment frustration, intensity 3, tags `auth friction` (Pain points) and `borrowed model`.\n\nWho said it: both are credited to **p1**. The overview shows p1 as the participant in s1 (name Ada, since Anonymise is off for this project). Only 1 participant is behind the Mental models evidence, so this is thin and not a pattern across people.\n\nCaveats the tools could not resolve:\n- q-p1-60 sits in session **s3**, but the overview lists s3's only participant as p3 (Cleo) with 0 visible quotes, while s3 shows 2 visible quotes. The code p1 is credited, but I can't say who actually spoke in s3 (the instructions say a session total above its speakers' sum means quotes tagged to someone not in that session). Treat the p1 attribution of q-p1-60 as unverified, and I'm not naming a person for it.\n- q-p1-300's timecode (05:00-05:45) is past the end of s1 (78 s long). Odd; the timing may be wrong.\n- q-p1-300's text is about a missing login code, which reads more like a pain point than a mental model; the borrowed-model tag is the researcher's, I haven't judged it.\n- Analysis has no last-run status (`last_run` null) and no coverage note, so I can't say whether it is complete. One quote is hidden by the researcher and not searched.\n- I did not run a free-text fallback search, since the codebook group matched.\n\n## Tool experience\n- Overview/quote mismatch for s3: quotes credited to p1 appear in a session whose only participant is p3, with p3 at 0 visible quotes. The instructions hint at this but nothing says which of p1/p3 is right; it made attribution unsafe.\n- Timecode 05:00 in a 78-second session is unexplained.\n- Overview reports participant names (Ada) while quotes only give codes; useful, but nothing links a name to a quote beyond the code, so the p1/s3 discrepancy blocks naming.\n- Mental models group has framework_id null and the codebook is the only place to see tag usage; fine. get_framework(\"codebook\") showed Sentiment tags with usage_count 0 despite quotes carrying sentiments, which looks misleading (counts apparently cover only tags, not sentiments).\n- Theme \"Onboarding gaps\" has 0 quotes; harmless but unexplained.\n- Otherwise the instructions pointed me clearly to the group filter; that worked well.\n"}, {"id": "b3", "study": "swap", "prompt": "Session 1 looks empty to me. Ada talked for most of it. What's going on?", "round": 2, "grade": {"id": "b3", "verdict": "minor_issues", "wrong_or_unsupported": ["'The two quotes ... are probably Cleo's' is a guess. The overview lists them under quotes_with_no_speaker (tag p1, nobody in s3 holds it), so the data does not say whose they are. The answer does label it an inference, but it still steers the researcher toward an attribution the tools leave open.", "'That p1 mixes quotes from two different sessions' p1 tags' is unsupported. In the swap study s1's p1-slot quotes are set aside, so the Login signal's p1 can only come from the s3 quote.", "'The tool documentation says ...' and 'Ada is p1 slot' rest on the instructions and on the prompt, not on the results. The answer flags the Ada link as an inference."], "missed": ["Nothing important. Set-aside count of 3, role/slot swap, 6 visible quotes, and the duplicated Sentiment group (7 and 3 tags) are all correctly reported."], "note": "Diagnosis is right and well supported. The weak points are the guess that the s3 quotes are Cleo's and the stray p1-mix claim."}, "steps": [{"t": 1794686800.774061, "study": "swap", "tool": "get_project_overview", "args": {}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "last_run": null, "sessions": {"count": 3, "items": [{"session_id": "s1", "session_date": "2026-01-20T00:00:00+00:00", "duration_seconds": 2400, "visible_quotes": 0, "speakers": [{"code": "p?", "role": "participant", "slot_code": "m1", "visible_quotes": 0}, {"code": "m?", "role": "researcher", "slot_code": "p1", "visible_quotes": 0, "quotes_set_aside": 3}]}, {"session_id": "s2", "duration_seconds": 2400, "visible_quotes": 4, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p2", "role": "participant", "visible_quotes": 4, "name": "Ben"}]}, {"session_id": "s3", "duration_seconds": 2400, "visible_quotes": 2, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p3", "role": "participant", "visible_quotes": 0, "name": "Cleo"}], "quotes_with_no_speaker": [{"tag": "p1", "visible_quotes": 2}]}]}, "participants": {"count": 3, "speakers": [{"code": "p2", "role": "participant", "name": "Ben"}, {"code": "p3", "role": "participant", "name": "Cleo"}, {"code": "p?", "role": "participant"}]}, "quotes": {"visible": 6, "starred": 1, "hidden_by_researcher": 0}, "sections": [{"label": "Login", "quote_count": 5}, {"label": "Payments", "quote_count": 1}], "themes": [{"label": "Onboarding gaps", "quote_count": 0}], "codebook": {"groups": [{"name": "Sentiment", "colour_set": "sentiment", "framework_id": "sentiment", "tag_count": 7}, {"name": "Pain points", "colour_set": "emo", "framework_id": "uxr", "tag_count": 1}, {"name": "Mental models", "colour_set": "task", "framework_id": "uxr", "tag_count": 1}, {"name": "Sentiment", "colour_set": "sentiment", "framework_id": "sentiment", "tag_count": 3}], "applied_frameworks": [{"framework_id": "sentiment", "enabled": true}, {"framework_id": "uxr", "enabled": true}], "available_framework_ids": ["sentiment", "uxr", "cli-ux", "garrett", "morville", "nielsen", "norman", "yablonski", "plato", "codebook"]}, "top_signals": [{"location": "Login", "source_type": "section", "sentiment": "frustration", "quote_count": 3, "participants": ["p1", "p2"], "composite_signal": 0.6, "confidence": "emerging"}]}}, {"t": 1794686805.192649, "study": "swap", "tool": "search_quotes", "args": {"session": "s1"}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "sorted_by": "time", "total_matched": 0, "returned": 0, "offset": 0, "has_more": false, "next_offset": null, "quotes": []}}, {"t": 1794686806.697027, "study": "swap", "tool": "search_quotes", "args": {"session": "s3"}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "sorted_by": "time", "total_matched": 2, "returned": 2, "offset": 0, "has_more": false, "next_offset": null, "quotes": [{"quote_id": "q-p1-0", "text": "Login again? Ok.", "participant": "p1", "session_id": "s3", "timecode": "00:00", "end_timecode": null, "duration_seconds": null, "sentiment": "frustration", "intensity": 1, "section": "Login", "themes": [], "tags": ["frustration"], "starred": false}, {"quote_id": "q-p1-60", "text": "I thought logging in would work like my other bank app.", "participant": "p1", "session_id": "s3", "timecode": "01:00", "end_timecode": "01:20", "duration_seconds": 20.0, "sentiment": "confusion", "intensity": 2, "section": "Login", "themes": [], "tags": ["borrowed model", "confusion"], "starred": false}]}}], "answer": "Session 1 is not empty in the analysis. Its three quotes are set aside, not lost, and the likely cause is that the speaker roles in that session got swapped.\n\n**What I found (get_project_overview, search_quotes with session s1)**\n- s1 shows 0 visible quotes, and search_quotes for s1 returns nothing.\n- s1 has two speakers, and both have been recoded:\n  - The speaker the transcript tags p1 is now listed as role \"researcher\", code m?, with quotes_set_aside: 3.\n  - The speaker the transcript tags m1 is now listed as role \"participant\", code p?, with 0 quotes.\n- The tool documentation says a speaker whose slot starts with p but whose role is not participant was recoded, and that their quotes are set aside until the recode is undone or the session is re-analysed.\n- So the person who spoke most (probably Ada, whom you named) is currently recorded as the moderator, and their 3 quotes are hidden from every view. The moderator is recorded as the participant, and moderators produce no quotes.\n- The two codes are also unidentified: p? and m?.\n\n**What I can't tell from the tools**\n- I can't confirm that Ada is the p1 slot. No name appears for s1 speakers, and names only appear for p2 (Ben) and p3 (Cleo). I'm inferring it from \"Ada talked most\" plus the fact that the p1 slot is the one with set-aside quotes.\n- I can't read the 3 set-aside quotes, so I can't say what they say. The tools don't expose them.\n- I can't tell when or why the roles were changed. It could be a deliberate recode or a mistake (a swap).\n- last_run is null, so I don't know whether the analysis finished or whether a re-run is pending.\n\n**Suggestion**\n- In the app, check the speaker roles for session 1. If the roles were swapped by mistake, undo the recode, or fix the roles and re-analyse that session. The 3 quotes should come back.\n- Only 6 quotes are visible across the study, so this matters. Session 1's evidence is missing from the Login section and from the top signal.\n\n**Related oddity in s3**\n- 2 quotes in s3 are credited to the tag p1, but nobody in s3 holds that tag. The speakers there are m? and p3 (Cleo), and p3 shows 0 visible quotes.\n- This looks like another speaker-attribution mismatch. The two quotes (\"Login again? Ok.\" and \"I thought logging in would work like my other bank app.\") are probably Cleo's, but I'm inferring that.\n- Those quotes also feed the top signal, which lists participants p1 and p2. That p1 mixes quotes from two different sessions' p1 tags, so treat that signal's participant count with caution.\n\n**Other notes**\n- The \"Onboarding gaps\" theme has 0 quotes.\n- The codebook lists the Sentiment group twice.\n\n**Tool experience**\n- Overall the instructions were good. The line about set-aside quotes in recoded speakers pointed straight at the cause.\n- The session row is confusing: `code` p? with `slot_code` m1, and `code` m? with `slot_code` p1, so code and slot cross over. It took careful reading of the instructions to realise this means the roles were swapped.\n- Nothing says who did the recode, when, or whether it was a swap. An explicit \"roles swapped\" flag or a note on the row would help.\n- The 3 set-aside quotes can't be retrieved or counted by any filter. search_quotes has no option to include them, so I couldn't see what Ada said.\n- No speaker name is shown for s1 (the overview shows names only for some), so I couldn't link \"Ada\" to a code.\n- The p1 tag in s3 and the participants list (\"p1, p2\") in the top signal use slot tags that are not study-wide codes, which is misleading next to the study-wide participants list (p2, p3, p?).\n- last_run is null with no explanation.\n- The Sentiment group appears twice in the codebook with different tag counts (7 and 3), with no explanation.\n"}, {"id": "b4", "study": "main", "prompt": "What are the pain points? Give me the top three with a quote each, in the shape of the report.", "round": 2, "grade": {"id": "b4", "verdict": "minor_issues", "wrong_or_unsupported": ["'Payments: 1 quote, 1 participant ... an anecdote' understates the evidence. The overview shows 2 Payments quotes and a Payments confusion quote exists (q-p2-500, p2 per the main study). The answer's frustration-only definition of pain point hides it, and it still states the section count as 1.", "'Below the signal threshold (a signal needs 2+ quotes)' cannot be confirmed from the logs. The answer cites it as an instruction.", "Pain points #1 and #2 overlap. q-p1-120 and q-p1-300 are among the 5 Login frustration quotes counted in #1 and are also the 2 quotes in #2, so the 'top three' are really two areas plus one quote."], "missed": ["q-p1-0 is listed as a 'related' quote in #1 with p1 attribution implied. The overview says it has no speaker in s3. The answer flags this later, but not where the quote is used.", "s3 quotes 'Login again? Ok.' and q-p1-60 are in the signal's evidence but cannot be attributed. This only appears as a 'what the tools could not tell me' item."], "note": "Quotes, counts, tags, and the observation that get_signals shows empty tags and 3 of 5 supporting quotes are accurate. The Payments sizing and the overlapping top-three are the flaws."}, "steps": [{"t": 1794686800.599568, "study": "main", "tool": "get_project_overview", "args": {}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "last_run": null, "sessions": {"count": 3, "items": [{"session_id": "s1", "session_date": "2026-01-20T00:00:00+00:00", "duration_seconds": 2400, "visible_quotes": 3, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p1", "role": "participant", "visible_quotes": 3, "name": "Ada"}]}, {"session_id": "s2", "duration_seconds": 2400, "visible_quotes": 4, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p2", "role": "participant", "visible_quotes": 4, "name": "Ben"}]}, {"session_id": "s3", "duration_seconds": 2400, "visible_quotes": 2, "speakers": [{"code": "m?", "role": "researcher", "slot_code": "m1", "visible_quotes": 0}, {"code": "p3", "role": "participant", "visible_quotes": 0, "name": "Cleo"}], "quotes_with_no_speaker": [{"tag": "p1", "visible_quotes": 2}]}]}, "participants": {"count": 3, "speakers": [{"code": "p1", "role": "participant", "name": "Ada"}, {"code": "p2", "role": "participant", "name": "Ben"}, {"code": "p3", "role": "participant", "name": "Cleo"}]}, "quotes": {"visible": 9, "starred": 1, "hidden_by_researcher": 1}, "sections": [{"label": "Login", "quote_count": 7}, {"label": "Payments", "quote_count": 2}], "themes": [{"label": "Onboarding gaps", "quote_count": 0}], "codebook": {"groups": [{"name": "Sentiment", "colour_set": "sentiment", "framework_id": "sentiment", "tag_count": 7}, {"name": "Pain points", "colour_set": "emo", "framework_id": "uxr", "tag_count": 1}, {"name": "Mental models", "colour_set": "task", "framework_id": "uxr", "tag_count": 1}, {"name": "Sentiment", "colour_set": "sentiment", "framework_id": "sentiment", "tag_count": 3}], "applied_frameworks": [{"framework_id": "sentiment", "enabled": true}, {"framework_id": "uxr", "enabled": true}], "available_framework_ids": ["sentiment", "uxr", "cli-ux", "garrett", "morville", "nielsen", "norman", "yablonski", "plato", "codebook"]}, "top_signals": [{"location": "Login", "source_type": "section", "sentiment": "frustration", "quote_count": 5, "participants": ["p1", "p2"], "composite_signal": 0.7555, "confidence": "emerging"}]}}, {"t": 1794686804.594202, "study": "main", "tool": "search_quotes", "args": {"group": "Pain points", "limit": 50}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "sorted_by": "time", "total_matched": 3, "returned": 3, "offset": 0, "has_more": false, "next_offset": null, "quotes": [{"quote_id": "q-p1-120", "text": "I typed my password three times and it still said wrong.", "participant": "p1", "session_id": "s1", "timecode": "02:00", "end_timecode": "02:18", "duration_seconds": 18.0, "sentiment": "frustration", "intensity": 3, "section": "Login", "themes": [], "tags": ["auth friction", "frustration"], "starred": false}, {"quote_id": "q-p1-300", "text": "The code text never arrived so I just gave up.", "participant": "p1", "session_id": "s1", "timecode": "05:00", "end_timecode": "05:45", "duration_seconds": 45.0, "sentiment": "frustration", "intensity": 3, "section": "Login", "themes": [], "tags": ["auth friction", "borrowed model", "frustration"], "starred": false}, {"quote_id": "q-p2-200", "text": "Why do I need to log in again every single time?", "participant": "p2", "session_id": "s2", "timecode": "03:20", "end_timecode": "03:35", "duration_seconds": 15.0, "sentiment": "frustration", "intensity": 2, "section": "Login", "themes": [], "tags": ["auth friction", "frustration"], "starred": true}], "groups_matched": [{"name": "Pain points", "framework_id": "uxr"}]}}, {"t": 1794686806.1383271, "study": "main", "tool": "get_framework", "args": {"framework_id": "uxr"}, "result": {"project": {"id": 1, "name": "Smoke Test", "key": "f66958d4"}, "kind": "template", "id": "uxr", "title": "Bristlenose UXR Codebook", "author": "", "description": "A practitioner-oriented codebook for any user research study. Eight theme groups covering behaviour, pain points, needs, mental models, motivation, emotion, context, and learning. Domain-agnostic \u2014 works equally well for fishkeeping, fintech, healthcare, or rock climbing. These are universal patterns of human experience that emerge in qualitative research across any domain.", "author_bio": "This is the default codebook \u2014 it provides a general-purpose qualitative coding framework that applies to any domain. Unlike the Research Leaders codebooks (Garrett, Norman), which focus on designed artefacts and specific interaction-design theories, these tags reflect the practical vocabulary used by working UX researchers on sticky notes, in Dovetail, and in affinity diagrams.", "preamble": "These tags describe patterns of human experience, behaviour, and interaction that emerge in qualitative research across any domain. They are not tied to a specific design framework or theory \u2014 they reflect the practical vocabulary used by working researchers. Apply tags based on what the participant says and does in the quote. If no tag fits naturally, assign nothing \u2014 an untagged quote is better than a forced tag. When two tags could apply, choose the one that best describes the primary thing happening in the quote.", "applied_to_project": true, "enabled": true, "groups": [{"name": "Behaviour", "subtitle": "What people actually do", "colour_set": "ux", "tags": [{"name": "workaround", "definition": "The participant has invented their own solution because the intended path doesn't work for them \u2014 a self-made fix, shortcut, or alternative route.", "apply_when": "The participant describes doing something \"the wrong way\" or a non-obvious way because the designed path failed them. Look for \"what I actually do is,\" \"I just use X instead,\" \"my trick is,\" \"I figured out that if you.\"", "not_this": "If the participant simply avoids the feature entirely, that's avoidance. If they describe difficulty but haven't invented a solution, that's friction. Workaround requires a creative alternative, not just struggle."}, {"name": "habit", "definition": "The participant does something automatically, without deliberate thought \u2014 ingrained routine behaviour that persists even when better options exist.", "apply_when": "The participant describes something they \"always\" do, do \"without thinking,\" or have done \"for years.\" Look for \"I just automatically,\" \"out of habit,\" \"I always,\" \"that's just what I do,\" \"I don't even think about it.\"", "not_this": "If the participant is deliberately choosing to do something (conscious decision), that's not habit \u2014 consider goal or workaround. Habit is unconscious repetition, not deliberate strategy."}, {"name": "avoidance", "definition": "The participant deliberately steers away from a feature, area, or action \u2014 they know it exists but choose not to engage.", "apply_when": "The participant describes something they refuse to use, skip over, ignore, or go out of their way to avoid. Look for \"I never touch that,\" \"I skip,\" \"I don't bother with,\" \"I stay away from,\" \"I refuse to.\"", "not_this": "If the participant doesn't know the feature exists, that's not avoidance \u2014 consider confusion or tag nothing. If they've built an alternative route, that's workaround. Avoidance is conscious non-engagement."}, {"name": "say-do gap", "definition": "What the participant says they do contradicts what they actually do \u2014 stated behaviour differs from observed behaviour.", "apply_when": "The participant's stated behaviour contradicts evidence from observation, other quotes, or their own earlier statements. Look for \"I usually do X\" when observation shows Y, or self-contradictions within the interview.", "not_this": "This tag requires evidence of a gap \u2014 the participant must both state something AND the data must show something different. A single statement without contradicting evidence isn't a say-do gap \u2014 it's just a statement."}, {"name": "error recovery", "definition": "How the participant recovers (or fails to recover) after making a mistake \u2014 the moment after something goes wrong.", "apply_when": "The participant describes what happened after an error \u2014 hitting undo, starting over, calling support, giving up, or finding their own fix. Look for \"so then I had to,\" \"I couldn't figure out how to go back,\" \"I hit undo,\" \"I just started over.\"", "not_this": "If the participant hasn't made an error but is simply confused, that's confusion. If they gave up entirely, that's abandonment. Error recovery is specifically the response to a mistake, not the confusion that preceded it."}, {"name": "exploration", "definition": "The participant's strategy for discovering what a product can do \u2014 trying things, poking around, navigating without a fixed goal, testing the boundaries of the system.", "apply_when": "The participant is actively experimenting: clicking things to see what happens, opening menus to find out what is there, narrating trial and error. Look for \"let me try,\" \"what happens if I,\" \"I'll just poke around,\" \"let's see what this does.\"", "not_this": "If the participant is performing a known action towards a clear goal, that's not exploration. If they are stuck with no way forward, that's dead end. If they are improvising around a blocker, that's workaround. If they are doing what they always do, that's habit. Exploration is deliberate, curious investigation."}]}, {"name": "Pain points", "subtitle": "Where things break down", "colour_set": "emo", "tags": [{"name": "friction", "definition": "Something slows the participant down, adds unnecessary steps, or requires more effort than it should \u2014 the \"this is harder than it needs to be\" feeling.", "apply_when": "The participant describes unnecessary steps, excessive effort, slow processes, or things that should be easier. Look for \"it takes too long,\" \"too many steps,\" \"why do I have to,\" \"it should just,\" \"every time I need to.\"", "not_this": "If the participant is emotionally escalated, that's frustration (friction is the observation, frustration is the emotional response to it). If they can't proceed at all, that's dead end. Friction means progress is possible but unnecessarily hard."}, {"name": "dead end", "definition": "The participant hits a wall with no obvious way forward \u2014 stuck, blocked, can't proceed.", "apply_when": "The participant reaches a point where they literally cannot continue. Look for \"I can't,\" \"there's no way to,\" \"it won't let me,\" \"I'm stuck,\" \"now what,\" \"nothing happens.\"", "not_this": "If the participant can proceed but it's slow or hard, that's friction. If they choose to give up, that's abandonment. Dead end is the moment of being blocked \u2014 what happens next (abandon, workaround, error recovery) is a separate tag."}, {"name": "abandonment", "definition": "The participant gives up on a task or goal entirely \u2014 they stop trying.", "apply_when": "The participant describes quitting, leaving, giving up, or walking away. Look for \"I just gave up,\" \"I left,\" \"I stopped trying,\" \"I moved on,\" \"I went somewhere else,\" \"forget it.\"", "not_this": "If the participant is still trying but blocked, that's dead end. If they found an alternative route, that's workaround. Abandonment means they stopped pursuing the goal entirely \u2014 no fallback, no retry, just done."}, {"name": "lost my place", "definition": "The participant loses track of where they are in a task or a process \u2014 what they were doing, which step they are on, what they had already done.", "apply_when": "The participant asks where they were, goes back to reorient, or restarts because they lost the thread. Look for \"where was I,\" \"what was I doing,\" \"which step am I on,\" \"I'll have to start again, I've lost track.\"", "not_this": "If they lost their place because the navigation failed them, that's navigation clarity (Morville \u2192 Findable). If they forgot a step they knew, that's memory lapse (Norman \u2192 Slips and mistakes). If they hit a wall with no way forward, that's dead end. Lost my place is the participant's own orientation going."}]}, {"name": "Needs and desires", "subtitle": "What people want", "colour_set": "emo", "tags": [{"name": "unmet need", "definition": "Something the participant wants or needs that isn't being addressed \u2014 a gap between what they have and what they require.", "apply_when": "The participant describes something missing from their experience \u2014 not a specific feature, but an underlying need or desire. Look for \"I wish,\" \"what I really need is,\" \"there's nothing that,\" \"if only,\" \"the problem is there's no way to.\"", "not_this": "If the participant asks for a specific feature or capability by name, that's feature request. Unmet need is the underlying problem; feature request is a proposed solution. \"I need better organisation\" = unmet need. \"I want a folder system\" = feature request."}, {"name": "feature request", "definition": "The participant explicitly asks for a specific capability, feature, or improvement \u2014 a concrete \"build this\" statement.", "apply_when": "The participant names a specific thing they want built, added, or changed. Look for \"you should add,\" \"it would be great if,\" \"I want a button that,\" \"can you make it so,\" \"why isn't there a.\"", "not_this": "If the participant describes an underlying problem without proposing a solution, that's unmet need. Feature request is the participant's proposed solution \u2014 they may be right about the need but wrong about the solution. Tag the request, not just the need behind it."}, {"name": "desire path", "definition": "The participant's natural behaviour reveals a need the designer didn't anticipate \u2014 they've worn a path through the grass where no pavement exists.", "apply_when": "The participant describes using something in an unintended way that reveals what they actually want. Look for \"I use X for Y\" (where Y isn't what X was designed for), cobbled-together workflows, spreadsheets used as databases, emails used as to-do lists.", "not_this": "If the participant has a deliberate fix for a known problem, that's workaround (conscious). Desire path is often unselfconscious \u2014 the participant may not even realise they're revealing a need. The distinction: workaround = \"I know this is wrong but\"; desire path = \"this is just how I do it.\""}, {"name": "expectation mismatch", "definition": "What the participant expected to happen differs from what actually happened \u2014 surprise, disappointment, or confusion caused by a gap between mental model and reality.", "apply_when": "The participant describes something that didn't behave as they expected. Look for \"I thought it would,\" \"I expected,\" \"I assumed,\" \"that's not what I thought would happen,\" \"I was surprised that,\" \"why did it.\"", "not_this": "If the participant reveals their overall understanding of a system, that's mental model (neutral). If they have a factually wrong belief, that's misconception. Expectation mismatch is specifically about a moment of surprise when prediction meets reality."}]}, {"name": "Mental models", "subtitle": "How people think it works", "colour_set": "task", "tags": [{"name": "mental model", "definition": "The participant reveals how they conceptualise a system, process, or domain \u2014 their internal map of how things work or are organised.", "apply_when": "The participant explains their understanding of how something is structured, categorised, or operates. Look for \"the way I think about it is,\" \"I see it as,\" \"in my mind,\" \"it's like,\" analogies, or descriptions of how they believe a process works.", "not_this": "If the participant's model is factually wrong, that's misconception (a subset). If they're comparing to past experience, that's prior experience. Mental model is the neutral act of revealing how they think \u2014 right or wrong."}, {"name": "assumption", "definition": "The participant takes something for granted that may or may not be true \u2014 an unexamined belief that shapes their behaviour.", "apply_when": "The participant acts on or states an unverified belief. Look for \"I assumed,\" \"I figured,\" \"I thought it was obvious that,\" \"of course it would,\" \"everyone knows that,\" \"surely.\"", "not_this": "If the assumption is definitively wrong, consider misconception. If the participant is actively comparing to past experience, that's prior experience. Assumption is about unstated, often unconscious premises."}, {"name": "prior experience", "definition": "The participant references a previous experience \u2014 with another product, system, or context \u2014 that shapes their current expectations.", "apply_when": "The participant explicitly references another product, a previous version, a competitor, or a past situation. Look for \"at my old job,\" \"on [other product],\" \"last time I,\" \"the way [competitor] does it,\" \"I'm used to.\"", "not_this": "If the participant reveals an internal model without referencing a specific past experience, that's mental model. Prior experience requires an explicit reference to a concrete past situation, product, or context."}, {"name": "misconception", "definition": "The participant has a factually incorrect understanding that they believe to be true \u2014 a wrong mental model they're acting on.", "apply_when": "The participant states or acts on something that is demonstrably wrong. Look for confident
