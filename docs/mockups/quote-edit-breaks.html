:root {

    --bn-colour-error-text: #c2410c;
    --bn-sentiment-confusion-bg: #fef2f2;
    --bn-sentiment-doubt: #7c3aed;
    --bn-sentiment-doubt-bg: #f5f3ff;

    /* Neutral (investigation flag) */

    /* Positive sentiments */

    --bn-sentiment-delight: #059669;
    --bn-sentiment-delight-bg: #ecfdf5;

    /* Analysis heatmap — OKLCH colour ramp tokens */
    --bn-heat-frustration-h: 55;
    --bn-heat-confusion-h: 30;
    --bn-heat-doubt-h: 295;
    --bn-heat-surprise-h: 75;
    --bn-heat-satisfaction-h: 155;

    --bn-heat-confidence-h: 260;
    --bn-heat-chroma: 0.12;
    --bn-heat-l-min: 95%;
    --bn-heat-l-max: 45%;
    --bn-heat-depleted-h: 75;
    --bn-heat-depleted-chroma: 0.08;

    /* Codebook user-tag colours — OKLCH v5 pentadic palette.
       5 sets at ~72° hue anchors, ±25° per set, ~12° steps.
       Light mode: washed (pale bg, dark text).
       Dark mode: saturated (mid-dark bg, white text).
       See immutable-chasing-patterson plan for rationale. */

    /* UX set (blue, H=225-275, anchor 250) */
    --bn-ux-1-bg: oklch(94% 0.03 225);
    --bn-ux-2-bg: oklch(94% 0.03 237);
    --bn-ux-3-bg: oklch(94% 0.03 250);
    --bn-ux-4-bg: oklch(94% 0.03 263);

    --bn-emo-2-bg: oklch(94% 0.03 352);
    --bn-emo-3-bg: oklch(94% 0.03 4);
    --bn-emo-4-bg: oklch(94% 0.03 16);
    --bn-emo-5-bg: oklch(94% 0.03 28);
    --bn-emo-6-bg: oklch(94% 0.03 40);

    /* Task set (green-teal, H=130-180, anchor 155) */

    --bn-task-2-bg: oklch(94% 0.03 142);
    --bn-task-3-bg: oklch(94% 0.03 155);
    --bn-task-4-bg: oklch(94% 0.03 168);
    --bn-task-5-bg: oklch(94% 0.03 180);

    /* Trust set (purple, H=275-325, anchor 300) */
    --bn-trust-1-bg: oklch(94% 0.03 275);
    --bn-trust-2-bg: oklch(94% 0.03 287);
    --bn-trust-3-bg: oklch(94% 0.03 300);
    --bn-trust-4-bg: oklch(94% 0.03 313);
    --bn-trust-5-bg: oklch(94% 0.03 325);

    /* Opportunity set (amber, H=50-100, anchor 75) */
    --bn-opp-1-bg: oklch(94% 0.03 50);
    --bn-opp-2-bg: oklch(94% 0.03 62);
    --bn-opp-3-bg: oklch(94% 0.03 75);

    /* Sentiment set — numeric aliases for the codebook colour system.

    --bn-sentiment-1-bg: var(--bn-sentiment-frustration-bg);
    --bn-sentiment-2-bg: var(--bn-sentiment-confusion-bg);

    /* Micro histogram bar colours (slightly more saturated than badge bg) */
    --bn-bar-ux:        oklch(70% 0.08 250);
    --bn-bar-emo:       oklch(70% 0.08 10);
    --bn-bar-task:      oklch(70% 0.06 155);
    --bn-bar-trust:     oklch(70% 0.07 300);
    --bn-bar-opp:       oklch(72% 0.07 75);
    --bn-bar-sentiment: oklch(65% 0.06 200);

    /* Set indicator dots (saturated anchors for codebook panel) */
    --bn-set-ux-dot: oklch(50% 0.12 250);
    --bn-set-emo-dot: oklch(50% 0.12 10);
    --bn-set-task-dot: oklch(50% 0.10 155);
    --bn-set-trust-dot: oklch(50% 0.11 300);

    /* Legacy sentiment colours (deprecated — kept for backward compat) */
    --bn-colour-confusion: var(--bn-sentiment-confusion);
    --bn-colour-confusion-bg: var(--bn-sentiment-confusion-bg);
    --bn-colour-frustration: var(--bn-sentiment-frustration);
    --bn-colour-frustration-bg: var(--bn-sentiment-frustration-bg);
    --bn-colour-delight: var(--bn-sentiment-delight);
    --bn-colour-delight-bg: var(--bn-sentiment-delight-bg);

    /* Layout */
    --bn-max-width: 52rem;

    /* Dialogs (atoms/modal.css, components/Dialog.tsx) — the macOS sheet, measured
       24 Oct 2026 from a stock Save sheet in light mode on macOS 27: the window
       behind is pulled towards a light grey rather than covered in black (no

    --bn-overlay-scrim: rgb(170 170 170 / 0.59);
    --bn-overlay-z: 1000;
    --bn-toast-z: 1100;                     /* a notification stays above a dialog */
    --bn-modal-bg: var(--bn-colour-bg);
    --bn-modal-radius: 20px;
    --bn-modal-hairline: rgb(0 0 0 / 0.1);
    --bn-modal-shadow-colour: rgb(0 0 0 / 0.3);

    --bn-modal-offset: 32px;                /* the sheet drops this far into place */
    --bn-modal-enter: 230ms;                /* the drop, and the backdrop dimming */
    --bn-modal-enter-fade: 100ms;           /* solid early; the drop carries on */
    --bn-modal-enter-ease: cubic-bezier(0, 0, 0.58, 1);
    --bn-modal-exit: 240ms;                 /* rise, fade and backdrop together, linear */
    /* Native-looking controls in a dialog: the segmented control's track and raised segment, and

    --bn-control-track: #e8e8ed;
    --bn-control-raised-shadow: 0 1px 2px rgb(0 0 0 / 0.18);
    --bn-help-button-bg: #e8e8ea;
    --bn-help-button-bg-hover: #dcdcdf;
    --bn-help-button-bg-active: #cfcfd3;
    --bn-help-button-ink: #1d1d1f;

    /* Breakpoints — reference values for @media queries across the system.

       When adding a new media query, pick from this list or add a new entry. */
    --bn-breakpoint-compact:  500px;   /* help overlay, single-column fallback */
    --bn-breakpoint-toolbar:  600px;   /* toolbar collapse (planned) */
    --bn-breakpoint-content:  1100px;  /* transcript annotation margin layout */

    --bn-space-lg: 1.5rem;
    --bn-space-xl: 2rem;
    --bn-space-2xl: 3rem;

    --bn-signal-card-inset: var(--bn-space-2xl);

    /* ── Inline edit fields — READ THIS BEFORE STYLING A NEW ONE ──────────
     *
     * An inline edit field is a piece of text the researcher can click into
     * and retype: a theme heading, a session name, a code group's title, a
     * code. There are exactly TWO treatments and the choice is mechanical,
     * decided by the GROUND the field sits on, not by which lens you are in:
     *
     *   field on page background  →  --bn-field-edit-fill-on-page  (tints up)
     *   field on a tinted surface →  --bn-field-edit-fill-on-tint  (blanks to
     *                                                               neutral)
     *
     * Both carry --bn-field-edit-edge at 1px. The fill inverts because the
     * ground does; the edge never changes, so the signal is one signal.
     * Border or outline is yours to pick — outline for a span in running
     * prose (it costs no layout and will not reflow the line), border for
     * something that already has a box. That is a mechanism, not a meaning.
     *
     * DO NOT invent a third fill. Two surfaces got one each before these
     * tokens existed (a quote-bg tint, a page-bg blank) and two more got
     * nothing at all, which is how "is this field live?" came to have four
     * answers on one screen.
     *
     * THE ONE EXEMPTION is quote cropping — `.crop-editable` and the bracket
     * handles in molecules/editable-text.css. That is not "edit this text",
     * it is "move this boundary", it was designed as a single signal with the
     * burnt-amber brackets, and it keeps --bn-colour-crop-bg. Do not reach
     * for that yellow for anything else, and do not restyle crop to match
     * these: a different verb is allowed a different look. The token was
     * called --bn-colour-editing-bg until 20 Sep 2026; it was renamed
     * because a token named for a state it must not be used in is how the
     * four-answers-on-one-screen problem started. */
    --bn-field-edit-edge: var(--bn-colour-accent);
    --bn-field-edit-fill-on-page: var(--bn-colour-quote-bg);
    --bn-field-edit-fill-on-tint: var(--bn-colour-bg);
    --bn-field-edit-radius: var(--bn-radius-sm);
    --bn-field-edit-offset: 1px;

    /* Section-divider keyline — the colour of the h2 / .section-heading /
       .framework-section-header bottom rules and the header <hr>. Aliases

       (globally here, or per-surface) to hide every section divider WITHOUT
       moving anything — the 1px box still lays out, it just stops painting.
       The reversible borders-off experiment. Table-header (th) rules keep
       --bn-colour-border (data-grid chrome, not a section divider).

    --bn-colour-keyline: var(--bn-colour-border);

    /* Transitions */
    --bn-transition-fast: 0.15s ease;
    --bn-transition-normal: 0.2s ease;
    --bn-transition-slow: 0.3s ease;

    /* Focus Mode — the distraction-free reading state (templates/focus-mode.css,
       docs/design-focus-mode.md). Structural, NOT palette-overridable: the whole
       transform is colour-free by design, which is what lets it compose with
       every palette × appearance with zero per-palette overrides. Deliberately
       here and not in colors/_contract.css — a Focus token in the contract would
       oblige every future palette author to answer a question the feature
       doesn't ask. "Dusk, not a light-switch": no overshoot, no bounce — the
       wrong register for reading evidence. */
    --bn-focus-ghost-opacity: 0.14;
    --bn-focus-heading-opacity: 0.4;
    --bn-focus-dur: 320ms;
    --bn-focus-ease: ease-in-out;
    /* How much of a receded card's outline survives — the border is mixed
       toward transparent by the remainder. One number for both lenses (the
       quote card's left edge, the signal card's box and fused seam); it was a
       literal 40% in two places until the Signals lens made it three. */
    --bn-focus-outline-mix: 40%;

    /* Arrival — the "you are here" cue on the thing a link landed on: a
       transcript paragraph, a quote card, a group heading
       (atoms/arrival.css, docs/design-arrival-flash.md). Seconds, not the
       Acknowledge range, because the eye is still travelling when it starts.
       Structural, like Focus: the colour is an alias of the palette's
       highlight, so every palette × appearance answers through the contract
       it already keeps. */
    --bn-arrival-colour: var(--bn-colour-highlight);
    --bn-arrival-duration: 5s;
    --bn-arrival-easing: ease-out;

    /* Thinking-shimmer — the "work in progress" travelling-sheen for text.
       Shared cross-surface spec, locked 18 Jul 2026 (docs/design-motion.md
       §4.7.1). Consuming surfaces set --bn-shimmer-base (resting text colour)
       and --bn-shimmer-peak (the pole the band moves toward: white where text
       is dark, the surface background where text is light) so the sheen has
       headroom in every theme. See atoms/shimmer.css. */
    --bn-shimmer-contrast: 5%;    /* band peak = 5% from base toward the peak pole */
    --bn-shimmer-band: 34%;       /* feathered band width, as % of the gradient */
    --bn-shimmer-angle: 100deg;   /* slight off-horizontal tilt */
    --bn-shimmer-sweep: 1800ms;   /* travel time (documentation; keyframe encodes the split) */
    --bn-shimmer-gap: 900ms;      /* dark hold between sweeps (documentation) */
    --bn-shimmer-period: 2700ms;  /* sweep + gap — the animation duration */
    --bn-shimmer-easing: ease-in-out;

    /* Block shimmer and ghost (docs/design-motion.md §4.7.2). Contrast follows area: slabs
       (thumbnail, card) take a third of the text value; small shapes (sparkline bars, the
       4.5px strip) take 8%, because a third-contrast sweep cannot be seen on so few pixels.
       The peak is a translucent ink tint laid OVER the element's own fill. */
    --bn-skeleton-base: var(--bn-colour-badge-bg);
    --bn-skeleton-contrast: 2.7%;
    --bn-skeleton-contrast-small: 8%;
    --bn-skeleton-peak: color-mix(in srgb, var(--bn-colour-text) var(--bn-skeleton-contrast), transparent);
    --bn-skeleton-peak-small: color-mix(in srgb, var(--bn-colour-text) var(--bn-skeleton-contrast-small), transparent);

    /* Legacy aliases — used by inline styles in generated HTML.
       Theme authors: override the --bn-* versions above;
       these aliases follow automatically. */
    --font-body: var(--bn-font-body);
    --font-mono: var(--bn-font-mono);
    --colour-bg: var(--bn-colour-bg);
    --colour-text: var(--bn-colour-text);
    --colour-muted: var(--bn-colour-muted);
    --colour-border: var(--bn-colour-border);
    --colour-accent: var(--bn-colour-accent);
    --colour-quote-bg: var(--bn-colour-quote-bg);
    --colour-badge-bg: var(--bn-colour-badge-bg);
    --colour-badge-text: var(--bn-colour-badge-text);
    --colour-confusion: var(--bn-colour-confusion);
    --colour-frustration: var(--bn-colour-frustration);
    --colour-delight: var(--bn-colour-delight);
    --colour-suggestion: var(--bn-colour-suggestion);
    --max-width: var(--bn-max-width);
}

        --bn-colour-confusion:        var(--bn-sentiment-confusion);

        --bn-colour-frustration-bg:   var(--bn-sentiment-frustration-bg);
        --bn-colour-delight:          var(--bn-sentiment-delight);
        --bn-colour-delight-bg:       var(--bn-sentiment-delight-bg);

        /* Dialogs in dark: the page dims towards black, and the sheet is a raised
           surface, lighter than the page, with a light hairline, the way a dark
           macOS sheet reads. Without the lift a dark card vanished into the dimmed
           dark report (docs/mockups/modal-crash-way-out.html, dark frame). */
        --bn-overlay-scrim:        light-dark(rgb(170 170 170 / 0.59), rgb(0 0 0 / 0.5));
        --bn-modal-bg:             light-dark(var(--bn-colour-bg), color-mix(in srgb, var(--bn-colour-bg), white 9%));

    }

    /* Explicit overrides — lock theme regardless of OS preference */
    [data-theme="light"]:root { color-scheme: light; }
    [data-theme="dark"]:root  { color-scheme: dark; }
}

/* --- tokens-typography.css --- */
/* Typography tokens — web defaults (Inter Variable from Google Fonts).
   Desktop overrides are in tokens-desktop.css.

   Scale D — 8 stops. Semantic intent:
   - label (13px) = app's voice (chrome, UI labels, navigation, context)
   - body  (15px) = participant's voice (quote text, transcript segments)

   Archive of previous scale: tokens-typography-v1.css */

:root {
    /* Font family — Inter Variable loaded from Google Fonts (see index.html).
       Fallback chain: Segoe UI Variable (Win 11), Segoe UI (Win 10),
       system-ui, SF Pro (macOS), CJK families. */
    --bn-font-body: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system,
        "Hiragino Kaku Gothic ProN", "Hiragino Sans",   /* macOS Japanese */
        "Yu Gothic UI",                                  /* Windows Japanese */
        "Malgun Gothic",                                 /* Windows Korean */
        "Apple SD Gothic Neo",                           /* macOS Korean */
        "Noto Sans CJK JP", "Noto Sans CJK KR",         /* Linux CJK */
        sans-serif;
    /* One mono stack for both scales (docs/design-monospace-roles.md §4, §6). No "SF Mono" by
       name: it resolves only on Macs with Apple's developer download, so it made the developer's
       view differ from every researcher's. WebKit reaches the system SF Mono via ui-monospace;
       Chromium on a Mac has no ui-monospace and takes Menlo; Windows 11 Cascadia Mono, Windows 10
       Consolas; Linux DejaVu. The generic is last and reached nowhere measured: it is Courier in
       Chromium on a Mac and Courier New in Windows 10's Edge. */
    --bn-font-mono: ui-monospace, Menlo, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
    --bn-font-editorial: Georgia, "Times New Roman", serif;

    /* Font weight scale — tuned for variable fonts (Inter, SF Pro, Segoe UI Variable).
       On static fonts (Win 10 Segoe UI), 370/420→400 and 490→400 — acceptable degradation. */
    --bn-weight-light: 370;      /* subordinate text (sidebar nav links, secondary lists) */
    --bn-weight-normal: 420;     /* body text, descriptions, quote content */
    --bn-weight-emphasis: 490;   /* headings, labels, section titles */
    --bn-weight-starred: 520;    /* starred quotes — pop above emphasis, below strong */
    --bn-weight-semibold: 600;   /* a chosen word in a text-only switch (picker scope) */
    --bn-weight-strong: 700;     /* delete buttons, page title, action glyphs */

    /* Icon stroke = the stem of the text beside it, as a fraction of the font size
       (docs/design-icon-system.md § Weight; measured on Inter and SF Pro, which agree
       to 2%). A context set in a heavier weight sets --bn-icon-stem beside its
       font-weight. No light value: the SPA's Inter is served 400..700, so 370 renders 400. */
    --bn-icon-stem-normal: 0.092;
    --bn-icon-stem-emphasis: 0.106;
    --bn-icon-stem-starred: 0.111;
    --bn-icon-stem-semibold: 0.127;
    --bn-icon-stem-strong: 0.146;
    --bn-icon-stem: var(--bn-icon-stem-normal);

    /* Monospace weights — three values, chosen against measured rendering on every face the
       stack reaches (docs/design-monospace-roles.md §6). 400–490 is Regular in Menlo, Consolas
       and Cascadia Mono and varies only in SF Mono; Windows matches the nearest weight, so
       Consolas turns Bold at 550 and Cascadia SemiBold at 500. */
    --bn-weight-mono: 400;          /* every mono role at rest */
    --bn-weight-mono-tag: 460;      /* tags, light appearance: SF Mono +9%, Regular elsewhere; 400 in dark (below) */
    --bn-weight-mono-emphasis: 560; /* the one step up (a path that names the screen): Bold in Menlo and Consolas */

    /* Typography scale — 8 stops, size + line-height pairs.
       Line-height decreases as size increases (Bringhurst principle:
       large letterforms provide visual anchoring, need less leading). */
    --bn-text-micro:       0.6rem;      /* 9.6px  — delete ×, confidence badges */
    --bn-text-micro-lh:    1.2;
    --bn-text-badge:       0.72rem;     /* 11.5px — badges, group headers, tag counts */
    --bn-text-badge-lh:    1.3;
    --bn-text-caption:     0.75rem;     /* 12px   — footnotes, footer, modal footer, kbd */
    --bn-text-caption-lh:  1.4;
    --bn-text-label:       0.8125rem;   /* 13px   — toolbar, filters, context, timecodes (app voice) */
    --bn-text-label-lh:    1.45;
    --bn-text-body:        0.9375rem;   /* 15px   — quote text, transcript segments (participant voice) */
    --bn-text-body-lh:     1.5;
    --bn-text-heading:     1.125rem;    /* 18px   — section headings, h3, modal titles */
    --bn-text-heading-lh:  1.3;
    --bn-text-title:       1.375rem;    /* 22px   — page titles, h2, logotype */
    --bn-text-title-lh:    1.25;
    --bn-text-display:     1.75rem;     /* 28px   — report h1 */
    --bn-text-display-lh:  1.2;

    /* Signal card finding hierarchy. The title is a compact app heading;
       the claim is the generous editorial statement beneath it. */
    --bn-text-signal-title: 0.9375rem;
    --bn-text-signal-title-lh: 1.5;
    --bn-track-signal-title: 0;
    --bn-weight-signal-title: var(--bn-weight-strong);
    --bn-text-signal-claim: 1.29375rem;
    --bn-text-signal-claim-lh: 1.4;
    --bn-track-signal-claim: -0.005em;
    --bn-weight-signal-claim: 500;
}

/* Tags drop to Regular in the dark appearance: light text on a dark tint already reads heavier,
   and dark tags measure 6.2–9.3:1 against light's 3.1–5.2:1 (docs/design-monospace-roles.md).
   font-weight cannot follow light-dark(), so the token follows the two scopes the palettes use. */
[data-theme="dark"] {
    --bn-weight-mono-tag: var(--bn-weight-mono);
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bn-weight-mono-tag: var(--bn-weight-mono);
    }
}

/* --- tokens-desktop.css --- */
/* Desktop typography overrides — SF Pro for macOS native feel.
   Active when data-platform="desktop" is set on <html> AND the user hasn't
   opted back to Inter. The macOS app sets data-platform via
   BRISTLENOSE_PLATFORM=desktop; the Appearance ▸ Typography setting writes
   BRISTLENOSE_TYPOGRAPHY, and "inter" makes the server emit
   data-typography="inter" — which this block's :not() excludes, so the cascade
   falls back to :root (Inter). On web/CLI neither var is set, so this never
   matches: SF Pro is licensed for Apple platforms only, Inter ships everywhere.

   SF Pro is a system font on macOS — no download needed.
   SF Pro Text is optimised for body sizes (<20pt), SF Pro Display for headings (≥20pt).
   -apple-system resolves to SF Pro automatically on macOS.

   Scale — calibrated against the live macOS AppKit ladder via the Type Parity
   Inspector (Debug ▸ Type Parity Inspector), macOS 26.4.1 @2x, Color LCD. Each
   bn stop is width-matched to its measured native style (Δ ≈ 0px), so the labels
   below are the *real* macOS styles (the old "Apple callout = 15px" label was
   wrong — callout is 12pt):
   - micro:   caption2     (10px)
   - badge:   subheadline  (11px)
   - caption: callout      (12px)
   - label:   body         (13px)  — app voice
   - body:    title3       (15px)  — participant voice (quotes + transcript)
   - heading: title2       (17px)
   - title:   title1       (22px)
   - display: largeTitle   (26px)

   Line-heights are Apple's absolute leadings expressed as size-relative ratios,
   except body — loosened slightly by eye (1.4) for reading comfort. --bn-track-* carries Apple's per-size
   tracking — empirically ≈0 across this range (only micro is non-zero), and
   currently unconsumed (no letter-spacing wired yet). Sizes are kept in rem so
   they still honour the user's root font-size; the px in each comment is the
   value at the default 16px root (the condition this was calibrated under).
   Re-true on a different scale/colour profile. Archive: tokens-desktop-v1.css */

[data-platform="desktop"]:not([data-typography="inter"]) {
    /* Font family — SF Pro via -apple-system, no Google Fonts needed */
    --bn-font-body: -apple-system, "SF Pro Text", "SF Pro", system-ui,
        "Hiragino Kaku Gothic ProN", "Hiragino Sans",
        sans-serif;
    /* No --bn-font-mono override: the :root stack reaches the system SF Mono via ui-monospace. */

    --bn-text-micro:       0.625rem;    /* 10px  — macOS caption2 */
    --bn-text-micro-lh:    1.300;
    --bn-track-micro:      0.013em;
    --bn-text-badge:       0.6875rem;   /* 11px  — macOS subheadline */
    --bn-text-badge-lh:    1.273;
    --bn-track-badge:      0;
    --bn-text-caption:     0.75rem;     /* 12px  — macOS callout */
    --bn-text-caption-lh:  1.250;
    --bn-track-caption:    0;
    --bn-text-label:       0.8125rem;   /* 13px  — macOS body */
    --bn-text-label-lh:    1.231;
    --bn-track-label:      0;
    --bn-text-body:        0.9375rem;   /* 15px  — macOS title3 */
    --bn-text-body-lh:     1.4;         /* looser than title3's 1.333 — tuned by eye in the stress-bench for reading comfort (participant voice) */
    --bn-track-body:       0;
    --bn-text-heading:     1.0625rem;   /* 17px  — macOS title2 */
    --bn-text-heading-lh:  1.294;
    --bn-track-heading:    0;
    --bn-text-title:       1.375rem;    /* 22px  — macOS title1 */
    --bn-text-title-lh:    1.182;
    --bn-track-title:      0;
    --bn-text-display:     1.625rem;    /* 26px  — macOS largeTitle */
    --bn-text-display-lh:  1.231;
    --bn-track-display:    0;

    /* Weight scale — SF Pro optical weights at same numeric values.
       No change needed — Inter and SF Pro share the weight axis range. */
}

/* --- colors/palette-default.css --- */
/* palette-default — Bristlenose's standard blue/grey colour theme.
   This is the web-mode default palette, loaded as :root fallback.
   Tokens defined here are overridden by any active [data-color-theme] palette.

   To create a new theme: copy this file, change the selector to
   [data-color-theme="your-theme"], and remap every token.
   See _contract.css for the full list of required tokens. */

:root,
[data-color-theme="default"] {
    /* Colour palette */
    --bn-colour-bg: #ffffff;
    --bn-colour-text: #1a1a1a;
    --bn-colour-muted: #6b7280;
    --bn-colour-border: #e5e7eb;
    --bn-colour-accent: #007aff;
    --bn-colour-hover: #e8f0fe;
    --bn-colour-inspector-bg: #f9f9fa;          /* Inspector chrome — Xcode Tahoe's flat inspector tint (~2% off white) */

    /* Semantic surfaces */
    --bn-colour-quote-bg: #f9fafb;
    --bn-colour-paper: #f6f7f8;                 /* Transcript ground: a cool neutral, 1.07:1 under the sheet */
    --bn-colour-sheet: #ffffff;                 /* A quote lifted off the paper */
    --bn-colour-badge-bg-paper: #ebedf0;        /* Badges on the paper (#f3f4f6 vanishes there) */
    --bn-colour-badge-bg: #f3f4f6;
    --bn-colour-badge-text: #374151;
    --bn-colour-user-tag-bg: #f3f4f6;
    --bn-colour-user-tag-text: #4b5563;
    --bn-colour-crop-bg: #fffbe6;
    --bn-crop-handle-colour: #c4850a;
    --bn-crop-handle-hover: #a06d08;
    --bn-colour-active-bg: #f0fdf4;
    --bn-colour-highlight: #fef08a;

    /* Destructive action */
    --bn-colour-negative: #dc2626;

    /* Success and caution — the other two semantic kinds */
    --bn-colour-positive: #16a34a;
    --bn-colour-warning: #f59e0b;

    /* Playback-sync glow */
    --bn-glow-colour: rgba(0, 122, 255, 0.06);
    --bn-glow-colour-strong: rgba(0, 122, 255, 0.11);

    /* Minimap */
    --bn-minimap-quote: #e5e7eb;
    --bn-minimap-heading: #b0b5bd;
    --bn-minimap-viewport-bg: rgba(0, 122, 255, 0.15);
    --bn-minimap-viewport-border: rgba(0, 122, 255, 0.3);

    /* Transcript coverage bar */
    --bn-coverage-report: #93b4f4;
    --bn-coverage-moderator: #d97706;
    --bn-coverage-omitted: #d1d5db;

    /* Group card background tints */
    --bn-group-none: #f9fafb;

    /* Micro histogram bar — neutral */
    --bn-bar-none: #d1d5db;

    /* Interactive elements */
    --bn-colour-border-hover: #d1d5db;
    --bn-colour-icon-idle: #c9ccd1;
    --bn-colour-starred: #999;
    --bn-colour-shadow: rgba(0, 0, 0, 0.1);

    /* Focus state */
    --bn-focus-shadow: 0 3px 12px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05);
    --bn-focus-ring: 0 0 0 2px rgba(0, 122, 255, 0.12);

    /* Hover backgrounds */
    --bn-hover-bg: rgba(0, 0, 0, 0.04);
    --bn-hover-bg-subtle: rgba(0, 0, 0, 0.03);

    /* Selection state */
    --bn-selection-bg: #eef4fc;
    --bn-selection-border: #007aff;
    --bn-selection-bg-inactive: #e5e7eb;
    --bn-selection-border-inactive: #9ca3af;
    /* Sidebar nav selected-row capsule — NSColor unemphasizedSelectedContentBackgroundColor,
       sampled (no canonical Apple hex; dynamic + vibrant composite). Re-sample at OS bumps. */
    --bn-nav-selection-bg: #efefef;

    /* Sidebar overlay */
    --bn-overlay-shadow: 4px 0 16px rgba(0, 0, 0, 0.08);

    /* Legacy aliases */
    --bn-colour-suggestion: #007aff;
    --bn-colour-suggestion-bg: #eff6ff;
}

/* Dark mode — uses light-dark() with the color-scheme property.
   Browsers without light-dark() support (~13%) fall back to the
   plain light values above. */

@supports (color: light-dark(#000, #fff)) {
    :root,
    [data-color-theme="default"] {
        /* Colour palette */
        --bn-colour-bg:               light-dark(#ffffff, #1c1c1c);   /* Dark: the paper, the darkest surface of the ladder (10 L*). Everything else steps away from it: quote cards, then inspector chrome, then the native sidebar */
        --bn-colour-text:             light-dark(#1a1a1a, #e5e7eb);
        --bn-colour-muted:            light-dark(#6b7280, #9ca3af);
        --bn-colour-border:           light-dark(#e5e7eb, #2d2d2d);
        --bn-colour-accent:           light-dark(#007aff, #0a84ff);
        --bn-colour-hover:            light-dark(#e8f0fe, #1e293b);
        --bn-colour-inspector-bg:     light-dark(#f9f9fa, #212121);   /* Inspector chrome — dark: one step up from the quote cards (12.7 L* against 11.8), neutral grey with no hue */

        /* Semantic surfaces */
        --bn-colour-quote-bg:         light-dark(#f9fafb, #1f1f1f);   /* Dark: lifted off the paper (1.5 L*) but below the inspector chrome */
        --bn-colour-paper:            light-dark(#f6f7f8, #1c1c1c);   /* Transcript ground; dark is the page itself */
        --bn-colour-sheet:            light-dark(#ffffff, #252525);   /* A quote lifted: 1.07:1 / 1.11:1 off the paper */
        --bn-colour-badge-bg-paper:   light-dark(#ebedf0, #252525);
        --bn-colour-badge-bg:         light-dark(#f3f4f6, #252525);
        --bn-colour-badge-text:       light-dark(#374151, #d1d5db);
        --bn-colour-user-tag-bg:      light-dark(#f3f4f6, #252525);
        --bn-colour-user-tag-text:    light-dark(#4b5563, #d1d5db);
        --bn-colour-crop-bg:          light-dark(#fffbe6, #2a2614);
        --bn-crop-handle-colour:      light-dark(#c4850a, #f0b830);
        --bn-crop-handle-hover:       light-dark(#a06d08, #f5cc60);
        --bn-colour-active-bg:        light-dark(#f0fdf4, #0f2918);
        --bn-colour-highlight:        light-dark(#fef08a, #854d0e);
        --bn-colour-cited-bg:         light-dark(#fef9c3, #3b2f05);

        /* Playback-sync glow */
        --bn-glow-colour:             light-dark(rgba(0, 122, 255, 0.06), rgba(10, 132, 255, 0.12));
        --bn-glow-colour-strong:      light-dark(rgba(0, 122, 255, 0.11), rgba(10, 132, 255, 0.2));

        /* Minimap */
        --bn-minimap-quote:           light-dark(#e5e7eb, #333333);
        --bn-minimap-heading:         light-dark(#b0b5bd, #555555);
        --bn-minimap-viewport-bg:     light-dark(rgba(0, 122, 255, 0.15), rgba(10, 132, 255, 0.2));
        --bn-minimap-viewport-border: light-dark(rgba(0, 122, 255, 0.3), rgba(10, 132, 255, 0.4));

        /* Transcript coverage bar */
        --bn-coverage-report:    light-dark(#93b4f4, #4a7ecf);
        --bn-coverage-moderator: light-dark(#d97706, #fbbf24);
        --bn-coverage-omitted:   light-dark(#d1d5db, #4b5563);

        /* Group card — neutral */
        --bn-group-none:      light-dark(#f9fafb, #1e1e1e);

        /* Micro histogram bar — neutral */
        --bn-bar-none:      light-dark(#d1d5db, #4b5563);

        /* Destructive action */
        --bn-colour-negative:         light-dark(#dc2626, #ef4444);

        /* Success and caution */
        --bn-colour-positive:         light-dark(#16a34a, #22c55e);
        --bn-colour-warning:          light-dark(#f59e0b, #fbbf24);

        /* Interactive elements */
        --bn-colour-border-hover:     light-dark(#d1d5db, #4b5563);
        --bn-colour-icon-idle:        light-dark(#c9ccd1, #595959);
        --bn-colour-starred:          light-dark(#999, #ccc);
        --bn-colour-shadow:           light-dark(rgba(0,0,0,0.1), rgba(0,0,0,0.4));

        /* Focus and selection */
        --bn-focus-ring:              0 0 0 2px light-dark(rgba(0, 122, 255, 0.12), rgba(10, 132, 255, 0.2));
        --bn-selection-bg:            light-dark(#eef4fc, #1a2838);
        --bn-selection-border:        light-dark(#007aff, #0a84ff);
        --bn-selection-bg-inactive:     light-dark(#e5e7eb, #262626);
        --bn-selection-border-inactive: light-dark(#9ca3af, #4b5563);
        --bn-nav-selection-bg:          light-dark(#efefef, #2b2b2b);

        /* Hover backgrounds */
        --bn-hover-bg:                light-dark(rgba(0,0,0,0.04), rgba(255,255,255,0.06));
        --bn-hover-bg-subtle:         light-dark(rgba(0,0,0,0.03), rgba(255,255,255,0.04));

        /* Legacy aliases (deprecated) */
        --bn-colour-suggestion:       light-dark(#007aff, #0a84ff);
        --bn-colour-suggestion-bg:    light-dark(#eff6ff, #111d2e);
    }
}

/* --- colors/palette-edo.css --- */
/* palette-edo — Edo-period Japanese art colour theme.
   Sampled from three artworks seen at the British Museum Samurai exhibition,
   1 Mar 2026. See docs/mockups/edo-colour-palette.html for source analysis.

   Pigments: rokusho (verdigris), sumi (iron-gall ink), cinnabar vermillion,
   bero-ai (Prussian blue), yellow ochre.

   Desktop default. Activate: data-color-theme="edo" on <html>.
   Env/CLI: BRISTLENOSE_PALETTE=edo or --palette edo (canonical; BRISTLENOSE_COLOR_THEME
   is the deprecated alias). Internal <html> attribute stays data-color-theme (glossary §Display settings).

   ── v1 decisions (Jul 2026) ──
   Accent uses Prussian blue's vivid UNDERTONE (#0f5c9e), not the dull masstone
   sampled off aged prints — that masstone reads too low-chroma for links/icons/selection.
   Dark accent is vivid blue (#4d9fe0), not verdigris. Background is bright Paper
   White (#fdfbf7). Body ink is passport navy (#1b2230 / #e8e3d6 dark).

   Alternatives considered — for future edo2/edo3 variants (explore in
   docs/mockups/edo-theme-studio.html):
     paper  — Snow White #fdfbf7, Warm off-white #f0e9d8, Washi Cream #ede5d1 (warmer/more washi)
     accent — masstone Prussian #0f5c9e, midpoint #164e80, electric #2a7ac0; dark verdigris #7ba8a0
     ink    — Sumi Black #1b2230 light / Sail Parchment #d4c9a8 dark; Moonlight #e4e6ea (cool dark ink)
   Known follow-up: warm surfaces (quote-bg #f0e9d8, hover #ede5d1, badge #e8dfc9)
   now read warmer against the brighter paper — revisit surface harmony next pass. */

[data-color-theme="edo"] {
    /* Colour palette — warm paper with indigo/verdigris accents */
    --bn-colour-bg: #fdfbf7;                    /* Paper White — bright near-white */
    --bn-colour-text: #1b2230;                   /* Passport navy — near-black, indigo whisper */
    --bn-colour-muted: #4a698a;                  /* Storm Slate — atmospheric grey-blue (AA 4.5:1 on paper + quote-bg) */
    --bn-colour-border: #d4c9a8;                 /* Sail Parchment — warm border */
    --bn-colour-accent: #0f5c9e;                 /* Vivid Prussian — bero-ai undertone */
    --bn-colour-hover: #ede5d1;                  /* Washi Cream tint — warm hover */
    --bn-colour-inspector-bg: #f7f2e6;           /* Inspector chrome — warm washi; the mirror of Xcode's #f9f9fa (Apple cools the neutral, Edo warms the paper). One notch off Paper White, lighter than quote-bg so it reads as chrome not content */

    /* Semantic surfaces */
    --bn-colour-quote-bg: #f0e9d8;              /* Warm off-white */
    --bn-colour-paper: #f7f2e6;                 /* Transcript ground: washi under Paper White */
    --bn-colour-sheet: #fdfbf7;                 /* A quote lifted: Paper White, 1.08:1 off the washi */
    --bn-colour-badge-bg-paper: #e8dfc9;        /* Edo's badge already reads on washi (1.19:1) */
    --bn-colour-badge-bg: #e8dfc9;              /* Parchment badge */
    --bn-colour-badge-text: #2d3654;            /* Court Indigo */
    --bn-colour-user-tag-bg: #e8dfc9;
    --bn-colour-user-tag-text: #3d4a5c;
    --bn-colour-crop-bg: #f5ecd0;               /* Gold Ochre tint */
    --bn-crop-handle-colour: #b5432a;           /* Vermillion */
    --bn-crop-handle-hover: #8b3a3a;            /* Bengara Red */
    --bn-colour-active-bg: #e8f0e4;             /* Pine Green tint */
    --bn-colour-highlight: #c4a96a;             /* Gold Ochre highlight */

    /* Destructive action — vermillion */
    --bn-colour-negative: #b5432a;

    /* Success — Pine Green (matsuba-iro), the hue active-bg already tints toward.
       Caution — Gold Ochre, deepened for legibility on paper. */
    --bn-colour-positive: #4a6b4a;
    --bn-colour-warning: #a8842c;

    /* Playback-sync glow — Prussian Blue based */
    --bn-glow-colour: rgba(15, 92, 158, 0.08);
    --bn-glow-colour-strong: rgba(15, 92, 158, 0.15);

    /* Minimap — warm parchment tones */
    --bn-minimap-quote: #d4c9a8;
    --bn-minimap-heading: #9e8b6e;
    --bn-minimap-viewport-bg: rgba(15, 92, 158, 0.12);
    --bn-minimap-viewport-border: rgba(15, 92, 158, 0.25);

    /* Transcript coverage bar */
    --bn-coverage-report: #5a7d9b;
    --bn-coverage-moderator: #c4a96a;
    --bn-coverage-omitted: #d4c9a8;

    /* Group card — neutral */
    --bn-group-none: #f0e9d8;

    /* Micro histogram bar — neutral */
    --bn-bar-none: #c4b898;

    /* Interactive elements */
    --bn-colour-border-hover: #b8ad91;
    --bn-colour-icon-idle: #b8ad91;
    --bn-colour-starred: #9e8b6e;
    --bn-colour-shadow: rgba(30, 20, 10, 0.12);

    /* Focus state */
    --bn-focus-shadow: 0 3px 12px rgba(30, 20, 10, 0.12), 0 0 0 1px rgba(30, 20, 10, 0.06);
    --bn-focus-ring: 0 0 0 2px rgba(15, 92, 158, 0.15);

    /* Hover backgrounds */
    --bn-hover-bg: rgba(30, 20, 10, 0.05);
    --bn-hover-bg-subtle: rgba(30, 20, 10, 0.03);

    /* Selection state — Prussian Blue */
    --bn-selection-bg: #e0e8f0;
    --bn-selection-border: #0f5c9e;
    --bn-selection-bg-inactive: #e8e2d4;
    --bn-selection-border-inactive: #b8ad91;
    /* Sidebar nav selected-row capsule — warm parchment grey (edo's native-grey analogue) */
    --bn-nav-selection-bg: #e6ddc9;

    /* Sidebar overlay */
    --bn-overlay-shadow: 4px 0 16px rgba(30, 20, 10, 0.10);

    /* Legacy aliases */
    --bn-colour-suggestion: #0f5c9e;
    --bn-colour-suggestion-bg: #e0e8f0;
}

/* Dark mode — Sumi Black bg, warm parchment text */

@supports (color: light-dark(#000, #fff)) {
    [data-color-theme="edo"] {
        /* Colour palette */
        --bn-colour-bg:               light-dark(#fdfbf7, #1a1816);

        /* Semantic surfaces */

        --bn-colour-crop-bg:          light-dark(#f5ecd0, #2d2614);
        --bn-crop-handle-colour:      light-dark(#b5432a, #e06a4a);

        --bn-colour-active-bg:        light-dark(#e8f0e4, #1a2818);
        --bn-colour-highlight:        light-dark(#c4a96a, #6b5528);
        --bn-colour-cited-bg:         light-dark(#f5ecd0, #3b3010);

        /* Playback-sync glow */
        --bn-glow-colour:             light-dark(rgba(15, 92, 158, 0.08), rgba(77, 159, 224, 0.10));
        --bn-glow-colour-strong:      light-dark(rgba(15, 92, 158, 0.15), rgba(77, 159, 224, 0.18));

        /* Minimap */
        --bn-minimap-quote:           light-dark(#d4c9a8, #2d2820);
        --bn-minimap-heading:         light-dark(#9e8b6e, #4a4030);
        --bn-minimap-viewport-bg:     light-dark(rgba(15, 92, 158, 0.12), rgba(77, 159, 224, 0.15));
        --bn-minimap-viewport-border: light-dark(rgba(15, 92, 158, 0.25), rgba(77, 159, 224, 0.3));

        /* Transcript coverage bar */
        --bn-coverage-report:    light-dark(#5a7d9b, #4a6a80);
        --bn-coverage-moderator: light-dark(#c4a96a, #a08848);
        --bn-coverage-omitted:   light-dark(#d4c9a8, #3d3830);

        /* Group card — neutral */
        --bn-group-none:      light-dark(#f0e9d8, #211e18);

        /* Micro histogram bar — neutral */
        --bn-bar-none:      light-dark(#c4b898, #4a4030);

        /* Destructive action — vermillion */
        --bn-colour-negative:         light-dark(#b5432a, #e06a4a);

        /* Success — Pine Green; caution — Gold Ochre */
        --bn-colour-positive:         light-dark(#4a6b4a, #7fa87f);
        --bn-colour-warning:          light-dark(#a8842c, #c4a96a);

        /* Interactive elements */
        --bn-colour-border-hover:     light-dark(#b8ad91, #4a4030);
        --bn-colour-icon-idle:        light-dark(#b8ad91, #4a4030);
        --bn-colour-starred:          light-dark(#9e8b6e, #b8a880);
        --bn-colour-shadow:           light-dark(rgba(30,20,10,0.12), rgba(0,0,0,0.4));

        /* Focus and selection */
        --bn-focus-ring:              0 0 0 2px light-dark(rgba(15, 92, 158, 0.15), rgba(77, 159, 224, 0.2));
        --bn-selection-bg:            light-dark(#e0e8f0, #1e2830);
        --bn-selection-border:        light-dark(#0f5c9e, #4d9fe0);
        --bn-selection-bg-inactive:     light-dark(#e8e2d4, #26231d);
        --bn-selection-border-inactive: light-dark(#b8ad91, #4a4030);
        --bn-nav-selection-bg:          light-dark(#e6ddc9, #2d2922);

        --bn-hover-bg-subtle:         light-dark(rgba(30,20,10,0.03), rgba(212,201,168,0.04));

        /* Legacy aliases */
        --bn-colour-suggestion:       light-dark(#0f5c9e, #4d9fe0);
        --bn-colour-suggestion-bg:    light-dark(#e0e8f0, #1e2830);
    }
}

/* --- atoms/badge.css --- */
/* Atom: badge — base badge, sentiment variants, AI and user variants */

/* Every tag is one weight, separated from its kind by colour, not weight:
   --bn-weight-mono-tag, 460 in the light appearance and 400 in dark. It was 370
   (Light), which drew Light only on a Mac with Apple's SF Mono download and
   Regular almost everywhere else (docs/design-monospace-roles.md §6). */
.badge {
    display: inline-block;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    font-weight: var(--bn-weight-mono-tag);
    padding: var(--bn-space-xs) 0.45rem;
    border-radius: var(--bn-radius-sm);
    background: var(--bn-colour-badge-bg);
    color: var(--bn-colour-badge-text);
}

/* Sentiment variants (v0.7+ taxonomy) — see docs/academic-sources.html */
.badge-frustration { background: var(--bn-sentiment-frustration-bg); color: var(--bn-sentiment-frustration); }
.badge-confusion { background: var(--bn-sentiment-confusion-bg); color: var(--bn-sentiment-confusion); }
.badge-doubt { background: var(--bn-sentiment-doubt-bg); color: var(--bn-sentiment-doubt); }
.badge-surprise { background: var(--bn-sentiment-surprise-bg); color: var(--bn-sentiment-surprise); }
.badge-satisfaction { background: var(--bn-sentiment-satisfaction-bg); color: var(--bn-sentiment-satisfaction); }
.badge-delight { background: var(--bn-sentiment-delight-bg); color: var(--bn-sentiment-delight); }
.badge-confidence { background: var(--bn-sentiment-confidence-bg); color: var(--bn-sentiment-confidence); }

/* Legacy variants (deprecated — kept for backward compat with old intermediate JSON) */
.badge-suggestion { background: var(--bn-colour-suggestion-bg); color: var(--bn-colour-suggestion); }
.badge-frustrated { background: var(--bn-sentiment-frustration-bg); color: var(--bn-sentiment-frustration); }
.badge-delighted { background: var(--bn-sentiment-delight-bg); color: var(--bn-sentiment-delight); }
.badge-confused { background: var(--bn-sentiment-confusion-bg); color: var(--bn-sentiment-confusion); }
.badge-amused { background: var(--bn-sentiment-delight-bg); color: var(--bn-sentiment-delight); }
.badge-critical { background: var(--bn-sentiment-frustration-bg); color: var(--bn-sentiment-frustration); }
.badge-sarcastic { background: var(--bn-colour-badge-bg); color: var(--bn-colour-badge-text); }
.badge-judgment { background: var(--bn-colour-badge-bg); color: var(--bn-colour-badge-text); }
.badge-narration { background: var(--bn-colour-badge-bg); color: var(--bn-colour-badge-text); }
.badge-task_management { background: var(--bn-colour-badge-bg); color: var(--bn-colour-badge-text); }

/* AI badge — deletable on hover */
.badge-ai {
    cursor: pointer;
    position: relative;
    transition: opacity var(--bn-transition-fast);
}

.badge-ai:hover {
    opacity: 0.8;
}

/* Delete circle — white floating chip with a red ×. The React badge draws the ×
   as an icon (.badge-ai-delete, Badge.tsx); the ::after draws it as a character
   for the frozen static report, and steps aside when the element is present.
   Both share one box. */
.badge-ai::after,
.badge-ai-delete {
    position: absolute;
    top: calc(-0.3rem - 1px);
    right: calc(-0.3rem - 1px);
    width: calc(0.875rem + 0.5px);   /* ~14.5px */
    height: calc(0.875rem + 0.5px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: var(--bn-colour-bg);
    color: var(--bn-colour-negative);
    border-radius: 50%;
    font-size: var(--bn-text-micro);
    font-weight: var(--bn-weight-strong);
    --bn-icon-stem: var(--bn-icon-stem-strong);  /* its icon follows the text weight */
    line-height: 1;
    opacity: 0;
    transition: opacity var(--bn-transition-fast);
    pointer-events: none;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.16), 0 0 1px rgba(0, 0, 0, 0.06);
}

.badge-ai::after {
    content: "\00d7";
}

.badge-ai:has(> .badge-ai-delete)::after {
    content: none;
}

.badge-ai:hover::after,
.badge-ai:hover .badge-ai-delete {
    opacity: 1;
}

/* User tag — mode-dependent treatment.
   Light mode: dark text on washed codebook bg (pale tint).
   Dark mode: white text on saturated codebook bg.
   Background colour set via inline style from codebook.js.
   Falls back to --bn-colour-user-tag-bg when no codebook colour assigned. */
.badge-user {
    background: var(--bn-colour-user-tag-bg);
    color: var(--bn-colour-text);
    cursor: default;
    position: relative;
}

/* Dark mode: user tags switch to white-on-saturated */
@supports (color: light-dark(#000, #fff)) {
    [data-theme="dark"] .badge-user {
        color: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .badge-user {
            color: #ffffff;
        }
    }
}

/* AI tag visibility toggle */
body.hide-ai-tags .badge-ai { display: none; }

.badge-user .badge-delete {
    position: absolute;
    top: calc(-0.3rem - 1px);
    right: calc(-0.3rem - 1px);
    width: calc(0.875rem + 0.5px);   /* ~14.5px */
    height: calc(0.875rem + 0.5px);
    background: var(--bn-colour-bg);
    border: none;
    border-radius: 50%;
    color: var(--bn-colour-negative);
    font-size: var(--bn-text-micro);
    font-weight: var(--bn-weight-strong);
    --bn-icon-stem: var(--bn-icon-stem-strong);  /* its icon follows the text weight */
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity var(--bn-transition-fast);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    pointer-events: none;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.16), 0 0 1px rgba(0, 0, 0, 0.06);
}

.badge-user:hover .badge-delete {
    opacity: 1;
    pointer-events: auto;
}

/* Add-tag ghost button */
.badge-add {
    border: 1px dashed var(--bn-colour-border);
    background: transparent;
    color: var(--bn-colour-muted);
    cursor: pointer;
    transition: border-color var(--bn-transition-fast), color var(--bn-transition-fast);
    user-select: none;
}

.badge-add:hover {
    border-color: var(--bn-colour-accent);
    color: var(--bn-colour-accent);
}

/* Proposed badge — pulsating dashed border (AutoCode) */
@keyframes bn-proposed-pulse {
    0%   { opacity: 0.50; }
    50%  { opacity: 0.78; }
    100% { opacity: 0.50; }
}

.badge-proposed {
    animation: bn-proposed-pulse 3s ease-in-out infinite;
    border: 1px dashed currentColor;
    cursor: pointer;
    position: relative;
}

.badge-proposed:hover {
    animation: none;
    opacity: 1 !important;
}

/* Action pill — floating [✗ | ✓] bar at badge top-right.
   ✗ (deny) anchored at delete-circle position, ✓ (accept) hangs right.
   16px compartments, pill-shaped, appears on hover. */
.badge-action-pill {
    position: absolute;
    top: calc(-0.3rem - 1px);              /* same vertical as delete × */
    right: calc(-0.3rem - 1px - 1rem);     /* ✗ aligns with delete × position,
                                              ✓ extends past badge right edge */
    display: flex;
    gap: 0;
    background: var(--bn-colour-bg);
    border-radius: var(--bn-radius-pill);   /* clamps to half-height; survives a height change */
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.16), 0 0 1px rgba(0, 0, 0, 0.06);
    opacity: 0;
    transition: opacity var(--bn-transition-fast);
    pointer-events: none;
    overflow: hidden;
    z-index: 1;                              /* sit above adjacent badges */
}

.badge-proposed:hover .badge-action-pill,
.badge-proposed:focus-within .badge-action-pill {
    opacity: 1;
    pointer-events: auto;
}

.badge-action-deny,
.badge-action-accept {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1rem;       /* 16px */
    height: 1rem;
    font-size: var(--bn-text-micro);
    font-weight: var(--bn-weight-strong);
    --bn-icon-stem: var(--bn-icon-stem-strong);  /* its icon follows the text weight */
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 0;
    transition: background var(--bn-transition-fast);
}

.badge-action-deny {
    color: var(--bn-colour-negative);
}

.badge-action-accept {
    color: var(--bn-colour-positive);
    border-left: 1px solid var(--bn-colour-border);
}

.badge-action-deny:hover { background: #fef2f2; }
.badge-action-accept:hover { background: #dcfce7; }

/* Keyboard focus ring — inset (outline-offset negative) because the pill has
   overflow:hidden, which would clip an outset ring on these 16px buttons. */
.badge-action-deny:focus-visible,
.badge-action-accept:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -2px;
}

/* Dark mode: pill and action compartments */
@supports (color: light-dark(#000, #fff)) {
    [data-theme="dark"] .badge-action-pill {
        background: var(--bn-colour-bg);
    }
    [data-theme="dark"] .badge-action-deny:hover {
        background: rgba(220, 38, 38, 0.25);
        color: #f87171;
    }
    [data-theme="dark"] .badge-action-accept:hover {
        background: rgba(22, 163, 74, 0.25);
        color: #4ade80;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .badge-action-pill {
            background: var(--bn-colour-bg);
        }
        :root:not([data-theme="light"]) .badge-action-deny:hover {
            background: rgba(220, 38, 38, 0.25);
            color: #f87171;
        }
        :root:not([data-theme="light"]) .badge-action-accept:hover {
            background: rgba(22, 163, 74, 0.25);
            color: #4ade80;
        }
    }
}

/* Accept flash — brief brightness burst when a proposed tag is accepted.
   Applied by React (QuoteCard) on the new user badge for ~400ms. */
@keyframes badge-accept-flash {
    0%   { filter: brightness(1.35); }
    100% { filter: brightness(1); }
}

.badge-accept-flash {
    animation: badge-accept-flash 0.4s ease-out;
}

/* Badge animations */
@keyframes badge-fade-out {
    to { opacity: 0; transform: scale(0.8); }
}

.badge-removing {
    animation: badge-fade-out 0.15s ease-out forwards;
    pointer-events: none;
}

@keyframes badge-fade-in {
    from { opacity: 0; transform: scale(0.8); }
    to   { opacity: 1; transform: scale(1); }
}

.badge-appearing {
    animation: badge-fade-in 0.15s ease-out;
}

/* Bulk-tag flash — asymmetric highlight (0.2s in, 0.6s hold+out).
   Uses box-shadow spread to avoid overriding codebook background colour. */
@keyframes badge-bulk-flash {
    0%   { box-shadow: 0 0 0 0 var(--bn-selection-border); }
    25%  { box-shadow: 0 0 0 3px var(--bn-selection-border); }
    100% { box-shadow: 0 0 0 0 var(--bn-selection-border); }
}

.badge-bulk-flash {
    animation: badge-bulk-flash 0.8s ease-out;
}

/* "New" material marker — a body-sized highlighter shown inline after a
   section/theme title (Phase 3, 3c).  Placeholder styling; click to dismiss
   (it evaporates, no undo — it has served its purpose once noticed). */
.bn-new-badge {
    display: inline;
    margin-left: 0.4rem;
    padding: 0.05em 0.3em;
    border: none;
    border-radius: var(--bn-radius-sm);
    background: var(--bn-colour-new-highlight);
    color: var(--bn-colour-new-highlight-text);
    font-family: inherit;
    font-size: var(--bn-text-body);
    font-weight: var(--bn-weight-emphasis);
    line-height: 1;
    cursor: pointer;
    vertical-align: baseline;
}
.bn-new-badge:hover { filter: brightness(0.95); }
.bn-new-badge:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: 1px;
}

/* --- atoms/icon.css --- */
/* Atom: icon — Lucide glyphs drawn by `components/Icon.tsx`.
   One em square by default, sitting on the text it accompanies.

   Stroke is the stem of that text, never under a pixel: em resolves against the
   text the icon sits in, so a 15 px label draws a heavier line than a 13 px one,
   and a context in a heavier weight sets --bn-icon-stem (tokens-typography.css).
   This beats Lucide's stroke-width="2" attribute; `nonScalingStroke` keeps the
   width in screen pixels at any box size (docs/design-icon-system.md § Weight). */

.bn-icon {
    display: inline-block;
    flex: none;
    stroke-width: max(1px, calc(var(--bn-icon-stem) * 1em));
}

/* The default box, at zero specificity: a control that sizes its own icon
   (`.bn-tp-nav svg { width: 6px }`) wins, and an icon given `px` keeps the
   width/height attributes it was drawn with. */
:where(.bn-icon:not(.bn-icon--px)) {
    width: 1em;
    height: 1em;
}
:where(.bn-icon) {
    vertical-align: -0.125em;
}

/* A menu's check gutter: the tick sized to the row's text, about 9 px of
   visible check at a 13 px label. Used by the person picker, the Export
   menu and the search token menu, so the web app has one tick (owner,
   6 Oct 2026; design-people.md §J8.8). Lucide's check fills two thirds of
   its box, so 1em keeps the ~9 px the improvised 0.9em tick drew. */
.bn-icon--menu {
    width: 1em;
    height: 1em;
    vertical-align: -0.125em;
}

/* --- atoms/button.css --- */
/* Atom: button — edit-pencil, badge-restore, toolbar-btn
   (star-btn, hide-btn, toolbar-btn-toggle moved to atoms/toggle.css) */

/* The pencil is HIDDEN AT REST and revealed by hovering its host.
 *
 * It used to be permanently visible at `--bn-colour-icon-idle`, which is two
 * separate mistakes. The first is semantic: that token is defined in
 * `colors/_contract.css` as "Disabled/idle icon colour", and this is a live
 * control. The second is that there was no disclosure ramp at all — the only
 * `:hover` rule was on the pencil ITSELF, so hovering the heading did nothing
 * and the sole state change in the control required the pointer to already be
 * on a ~13px glyph rendering at 1.24:1 (light) / 1.44:1 (dark) median ink,
 * measured. You had to find an invisible target to discover it was there.
 *
 * So: nothing at rest, `--bn-colour-muted` on host hover (4.83:1 / 7.44:1),
 * accent on its own hover. The APPEARANCE is the discoverability signal —
 * motion reads faster than any static contrast bump — and the heading stops
 * carrying a permanent speck that serves nobody until hovered.
 *
 * This is not a new pattern: `.hide-btn` (atoms/toggle.css) and
 * `.bn-name-pencil` (molecules/person-badge.css) already ship it. `.star-btn`
 * deliberately does NOT adopt it — a star is a state display as well as a
 * control, so a starred quote must read as starred without hovering.
 */
.edit-pencil {
    position: absolute;
    top: 0.65rem;
    right: 3.35rem;
    background: none;
    border: none;
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    cursor: pointer;
    padding: var(--bn-space-xs);
    line-height: 1;
    opacity: 0;
    transition: opacity var(--bn-transition-fast), color var(--bn-transition-normal);
}

/* Revealed by hovering WHATEVER CONTAINS IT. Written parent-agnostically
   rather than as an enumeration, because the pencil has four hosts already
   (`h3`, `p.description`, the toc `<li>`, and `blockquote.quote-card`) and a
   fifth should not need an edit here. The pencil is a direct child in every
   one of them, so `:hover >` is exact — and at (0,2,0) it outranks the
   `.edit-pencil` base rule without `!important`.

   `:focus-visible` is load-bearing, not politeness: an `opacity: 0` button is
   still in the tab order, so without it a keyboard user would land on an
   invisible control. */
:hover > .edit-pencil,
.edit-pencil:focus-visible {
    opacity: 1;
}

.edit-pencil:hover {
    color: var(--bn-colour-accent);
}

/* Baseline-align the SVG the SPA renders — same idiom as `.toolbar-icon-svg`
   below. The static renderer still emits U+270E as text and ignores this. */
.edit-pencil svg {
    vertical-align: -0.15em;
}

/* A hover-reveal is unreachable where there is no hover. The report is a
   desktop tool, but a touch visitor must not simply lose the control. */
@media (hover: none) {
    .edit-pencil {
        opacity: 1;
    }
}

.edit-pencil-inline {
    position: static;
    display: inline;
    margin-left: 0.4em;
    vertical-align: baseline;
    font-size: 0.75em;
}

.badge-restore {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--bn-colour-muted);
    font-size: var(--bn-text-label);
    cursor: pointer;
    padding: 0.1rem 0.25rem;
    line-height: 1;
    transition: color var(--bn-transition-fast);
    flex-shrink: 0;
}

.badge-restore:hover {
    color: var(--bn-colour-accent);
}

/* .toolbar-btn — round-rect button used for all toolbar controls.
   Tokens: bg, border, border-hover, quote-bg, text, muted, accent.
   Variants:
     default       — Codebook, Copy CSV, Export names (icon + label)
     dropdown      — Tag filter, View switcher (icon + label + arrow)
     toggle        — .toolbar-btn-toggle: active/inactive binary state
   Child elements:
     .toolbar-icon     — emoji/text icon (0.95rem, muted)
     .toolbar-icon-svg — SVG icon (muted, baseline-aligned)
     .toolbar-arrow    — dropdown chevron SVG (muted, right side) */
.toolbar-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--bn-space-sm);
    background: var(--bn-colour-bg);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-md);
    padding: 0.4rem 0.85rem;
    font-family: var(--bn-font-body);
    font-size: var(--bn-text-label);
    color: var(--bn-colour-text);
    cursor: pointer;
    transition: background var(--bn-transition-fast), border-color var(--bn-transition-fast);
}

.toolbar-btn:hover {
    background: var(--bn-colour-quote-bg);
    border-color: var(--bn-colour-border-hover);
}

.toolbar-btn:disabled {
    opacity: 0.5;
    cursor: default;
}

.toolbar-btn:disabled:hover {
    background: var(--bn-colour-bg);
    border-color: var(--bn-colour-border);
}

.bn-refresh-icon-spin {
    animation: bn-refresh-spin 0.8s linear infinite;
    transform-origin: center;
}

@keyframes bn-refresh-spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
    .bn-refresh-icon-spin { animation: none; }
}

.toolbar-btn .toolbar-icon {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
}

.toolbar-btn .toolbar-icon-svg {
    color: var(--bn-colour-muted);
    vertical-align: -0.15em;
}

.toolbar-btn .toolbar-arrow {
    color: var(--bn-colour-muted);
    vertical-align: -0.05em;
    flex-shrink: 0;
    margin-left: -0.1rem;
}

/* --- atoms/toggle.css --- */
/* Atom: toggle — on/off icon buttons (star, hide, toolbar toggle) */

.star-btn {
    position: absolute;
    top: 0.65rem;
    right: 0.65rem;
    background: none;
    border: none;
    font-size: var(--bn-text-label);
    color: var(--bn-colour-icon-idle);
    cursor: pointer;
    padding: var(--bn-space-xs);
    line-height: 1;
    transition: color var(--bn-transition-normal);
}

.star-btn:hover {
    color: var(--bn-colour-accent);
}

/* ── Hide button on quote card ─────────────────────────────────────────── */

.hide-btn {
    position: absolute;
    top: 0.65rem;
    right: 2rem;
    background: none;
    border: none;
    font-size: var(--bn-text-label);
    color: var(--bn-colour-icon-idle);
    cursor: pointer;
    padding: var(--bn-space-xs);
    line-height: 1;
    transition: color var(--bn-transition-normal), opacity var(--bn-transition-normal);
    opacity: 0;
}

.quote-card:hover .hide-btn,
.quote-card.bn-focused .hide-btn {
    opacity: 1;
}

.hide-btn:hover {
    color: var(--bn-colour-accent);
}

.hide-btn svg {
    display: block;
}

/* ── Toolbar toggle variant ─────────────────────────────────────────────── */

.toolbar-btn-toggle {
    user-select: none;
}

.toolbar-btn-toggle.active {
    background: var(--bn-colour-quote-bg);
    border-color: var(--bn-colour-accent);
    color: var(--bn-colour-accent);
}

.toolbar-btn-toggle:not(.active) {
    color: var(--bn-colour-muted);
}

/* --- atoms/input.css --- */
/* Atom: input — tag-input with inline ghost text */

.tag-input-box {
    position: relative;
    display: inline-block;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    padding: var(--bn-space-xs) 0.4rem;
    /* The tinted-ground field, in border form — this chip already has a box,
       so it needs no outline. See the inline-edit block in tokens.css. */
    border: 1px solid var(--bn-field-edit-edge);
    border-radius: var(--bn-field-edit-radius);
    background: var(--bn-field-edit-fill-on-tint);
    min-width: 3rem;
}

.tag-input {
    position: relative;
    font-family: inherit;
    font-size: inherit;
    border: none;
    outline: none;
    background: transparent;
    color: var(--bn-colour-text);
    padding: 0;
    width: 100%;
    min-width: 0;
    z-index: 1;
    caret-color: var(--bn-colour-text);
}

.tag-input::placeholder {
    color: var(--bn-colour-muted);
}

/* Ghost layer overlays the input, showing completion after typed text */
.tag-ghost-layer {
    position: absolute;
    top: var(--bn-space-xs);
    left: 0.4rem;
    right: 0.4rem;
    display: flex;
    pointer-events: none;
    user-select: none;
    white-space: pre;
    overflow: hidden;
}

.tag-ghost-spacer {
    /* Invisible text matching input value — pushes ghost to the right */
    color: transparent;
}

.tag-ghost {
    color: var(--bn-colour-muted);
}

.tag-sizer {
    position: absolute;
    visibility: hidden;
    height: 0;
    overflow: hidden;
    white-space: pre;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    padding: 0 0.4rem;
}

/* --- atoms/toast.css --- */
/* Atom: toast — clipboard notification */

.clipboard-toast {
    position: fixed;
    bottom: 90px;
    right: var(--bn-space-lg);
    background: var(--bn-colour-text);
    color: var(--bn-colour-bg);
    padding: 0.6rem 1.2rem;
    border-radius: var(--bn-radius-lg);
    font-size: var(--bn-text-label);
    opacity: 0;
    transform: translateY(0.5rem);
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: var(--bn-toast-z);  /* above an open dialog: a failed Apply's toast must be read */
    pointer-events: none;
}

.clipboard-toast.show {
    opacity: 1;
    transform: translateY(0);
}

/* ── Kinded toast ─────────────────────────────────────────────────────────
   The message-kind vocabulary (bristlenose/ui_kinds.py, mirrored in
   frontend/src/utils/messageKind.ts); a toast draws four of the five, `skipped`
   as info. Optional: a bare confirmation like "Copied" carries no state and
   gets no icon.

   Colours are the semantic palette tokens, not literals. Before 30 Aug 2026
   the sibling .autocode-toast reached for --bn-colour-success and
   --bn-colour-danger, which were defined nowhere — so its tick and cross
   rendered in the toast's ordinary text colour. See tests/test_theme_token_
   resolution.py, which now fails on any no-fallback use of an undefined token. */
.clipboard-toast.has-kind {
    display: flex;
    gap: 0.45rem;
    align-items: flex-start;
}

/* The kind icon: a Lucide shape (components/Icon.tsx) in the palette colour, drawn
   in the toast's text so its stroke follows the text's stem. The Mac's SF Symbols
   have the same shapes; a web view cannot draw them (docs/design-icon-system.md). */
.toast-glyph {
    flex-shrink: 0;
    margin-top: 0.1em;
    line-height: 1;
}

/* Anatomy. One regular line, or a title over a quieter body. `pre-line` keeps a
   newline in a message (two notices on two lines) without a new element. */
.toast-message,
.toast-body {
    white-space: pre-line;
}

.toast-title {
    font-weight: var(--bn-weight-emphasis);
}

.toast-body {
    opacity: 0.78;
}

.toast-title + .toast-body {
    margin-top: 0.1rem;
}

.toast-glyph--success { color: var(--bn-colour-positive); }
.toast-glyph--error   { color: var(--bn-colour-negative); }
.toast-glyph--warning { color: var(--bn-colour-warning); }
.toast-glyph--info    { color: var(--bn-colour-accent); }
/* No --skipped: a toast draws SKIPPED as info (components/Toast.tsx). */

/* --- atoms/timecode.css --- */
/* Atom: timecode — clickable and plain timecode links */

a.timecode,
a.timecode:visited {
    color: var(--bn-colour-accent);
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-label);
    text-decoration: none;
    cursor: pointer;
}

span.timecode {
    color: var(--bn-colour-accent);
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-label);
}

a.timecode:hover {
    text-decoration: underline;
}

.timecode-bracket {
    color: var(--bn-colour-muted);
}

/* --- Glow states: synced playback highlight (driven by player.js) --- */

.bn-timecode-glow {
    box-shadow: 0 0 8px 2px var(--bn-glow-colour);
    border-left-color: var(--bn-colour-accent);
    background-color: var(--bn-glow-colour);
    border-radius: var(--bn-radius-sm);
    transition: box-shadow var(--bn-transition-normal),
                background-color var(--bn-transition-normal);
}

@keyframes bn-glow-pulse {
    0%, 100% { box-shadow: 0 0 8px 2px var(--bn-glow-colour); }
    50%      { box-shadow: 0 0 12px 4px var(--bn-glow-colour-strong); }
}

.bn-timecode-glow.bn-timecode-playing {
    animation: bn-glow-pulse 2s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
    .bn-timecode-glow.bn-timecode-playing {
        animation: none;
    }
}

/* --- Progress fill: left border grows top-to-bottom during playback ---
   Driven by --bn-segment-progress (0–1) set in PlayerContext.tsx.
   Only appears on transcript segments (not report blockquotes).

   Registered as NOT inherited. It is set on the playing paragraph about four times a second, and
   an inherited custom property restyles every descendant: a paragraph of 400 word spans cost
   about 20 layout passes a tick instead of one, and 21 ms of style and layout instead of 10
   (measured 4 Nov 2026, experiments/perf/playback.mjs). Only the ::before below reads it. */
@property --bn-segment-progress {
    syntax: "<number>";
    inherits: false;
    initial-value: 0;
}

.transcript-segment.bn-timecode-glow {
    position: relative;
}

.transcript-segment.bn-timecode-glow::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: calc(var(--bn-segment-progress, 0) * 100%);
    background: var(--bn-colour-accent);
    border-radius: 0 0 1px 1px;
    transition: height 0.25s linear;
    pointer-events: none;
    z-index: 1;
}

@media (prefers-reduced-motion: reduce) {
    .transcript-segment.bn-timecode-glow::before {
        transition: none;
    }
}

/* --- Word-level highlight: karaoke-style during playback ---
   Driven by .bn-word-active toggled in PlayerContext.tsx.
   Only appears when word timing data is available (Whisper sessions). */

.transcript-word.bn-word-active {
    background: color-mix(in srgb, var(--bn-colour-accent) 30%, transparent);
    border-radius: 2px;
    transition: background 0.1s ease;
}

@media (prefers-reduced-motion: reduce) {
    .transcript-word.bn-word-active {
        text-decoration: underline;
        text-decoration-color: var(--bn-colour-accent);
        background: none;
        transition: none;
    }
}

/* --- atoms/bar.css --- */
/* Atom: bar — sentiment histogram bar and count */

.sentiment-bar {
    height: 1rem;
    border-radius: 0 var(--bn-radius-sm) var(--bn-radius-sm) 0;
    min-width: 2px;
}

.sentiment-bar-count {
    font-size: var(--bn-text-caption);
    font-weight: var(--bn-weight-emphasis);
    flex-shrink: 0;
}

.sentiment-bar-label {
    display: inline-block;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    padding: var(--bn-space-xs) 0.45rem;
    border-radius: var(--bn-radius-sm);
    background: var(--bn-colour-badge-bg);
    color: var(--bn-colour-badge-text);
    line-height: 1.2;
    max-width: 12rem;
    width: fit-content;
    justify-self: start;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
    position: relative;
}

/* Delete button on histogram user-tag labels — matches .badge-delete pattern */
.histogram-bar-delete {
    position: absolute;
    top: calc(-0.3rem - 1px);
    right: calc(-0.3rem - 1px);
    width: calc(0.875rem + 0.5px);   /* ~14.5px */
    height: calc(0.875rem + 0.5px);
    background: var(--bn-colour-bg);
    border: none;
    border-radius: 50%;
    color: var(--bn-colour-muted);
    font-size: var(--bn-text-micro);
    font-weight: var(--bn-weight-strong);
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity var(--bn-transition-fast);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    pointer-events: none;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.16), 0 0 1px rgba(0, 0, 0, 0.06);
}

.sentiment-bar-label:hover .histogram-bar-delete {
    opacity: 1;
    pointer-events: auto;
}

.sentiment-divider {
    height: 1px;
    background: var(--bn-colour-border);
    margin: var(--bn-space-sm) 0;
    grid-column: 1 / -1;
}

/* --- atoms/logo.css --- */
/* Atom: logo — report header with logo, logotype, project name, doc title */

.report-logo-link {
    text-decoration: none;
    line-height: 0;
}

.report-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--bn-space-lg);
    flex-wrap: wrap;
}

.header-left {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    /* A phone-width column is narrower than logo + nowrap title (BR-18: 30 px
       page overflow on every route at 390 px). Shrink with the column instead. */
    min-width: 0;
    max-width: 100%;
}

.report-logo {
    width: 80px;
    height: auto;
    flex-shrink: 0;
    opacity: 0.85;
    transition: opacity var(--bn-transition-normal);
    transform: scaleX(-1);
    align-self: flex-start;
    position: relative;
    top: 1.7rem;
    border-radius: var(--bn-radius-md);
}

/* HACK: Dark logo has a solid black background — blend it away in dark mode.
   Remove this when the logo images are replaced with transparent-background PNGs. */
[data-theme="dark"] .report-logo { mix-blend-mode: lighten; }
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .report-logo { mix-blend-mode: lighten; }
}

.report-logo:hover {
    opacity: 1;
}

.header-title {
    min-width: 0;
}

.header-logotype {
    white-space: nowrap;
    font-size: var(--bn-text-title);
    font-weight: var(--bn-weight-emphasis);
    letter-spacing: -0.01em;
}

.header-project {
    /* User data, so it may break anywhere: a long compound must not push the page wide. */
    overflow-wrap: anywhere;
    font-size: var(--bn-text-title);
    font-weight: var(--bn-weight-normal);
    letter-spacing: -0.01em;
}

.header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: var(--bn-space-xs);
    flex-shrink: 0;
}

.header-doc-title {
    font-size: var(--bn-text-heading);
    font-weight: var(--bn-weight-normal);
}

.header-meta {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
}

/* The tab bar's icon tabs, moved up under the document title when the window
   is too narrow for them beside the tabs (NavTools, the fit cascade's second
   step). Right-aligned with the title; no auto margin needed in a column. */
.header-right .bn-tab-tools {
    margin-left: 0;
}

/* Tighten vertical spacing: header → rule → toolbar */
.report-header + hr {
    margin-top: 0.75rem;
    margin-bottom: 0.75rem;
}

@media print {
    .report-logo {
        width: 60px;
        opacity: 1;
    }
}

/* --- atoms/footer.css --- */
/* Atom: footer — colophon at page bottom */

.report-footer {
    margin: var(--bn-space-xl) 0 0;
    padding-top: var(--bn-space-md);
    border-top: 1px solid var(--bn-colour-border);
    font-size: var(--bn-text-badge);
    color: var(--bn-colour-muted);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}

.footer-logotype {
    font-weight: var(--bn-weight-emphasis);
}

.footer-version {
    /* JSX whitespace between logotype and version collapses in the flex
       row (.footer-left), so restore the word gap explicitly. */
    margin-left: 0.35rem;
    color: var(--bn-colour-muted);
    text-decoration: none;
}

.footer-version:visited {
    color: var(--bn-colour-muted);
}

.footer-version:hover {
    text-decoration: underline;
}

/* Keyboard shortcut hint — subtle, right-aligned */
.footer-keyboard-hint {
    color: var(--bn-colour-muted);
    text-decoration: none;
    opacity: 0.6;
    cursor: pointer;
    transition: opacity var(--bn-transition-fast);
}

.footer-keyboard-hint:visited {
    color: var(--bn-colour-muted);
}

.footer-keyboard-hint:hover {
    opacity: 1;
}

.footer-keyboard-hint kbd {
    display: inline-block;
    padding: 0.1em 0.35em;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-micro);
    font-weight: var(--bn-weight-mono);
    line-height: 1;
    color: var(--bn-colour-muted);
    background: var(--bn-colour-badge-bg);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-sm);
    box-shadow: 0 1px 0 var(--bn-colour-border);
    margin-right: 0.25em;
}

/* Hide keyboard hint on touch devices */
@media (pointer: coarse) {
    .footer-keyboard-hint {
        display: none;
    }
}

/* Footer three-zone layout: left (logo+text) | middle (feedback links) | right (help) */

.footer-left {
    display: flex;
    align-items: baseline;
}

/* Tiny footer fish logo */
.footer-logo-picture {
    display: inline-flex;
    align-items: baseline;
    margin-right: 0.35rem;
}

.footer-logo {
    width: 14px;
    height: auto;
    opacity: 0.5;
    transform: scaleX(-1);
    position: relative;
    top: 0.15em;
    transition: opacity var(--bn-transition-normal);
}

.footer-logo:hover {
    opacity: 0.8;
}

/* Feedback links — hidden by default, shown by JS when feature flag is true */
.feedback-links {
    display: none;
}

body.feedback-enabled .feedback-links {
    display: flex;
    align-items: baseline;
    gap: 0.5em;
}

.feedback-links.feedback-links-visible {
    display: flex;
    align-items: baseline;
    gap: 0.5em;
}

.footer-link {
    color: var(--bn-colour-muted);
    text-decoration: none;
    opacity: 0.6;
    cursor: pointer;
    transition: opacity var(--bn-transition-fast);
}

.footer-link:visited {
    color: var(--bn-colour-muted);
}

.footer-link:hover {
    opacity: 1;
}

.footer-link-sep {
    color: var(--bn-colour-muted);
    opacity: 0.4;
}

@media (pointer: coarse) {
    .feedback-links {
        display: none !important;
    }
}

/* --- atoms/interactive.css --- */
/* Atom: interactive — focus and selection states for keyboard navigation.

   Focus: the keyboard cursor (0 or 1 item). Shadow lift on white background.
   Selection: operand set for bulk actions (0 to N items). Light blue tint + blue bar.

   These classes are generic — apply to blockquotes, table rows, list items, etc.
   For blockquote-specific styling, see molecules/quote-actions.css.

   State priority for left border: starred > selected > default
   See docs/design-keyboard-navigation.md for full state combination matrix.
*/

/* ---------------------------------------------------------------------
   Focus outline suppression — mouse / touch

   Browsers show :focus on both keyboard and mouse interaction.
   :focus-visible only fires on keyboard navigation (Tab, arrow keys).
   This rule hides the outline for mouse/touch clicks globally.

   Keyboard users still see the blue ring via :focus-visible rules
   defined on individual components (sidebar.css, journey-label.css, etc.).

   Industry standard pattern — used by Bootstrap 5, Tailwind, GitHub Primer.
   See theme/CLAUDE.md "Focus outline convention" for the full rule.
   --------------------------------------------------------------------- */

:focus:not(:focus-visible) {
    outline: none;
}

/* .center is a focus *sink*, not a control: in embedded (desktop) mode it
   carries tabIndex=-1 and SidebarLayout redirects focus to it when a sidebar
   closes (the rails that'd otherwise catch returning focus are removed there).
   Keyboard-initiated focus then matches :focus-visible, and since the content
   column has no custom ring of its own it falls through to WebKit's default
   outline:auto — a fat accent rectangle around the whole report that reads as a
   rendering seam, not "you are here". The focus MOVE is correct a11y and stays;
   only the stray visual is dropped. Per the focus convention this is the one
   allowed form (a :focus-visible suppressor, never :focus:not(:focus-visible) —
   the global rule above already owns the mouse case). Affordances that matter to
   users — quote focus/selection, search inputs, interactive controls — keep
   their own :focus-visible rings. No embedded gate needed: .center isn't
   focusable in the browser/CLI SPA, so the ring can't appear there anyway. */
.center:focus-visible {
    outline: none;
}

/* ---------------------------------------------------------------------
   Focused state — keyboard cursor, shadow lift
   --------------------------------------------------------------------- */

.bn-focused {
    background: var(--bn-colour-bg);
    box-shadow: var(--bn-focus-shadow);
    z-index: 1;
    position: relative;
}

/* Quote-card specific: beat blockquote.quote-card (0,1,1) with (0,2,1).
   (0,2,1) also beats `.quote-card.starred` and `.quote-card.quote-active`
   (both (0,2,0)), which is deliberate — see the keyline note below. */
blockquote.quote-card.bn-focused {
    background: var(--bn-colour-bg);

    /* The cursor's cue is appearance-conditional, because the rule above is a
       RELATIVE idiom: dropping the card to the page colour only says anything
       against neighbours that aren't focused. In light that makes the focused
       card the brightest surface in both palettes and --bn-focus-shadow reads
       against it. In dark it makes it the darkest — with a shadow that has
       never been visible there (neither palette gives --bn-focus-shadow a dark
       variant). So dark gets an accent ring, resolved per palette for free.

       This lives here rather than in templates/focus-mode.css because the ring
       earns its place in ordinary reading too, not only in Focus Mode — and
       putting it here fixes a bug the Focus-only version had: at (0,3,1) it
       out-specified `.bn-window-inactive blockquote.quote-card.bn-focused`
       (also (0,3,1), but earlier in the concatenation), so the ring kept
       glowing while the app wasn't accepting input. At (0,2,1) the
       inactive-window rule wins again, which is the macOS convention. */
    box-shadow:
        var(--bn-focus-shadow),
        0 0 0 1px light-dark(transparent, var(--bn-colour-accent));

    /* Keylines must not double up. The card carries a 1px `border-left` and the
       ring is a 1px box-shadow drawn OUTSIDE the border box, so a focused card
       would show 2px on the left (ring + border, in two different colours) and
       1px on its other three sides. In dark the ring owns the whole outline, so
       the left border steps aside — uniform 1px all round, nothing overlapping.
       In light there is no ring, so the border stays and simply reverts to the
       neutral colour: focus OVERRIDES the starred bracket rather than clashing
       with it or sitting on top of it. Colour only — no reflow either way. */
    border-left-color: light-dark(var(--bn-colour-border), transparent);
}

/* ---------------------------------------------------------------------
   Selected state — multi-select for bulk actions
   --------------------------------------------------------------------- */

.bn-selected {
    background: var(--bn-selection-bg);
    border-left-color: var(--bn-selection-border);
}

/* Quote-card specific: beat blockquote.quote-card (0,1,1) with (0,2,1) */
blockquote.quote-card.bn-selected {
    background: var(--bn-selection-bg);
    border-left-color: var(--bn-selection-border);
}

/* ---------------------------------------------------------------------
   Combined: focused + selected
   Selection background wins, shadow adds lift
   --------------------------------------------------------------------- */

.bn-focused.bn-selected {
    background: var(--bn-selection-bg);
    box-shadow: var(--bn-focus-shadow);
}

blockquote.quote-card.bn-focused.bn-selected {
    background: var(--bn-selection-bg);

    /* The combination has to state its own left edge, because neither single
       rule can win it: `blockquote.quote-card.bn-focused` (which blanks the
       border so the ring owns a uniform outline) and
       `blockquote.quote-card.bn-selected` (which colours it
