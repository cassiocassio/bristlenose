       { flex: 1; overflow-y: auto }` inside is inert: the body sizes to its
       content, never overflows itself, and this OUTER box scrolls instead —
       carrying the header, the toolbar bleed below and the shared first-row
       datum with it, so the panel lined up with the content only at
       scroll-top (found 2 Sep 2026, fixed 20 Sep). With the column, the body
       is the one scroller under a header that never moves. */
    display: flex;
    flex-direction: column;
    visibility: hidden;
    opacity: 0;
    /* Toolbar bleed (mirrors .tag-sidebar). This column sits in the body's
       top-inset flow (padding-top: inset + space-xl), but `top: 0` anchors the
       sticky at the toolbar seam — the gap makes the panel start a full pad
       below the toolbar and overflow the bottom by the same amount, and it
       teleports up on first scroll. Cancel the inset with a negative margin
       (flow origin → seam, so the panel fills 100vh exactly and sticky has
       nothing to snap across), then re-inset the content as inner padding to
       the shared space-xl datum. `, 0px` keeps browser/serve on plain space-xl.
       With the toolbar-inset residual now 0 the bleed collapses to space-xl. */
    margin-top: calc(-1 * (var(--bn-toolbar-inset, 0px) + var(--bn-space-xl)));
    padding-top: calc(var(--bn-toolbar-inset, 0px) + var(--bn-space-xl));
    padding-bottom: 2rem;
}

/* Push mode: sidebar in grid flow */
.layout.toc-open .toc-sidebar {
    visibility: visible;
    opacity: 1;
}

/* ── Overlay keyframes ─────────────────────────────────────────
   The rail IS the panel's left edge. clip-path reveals the panel
   rightward from that edge. Content visible from frame 1. Shadow
   reveals progressively with the clip.

   Open timeline (75ms):
     0–40ms   icon departs (fade + shift left)
     0–75ms   panel clip-path reveals
     40–75ms  close × sneaks in

   Close timeline (75ms):
     0–40ms   close × fades out
     0–75ms   panel clip-path hides
     40–75ms  icon returns                                       */

@keyframes toc-reveal {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 -100px 0 0); } /* negative = room for box-shadow to paint beyond element edge */
}

@keyframes toc-hide {
    from { clip-path: inset(0 -100px 0 0); } /* must match toc-reveal end state */
    to   { clip-path: inset(0 100% 0 0); }
}

@keyframes toc-icon-depart {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(-4px); }
}

@keyframes toc-icon-return {
    from { opacity: 0; transform: translateX(-4px); }
    to   { opacity: 1; transform: translateX(0); }
}

@keyframes toc-close-sneak-in {
    from { opacity: 0; }
    to   { opacity: 1; }
}

@keyframes toc-close-sneak-out {
    from { opacity: 1; }
    to   { opacity: 0; }
}

/* iOS variant: content settles into place with its own inertia */
@keyframes toc-ios-settle {
    from { transform: translateX(-20px); }
    to   { transform: translateX(0); }
}

@keyframes toc-ios-depart {
    from { transform: translateX(0); }
    to   { transform: translateX(-20px); }
}

/* ── Floating base: left panel ────────────────────────────────── */
/* Shared positioning for all modes where the left sidebar leaves
   the grid and floats over content (overlay, rail drag).
   toc-closing co-exists with toc-overlay — inherits positioning.
   Mode-specific overrides (left, width, shadow, animation) follow.

   top: var(--bn-space-xl) matches body padding-top so the overlay
   starts at the same vertical position as the push-mode grid row.

   left differs per mode:
   - overlay: var(--bn-space-lg) — aligns with push mode's grid edge
     so content (×, title, links) is at the same horizontal position
     regardless of how the sidebar was opened.
   - rail drag: var(--bn-rail-width) — "curtain reveals" from the rail
     edge, frontier line visible at the expanding boundary.             */
.layout.toc-overlay .toc-sidebar,
.layout.toc-rail-dragging .toc-sidebar {
    position: fixed;
    top: var(--bn-space-xl);
    height: 100vh;
    visibility: visible;
    opacity: 1;
    z-index: 110;
    /* Cancel the push-mode toolbar bleed: these are floating panels positioned
       from `top`, so the negative margin would drag them up off their anchor.
       (Embedded TOC is closed↔push only, so this only guards the browser.) */
    margin-top: 0;
    padding-top: 0;
}

/* ── Overlay open ─────────────────────────────────────────────── */

.layout.toc-overlay .toc-sidebar {
    left: var(--bn-space-lg);
    width: var(--toc-width, var(--bn-sidebar-width));
    box-shadow: var(--bn-overlay-shadow);
    animation: toc-reveal 75ms cubic-bezier(0, 0, 0.2, 1) both;
}

/* Seamless rail-to-panel: hide rail border so rail IS the panel edge */
.layout.toc-overlay .toc-rail,
.layout.toc-closing .toc-rail {
    border-right-color: transparent;
}

/* Rail icon departs — fades out with leftward nudge (first 40ms) */
.layout.toc-overlay .toc-rail .rail-btn {
    animation: toc-icon-depart 40ms cubic-bezier(0.4, 0, 1, 1) both;
    pointer-events: none;
}

/* Close × sneaks in at end (last 40ms) */
.layout.toc-overlay .toc-sidebar-header .sidebar-close {
    animation: toc-close-sneak-in 40ms cubic-bezier(0, 0, 0.2, 1) 40ms both;
}

/* iOS variant: content body settles with its own inertia */
.layout.toc-overlay.overlay-ios .toc-sidebar-body {
    animation: toc-ios-settle 65ms cubic-bezier(0.25, 0.46, 0.45, 0.94) 10ms both;
}

/* ── Overlay close ────────────────────────────────────────────── */

/* Panel clips shut toward rail edge */
.layout.toc-closing .toc-sidebar {
    animation: toc-hide 75ms cubic-bezier(0.4, 0, 1, 1) both;
    box-shadow: none;
}

/* Close × fades out first (first 40ms) */
.layout.toc-closing .toc-sidebar-header .sidebar-close {
    animation: toc-close-sneak-out 40ms cubic-bezier(0.4, 0, 1, 1) both;
}

/* Rail icon returns in last 40ms */
.layout.toc-closing .toc-rail .rail-btn {
    animation: toc-icon-return 40ms cubic-bezier(0, 0, 0.2, 1) 40ms both;
    pointer-events: auto;
}

/* iOS variant: content departs with inertia */
.layout.toc-closing.overlay-ios .toc-sidebar-body {
    animation: toc-ios-depart 50ms cubic-bezier(0.4, 0, 1, 1) both;
}

/* ── Rail drag-to-open ────────────────────────────────────────── */
/* During a drag from the closed rail, the sidebar appears as a
   fixed overlay that tracks the pointer 1:1 — no grid rearrangement,
   no animations.  Width is set directly via --toc-width CSS var.
   On pointerup the layout commits to push mode or snaps closed. */

.layout.toc-rail-dragging .toc-sidebar {
    left: var(--bn-rail-width);
    width: var(--toc-width, 0px);
    box-shadow: none;
    border-right: 1px solid var(--bn-colour-border);
    animation: none;
}

/* Rail stays visible during drag — it's the physical thing the user grabbed. */

/* ── Floating base: right panel ───────────────────────────────── */
/* Mirror of left floating base. Currently rail-drag only;
   tag overlay mode would add its selector here.                   */
.layout.tags-rail-dragging .tag-sidebar {
    position: fixed;
    top: var(--bn-space-xl);
    right: var(--bn-rail-width);
    width: var(--tags-width, 0px);
    height: 100vh;
    visibility: visible;
    opacity: 1;
    z-index: 110;
    box-shadow: none;
    border-left: 1px solid var(--bn-colour-border);
    animation: none;
}

/* Content previews at minimum sidebar width, clipped by the
   narrower container — reveals progressively as the user drags. */
.layout.toc-rail-dragging .toc-sidebar-header,
.layout.toc-rail-dragging .toc-sidebar-body {
    min-width: var(--bn-sidebar-min);
}

.layout.tags-rail-dragging .tag-sidebar-header,
.layout.tags-rail-dragging .tag-sidebar-body {
    min-width: var(--bn-sidebar-min);
}

/* Shared sidebar header layout — used by both TOC and tag headers.
   Per-sidebar overrides (e.g. padding-bottom) use the specific class. */
.sidebar-header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.25rem;
    padding: var(--bn-space-md) 0.85rem 0.25rem;
    flex-shrink: 0;
}

.toc-sidebar-header .sidebar-title {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
}

/* The Quotes lens's grouping control (Sections & themes / Sessions) when the
   sidebar is showing: the shipped split control run full width, as the person
   picker runs it. Each half sizes to its label, so a short label gives its
   room to a long one rather than halving the row. When the sidebar is closed
   the same control sits in the zone heading at its natural width. */
.toc-sidebar-header .bn-quote-grouping {
    display: flex;
    align-self: stretch;
}
.toc-sidebar-header .bn-quote-grouping .dimension-btn {
    flex: auto;
}

.sidebar-close {
    background: none;
    border: none;
    font-size: var(--bn-text-heading);
    color: var(--bn-colour-muted);
    cursor: pointer;
    line-height: 1;
    transition: color var(--bn-transition-fast);
    /* Always above the title (order: -1 in flex-column header).
       Outdented left via negative margin — hanging indent so the ×
       sits roughly at the rail icon's horizontal position. */
    order: -1;
    margin-left: -0.5rem;
    padding: 2px 6px;
}

.sidebar-close:hover { color: var(--bn-colour-text); }

.sidebar-close:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -2px;
}

.toc-sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 0 0.85rem 1rem;
}

/* ── TOC links (scroll-spy nav) ───────────────────────────────── */

.toc-heading {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
    margin: 1rem 0 var(--bn-space-sm);
    padding-bottom: 0.25rem;
    border-bottom: 1px solid var(--bn-colour-border);
}

.toc-heading:first-child { margin-top: 0; }

.toc-link {
    display: block;
    padding: 0.2rem var(--bn-space-sm);
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-light);
    color: var(--bn-colour-text);
    text-decoration: none;
    border-radius: var(--bn-radius-md);
    transition: background var(--bn-transition-fast), color var(--bn-transition-fast);
    cursor: pointer;
}

.toc-link:hover {
    color: var(--bn-colour-accent);
    text-decoration: underline;
    text-underline-offset: 0.25em;
    text-decoration-color: var(--bn-colour-accent);
}

.toc-link:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -2px;
}

.toc-link.active {
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-accent);
    background: var(--bn-nav-selection-bg);
}

/* ── Column 3: Center ─────────────────────────────────────────── */

.layout > .center {
    grid-column: 3;
    grid-row: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    /* The side padding is PUBLISHED as two properties, and every rule that
       changes it (no-right, inert, embedded — above) sets the property, never
       padding-left/right directly. Descendants inherit the live value, so a
       lens can bleed a full-width band out of this padding and give it back
       exactly: inspector.css does it for the Signals heatmap bar. A rule that
       sets padding here directly would desync that bleed silently. */
    --bn-center-pad-left: var(--bn-gutter-left);
    --bn-center-pad-right: var(--bn-gutter-right);
    padding-left: var(--bn-center-pad-left);
    padding-right: var(--bn-center-pad-right);
    /* The page's bottom breathing room, moved here from body (report.css) so
       it is inside the grid row the sticky panels span. */
    padding-bottom: var(--bn-space-xl);
}

/* Main landmark — transparent flex-column pass-through so the routed content
   keeps the exact flex context it had as a direct child of .center (no
   margin-collapse; min-width:0 for nested overflow). Adds the sole <main>
   ARIA landmark without altering layout. */
.bn-main {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* ── Column 5: Right sidebar (Tags) ───────────────────────────── */

.tag-sidebar {
    grid-column: 5;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bn-colour-inspector-bg);
    border-left: 1px solid var(--bn-colour-border);
    display: flex;
    flex-direction: column;
    visibility: hidden;
    opacity: 0;
    /* Bleed the inspector chrome up under the frosted toolbar (Xcode-style
       full-height keyline). The grid sits inside body's top-inset, so this
       column's flow origin is ~inset+xl below y=0 while `top: 0` anchors the
       sticky at y=0 — that gap is what makes the panel teleport up on first
       scroll. Cancel the inset with a negative margin (origin → y=0, so the
       tint + keyline run to the top AND sticky has nothing to snap across),
       then re-inset the header as inner padding. Value mirrors the
       html[data-embedded] body padding-top; `, 0px` keeps browser/serve at
       its plain space-xl inset. box-sizing:border-box keeps height at 100vh. */
    margin-top: calc(-1 * (var(--bn-toolbar-inset, 0px) + var(--bn-space-xl)));
    padding-top: calc(var(--bn-toolbar-inset, 0px) + var(--bn-space-xl));
    /* Extra bottom padding so macOS auto-hiding scrollbar doesn't obscure
       the last items when content overflows. */
    padding-bottom: 2rem;
}

.layout.tags-open .tag-sidebar {
    visibility: visible;
    opacity: 1;
}

/* ── First-baseline datum (desktop/embedded only) ─────────────────────────
   Content and the flanking inspector share ONE web-internal datum: the base
   `.tag-sidebar` bleed (margin-top -(inset+space-xl), padding-top inset+space-xl)
   lands the "Tags" header at the same y as the body's first h1 (body padding-top
   inset+space-xl, h1 margin-top 0). No override needed — the base rules already
   agree on space-xl below the toolbar seam.

   The old cross-seam idea (align web baselines to the native sidebar's "Project"
   lens-row baseline via --bn-first-baseline) is retired: the red-background test
   (23 Jul 2026) showed the webview's layout viewport already starts at the
   toolbar seam, so that native baseline sits ABOVE the webview origin and can't
   be reached from CSS. With the toolbar-inset residual now 0 (BridgeHandler),
   the datum is purely web-internal — tune via --bn-space-xl on the specimen lens.
   See docs/design-lens-template.md § "Native geometry — ground truth".

   (The former h2 lift rule is gone with the h1 promotion — 5c611310 turned the
   first-of-type headings into <h1>, which flush to the datum via their own
   `margin-top: 0` rule in report.css.) */

/* Tag header override: no bottom padding (subtitle/actions follow) */
.tag-sidebar-header {
    padding-bottom: 0;
}

.tag-sidebar-header .sidebar-title {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
}

.tag-sidebar-subtitle {
    font-size: var(--bn-text-badge);
    color: var(--bn-colour-muted);
    padding: 0 0 0.25rem 0.85rem;
}

.tag-sidebar-actions {
    display: flex;
    /* Wraps at the narrow end of the drag (200px): Russian "Select all / Clear /
       Used" needs ~230px, and the sidebar's overflow-x: hidden would cut the
       last button off. A control never truncates (owner rule, 9 Nov 2026). */
    flex-wrap: wrap;
    gap: 0.25rem 0.5rem;
    padding: var(--bn-space-xs) 0 0.5rem 0.85rem;
    border-bottom: 1px solid var(--bn-colour-border);
    flex-shrink: 0;
}

.tag-filter-action-active {
    font-weight: var(--bn-weight-emphasis);
}

.tag-sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 0.25rem 0;
}

/* 2-column masonry: CSS columns pack group cards tightly with no
   row-based gaps. Items flow down column 1, then column 2.
   break-inside: avoid keeps each group card as an unbroken unit. */
.tag-sidebar.two-col .codebook-body {
    columns: 2;
    column-gap: var(--bn-space-sm);
}

.tag-sidebar.two-col .tag-filter-group {
    break-inside: avoid;
    margin: 0 0 var(--bn-space-sm) 0;
}

/* ── Column 6: Right icon rail ────────────────────────────────── */

.tag-rail {
    grid-column: 6;
    position: sticky;
    top: 0;
    height: 100vh;
    align-self: start;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: var(--bn-space-md);
    border-left: 1px solid var(--bn-colour-border);
    background: var(--bn-colour-bg);
    overflow: hidden;
    margin-right: 8px;  /* clear macOS auto-hiding scrollbar */
}

.layout.tags-open .tag-rail { display: none; }

/* ── Column 4: Minimap slot ───────────────────────────────────── */

.minimap-slot {
    grid-column: 4;
    position: sticky;
    /* Anchor the sticky at the same inset the body already pushes this column
       down by, so it doesn't teleport up under the frost on first scroll. Unlike
       the tag sidebar, the minimap is content-overview (no chrome tint), so it
       should stay clear of the toolbar rather than bleed beneath it. */
    top: calc(var(--bn-toolbar-inset, 0px) + var(--bn-space-xl));
    height: 100vh;
    align-self: start;
    overflow: hidden;
    pointer-events: auto;
    /* Equal breathing room from center content (left) and tag sidebar/rail (right).
       The center column has no right padding — this column provides ALL the
       visual separation. Padding inserts the abstract lines symmetrically. */
    --bn-minimap-extra-pad-r: 0px;
    padding: 0 calc(var(--bn-space-md) + var(--bn-minimap-extra-pad-r)) 0 var(--bn-space-md);
}

/* ── Drag handles ─────────────────────────────────────────────── */

.drag-handle {
    position: absolute;
    top: 0;
    width: 6px;
    height: 100%;
    cursor: col-resize;
    z-index: 120;
    background: transparent;
}

.drag-handle.hover-intent,
.drag-handle.active {
    background: var(--bn-colour-accent);
    opacity: 0.3;
}

.drag-handle:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -2px;
}

.drag-handle::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: 24px;
    border-radius: 1px;
    background: var(--bn-colour-muted);
    opacity: 0;
    transition: opacity var(--bn-transition-fast);
}

.drag-handle.hover-intent::after,
.drag-handle.active::after {
    opacity: 0.6;
}

/* Sidebar edge drag handles */
.toc-drag-handle { right: -3px; }
.tag-drag-handle { left: -3px; }

/* Overlay mode: drag handle must beat the overlay panel (z-index: 110) */
.layout.toc-overlay .toc-drag-handle { z-index: 121; }

/* Rail edge drag handles (drag-to-open from closed state) */
.toc-rail-drag  { right: -3px; }
.tag-rail-drag  { left: -3px; }

/* ── Drag-select disable ──────────────────────────────────────── */

body.dragging {
    user-select: none;
    cursor: col-resize !important;
}

body.dragging * {
    cursor: col-resize !important;
}

/* ── Responsive: hide toolbar labels when space is tight ──────── */

.toolbar-btn-label {
    transition: opacity var(--bn-transition-fast);
}

@media (max-width: 900px) {
    .toolbar-btn-label { display: none; }
}

/* Hide labels when TOC sidebar is open (center column narrows) */
.layout.toc-open .toolbar-btn-label { display: none; }

/* ══════════════════════════════════════════════════════════════════
   CODEBOOK SIDEBAR — codebook-level navigation
   ══════════════════════════════════════════════════════════════════ */

/* ── Codebook status dot ──────────────────────────────────────────
   Each codebook row in the Codebook-tab sidebar carries a leading dot
   that echoes the enable/disable switch: blue = on, grey = disabled,
   transparent = available / floor. The row becomes a flex line so the
   dot sits first-line-aligned (like a list bullet) and every label's
   left edge lines up regardless of dot colour. */
.toc-link.codebook-toc-link {
    display: flex;
    align-items: flex-start;
    gap: var(--bn-space-xs);
}

/* Disabled (switched-off) codebook: muted label, grey dot — still a live
   link (it scrolls to the folded section). */
.toc-link.codebook-disabled .codebook-toc-label {
    color: var(--bn-colour-muted);
}

/* Compact action button inside sidebar body — e.g. "Browse codebooks →".
   Smaller than .bn-btn, fits the sidebar's dense information layout. */
.sidebar-mini-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--bn-space-xs);
    font-family: inherit;
    font-size: var(--bn-text-caption);
    font-weight: var(--bn-weight-emphasis);
    padding: var(--bn-space-xs) var(--bn-space-sm);
    border-radius: var(--bn-radius-sm);
    border: 1px solid var(--bn-colour-border);
    background: var(--bn-colour-bg);
    color: var(--bn-colour-muted);
    cursor: pointer;
    transition: background var(--bn-transition-fast), color var(--bn-transition-fast), border-color var(--bn-transition-fast);
    margin: var(--bn-space-xs) var(--bn-space-sm);
}

.sidebar-mini-btn:hover {
    background: var(--bn-colour-hover);
    color: var(--bn-colour-accent);
    border-color: var(--bn-colour-border-hover);
}

/* ══════════════════════════════════════════════════════════════════
   SESSION SIDEBAR — compact session list for Sessions/Transcript tabs
   ══════════════════════════════════════════════════════════════════ */

/* ── Molecule: session-entry ─────────────────────────────────────
   A .toc-link variant with multi-line layout (speakers + metadata).
   Reuses .toc-link base pattern: same padding, radius, hover, active.
   Session ID uses the existing .badge atom.

   v4: date-first priority, no stacking without thumbnail,
   middle dot separator, JS-driven visibility (no container queries). */

.session-entry {
    display: block;
    padding: var(--bn-space-sm);
    border-radius: var(--bn-radius-md);
    text-decoration: none;
    color: var(--bn-colour-text);
    transition: background var(--bn-transition-fast);
    cursor: pointer;
}

.session-entry:hover { background: var(--bn-colour-hover); }
.session-entry:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -2px;
}
.session-entry.active { background: var(--bn-nav-selection-bg); }

.session-entry + .session-entry {
    border-top: 1px solid var(--bn-colour-border);
}

.session-entry-row {
    display: flex;
    align-items: baseline;
    gap: var(--bn-space-sm);
    min-height: 1.4em;
}

.session-entry-row .badge {
    flex-shrink: 0;
}

/* Session ID badge — accent colour variant of .badge atom */
.session-entry .session-id-badge {
    color: var(--bn-colour-accent);
    background: var(--bn-sentiment-confidence-bg);
}

.session-entry-speakers {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex: 1;
    min-width: 0;
}

.session-entry-speaker-row {
    display: flex;
    align-items: baseline;
    gap: var(--bn-space-xs);
}

.session-entry-name {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-light);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
}

/* Duration — compact mono, right-aligned */
.session-entry-duration {
    font-size: var(--bn-text-caption);
    font-family: var(--bn-font-mono);
    color: var(--bn-colour-muted);
    white-space: nowrap;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    text-align: right;
}

/* Date — always right-aligned */
.session-entry-date {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    white-space: nowrap;
    flex-shrink: 0;
    text-align: right;
}

/* Middle dot separator between duration and date */
.session-entry-sep {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    flex-shrink: 0;
    opacity: 0.5;
}

/* Right-aligned meta stack — used when thumbnail forces row depth.
   Stacks date above duration vertically, right-aligned against thumb. */
.session-entry-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    flex-shrink: 0;
    gap: 1px;
}

.session-entry.active .session-entry-name {
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-accent);
}

/* Thumbnail placeholder */
.session-entry-thumb {
    width: 64px;
    height: 36px;
    border-radius: var(--bn-radius-sm);
    background: var(--bn-colour-badge-bg);
    border: 1px solid var(--bn-colour-border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--bn-text-micro);
    color: var(--bn-colour-muted);
    align-self: flex-start;
    overflow: hidden;
}

.session-entry-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: var(--bn-radius-sm);
}

/* ── Signal sidebar entries (Analysis tab) ─────────────────────────── */

/* The location heading. It carried uppercase and letterspacing while it named
   a KIND — "Section", "Theme" — which is a category and reads like one. It
   names a PLACE now, and the same argument that took uppercase off the card's
   location applies here verbatim: all-caps makes "Shopping Bag" look like a
   category, and that is not how the Quotes lens renders the same string. The
   two lenses name the same things. It also takes the full text colour rather
   than muted, because it is the thing the rows below it belong to.

   IT KEEPS THE LEFT EDGE; THE ROWS UNDER IT INDENT (see .signal-entry). The
   centre column already draws this distinction and draws it with SPACE, not
   type: the location heading sits flush on the content edge and the card's own
   --bn-space-lg padding puts the headline 25px further in (24px + the card's
   1px border). This panel had both on an identical x, so the one rank that is
   a container and the one that is its contents started at the same place.

   --bn-space-md rather than --bn-space-sm for the air: at 5.6px the gap before
   a new location was the same gap as between two rows inside one, so the
   blocks did not close. */
.toc-sub-heading {
    font-size: var(--bn-text-caption);
    line-height: var(--bn-text-caption-lh);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
    padding: 0 var(--bn-space-sm);
    margin-top: var(--bn-space-md);
}

/* The first heading takes no air. Every lens starts its content at the same
   height, and a margin here would drop this panel below that datum — the same
   reason .toc-heading:first-child exists above. */
.toc-sidebar-body > .toc-sub-heading:first-child {
    margin-top: 0;
}

/* The row is a BLOCK, and the chip flows inline after the words.
   It was a flex row with the name at flex:1 and the chip at flex-shrink:0 —
   V0's pinned badge, which the chosen row layout explicitly drops. Pinning
   cost two things at once. A long chip ("Aesthetics and minimalism") squeezed
   the name column to roughly one word wide and the wrap then broke mid-word:
   "Homepa / ge / Content / Tension". And a row with no elaborated name had
   nothing to push its chip rightward, so the chip column jumped between the
   left and right edges down the list. Inline, every chip simply follows its
   own words, and a nameless row's chip sits where its row starts.

   THE INDENT IS ON padding-left, NOT margin-left, and that is the whole point
   of it. This element's background IS the hover and selection capsule, so
   padding moves the TEXT in while the capsule's left edge stays on the
   heading's line — Finder and Mail both do exactly this, selection spanning
   the row with the content indented inside it. A margin would drag the capsule
   in with the text and the column would lose its left edge.

   --bn-space-md (12px), not the 14pt the Mac app's own sidebar indents by
   (ProjectSidebarOutline.swift:378, outlineView.indentationPerLevel = 14, and
   CloudImportOutlineView repeats it). Two pixels does not buy a sixth spacing
   token; the ladder is 2.4 / 5.6 / 12 / 24 / 32 and has no step between sm and
   md to reach for. Measured over the nine locations and thirteen rows of a
   real project at the shipped 280px: eight or nine rows still fit on one line
   against ten before, and the panel grows about a tenth — most of that the
   air, not the indent. --bn-space-lg was tried and costs five of the thirteen.
   Both live in docs/mockups/signals-sidebar-indent.html, which measures
   itself. */
.signal-entry {
    display: block;
    padding: 0.2rem var(--bn-space-sm) 0.2rem calc(var(--bn-space-sm) + var(--bn-space-md));
    border-radius: var(--bn-radius-md);
    cursor: pointer;
    transition: background var(--bn-transition-fast);
    text-decoration: none;
    color: var(--bn-colour-text);
}

.signal-entry:hover {
    background: var(--bn-colour-hover);
}

/* The mini tag says its signal in the signal's ink, as the chip on the card does. */
.signal-entry .badge {
    color: var(--bn-signal-accent-ink, inherit);
}

.signal-entry:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -2px;
}

.signal-entry.active {
    background: var(--bn-nav-selection-bg);
}

.signal-entry.active .signal-entry-name {
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-accent);
}

.signal-entry-name {
    font-size: var(--bn-text-label);
    line-height: var(--bn-text-label-lh);
    font-weight: var(--bn-weight-normal);
    /* Rows WRAP. Ten variants were built to ask whether a row should lose
       words or gain a line. Measured over the 58 named rows that survive
       de-duplication, a row runs 34 characters at the median once its group
       chip is beside it, 42 at p90 and 50 at its longest — so against a
       28-character line 90% of them truncated. The ellipsis mechanism was
       never broken; the outcome was. The cost is height, and de-duplication
       has already paid it.

       `break-word`, not `anywhere`: anywhere breaks a word whenever breaking
       helps the line fit, which is how a squeezed column produced "Homepa /
       ge". break-word only breaks a word that cannot fit on a line of its
       own — the case it is actually for. */
    overflow-wrap: break-word;
}

.signal-entry .badge {
    vertical-align: 1px;
    margin-left: 0.2rem;
    font-size: var(--bn-text-micro);
}

/* --- organisms/minimap.css --- */
/* Minimap — VS Code-style abstract overview of quote page.
   Grid column 4 in the sidebar layout (between center content and tag sidebar). Quote lines as pale grey,
   heading lines as darker grey, blue translucent viewport indicator.
   Parallax scrolling for long pages via translateY on .bn-minimap-content.
   Design reference: docs/mockups/mockup-minimap.html */

/* Content container — holds all lines, parallax via translateY */
.bn-minimap-content {
    display: flex;
    flex-direction: column;
    padding: 8px 0;
    /* transform applied by JS for parallax */
}

/* Each quote = a pale grey rectangle */
.bn-minimap-quote {
    height: 2px;
    margin: 0 6px 1px;
    background: var(--bn-minimap-quote);
    border-radius: 0.5px;
    flex-shrink: 0;
}

/* Section/theme heading = darker, same height, wider */
.bn-minimap-heading {
    height: 2px;
    margin: 3px 4px 1px;
    background: var(--bn-minimap-heading);
    border-radius: 1px;
    flex-shrink: 0;
}

/* "Sections" / "Themes" group heading = taller, wider */
.bn-minimap-group-heading {
    height: 3px;
    margin: 2px 3px 2px;
    background: var(--bn-minimap-heading);
    border-radius: 1px;
    flex-shrink: 0;
}

/* Major division between sections and themes */
.bn-minimap-division {
    height: 0;
    margin: 8px 0;
    flex-shrink: 0;
}

/* ── Multi-column mode ────────────────────────────────────────────────────
   Mirror the quote grid's responsive column count. Each section becomes an
   N-column grid (N = --bn-minimap-cols, set by Minimap.tsx from the live
   .quote-group); the heading spans all columns and quotes flow row-major, so
   the minimap compresses to ~1/N height — matching the real (shortened)
   document. The slot width never changes; ticks just narrow as N grows.
   At N=1 the `multi` class is absent and the flex layout above is used
   unchanged (byte-for-byte today's single strip). */
.bn-minimap-content.multi .bn-minimap-section {
    display: grid;
    grid-template-columns: repeat(var(--bn-minimap-cols, 1), 1fr);
    gap: 1px 2px;
    align-content: start;
}
.bn-minimap-content.multi .bn-minimap-heading {
    grid-column: 1 / -1;
    margin: 3px 0 1px;
}
.bn-minimap-content.multi .bn-minimap-quote {
    margin: 0;
}
/* Full-width elements sit flush with the section grids' edges in multi mode */
.bn-minimap-content.multi .bn-minimap-group-heading {
    margin: 2px 0;
}

/* Viewport indicator — translucent blue overlay */
.bn-minimap-viewport {
    position: absolute;
    left: 0;
    /* Stops where the ticks' padding stops (set by sidebar.css when the tag
       sidebar is closed), so the rect hugs the ticks and clears the scrollbar. */
    right: var(--bn-minimap-extra-pad-r, 0px);
    background: var(--bn-minimap-viewport-bg);
    border: 1.5px solid var(--bn-minimap-viewport-border);
    border-radius: var(--bn-radius-sm);
    cursor: grab;
    z-index: 1;
    pointer-events: auto;
    min-height: 8px;
}

.bn-minimap-viewport:active {
    cursor: grabbing;
}

/* Hide minimap on narrow screens */
@media (max-width: 600px) {
    .minimap-slot { display: none; }
}

/* ── Fit to width (SidebarLayout): the minimap is the last thing the cascade drops ──
   SidebarStore.fitPanels closes the left panel, then the tag sidebar, then
   the minimap, so the centre keeps its reading measure. The first two are
   the ordinary toc-open / tags-open classes going away; this one zeroes the
   minimap track the same way `.layout.embedded` in sidebar.css zeroes the rails — one token, every
   grid variant. */
.layout.minimap-hidden { --bn-minimap-width: 0px; }
.layout.minimap-hidden .minimap-slot { display: none; }

/* --- organisms/sidebar-tags.css --- */
/* Tag sidebar content — codebook tree, eye toggles, tag rows, micro-bars.
   Scoped to .tag-sidebar to avoid collisions with existing codebook-panel.css.

   Design reference: docs/mockups/mockup-sidebar-tags.html
   Design doc: docs/design-sidebar.md */

/* ── Tag search box ───────────────────────────────────────────── */

.tag-search-container {
    padding: 0.25rem 0.85rem var(--bn-space-sm);
    flex-shrink: 0;
}

.tag-search-input {
    width: 100%;
    padding: var(--bn-space-sm) 0.55rem;
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-md);
    font-family: var(--bn-font-body);
    font-size: var(--bn-text-label);
    color: var(--bn-colour-text);
    background: var(--bn-colour-bg);
    outline: none;
    transition: border-color var(--bn-transition-fast);
}

.tag-search-input:focus {
    border-color: var(--bn-colour-accent);
}

.tag-search-input::placeholder {
    color: var(--bn-colour-muted);
}

/* ── Codebook framework disclosure ────────────────────────────── */

.codebook-framework {
    border-bottom: 1px solid var(--bn-colour-border);
    margin-bottom: 0;
}

.codebook-framework:last-child {
    border-bottom: none;
}

.codebook-framework > summary {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 0.6rem 0.85rem;
    cursor: pointer;
    list-style: none;
    user-select: none;
    transition: background var(--bn-transition-fast);
}

.codebook-framework > summary::-webkit-details-marker { display: none; }
.codebook-framework > summary::marker { display: none; content: ""; }

.codebook-framework > summary:hover {
    background: var(--bn-colour-quote-bg);
}

.codebook-disclosure {
    flex-shrink: 0;
    width: 0.85rem;
    height: 0.85rem;
    margin-top: 0.2rem;
    color: var(--bn-colour-accent);
    transition: transform var(--bn-transition-fast);
}

.codebook-framework[open] > summary .codebook-disclosure {
    transform: rotate(90deg);
}

.codebook-info {
    flex: 1;
    min-width: 0;
}

.codebook-title {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
    line-height: var(--bn-text-label-lh);
}

.codebook-author {
    font-size: var(--bn-text-badge);
    color: var(--bn-colour-muted);
    line-height: var(--bn-text-badge-lh);
}

.codebook-body {
    padding: 0 0 0.25rem;
}

/* ── Eye-toggle interaction design ────────────────────────────────
   Two levels: group eye + framework eye. Visual declutter only —
   NOT data filtering. See design doc for full interaction spec.
   ────────────────────────────────────────────────────────────── */

/* Framework-level eye — hidden by default, visible on summary hover */
.codebook-eye {
    flex-shrink: 0;
    background: none;
    border: none;
    padding: 2px;
    color: var(--bn-colour-border-hover);
    cursor: pointer;
    transition: color var(--bn-transition-fast), opacity var(--bn-transition-fast);
    margin-top: 0.1rem;
    opacity: 0;
    pointer-events: none;
}

.codebook-framework > summary:hover .codebook-eye {
    opacity: 1;
    pointer-events: auto;
}

.codebook-eye:hover {
    color: var(--bn-colour-muted);
}

/* When framework is hidden, eye is always visible (closed-eye affordance) */
.codebook-framework.eye-hidden > summary .codebook-eye {
    opacity: 1;
    pointer-events: auto;
}

/* ── Group header with subtitle ───────────────────────────────── */

.tag-filter-group-header-row {
    display: flex;
    align-items: flex-start;
    gap: var(--bn-space-sm);
    /* Left padding aligns with framework title text
       (summary padding 0.85rem + chevron 0.85rem + gap 0.5rem = 2.2rem) */
    padding: var(--bn-space-sm) 0.5rem 0.1rem 2.2rem;
}

.tag-filter-group-info {
    flex: 1;
    min-width: 0;
}

.tag-filter-group-name {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
}

.tag-filter-group-subtitle {
    font-size: var(--bn-text-micro);
    color: var(--bn-colour-muted);
    line-height: var(--bn-text-micro-lh);
}

/* Group-level eye — hidden by default, visible on group hover */
.group-eye {
    flex-shrink: 0;
    background: none;
    border: none;
    padding: 2px;
    color: var(--bn-colour-border-hover);
    cursor: pointer;
    transition: color var(--bn-transition-fast), opacity var(--bn-transition-fast);
    margin-top: 0.05rem;
    opacity: 0;
    pointer-events: none;
}

.tag-filter-group:hover .group-eye {
    opacity: 1;
    pointer-events: auto;
}

.group-eye:hover {
    color: var(--bn-colour-muted);
}

/* ── Hidden group state (eye closed) ──────────────────────────── */
/* Group name goes grey, subtitle + tags hidden,
   closed-eye icon always visible as affordance to reopen. */

.tag-filter-group.eye-hidden .tag-filter-group-name {
    color: var(--bn-colour-muted);
}

.tag-filter-group.eye-hidden .tag-filter-group-subtitle,
.tag-filter-group.eye-hidden .tag-filter-group-tags {
    display: none;
}

.tag-filter-group.eye-hidden .group-eye {
    opacity: 1;
    pointer-events: auto;
}

/* ── Hidden framework state ───────────────────────────────────── */

.codebook-framework.eye-hidden .codebook-title,
.codebook-framework.eye-hidden .codebook-author {
    color: var(--bn-colour-muted);
}

.tag-filter-group-tags {
    padding: 0;
}

/* ── Tag row (badge + micro-bar pattern) ──────────────────────── */

.tag-sidebar .tag-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: var(--bn-space-sm);
    padding: 3px 0.5rem;
    border-radius: var(--bn-radius-sm);
    /* No row-level hover — each zone (checkbox, badge, bar+count)
       has its own hover affordance so the three actions are distinct. */
}

.tag-sidebar .tag-checkbox-label {
    display: inline-flex;
    align-items: center;
    min-width: 24px;
    flex-shrink: 0;
    cursor: pointer;
    border-radius: var(--bn-radius-sm);
    padding: 2px;
    margin: -2px;
    transition: background var(--bn-transition-fast);
}

.tag-sidebar .tag-checkbox-label:hover {
    background: var(--bn-hover-bg-subtle);
}

.tag-sidebar .tag-name-area {
    display: flex;
    align-items: center;
    gap: var(--bn-space-md);
    min-width: 0;
}

/* Badge — matches design system atom: mono font, small, rounded rect */
.tag-sidebar .badge {
    display: inline-block;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    padding: var(--bn-space-xs) 0.45rem;
    border-radius: var(--bn-radius-sm);
    background: var(--bn-colour-badge-bg);
    color: var(--bn-colour-badge-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 14rem;
}

/* Assignable badge — cursor and hover hint when quotes are selected */
.tag-sidebar .badge.badge-assignable {
    cursor: copy;
    transition: filter var(--bn-transition-fast);
}

.tag-sidebar .badge.badge-assignable:hover {
    filter: brightness(1.1);
}

/* Micro histogram bar + count */
.tag-sidebar .tag-bar-area {
    display: flex;
    align-items: center;
    gap: var(--bn-space-xs);
    min-width: 50px;
    justify-content: flex-end;
}

.tag-sidebar .tag-micro-bar {
    height: 0.6rem;
    border-radius: var(--bn-radius-sm);
    min-width: 2px;
    transition: width var(--bn-transition-normal);
}
/* Two-tone stacked bar inherits from codebook-panel.css;
   sidebar only overrides transition timing. */
.tag-sidebar .tag-micro-bar-stack {
    transition: width var(--bn-transition-normal);
}
.tag-sidebar .tag-micro-bar-tentative,
.tag-sidebar .tag-micro-bar-accepted {
    transition: width var(--bn-transition-normal);
}

.tag-sidebar .tag-count {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    min-width: 16px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    /* Always reserve space for solo highlight so toggling is colour-only (no jump) */
    padding: 1px 6px;
    margin: -1px -6px;
    border-radius: var(--bn-radius-sm);
    background: transparent;
}

/* Accepted count in full ink; a proposals-only count keeps the muted base.
   Colour, not weight, carries the difference, so the count never outshouts
   the tag name. */
.tag-sidebar .tag-count.is-accepted {
    color: var(--bn-colour-text);
}

/* Group total row */
.tag-sidebar .group-total-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: var(--bn-space-sm);
    padding: var(--bn-space-xs) 0.5rem 0.25rem;
    border-top: 1px solid var(--bn-colour-border);
    margin-top: var(--bn-space-xs);
}

.tag-sidebar .group-total-label {
    font-size: var(--bn-text-badge);
    color: var(--bn-colour-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.tag-sidebar .group-total-count {
    font-size: var(--bn-text-caption);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-muted);
    font-variant-numeric: tabular-nums;
    min-width: 16px;
    text-align: right;
}

/* ── Solo / focus mode ─────────────────────────────────────────── */

/* Bar area (micro-bar + count): always clickable, hover affordance */
.tag-sidebar .tag-bar-area {
    cursor: pointer;
    border-radius: var(--bn-radius-sm);
    padding: 1px 4px;
    margin: -1px -4px;
}

.tag-sidebar .tag-bar-area:hover {
    background: var(--bn-colour-hover);
}

/* Dim all controls except bar areas when in solo mode */
.tag-solo-active .tag-sidebar-actions,
.tag-solo-active .tag-search-container,
.tag-solo-active .tag-sidebar-subtitle {
    opacity: 0.5;
    pointer-events: none;
    transition: opacity var(--bn-transition-fast);
}

.tag-solo-active .tag-checkbox-label,
.tag-solo-active .group-eye,
.tag-solo-active .codebook-eye,
.tag-solo-active .tag-filter-group-header-row,
.tag-solo-active .tag-filter-group-subtitle,
.tag-solo-active .group-total-row,
.tag-solo-active .badge {
    opacity: 0.5;
    pointer-events: none;
    transition: opacity var(--bn-transition-fast);
}

/* The focused tag row stays at full brightness */
.tag-solo-active .tag-row-solo-focused .tag-checkbox-label,
.tag-solo-active .tag-row-solo-focused .badge,
.tag-solo-active .tag-row-solo-focused .tag-bar-area {
    opacity: 1;
    pointer-events: auto;
}

/* "You are here" highlight on the active solo tag's count number —
   accent text + subtle blue wash. Geometry (padding/margin/radius) is on
   the base .tag-count so toggling this class is colour-only (no layout jump). */
.tag-sidebar .tag-count.tag-solo-focused {
    color: var(--bn-colour-accent);
    background: var(--bn-colour-hover);
}

/* --- organisms/signals.css --- */
/* ── Analysis page — signal cards + heatmap ─────────────────── */

/* Signal card list — ONE column, fused.
   The cards at a location read as one object: the seam between them is a
   card's own top border, so it runs the full width rather than stopping
   inside the padding. A rule inside a card would say these are sections of
   one thing; a border between cards says they are separate findings in one
   place, which is what they are.

   It was a responsive auto-fill grid. Two columns cannot fuse — CSS has no
   selector that knows which column a card landed in, because the count is
   decided at layout time — and the measure was poor for the prose anyway:
   the median elaboration runs 292 characters and the longest 529, which a
   26rem column sets badly. */
.signal-cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
}

/* Held to the reading width Discussion and Quotes' single column use,
   --bn-max-width (52rem), so a card's prose does not run the whole window
   (about 140 characters a line on a 14-inch laptop, 170 on a 16). Only the
   card stack: the page title, its rule and the stats block inside a card are
   untouched, the stats block still floating right with the text round it.
   Scoped to the SPA's .signals-center, so the sealed static report keeps the
   width it had. */
.signals-center .signal-cards {
    max-width: var(--bn-max-width);
}

/* Radius comes from position in the run. An only child is BOTH :first-child
   and :last-child, so it keeps all four corners with no rule of its own —
   which matters, because a location with one card is the common case. */
.signal-card:first-child {
    border-top-left-radius: var(--bn-radius-lg);
    border-top-right-radius: var(--bn-radius-lg);
}

.signal-card:last-child {
    border-bottom-left-radius: var(--bn-radius-lg);
    border-bottom-right-radius: var(--bn-radius-lg);
}

/* One hairline, not two abutting borders. */
.signal-card:not(:first-child) {
    border-top: none;
}

/* ...except on the selected card, whose keyline goes all the way round (owner,
   31 Oct 2026). Its top edge is drawn over the hairline it shares with the card
   above, pulled up by exactly one border so nothing shifts when selection moves. */
.signal-card.bn-selected:not(:first-child) {
    border-top: 1px solid var(--signal-card-selected-border, var(--bn-selection-border));
    margin-top: -1px;
    z-index: 1;
}

.signal-card {
    border: 1px solid var(--bn-colour-border);
    /* Pane tier (lg) — these are the largest cards in the app; sm (3px) read
       near-square on a 425px card and made the child .signal-card-quotes box
       (md) rounder than its parent (inverted nesting). lg outer / md inner is
       the correct decreasing nest. See docs/design-lens-template.md § Radii. */
    border-radius: 0;
    container-type: inline-size;
    padding: var(--bn-signal-card-inset);
    background: var(--bn-colour-bg);
    transition: box-shadow var(--bn-transition-fast);
    position: relative;
}

/* A shadow is a detached-object affordance. On a fused card it draws into the
   seam and reads as a rendering fault, so hover is a tint. */
.signal-card:hover {
    background: var(--bn-signal-accent-hover, var(--bn-colour-hover));
}

/* ONE signal ink, and the hover tint, derived from the signal's own hue (`--bn-signal-accent`,
   set on the card by SignalCard and on a navigation row by SignalEntry), so the chip's words,
   the selected card's keyline, the highlighted reason in an evidence bullet and the navigation's
   mini tag are one colour and the eye joins them (owner, 30 Oct 2026).

   The fallback is the old mix of the hue into the text colour. Where relative colour syntax
   exists, the ink is the hue pulled to a fixed lightness (0.42 on a light page, 0.82 on a dark
   one) with its chroma lifted 1.8x and CAPPED at 0.085 / 0.08, which keeps every hue inside
   sRGB. The first cap, 0.2, was far outside it: a browser clips the out-of-range channels, so
   the oranges (frustration, confusion, surprise) collapsed to (156,0,0), a danger red, in the
   light appearance (re-measured 30 Oct 2026). At the cap, frustration is a dark orange-brown
   (117,58,35). Contrast was measured against every codebook and sentiment hue on the card, the
   pale highlight, the chip fill and the sidebar, light and dark: AA holds with room to spare.
   Hover is the INK at 4%: the system hover's 4% of black draws a colour distance of about 18 on
   white, and 4% of the pastel hue drew only 6 to 8, which no one could see; 4% of the ink draws
   11 to 15, below the selected wash (10% of the hue, 14 to 19) for every colour set, light and
   dark (a 5% dark hover measured above the selected wash for the sentiment set). */
.signal-card,
.signal-entry {
    --bn-signal-accent-ink: color-mix(in srgb, var(--bn-signal-accent, var(--bn-colour-accent)) 72%, var(--bn-colour-text));
    --bn-signal-accent-hover: color-mix(in srgb, var(--bn-signal-accent-ink) 4%, var(--bn-colour-bg));
}

@supports (color: oklch(from red l c h)) {
    .signal-card,
    .signal-entry {
        --bn-signal-accent-ink: light-dark(
            oklch(from var(--bn-signal-accent, var(--bn-colour-accent)) 0.42 min(calc(c * 1.8), 0.085) h),
            oklch(from var(--bn-signal-accent, var(--bn-colour-accent)) 0.82 min(calc(c * 1.8), 0.08) h)
        );
    }
}

.signal-card .signal-card-hero {
    color: var(--bn-signal-accent-ink, inherit);
}

/* A card scrolled to from the list or the heatmap lands with its top edge, keyline
   included, just inside the viewport. The first card on a page scrolls the whole
   lens column instead, so its title is read with it and rests at the same height
   it has on first paint, not flush with the top edge or the toolbar seam. */
.signal-card {
    scroll-margin-top: var(--bn-space-md);
}

.signals-center {
    scroll-margin-top: var(--bn-space-xl);
}

/* Selected signal card — a restrained tint derived from the signal's group or
   sentiment hue. Shows which card the inspector is displaying. */
.signal-card.bn-selected {
    background: var(--signal-card-selected-bg, var(--bn-selection-bg));
    border-color: var(--signal-card-selected-border, var(--bn-selection-border));
}

/* One card-local analytical hue connects the selected keyline to the card's
   classification and its attributable evidence. The values are assigned once
   by SignalCard; individual descendants must not pick their own palette. */
/* The hero floats into the card's top-right corner and the headline AND the
   elaboration flow around and under it.

   It was a flex row with the elaboration inside the left child, which meant
   the elaboration could not reach the space beneath the chip — the gutter was
   unreachable by construction, and a long finding left a column of white
   beside a column of text.

   A float only affects content that FOLLOWS it, so `.signal-card-right` is
   emitted first in the markup — which costs reading order. See the note on
   `.signal-card-identity` below. */
.signal-card-top {
    display: block;
    margin-bottom: var(--bn-space-sm);
}

.signal-card-right {
    float: right;
    margin: 0 0 var(--bn-space-sm) var(--bn-space-lg);
}

/* A plain block. It is emitted AFTER the floated hero so the float catches it:
   a block box beside a float does not move aside, but its line boxes shorten,
   which is the wrap. `flex: 1; min-width: 0` lived here for the old flex row
   and does nothing now.

   THE COST, stated because it is real and unfixed: the hero is emitted first,
   so a screen reader announces "Frustration 0.42, button" before the finding's
   name. `order` does NOT fix this — it reorders the visual rendering only, and
   is a well-known accessibility trap for exactly this reason. Fixing it needs
   either a DOM order a float cannot use, or the chip absolutely positioned,
   which loses the wrap. Recorded in design-signal-card.md rather than papered
   over. */
.signal-card-identity {
    min-width: 0;
}

/* VANILLA-RENDERER ONLY as of 20 Sep 2026. The React lens stopped emitting
   this when the eyebrow was removed — the location is the heading now — but
   theme/js/analysis.js:173 still writes it, so the rule is live on the static
   byproduct and is not dead code. Grep frontend/src alone and it looks
   deletable; it isn't. */
.signal-card-source {
    display: block;
    font-size: var(--bn-text-badge);
    line-height: var(--bn-text-badge-lh);
    font-weight: var(--bn-weight-normal);
    /* Natural case, as the data has it. Uppercase made "Shopping Bag" look
       like a category rather than a place, which is not how the Quotes lens
       renders the same string — and the two lenses name the same things. */
    letter-spacing: 0.02em;
    color: var(--bn-colour-muted);
    margin-bottom: 0.1rem;
}

.signal-card-location {
    font-size: var(--bn-text-signal-title);
    line-height: var(--bn-text-signal-title-lh);
    letter-spacing: var(--bn-track-signal-title);
    font-weight: var(--bn-weight-signal-title);
    margin-bottom: var(--bn-space-md);
}

.signal-card-location-link {
    color: inherit;
    text-decoration: none;
    transition: color var(--bn-transition-fast);
}

.signal-card-location-link:hover {
    color: var(--bn-colour-accent);
}

.signal-card-location-link:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: 2px;
    border-radius: var(--bn-radius-sm);
}

/* Metrics grid (label | value | viz) */
.signal-card-metrics {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: auto auto auto;
    gap: 0.2rem 0.6rem;
    align-items: center;
    font-size: var(--bn-text-label);
    white-space: nowrap;
}

.metric-label {
    color: var(--bn-colour-muted);
    text-align: right;
    cursor: help;
}

/* The metric names come in two lengths ("Concentration ratio", "Conc."). The long one is the
   default; the short one takes over when the card is narrow. The hidden one is display:none,
   so a screen reader reads only the one on screen.

   Owner's rule (13 Nov 2026): long labels from a 654px CARD up to the card's 832px cap (52rem),
   short below it. 654px is the card width at which a headline of about 90 characters, with the
   long labels beside it, still sets in four lines; narrower, the long labels squeeze it further.
   A container query measures the card's CONTENT box, so the figure is the card's width less its
   own padding and border (2 x 3rem + 2px): 556px, or 34.75rem. Change the card's inset and this
   number moves with it. */
.metric-label-short {
    display: none;
}

@container (max-width: 34.75rem) {
    .metric-label-long {
        display: none;
    }

    .metric-label-short {
        display: inline;
    }
}

/* Figures — values, counts and scores — set in the body face with tabular numerals, not mono:
   alignment without a change of voice, as SwiftUI's .monospacedDigit() does natively
   (docs/design-monospace-roles.md §4). Codes that happen to be digits stay mono. */
.metric-value {
    font-family: var(--bn-font-body);
    font-variant-numeric: tabular-nums;
    font-size: var(--bn-text-label);
    color: var(--bn-colour-text);
    text-align: right;
}

.metric-viz {
    display: flex;
    align-items: center;
}

/* Concentration bar */
.conc-bar-track {
    display: block;
    width: 96px;
    height: 6px;
    background: var(--bn-colour-border);
    border-radius: var(--bn-radius-sm);
    overflow: hidden;
}

.conc-bar-fill {
    display: block;
    height: 100%;
    border-radius: var(--bn-radius-sm);
    background: var(--bn-colour-text);
    opacity: 0.45;
    transition: width 0.3s ease;
}

/* Intensity dots (SVG) */
.intensity-dots-svg {
    display: flex;
    align-items: center;
    gap: 2px;
    width: 46px;
}

/* Quote list inside signal card */
.signal-card-quotes {
    /* Below the float, not beside it. */
    clear: both;
    background: var(--bn-colour-quote-bg);
    border-radius: var(--bn-radius-md);
    margin: var(--bn-signal-card-section-gap) 0;
    padding: var(--bn-signal-card-quote-inset) 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
}

.signal-card-quotes blockquote {
    margin: 0 var(--bn-signal-card-quote-inset);
}

.signal-card-quotes blockquote + blockquote {
    margin-top: var(--bn-signal-card-evidence-gap);
}

.signal-card-quotes blockquote .intensity-dots {
    float: right;
    width: 46px;
    cursor: help;
    margin: var(--bn-space-xs) 0 var(--bn-space-xs) var(--bn-space-md);
    --dot-colour: var(--bn-colour-muted);
}

/* Expansion animation */
.signal-card-expansion {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.25s ease;
}

.signal-card.expanded .signal-card-expansion {
    opacity: 1;
    /* max-height set by JS */
}

.signal-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: var(--bn-signal-card-footer-gap);
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
}

/* A quote in a card is the Quotes lens's own row (organisms/blockquote.css): a flex row, the
   timecode in a gutter on the baseline of the first line, the words hanging beside it. The
   intensity circles are the first thing in the body, floated into its top-right corner, so the
   words flow around them (owner, 30 Oct 2026). Before this the row was floated by hand, the
   circles came after the text and drew at the bottom of the quote, and the timecode sat 3px
   above the text's baseline. */

/* Evidence contribution array — contribution strength, not participant identity. */
.evidence-contribution-array {
    display: flex;
    gap: 3px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.evidence-contribution-cell {
    display: inline-block;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-micro);
    line-height: var(--bn-text-micro-lh);
    min-width: 1.55rem;
    height: 1.25rem;
    padding: var(--bn-space-xs) 0.2rem;
    text-align: center;
    border-radius: var(--bn-radius-sm);
    border: 1px solid color-mix(in srgb, var(--bn-colour-muted) 32%, transparent);
    background: transparent;
    color: var(--bn-colour-muted);
}

.evidence-contribution-cell.strength-1,
.evidence-contribution-cell.strength-2,
.evidence-contribution-cell.strength-3 {
    border-color: transparent;
    color: var(--bn-colour-bg);
}

.evidence-contribution-cell.strength-1 {
    background: color-mix(in srgb, var(--card-accent, var(--bn-colour-muted)) 35%, var(--bn-colour-muted));
}

.evidence-contribution-cell.strength-2 {
    background: color-mix(in srgb, var(--card-accent, var(--bn-colour-muted)) 58%, var(--bn-colour-muted));
}

.evidence-contribution-cell.strength-3 {
    background: color-mix(in srgb, var(--card-accent, var(--bn-colour-muted)) 80%, var(--bn-colour-muted));
}

@container (max-width: 35rem) {
    .evidence-contribution-array {
        gap: 3px;
        flex-wrap: nowrap;
    }

    .evidence-contribution-cell {
        min-width: 0;
        width: 0.65rem;
        height: 1rem;
        padding: 0;
        font-size: 0;
    }
}

/* The frozen static renderer still emits the former binary presence grid.
   Keep it readable until that renderer adopts EvidenceContributionArray. */
.participant-grid {
    display: flex;
    gap: 3px;
    align-items: center;
    flex-wrap: wrap;
}

.participant-grid .p-box {
    display: inline-block;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    padding: var(--bn-space-xs) 0.45rem;
    border-radius: var(--bn-radius-sm);
    line-height: 1;
    background: var(--bn-colour-border);
    color: var(--bn-colour-muted);
    opacity: 0.6;
}

.participant-grid .p-box.p-present {
    background: color-mix(in srgb, var(--card-accent, var(--bn-colour-muted)) 30%, var(--bn-colour-bg));
    color: var(--bn-colour-text);
    opacity: 1;
}

.signal-card-link {
    color: var(--bn-colour-accent);
    text-decoration: none;
    font-weight: var(--bn-weight-normal);
}

.signal-card-link:hover { text-decoration: underline; }

/* Button variant of .signal-card-link — expand/collapse toggle on signal cards.
   Semantically a button (toggles local state), not a link (no navigation).
   Resets default <button> chrome so it renders identical to the anchor variant. */
button.signal-card-toggle {
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    cursor: pointer;
}

/* Confidence badge — hidden from UI, preserved for future */
.confidence-badge {
    display: inline-block;
    font-size: var(--bn-text-micro);
    font-weight: var(--bn-weight-emphasis);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.15rem 0.5rem;
    border-radius: var(--bn-radius-sm);
}

.confidence-strong  { background: light-dark(#9ca3af, #9ca3af); color: light-dark(#fff, #111); }
.confidence-moderate { background: light-dark(#c9cdd3, #6b7280); color: light-dark(var(--bn-colour-badge-text), var(--bn-colour-text)); }
.confidence-emerging { background: light-dark(var(--bn-colour-border), #4b5563); color: var(--bn-colour-muted); }

/* ── Heatmap ──────────────────────────────────────────────── */

/* `.analysis-heatmap` keeps its name deliberately: the frozen vanilla
   renderer emits it (theme/js/analysis.js:314) and that file takes
   data-integrity fixes only. The static byproduct keeps the analysis
   vocabulary throughout — see docs/design-signals-rename.md §6.3. */
.analysis-heatmap {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--bn-text-label);
    margin-bottom: var(--bn-space-xl);
}

.analysis-heatmap th {
    text-align: center;
    padding: 0.5rem 0.3rem;
    font-weight: var(--bn-weight-emphasis);
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    border-bottom: 2px solid var(--bn-colour-border);
    white-space: nowrap;
}

.analysis-heatmap th .badge { font-weight: var(--bn-weight-emphasis); }

.analysis-heatmap th:first-child {
    text-align: left;
    min-width: 140px;
}

.analysis-heatmap td {
    text-align: center;
    padding: 0.45rem 0.4rem;
    border-bottom: 1px solid var(--bn-colour-border);
    transition: background 0.15s;
}

.analysis-heatmap td:first-child {
    text-align: left;
    font-weight: var(--bn-weight-emphasis);
    font-size: var(--bn-text-label);
    padding-right: var(--bn-space-md);
}

/* Cell colouring — inline oklch background set by JS */
.heatmap-cell {
    font-family: var(--bn-font-body);
    font-variant-numeric: tabular-nums;
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
    border-radius: var(--bn-radius-sm);
    min-width: 36px;
    position: relative;
    cursor: pointer;
    transition: background 0.15s, outline 0.1s;
}

.heatmap-cell:hover {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -1px;
}

.heatmap-cell[data-count="0"] {
    color: var(--bn-colour-border);
    cursor: default;
}

.heatmap-cell[data-count="0"]:hover { outline: none; }

.heatmap-cell[data-count="1"] {
    color: light-dark(#c9cdd3, #555);
    cursor: default;
}

.heatmap-cell[data-count="1"]:hover { outline: none; }

.heatmap-cell.heat-strong { color: light-dark(#fff, #111); }

.heatmap-total {
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-muted);
    background: transparent !important;
    cursor: default;
}

.heatmap-total:hover { outline: none; }

.heatmap-grand-total {
    font-weight: var(--bn-weight-strong);
}

.heatmap-cell.has-card { cursor: pointer; }
.heatmap-cell:not(.has-card) { cursor: default; }
.heatmap-cell:not(.has-card):hover { outline: none; }

/* ── Fixed-width columns for tag heatmaps (rotated headers) ── */

.analysis-heatmap th.heatmap-col-header {
    width: 56px;
    min-width: 56px;
    max-width: 56px;
    height: 6rem;
    vertical-align: bottom;
    padding: 0 0.2rem 0.3rem;
    overflow: visible;
}

.heatmap-col-label {
    display: inline-block;
    transform: rotate(-30deg);
    transform-origin: left bottom;
    white-space: nowrap;
    font-size: var(--bn-text-caption);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-muted);
}

/* ── Signal card badge styles ──────────────────────────────── */

/* .signal-group-badge — removed 13 Sep 2026. The group name is the hero
   chip's own label now, and no caller remains in frontend/src or in the
   frozen vanilla renderer. A rule that can never match is worse than no
   rule — it reads as live styling while styling nothing. */

.signal-quote-tag {
    margin-left: 0.4rem;
    font-size: var(--bn-text-badge);
    vertical-align: middle;
}

/* ── Per-codebook section heading ─────────────────────────── */

.signals-codebook-section {
    margin-bottom: var(--bn-space-xl);
}


.signals-heatmap-label {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-muted);
    margin: var(--bn-space-md) 0 var(--bn-space-xs);
}

/* ── Cell tooltip (context-only micro) ───────────────────── */

.cell-tooltip {
    position: absolute;
    z-index: 10;
    transform: translateX(-50%);
    pointer-events: none;
    max-width: 270px;
    width: max-content;
    background: var(--bn-colour-bg);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-md);
    box-shadow: 0 4px 16px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    overflow: hidden;
    animation: cell-tooltip-in 0.12s ease-out;
}

@keyframes cell-tooltip-in {
    from { opacity: 0; transform: translateX(-50%) translateY(4px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* Left accent bar */
.cell-tooltip::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    border-radius: 1px 0 0 1px;
    background: var(--tip-accent, var(--bn-colour-muted));
}

.cell-tooltip-body {
    padding: 0.45rem 0.6rem 0.45rem 0.7rem;
}

/* Metrics row */
.cell-tooltip-metrics {
    display: flex;
    gap: 0.6rem;
    align-items: center;
    font-family: var(--bn-font-body);
    font-variant-numeric: tabular-nums;
    font-size: var(--bn-text-micro);
    line-height: var(--bn-text-micro-lh);
    color: var(--bn-colour-muted);
    margin-bottom: 0.25rem;
}

.cell-tooltip-val {
    color: var(--bn-colour-text);
    font-weight: var(--bn-weight-emphasis);
}

/* Participant pips */
.cell-tooltip-pips {
    display: flex;
    gap: 3px;
    align-items: center;
    margin-left: auto;
}

.cell-tooltip-pip {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--tip-accent, var(--bn-colour-accent));
    opacity: 0.7;
}

.cell-tooltip-pip.absent {
    background: var(--bn-colour-border);
    opacity: 0.4;
}

/* Quotes */
.cell-tooltip-quotes {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
}

.cell-tooltip-quote {
    font-size: var(--bn-text-badge);
    line-height: var(--bn-text-badge-lh);
    display: flex;
    gap: 0.3rem;
    align-items: flex-start;
}

.cell-tooltip-quote::before {
    content: "\201C";
    color: var(--bn-colour-muted);
    font-size: var(--bn-text-label);
    line-height: 1;
    flex-shrink: 0;
}

.cell-tooltip-quote-text {
    flex: 1;
    min-width: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--bn-colour-text);
}

.cell-tooltip-speaker {
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-micro);
    color: var(--bn-colour-muted);
    white-space: nowrap;
    flex-shrink: 0;
    align-self: flex-end;
}

.cell-tooltip-footer {
    font-family: var(--bn-font-body);
    font-variant-numeric: tabular-nums;
    font-size: var(--bn-text-micro);
    color: var(--bn-colour-muted);
    margin-top: 0.2rem;
}

/* ── Header highlighting on cell hover ───────────────────── */

.heatmap-header-hl {
    background: var(--bn-colour-hover);
    transition: background var(--bn-transition-fast);
}

.heatmap-row-hl {
    background: var(--bn-colour-hover);
    transition: background var(--bn-transition-fast);
}

/* ── Quote sequences ───────────────────────────────────── */

.signal-card-quotes blockquote.seq-middle,
.signal-card-quotes blockquote.seq-last {
    padding-top: 0;
    margin-top: calc(-1 * var(--bn-space-xs));
}

.signal-card-quotes blockquote.seq-middle .timecode,
.signal-card-quotes blockquote.seq-last .timecode {
    opacity: 0.6;
}

/* ── Signal elaboration ──────────────────────────────────────── */

/* Right-side column: badges, rank, sparkbars, metrics.
   Replaces the flat .signal-card-metrics when elaboration is present. */
.signal-card-right {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: var(--bn-space-sm);
}

/* Badge row: group name + pattern type */
/* ── The hero chip ────────────────────────────────────────────────────────
   The card's one number, and the control that opens the working. It sits on
   `.badge` for the tint and the mono face, and adds the size, the disclosure
   affordance and the button reset — most readers need one number, and the four
   metrics behind it are for whoever wants to audit it. */
.signal-card-hero {
    display: inline-flex;
    align-items: baseline;

    /* TWO STEPS DOWN the ladder, 20 Sep 2026. It was --bn-text-body with
       --bn-space-sm/md padding, on the reasoning that it is "the hero of this
       corner". That was true when the card had no headline worth reading —
       every card has one now, and the chip's job is to confirm direction and
       give a sortable number while the headline and the claim carry the
       finding. A scan aid, not the thing being read.

       --bn-space-sm between label and score: at xs they collided outright
       ("Mixed sentiments0.30"). */
    font-size: var(--bn-text-label);
    line-height: var(--bn-text-label-lh);
    padding: var(--bn-space-xs) var(--bn-space-sm);
    gap: var(--bn-space-sm);

    border: 1px solid transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
}

.signal-card-hero:hover {
    border-color: var(--bn-signal-accent-ink, var(--bn-colour-border-hover));
}

.signal-card-hero:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: 2px;
}

.signal-card-hero-score {
    font-family: var(--bn-font-body);
    font-variant-numeric: tabular-nums;
    font-weight: var(--bn-weight-emphasis);
}

/* Always drawn, just quiet: a control has to read as a control BEFORE the
   pointer arrives, and this chip is otherwise indistinguishable from the
   tinted chips on the same card that do nothing when clicked. */
.signal-card-hero-caret {
    font-size: var(--bn-text-micro);
    opacity: 0.4;
    transition: transform var(--bn-transition-fast), opacity var(--bn-transition-fast);
}

.signal-card-hero:hover .signal-card-hero-caret,
.signal-card-hero:focus-visible .signal-card-hero-caret {
    opacity: 0.85;
}

.signal-card-hero[aria-expanded="true"] .signal-card-hero-caret {
    transform: rotate(180deg);
    opacity: 0.85;
}

@media (prefers-reduced-motion: reduce) {
    .signal-card-hero-caret,
    .signal-card-expansion {
        transition: none;
    }
}

/* .signal-card-badges — removed 13 Sep 2026, with its narrow-viewport
   override. The hero is the only thing in this corner now, and the metrics sit
   under it when opened. */

/* Pattern badge — coloured allcaps label.
   Opacity 0.9 knocks text back 10% — heavy weight + allcaps reads
   darker than it is, so pulling back keeps visual weight balanced. */
.pattern-label {
    display: inline-block;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    font-weight: var(--bn-weight-starred);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: var(--bn-space-xs) 0.45rem;
    border-radius: var(--bn-radius-sm);
    opacity: 0.9;
}

.pattern-success  { background: light-dark(#dcfce7, #14532d); color: light-dark(#166534, #86efac); }
.pattern-tension  { background: light-dark(#fef3c7, #451a03); color: light-dark(#92400e, #fcd34d); }
.pattern-gap      { background: light-dark(#fee2e2, #450a0a); color: light-dark(#991b1b, #fca5a5); }
.pattern-recovery { background: light-dark(#e0f2fe, #0c4a6e); color: light-dark(#075985, #7dd3fc); }

/* .signal-rank — removed 20 Sep 2026. No consumer anywhere in the tree:
   not the React lens, not the frozen vanilla renderer, not a template. */

/* Mini sparkbar chart — inline in the Signal metric row.
   Width matches conc-bar-track (96px). Bar count = signal card count.
   Current card's bar uses var(--card-accent); all others grey. */
.signal-sparkbars {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 28px;
    width: 96px;
}

.signal-sparkbar {
    width: 12px;
    border-radius: 1px 1px 0 0;
    min-height: 2px;
}

/* Signal elaboration — the finding below the signal name.
   Ranked by `atoms/lead-paragraph.css`: the core assertion in normal ink, the
   evidence and nuance after it in a tint. This card originated the idea and
   originated it the other way — same colour throughout, heavier lead via
   `--bn-weight-starred` — and was converted on 31 Aug 2026 so it and the
   codebook description cannot say the same thing differently. The atom owns
   colour and weight; do not restore either here, because an organism rule
   wins the tie on source order and would silently defeat it. Alternatives are
   live in `docs/mockups/lead-sentence-playground.html`. */
.signal-elaboration {
    font-family: var(--bn-font-editorial);
    font-size: var(--bn-text-signal-claim);
    line-height: var(--bn-text-signal-claim-lh);
    letter-spacing: var(--bn-track-signal-claim);
    --bn-lead-weight: var(--bn-weight-signal-claim);
    --bn-lead-rest-weight: var(--bn-weight-signal-claim);
    max-inline-size: 76ch;
    margin-bottom: var(--bn-space-lg);
}

/* Generated assertions are a compact, attributable explanation of the claim,
   not a second headline. Native list flow gives the marker a real hanging
   indent: continuation lines begin under the text, never under the bullet. */
.signal-evidence-assertions {
    margin: 0 0 var(--bn-signal-card-section-gap);
    padding-inline-start: var(--bn-space-lg);
    color: var(--bn-colour-muted);
    font-family: var(--bn-font-body);
    font-size: var(--bn-text-body);
    line-height: var(--bn-text-body-lh);
}

.signal-evidence-assertions li + li {
    margin-top: var(--bn-signal-card-assertion-gap, var(--bn-space-sm));
}

/* This is deliberately an inline marker, not a badge. `clone` gives a wrapped
   causal unit an intentional continuation without forcing it onto a new line. */
.signal-evidence-highlight {
    display: inline;
    color: var(--bn-signal-accent-ink, var(--bn-colour-text));
    background: var(--bn-signal-accent-highlight, var(--bn-colour-hover));
    border-radius: var(--bn-radius-sm);
    padding-inline: 0.08em;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
}

/* The highlighted words in an evidence bullet are a control: hover says they can be pressed,
   and pressing flashes the quote they came from (the same arrival flash as every link).
   A span with role=button around the mark (not a <button>: a button is laid out as one
   unbreakable box and would not wrap with the sentence). */
.signal-evidence-highlight-button {
    /* An inline span, so a long phrase wraps with the sentence it is in. */
    cursor: pointer;
}

.signal-evidence-highlight-button:hover .signal-evidence-highlight,
.signal-evidence-highlight-button:focus-visible .signal-evidence-highlight {
    background: color-mix(in srgb, var(--bn-signal-accent, var(--bn-colour-accent)) 30%, var(--bn-colour-bg));
}

.signal-evidence-highlight-button:focus-visible {
    outline: 2px solid var(--bn-signal-accent-keyline, var(--bn-colour-accent));
    outline-offset: 2px;
    border-radius: var(--bn-radius-sm);
}

/* The speaker badge after a bullet keeps a small gap from the sentence. */
.signal-evidence-assertions .speaker-link,
.signal-evidence-assertions .bn-person-badge {
    margin-inline-start: var(--bn-space-xs);
}

/* ── Responsive: narrow CARD — stack the top, by the card's own width ──
   This was a viewport query (500px). A card is narrow whenever the window is shared with both
   side panels, which is a wide window, so the right column kept its 210 to 266px and left the
   headline 85px (six lines of one or two words at a 420px card). The card is the container, so
   the top stacks when the card's content is under 27.5rem: a 540px card, less its 98px of
   padding and border (13 Nov 2026). */
@container (max-width: 27.5rem) {
    /* Stacked, the order is the finding's name, then the chip and its working, then the headline
       and evidence. The chip is first in the DOM so the float can catch the headline, which is
       why unfloated it would draw above the name. `display: contents` on the identity block
       hands its children to this flex column so `order` can interleave the chip between them.
       Visual order only: a screen reader already reads the chip first, and still does. The
       spacing is the children's own margins, so no gap. */
    .signal-card-top {
        display: flex;
        flex-direction: column;
    }

    .signal-card-identity {
        display: contents;
    }

    .signal-card-identity > * {
        order: 2;
    }

    .signal-card-identity > .signal-card-location {
        order: 0;
    }

    .signal-card-metrics {
        align-self: flex-start;
    }

    /* The float's `margin-left` (the gutter to the wrapping text) is meaningless once the hero is
       a full-width block, and left in place it indents the chip and the metrics a gutter's width
       in from the headline's left edge. Zero it, and give the bottom edge the room the headline
       needs, since it now sits directly under the metrics. */
    .signal-card-right {
        order: 1;
        float: none;
        align-items: flex-start;
        align-self: stretch;
        margin: 0 0 var(--bn-space-md);
    }
}

/* A small viewport also tightens the card's own padding (a container query cannot restyle its
   container). */
@media (max-width: 500px) {
    .signal-card {
        padding: var(--bn-space-lg);
    }
}

/* The flag, as a prefix INSIDE the hero chip — never a second chip. A second
   one was rejected on 20 Sep 2026: "two chips is too complex visually, adds
   confusion — the eye will jump to a single patch of colour." The chip's job
   is to be the one thing the eye lands on in that corner, and splitting it
   into two competing patches destroys that. It is the same failure the
   `pattern` chip had on 13 Sep, which "competed with the score for this exact
   corner".

   Weight rather than colour: colour here would make a second patch by another
   route. */
.signal-card-hero-flag {
    font-weight: var(--bn-weight-emphasis);
    opacity: 0.78;
}

/* The quote that took the slot reserved for a dissenting voice.
   Marked so a reader can see the card is not only agreeing with itself — "a
   very strong one in five, said clearly and with feeling, has earned the right
   to be seen". A rule on the leading edge rather than a tint or a badge: it is
   a provenance mark, not a status, and the quote's own words should carry the
   weight. */
