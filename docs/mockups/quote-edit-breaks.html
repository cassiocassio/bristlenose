       --bn-selection-border) are BOTH (0,2,1), and selection sits later in this
       file — so on a card that is focused *and* selected, selection took the
       edge and you got 2px of blue on the left against 1px of ring everywhere
       else. Visible, and distracting, precisely on the card you're working on.

       Light keeps the selection edge: there is no ring in light, so nothing
       doubles up and the edge is a real cue. Dark goes transparent and lets the
       ring carry a single thin line the whole way round. Pinned by
       `test_focused_and_selected_states_the_left_edge`. */
    border-left-color: light-dark(var(--bn-selection-border), transparent);
}

/* ---------------------------------------------------------------------
   Inactive window — selection dims to grey (macOS convention)
   Body class toggled by React (AppLayout) on window blur/focus.
   --------------------------------------------------------------------- */

.bn-window-inactive .bn-focused {
    box-shadow: none;
}

.bn-window-inactive blockquote.quote-card.bn-focused {
    box-shadow: none;
}

.bn-window-inactive .bn-selected {
    background: var(--bn-selection-bg-inactive);
    border-left-color: var(--bn-selection-border-inactive);
}

.bn-window-inactive blockquote.quote-card.bn-selected {
    background: var(--bn-selection-bg-inactive);
    border-left-color: var(--bn-selection-border-inactive);
}

.bn-window-inactive .bn-focused.bn-selected {
    box-shadow: none;
    background: var(--bn-selection-bg-inactive);
}

.bn-window-inactive blockquote.quote-card.bn-focused.bn-selected {
    box-shadow: none;
    background: var(--bn-selection-bg-inactive);
}

/* ---------------------------------------------------------------------
   Preference: disable animations
   Applied via preferences.js when animations_enabled = false
   --------------------------------------------------------------------- */

.bn-no-animations *,
.bn-no-animations *::before,
.bn-no-animations *::after {
    animation-duration: 0s !important;
    animation-delay: 0s !important;
    transition-duration: 0s !important;
    transition-delay: 0s !important;
}

/* ---------------------------------------------------------------------
   Preference: hide AI-generated tags
   Applied via preferences.js when ai_tags_visible = false
   --------------------------------------------------------------------- */

.bn-hide-ai-tags [data-badge-type="ai"] {
    display: none !important;
}

/* --- atoms/checkbox.css --- */
/* Atom: checkbox — ghost-style custom checkbox.
   Replaces native checkbox appearance with a subtle bordered square and
   a muted tick mark. Designed to recede visually (ghost pattern) while
   remaining functional and accessible.

   Usage: <input type="checkbox" class="bn-checkbox">
   Or apply to any input[type="checkbox"] inside a scoped container. */

.bn-checkbox {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border: 1px solid var(--bn-colour-border);
    border-radius: 2px;
    background: transparent;
    margin: 0;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    transition: border-color var(--bn-transition-fast), background var(--bn-transition-fast);
}

.bn-checkbox:checked {
    border-color: var(--bn-colour-border-hover);
    background: var(--bn-colour-quote-bg);
}

.bn-checkbox:checked::after {
    content: "";
    position: absolute;
    left: 3px;
    top: 0.5px;
    width: 5px;
    height: 9px;
    border: solid var(--bn-colour-muted);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
}

.bn-checkbox:hover {
    border-color: var(--bn-colour-border-hover);
}

/* --- atoms/modal.css --- */
/* Atom: modal — shared overlay backdrop, card, and close button.
   The React dialogs all draw this through one component, Dialog.tsx; the
   frozen static report's modal.js uses the same classes. The look is the macOS
   sheet, measured (tokens.css § Dialogs). A click on the backdrop never closes
   a dialog (24 Oct 2026): Escape and the dialog's own buttons do. */

/* Backdrop — fullscreen, centred. It fades in with the sheet's drop and out
   with its rise. */
.bn-overlay {
    position: fixed;
    inset: 0;
    background: var(--bn-overlay-scrim);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: var(--bn-overlay-z);
    opacity: 0;
    visibility: hidden;
    transition: opacity var(--bn-modal-exit) linear, visibility var(--bn-modal-exit) linear;
}

.bn-overlay.visible {
    opacity: 1;
    visibility: visible;
    transition: opacity var(--bn-modal-enter) linear, visibility 0s;
}

/* The sheet's motion. A transition takes the timing of the state it is going
   TO, so the resting rule carries the exit and `.visible` the entrance:
   in, it drops 32 pt and is solid early; out, it rises, fading with the
   backdrop, all at one pace. */
.bn-overlay .bn-modal {
    transform: translateY(calc(-1 * var(--bn-modal-offset)));
    opacity: 0;
    transition: transform var(--bn-modal-exit) linear, opacity var(--bn-modal-exit) linear;
}

.bn-overlay.visible .bn-modal {
    transform: none;
    opacity: 1;
    transition: transform var(--bn-modal-enter) var(--bn-modal-enter-ease),
        opacity var(--bn-modal-enter-fade) linear;
}

/* A dialog that mounts already open has no previous style to transition from,
   so it starts from here: the same resting state, for its first frame. */
@starting-style {
    .bn-overlay.visible {
        opacity: 0;
    }
    .bn-overlay.visible .bn-modal {
        transform: translateY(calc(-1 * var(--bn-modal-offset)));
        opacity: 0;
    }
}

@media (prefers-reduced-motion: reduce) {
    .bn-overlay .bn-modal,
    .bn-overlay.visible .bn-modal {
        transform: none;
    }
    @starting-style {
        .bn-overlay.visible .bn-modal {
            transform: none;
        }
    }
}

/* Modal card — centred, raised, with the sheet's radius and shadow.
   Default max-width suits confirmation dialogs; a dialog's own class sets
   its width (.feedback-modal 420px, .settings-modal 42rem). */
.bn-modal {
    position: relative;
    background: var(--bn-modal-bg);
    border-radius: var(--bn-modal-radius);
    padding: var(--bn-space-xl);
    width: 90%;
    max-width: 24rem;
    box-shadow: var(--bn-modal-shadow);
}

/* The card takes focus when nothing in it asks for it: a focus sink, not a
   control, so no ring (theme CLAUDE.md, focus sinks). */
.bn-modal:focus-visible {
    outline: none;
}

/* Widths for dialogs that had them inline. */
.bn-modal.bn-export-modal {
    max-width: 420px;
}

.bn-modal.bn-board-modal {
    max-width: 460px;
}

/* Modal heading */
.bn-modal h2 {
    margin: 0 0 var(--bn-space-lg) 0;
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
}

/* Close button — top right */
.bn-modal-close {
    position: absolute;
    top: var(--bn-space-md);
    right: var(--bn-space-md);
    background: none;
    border: none;
    font-size: var(--bn-text-heading);
    line-height: 1;
    color: var(--bn-colour-muted);
    cursor: pointer;
    padding: 0.25rem 0.4rem;
    border-radius: var(--bn-radius-sm);
    transition: color var(--bn-transition-fast), background var(--bn-transition-fast);
}

.bn-modal-close:hover {
    color: var(--bn-colour-text);
    background: var(--bn-colour-quote-bg);
}

/* Modal footer text */
.bn-modal-footer {
    margin: var(--bn-space-lg) 0 0 0;
    text-align: center;
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
}

/* Modal action buttons */
.bn-modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: var(--bn-space-sm);
    margin-top: var(--bn-space-lg);
}

/* THE BASE CARRIES A BACKGROUND. It did not, and every variant did — so a bare
   `.bn-btn` fell through to the user agent's own `buttonface`, painting a grey
   that is the BROWSER's and not ours. It reads as drab and slightly dead
   because it is unstyled, not because it is understated, and it drifts with
   whatever WebKit does next. Seven call sites were shipping it: both modals'
   default action, the codebook picker button, and the Install/Uninstall toggle
   on every card in both codebook lenses — where a destructive action and a
   constructive one were equally unstyled.

   The neutral bordered button is the right default for an element that already
   declares a border: it is what `.bn-btn-secondary` and `.bn-btn-cancel` both
   describe, so the base now simply IS that, and those two restate it rather
   than adding to it. Left in place — collapsing three names into one is a
   separate call, and a redundant class is harmless where an unstyled base was
   not.

   A variant still wins on source order, so `primary` and `danger` are
   unaffected. */
.bn-btn {
    font-family: inherit;
    font-size: var(--bn-text-label);
    padding: 0.4rem 1rem;
    border-radius: var(--bn-radius-md);
    border: 1px solid var(--bn-colour-border);
    background: var(--bn-colour-bg);
    color: var(--bn-colour-text);
    cursor: pointer;
    transition: background var(--bn-transition-fast), color var(--bn-transition-fast);
}

.bn-btn:hover {
    background: var(--bn-colour-quote-bg);
}


.bn-btn-cancel {
    background: var(--bn-colour-bg);
    color: var(--bn-colour-text);
}

.bn-btn-cancel:hover {
    background: var(--bn-colour-quote-bg);
}

.bn-btn-danger {
    background: var(--bn-sentiment-frustration);
    color: #fff;
    border-color: var(--bn-sentiment-frustration);
}

.bn-btn-danger:hover {
    opacity: 0.85;
    /* Restated: the base `.bn-btn:hover` is (0,2,0) and beats
       `.bn-btn-danger` (0,1,0), so without this the fill washes out to
       the neutral tint on hover. */
    background: var(--bn-sentiment-frustration);
}

.bn-btn-primary {
    background: var(--bn-colour-accent);
    color: #fff;
    border-color: var(--bn-colour-accent);
}

.bn-btn-primary:hover {
    opacity: 0.85;
    /* Restated: the base `.bn-btn:hover` is (0,2,0) and beats
       `.bn-btn-primary` (0,1,0), so without this the fill washes out to
       the neutral tint on hover. */
    background: var(--bn-colour-accent);
}

.bn-btn-secondary {
    background: var(--bn-colour-bg);
    color: var(--bn-colour-text);
}

.bn-btn-secondary:hover {
    background: var(--bn-colour-quote-bg);
}

.bn-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* Modal subtitle text */
.bn-modal-subtitle {
    margin: 0 0 var(--bn-space-lg) 0;
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
}

/* Export language line — the governing control sits trailing on its own line,
   so the researcher reads "Language  [Deutsch]" rather than meeting a question.
   Same token scale as the checkbox below it; they are siblings in the dialog. */
.bn-export-locale {
    display: flex;
    gap: var(--bn-space-sm);
    align-items: center;
    justify-content: space-between;
    font-size: var(--bn-text-label);
    margin: var(--bn-space-md) 0;
}

.bn-export-locale .bn-locale-select {
    flex: 0 1 auto;
    min-width: 12ch;
}

/* Export checkbox layout */
.bn-export-checkbox {
    display: flex;
    gap: var(--bn-space-sm);
    align-items: flex-start;
    font-size: var(--bn-text-label);
    cursor: pointer;
    margin: var(--bn-space-md) 0;
}

.bn-export-checkbox input[type="checkbox"],
.bn-export-checkbox input[type="radio"] {
    margin-top: 0.15rem;
}

/* A pair of radios in an export dialog (Miro's sticky shape): the legend reads as the hint line
   above them, the choices sit side by side. */
.bn-export-radios {
    border: 0;
    padding: 0;
    margin: var(--bn-space-md) 0;
    display: flex;
    flex-wrap: wrap;
    column-gap: var(--bn-space-lg);
}

.bn-export-radios legend {
    padding: 0;
}

.bn-export-radios .bn-export-checkbox {
    margin: var(--bn-space-xs) 0 0;
}

.bn-export-hint {
    display: block;
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    margin-top: 0.15rem;
}

/* A long export's progress: the browser's own bar, indeterminate until it has a value, sized to
   the dialog and tinted with the accent where the engine allows it. */
.bn-export-progress {
    display: block;
    width: 100%;
    margin: var(--bn-space-md) 0 var(--bn-space-xs);
    accent-color: var(--bn-colour-accent);
}

.bn-export-error {
    color: var(--bn-colour-error-text);
    font-size: var(--bn-text-label);
    margin: var(--bn-space-sm) 0;
}

/* Confirm-delete modal — narrow width */
.confirm-delete-modal {
    max-width: 24rem;
}

/* Inline link-style button — e.g. the Miro "Disconnect" action inside a
   sentence. Web-report context, so the accent affordance + underline is fine;
   keyboard focus uses the standard focus-visible ring (the global
   :focus:not(:focus-visible) suppressor handles the mouse case). */
.bn-linkish {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: var(--bn-colour-accent);
    cursor: pointer;
    text-decoration: underline;
}
.bn-linkish:hover { text-decoration: none; }
.bn-linkish:disabled { color: var(--bn-colour-muted); cursor: default; text-decoration: none; }
.bn-linkish:focus-visible { outline: 2px solid var(--bn-colour-accent); outline-offset: 2px; }

/* ── Two-route dialogs (Send to Miro: Miro app | Developer access token) ──────────────────────
   A segmented control: one choice of a few, shown as joined buttons. The Mac sheet draws the
   system's segmented control; this is its web twin, the same shape, in the dialog's tokens.
   Tablist semantics live in components/SegmentedTabs.tsx. */
.bn-seg {
    display: inline-flex;
    padding: 2px;
    border-radius: var(--bn-radius-md);
    background: var(--bn-control-track);
    margin: 0 0 var(--bn-space-md);
}

.bn-seg button {
    font: inherit;
    font-size: var(--bn-text-label);
    border: 0;
    background: transparent;
    color: var(--bn-colour-text);
    padding: 4px 14px;
    border-radius: calc(var(--bn-radius-md) - 2px);
    cursor: pointer;
}

.bn-seg button[aria-selected="true"] {
    background: var(--bn-colour-bg);
    box-shadow: var(--bn-control-raised-shadow);
    font-weight: var(--bn-weight-emphasis);
}

.bn-seg button:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: 1px;
}

/* The report's own rule (templates/report.css `hr`), with a dialog-sized margin. */
.bn-board-modal hr {
    border: none;
    border-top: 1px solid var(--bn-colour-keyline);
    margin: var(--bn-space-md) 0 0;
}

/* The Mac form (owner, 9 Nov 2026; Pixelmator's Settings, Apple's own panes, our Mac sheet's
   token tab): each label ends in a colon and right-aligns on one axis, each control left-aligns in
   the column beside it, and a rule spans both columns between groups. The eye reads the controls;
   the labels support them. */
.bn-board-form {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    column-gap: var(--bn-space-sm);
    row-gap: var(--bn-space-sm);
    align-items: baseline;
    font-size: var(--bn-text-label);
}

.bn-board-form-label {
    text-align: right;
    color: var(--bn-colour-muted);
}

.bn-board-form > .bn-export-checkbox,
.bn-board-form-radios .bn-export-checkbox {
    margin: 0;
}

.bn-board-form-radios {
    display: flex;
    flex-wrap: wrap;
    column-gap: var(--bn-space-lg);
}

.bn-board-form > hr {
    grid-column: 1 / -1;
    margin: var(--bn-space-xs) 0;
}

/* Either and or: two buttons stacked, one width. */
.bn-board-form-button {
    min-width: 12em;
}

/* A button that changes its words in place (Copy board data → Copied) keeps its width: both
   labels share one grid cell and the resting one is hidden, so the box is the wider label's in
   every language, where a fixed width would not survive German. */
.bn-keep-width {
    display: inline-grid;
}

.bn-keep-width > span {
    grid-area: 1 / 1;
}

.bn-keep-width > [aria-hidden="true"] {
    visibility: hidden;
}

/* The round help button, at the leading end of the action row, drawn as macOS draws its own
   (the Mac sheet's SwiftUI HelpLink): a filled grey disc and a dark "?". */
.bn-modal-actions .bn-help-btn {
    margin-right: auto;
}

.bn-help-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: var(--bn-help-button-size);
    height: var(--bn-help-button-size);
    border-radius: 50%;
    background: var(--bn-help-button-bg);
    color: var(--bn-help-button-ink);
    font-size: var(--bn-text-body);
    font-weight: var(--bn-weight-emphasis);
    line-height: 1;
    text-decoration: none;
    box-shadow: 0 0 0 0.5px var(--bn-modal-hairline);
    align-self: center;
}

.bn-help-btn:hover {
    background: var(--bn-help-button-bg-hover);
}

.bn-help-btn:active {
    background: var(--bn-help-button-bg-active);
}

.bn-help-btn:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: 2px;
}

/* --- atoms/tooltip.css --- */
/* Atom: tooltip — shortcut hint tooltips on toolbar/nav buttons.
   Uses the same visual spec as .has-tooltip in autocode-report.css
   (soft surface, 300ms hover delay, float-down animation) but
   positioned ABOVE the trigger (prefers-above for toolbar buttons
   near the top of the viewport). */

.bn-tooltip-wrap {
    position: relative;
    display: inline-flex;
}

.bn-tooltip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    background: var(--bn-colour-bg);
    color: var(--bn-colour-text);
    border: 1px solid var(--bn-colour-border);
    font-size: var(--bn-text-caption);
    line-height: 1.4;
    padding: 0.35rem 0.55rem;
    border-radius: var(--bn-radius-md);
    white-space: nowrap;
    z-index: 400;
    font-family: var(--bn-font-body);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
    /* Float-down animation: starts 8px above, settles into place */
    opacity: 0;
    transform: translateX(-50%) translateY(-8px);
    transition: opacity 0.2s ease-out, transform 0.2s ease-out;
    pointer-events: none;
    transition-delay: 0s;
}

.bn-tooltip-wrap:hover .bn-tooltip,
.bn-tooltip-wrap:focus-visible .bn-tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    transition-delay: 0.3s;
}

/* Keycap badge inside tooltips — smaller than help modal version */
.bn-tooltip kbd {
    display: inline-block;
    min-width: 1em;
    padding: 0.15em 0.35em;
    font-family: var(--bn-font-body);
    font-size: var(--bn-text-badge);
    font-weight: 500;
    line-height: 1.1;
    text-align: center;
    color: var(--bn-colour-text);
    background: var(--bn-colour-badge-bg);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-sm);
    box-shadow: 0 1px 0 0 var(--bn-colour-border);
    vertical-align: baseline;
    margin-left: 0.4em;
}

@supports (color: light-dark(black, white)) {
    .bn-tooltip kbd {
        box-shadow: 0 1px 0 0 light-dark(var(--bn-colour-border), rgba(255,255,255,0.1));
    }
}

/* --- atoms/thumbnail.css --- */
/* Atom: thumbnail — media preview placeholder with play icon */

.bn-video-thumb {
    width: 96px;
    height: 54px;
    background: var(--bn-colour-border);
    border-radius: var(--bn-radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.bn-video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: var(--bn-radius-sm);
}

/* Lucide's play, filled: a hollow triangle in a 28px ring reads as weak. */
.bn-play-icon .bn-icon {
    fill: currentColor;
}

.bn-play-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--bn-colour-muted);
    color: var(--bn-colour-muted);
    font-size: var(--bn-text-badge);
    padding-left: 2px;
}

/* --- atoms/shimmer.css --- */
/* Atom: shimmer — the "thinking / work in progress" travelling-sheen for text.

   Single shared cross-surface spec (docs/design-motion.md §4.7.1); this is the
   web (CSS) rendering. Apply `.bn-thinking-shimmer` to a text element to signal
   indeterminate work with no ETA. It REPLACES the spinner — never run it
   alongside a determinate progress bar on the same element (design-motion §4.7).

   Two gates, BOTH must pass to animate (degrade to static plain text otherwise):
     1. @media (prefers-reduced-motion: no-preference)   — accessibility
     2. :root:not([data-analysis-animation="off"])       — the app's "Show
        animation while analysing" toggle, bridged from native chrome.

   The consuming surface MUST set --bn-shimmer-base (its resting text colour) and
   SHOULD set --bn-shimmer-peak (the pole the band moves toward). The clip-to-text
   technique forces color:transparent, which would also turn `currentColor`
   transparent — hence base must be an explicit colour, not currentColor.

     - Dark text (headroom up):  peak = white  → band brightens (the default).
     - Light text (headroom down): peak = the surface background → band dims.

   Either way the perceptual magnitude is the tuned --bn-shimmer-contrast (5%),
   so the *character* matches across surfaces even where polarity flips. */

.bn-thinking-shimmer {
    --_shimmer-base: var(--bn-shimmer-base, currentColor);
    --_shimmer-peak: color-mix(
        in srgb,
        var(--_shimmer-base),
        var(--bn-shimmer-peak, #fff) var(--bn-shimmer-contrast)
    );
}

@media (prefers-reduced-motion: no-preference) {
    :root:not([data-analysis-animation="off"]) .bn-thinking-shimmer {
        /* Band half-width is `--bn-shimmer-band` (a fraction of the TEXT) ÷ 6:
           ÷3 converts text-fraction → gradient-fraction (the gradient image is
           300% of the text width, below), then ÷2 for the half. So the peak
           spans ~34% of the text. */
        background-image: linear-gradient(
            var(--bn-shimmer-angle),
            var(--_shimmer-base) 0%,
            var(--_shimmer-base) calc(50% - var(--bn-shimmer-band) / 6),
            var(--_shimmer-peak) 50%,
            var(--_shimmer-base) calc(50% + var(--bn-shimmer-band) / 6),
            var(--_shimmer-base) 100%
        );
        background-size: 300% 100%;
        background-repeat: no-repeat;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: bn-thinking-shimmer var(--bn-shimmer-period) var(--bn-shimmer-easing) infinite;
    }
}

@keyframes bn-thinking-shimmer {
    /* Positions stay within [0%, 100%] so the 300%-wide no-repeat gradient ALWAYS
       covers the text — outside that range the image slides off and the clipped
       glyphs render transparent (they vanish). Over the sweep window (1800/2700 =
       66.67%) the sampling window travels across the middle of the gradient: the
       peak band enters from the left, crosses, and exits right. It then parks at
       0% — where the band sits off-window and only the base colour shows — for the
       0.9 s gap. Band is off-window at the hold, so the loop restart never pops. */
    0%     { background-position: 100% 50%; }
    66.67% { background-position: 0% 50%; }
    100%   { background-position: 0% 50%; }
}

/* Block shimmer — `.is-working` on a box (docs/design-motion.md §4.7.2). The text clip does
   not apply to a box, so the sweep is a translucent ink tint laid over whatever fill the element
   already has: a ghost shape and a plain box share one rule. Same timing and the same two gates
   as the text shimmer. Contrast is --bn-skeleton-peak; a small shape (a few px of area) sets
   --bn-skeleton-peak: var(--bn-skeleton-peak-small). Give neighbours an independent
   --bn-skeleton-phase (a negative delay) so they read as individual organisms, not a strobe. */
@media (prefers-reduced-motion: no-preference) {
    :root:not([data-analysis-animation="off"]) .is-working {
        background-image: linear-gradient(
            var(--bn-shimmer-angle),
            transparent 0%,
            transparent calc(50% - var(--bn-shimmer-band) / 6),
            var(--bn-skeleton-peak) 50%,
            transparent calc(50% + var(--bn-shimmer-band) / 6),
            transparent 100%
        );
        background-size: 300% 100%;
        background-repeat: no-repeat;
        animation: bn-block-shimmer var(--bn-shimmer-period) var(--bn-shimmer-easing) infinite;
        animation-delay: var(--bn-skeleton-phase, 0ms);
    }
}

@keyframes bn-block-shimmer {
    0%     { background-position: 100% 50%; }
    66.67% { background-position: 0% 50%; }
    100%   { background-position: 0% 50%; }
}

/* --- atoms/arrival.css --- */
/* Atom: arrival — the flash on the thing a link landed on.

   One cue for every in-app link (docs/design-arrival-flash.md): the transcript
   paragraph a quote or timeline named, the quote card or group heading a
   gutter label named, the screen's title in Screens. It fades from
   --bn-arrival-colour to the element's own background over
   --bn-arrival-duration (tokens.css), so the eye finds its place before the
   cue is gone.

   The app writes `data-arrived` (frontend/src/utils/arrival.ts markArrived),
   an attribute rather than a class because React owns those elements'
   className and a re-render would wipe a class mid-flash. The sealed static
   render's frozen transcript-names.js writes `.anchor-highlight` on a
   transcript segment; it stays styled here, as it was.

   The keyframe names only a `from`: the fade ends on whatever background the
   element has of its own (transparent on a paragraph, the card's on a card),
   and with no fill-mode nothing is left behind when it ends. Never add a `to`
   or `forwards`: either strips a card of its own background. */

@keyframes bn-arrival {
    from { background-color: var(--bn-arrival-colour); }
}

/* `:root` lifts the attribute to (0,2,0), and this file loads after
   atoms/timecode.css: a paragraph or card the player is on carries
   `.bn-timecode-glow.bn-timecode-playing`, whose pulse would otherwise take the
   `animation` and the flash would never show. The arrival wins for its five
   seconds, as the transcript's flash always has. */
:root [data-arrived],
.transcript-segment.anchor-highlight {
    animation: bn-arrival var(--bn-arrival-duration) var(--bn-arrival-easing);
}

/* A heading is a full-width block with no padding: round the strip's corners
   while it flashes, as the transcript paragraph's are. */
h1[data-arrived],
h2[data-arrived],
h3[data-arrived] {
    border-radius: var(--bn-radius-sm);
}

/* Forced colours (Windows High Contrast) replace background-color with the
   system's, so the wash vanishes there: draw the system highlight as an outline
   for as long as the mark lasts (markArrived clears it when the flash ends). */
@media (forced-colors: active) {
    :root [data-arrived] {
        outline: 2px solid Highlight;
    }
}

/* No prefers-reduced-motion override, deliberately: a colour fade moves
   nothing, and a fade is what reduced motion replaces movement with (Apple
   HIG, Accessibility ▸ Cognitive). A held colour that snaps off would keep
   the brightest moment five times longer and then pull the eye back. */

/* --- atoms/activity-chip.css --- */
/* Atom: activity-chip — non-dismissable floating progress chips for background jobs */

.activity-chip-stack {
    position: fixed;
    bottom: 48px;
    right: 24px;
    z-index: 200;
    display: flex;
    flex-direction: column-reverse;
    gap: 6px;
    font-family: var(--bn-font-body);
    pointer-events: none;
}

.activity-chip {
    background: var(--bn-colour-text);
    color: var(--bn-colour-bg);
    padding: 0.6rem 1rem;
    border-radius: var(--bn-radius-lg);
    font-size: var(--bn-text-label);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    pointer-events: auto;
    animation: chip-slide-in 0.2s ease-out;
}

@keyframes chip-slide-in {
    from { opacity: 0; transform: translateY(0.5rem); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Running label carries the shimmer (replaces the old spinner). The chip is a
   filled pill with light text (light mode) / dark text (dark mode), so the band
   moves toward whichever pole has headroom. Base must match the chip's own text
   colour exactly (clip-to-text can't use currentColor). See atoms/shimmer.css. */
.chip-label {
    --bn-shimmer-base: var(--bn-colour-bg);   /* = the chip's light label colour */
    --bn-shimmer-peak: var(--bn-colour-text); /* dim toward the dark pill */
    /* The CSS chip runs 20% (both themes) — the filled-pill background-clip sweep
       needs more travel to read than the token's 5% default. The native sidebar
       (SidebarShimmerText, mid-grey secondary text) stays at 5%. */
    --bn-shimmer-contrast: 20%;
}

.chip-check {
    color: var(--bn-colour-positive);
    font-weight: var(--bn-weight-strong);
    --bn-icon-stem: var(--bn-icon-stem-strong);  /* its icon follows the text weight */
}

.chip-error {
    color: var(--bn-colour-negative);
    font-weight: var(--bn-weight-strong);
    --bn-icon-stem: var(--bn-icon-stem-strong);  /* its icon follows the text weight */
}

/* Partial completion. --bn-colour-warning is defined in both palettes
   (palette-default.css:38, palette-edo.css:55), unlike the --bn-colour-success
   / --bn-colour-danger the autocode toast reaches for, which are defined
   nowhere. Don't copy those two here. */
.chip-warning {
    color: var(--bn-colour-warning);
    font-weight: var(--bn-weight-strong);
    --bn-icon-stem: var(--bn-icon-stem-strong);  /* its icon follows the text weight */
}

.chip-link {
    color: #60a5fa;
    text-decoration: none;
    font-weight: var(--bn-weight-emphasis);
    margin-left: 0.3rem;
    cursor: pointer;
}

.chip-link:hover { text-decoration: underline; }

.chip-close {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.4);
    cursor: pointer;
    font-size: var(--bn-text-label);
    padding: 0 0.2rem;
    margin-left: 0.3rem;
}

.chip-close:hover { color: rgba(255, 255, 255, 0.8); }

/* Cancel button (shown while running) */

.chip-cancel {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.5);
    cursor: pointer;
    font-size: var(--bn-text-label);
    padding: 0 0.2rem;
    margin-left: auto;
}

.chip-cancel:hover {
    color: rgba(255, 255, 255, 0.9);
    text-decoration: underline;
}

/* Summary chip (collapsed multi-job view) */

.activity-chip-summary {
    cursor: pointer;
}

.chip-toggle {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.4);
    cursor: pointer;
    font-size: var(--bn-text-badge);
    padding: 0 0.2rem;
    margin-left: auto;
}

.chip-toggle:hover { color: rgba(255, 255, 255, 0.8); }

/* Collapse button (shown at bottom of expanded stack) */

.activity-chip-collapse {
    justify-content: center;
    padding: 0.3rem 1rem;
    cursor: pointer;
    border: none;
}

/* Dark mode — inverted chip (light bg on dark theme) */
@supports (color: light-dark(#000, #fff)) {
    [data-theme="dark"] .activity-chip {
        background: #e5e7eb;
        color: #111;
    }
    [data-theme="dark"] .activity-chip .chip-link { color: #2563eb; }
    [data-theme="dark"] .activity-chip .chip-close { color: rgba(0, 0, 0, 0.3); }
    [data-theme="dark"] .activity-chip .chip-close:hover { color: rgba(0, 0, 0, 0.7); }
    [data-theme="dark"] .activity-chip .chip-toggle { color: rgba(0, 0, 0, 0.3); }
    [data-theme="dark"] .activity-chip .chip-toggle:hover { color: rgba(0, 0, 0, 0.7); }
    [data-theme="dark"] .activity-chip .chip-cancel { color: rgba(0, 0, 0, 0.4); }
    [data-theme="dark"] .activity-chip .chip-cancel:hover { color: rgba(0, 0, 0, 0.8); }
    [data-theme="dark"] .activity-chip .chip-label {
        --bn-shimmer-base: #111;   /* = the inverted (dark) chip label colour */
        --bn-shimmer-peak: #fff;   /* brighten toward white — dark text has headroom up */
        /* contrast (20%) inherited from .chip-label — near-black text needs it */
    }

    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .activity-chip {
            background: #e5e7eb;
            color: #111;
        }
        :root:not([data-theme="light"]) .activity-chip .chip-link { color: #2563eb; }
        :root:not([data-theme="light"]) .activity-chip .chip-close { color: rgba(0, 0, 0, 0.3); }
        :root:not([data-theme="light"]) .activity-chip .chip-close:hover { color: rgba(0, 0, 0, 0.7); }
        :root:not([data-theme="light"]) .activity-chip .chip-toggle { color: rgba(0, 0, 0, 0.3); }
        :root:not([data-theme="light"]) .activity-chip .chip-toggle:hover { color: rgba(0, 0, 0, 0.7); }
        :root:not([data-theme="light"]) .activity-chip .chip-cancel { color: rgba(0, 0, 0, 0.4); }
        :root:not([data-theme="light"]) .activity-chip .chip-cancel:hover { color: rgba(0, 0, 0, 0.8); }
        :root:not([data-theme="light"]) .activity-chip .chip-label {
            --bn-shimmer-base: #111;
            --bn-shimmer-peak: #fff;
        }
    }
}

/* --- atoms/journey-label.css --- */
/* Atom: journey-label — interactive journey step buttons with active state.

   Used by JourneyChain component in sessions table and transcript pages.
   The active state applies a hover-tint pill (--bn-colour-hover) to mark
   the current section during scroll-sync or click-to-jump navigation.

   Specificity note: the base rule uses `all: unset` which resets background.
   The active rule must match or exceed that specificity (0-1-1) to win. */

/* Base interactive label — reset to inline text, add cursor + transitions.
   Matches both the transcript page's <button> (in-page scroll) and the
   Sessions lens's <a> (deep-link navigation). `:is(button, a)` keeps the
   0-1-1 specificity the active rule below relies on. */
:is(button, a).bn-journey-label--interactive {
    all: unset;
    cursor: pointer;
    font: inherit;
    color: inherit;
    border-radius: 2px;
    padding: 0.1rem 0.3rem;
    transition: color 0.15s, text-decoration-color 0.15s, background 0.15s;
}

/* Wrapping chains (the Sessions lens grid) carry the horizontal breathing room
   on the trailing edge only. Padding on an inline box paints at the start of
   its first line fragment and the end of its last — so symmetric padding shows
   as a ragged left indent on line 1 and on every line that opens after an
   arrow, while a line continuing a wrapped label sits flush. Trailing-edge
   padding keeps the mid-line gaps identical (label's padding-right + the
   separator's leading space before the arrow; the separator's padding-right +
   its trailing space after) and leaves nothing to paint at a line start.
   The transcript header's chain is `--overflow` — one line, horizontal scroll,
   no wrapping — so it keeps the symmetric pill the active state wants. */
.bn-session-journey:not(.bn-session-journey--overflow)
  :is(.bn-journey-label, .bn-journey-sep) {
    padding-inline: 0 0.3rem;
}

:is(button, a).bn-journey-label--interactive:hover {
    color: var(--bn-colour-accent);
    text-decoration: underline;
    text-decoration-color: var(--bn-colour-muted);
    text-underline-offset: 0.25em;
}

:is(button, a).bn-journey-label--interactive:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: 2px;
}

/* Active journey step — hover-tint pill background.
   Selector must beat the base `all: unset` rule (0-2-1 > 0-1-1). */
:is(button, a).bn-journey-label--interactive.bn-journey-label--active {
    font-weight: var(--bn-weight-emphasis);
    background: var(--bn-colour-hover);
    border-radius: var(--bn-radius-sm);
}

/* --- atoms/section-heading.css --- */
/* Atom: section-heading — the zone title on a lens page.
 *
 * One h1 per top-level content zone, named for the zone, never the lens
 * (docs/design-lens-template.md § "The h1 scheme"). Four lenses use it:
 * Quotes ("Sections" / "Themes"), Analysis ("Sentiment signals" / "Tag
 * signals"), Codebook ("Codebook"), Sessions ("Sessions").
 *
 * WHY THIS IS AN ATOM, not a rule in templates/report.css where it lived
 * until 6 Aug 2026: a class you have to remember to type will eventually be
 * forgotten. Codebook's h1 carried no `.section-heading` at all — in all
 * three of its render states — so it rendered with correct type (inherited)
 * and NO horizontal rule, and nothing caught it. Quotes and Analysis were
 * right only because they copied each other. Use the `<SectionHeading>`
 * component (frontend/src/components/SectionHeading.tsx) rather than typing
 * the class, so a zone title cannot be rendered without its rule.
 *
 * Provides the full-pane 1px keyline + padding itself rather than leaning on
 * the base h2 rule, so an h1 (which has no border of its own) still gets the
 * divider.
 *
 * Font size/weight are deliberately NOT set here — they inherit from the
 * element (h1 → display/strong), keeping the *semantic* level and the
 * *graphic* size as separate knobs. Tune size via the h1 rule / specimen lens.
 *
 * The 2.5rem top gives between-zone separation. Flushing the FIRST zone title
 * to the page datum is page-layout geometry, not the atom's business, so that
 * rule stays in templates/report.css — an atom should not know where on a
 * page it sits.
 *
 * THE ATOM IS THE ROW, NOT THE TEXT (20 Aug 2026). It renders as a wrapper
 * carrying the keyline, with the <h1> and an optional action inside. Before
 * this, the class sat on the <h1> itself, and Codebook — the only lens with a
 * zone-level action — wrapped that h1 in its own flex column to get a button
 * beside it. Two defects followed from that one wrapper:
 *
 *   1. The rule stopped short of the pane by the button's width. `max-width:
 *      none` makes the box as wide as its CONTAINING BLOCK, and the containing
 *      block had become the flex column, not the pane.
 *   2. The datum rule in templates/report.css
 *      (`.center > main > section:first-of-type > .section-heading`) no longer
 *      matched — the heading was a grandchild — so the first zone title on
 *      Codebook sat 40px below the datum every other lens flushes to.
 *
 * Both are structural: any construction that leaves a column around the
 * heading reproduces them. Making the atom itself the row removes the reason
 * to wrap. The action is a SIBLING of the h1, not a child, so the heading
 * still announces as just its own text.
 *
 * `align-items: flex-end` is a rule-relative alignment, deliberately: the
 * action's bottom edge lands on the same line as the title text's, so both sit
 * one `padding-bottom` (6.4px) above the keyline and the row reads as having
 * a single bottom gutter. It also keeps the row's height equal to the h1's
 * line box (28px x 1.45 = 40.6px, against a 33.65px button), so A ROW WITH AN
 * ACTION IS EXACTLY AS TALL AS A ROW WITHOUT ONE — the keyline lands at the
 * same y on every lens, which is the whole point of a shared atom. Do not
 * switch to `baseline`: it pushes the button below the h1's line box, grows
 * the row, and drifts Codebook's rule off every other lens's.
 */

.section-heading {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    /* Title text can never crash into the action, at any width or locale. */
    gap: var(--bn-space-lg);
    /* A one-word title ("Abschnitte") cannot wrap inside itself, so with
       `min-width: 0` below it was clipped by the action. Let the ACTION drop
       to its own line instead (BR-09). A row that fits is unchanged (the one-height-with-or-without-an-action
       rule above holds only while the row fits). */
    flex-wrap: wrap;
    row-gap: var(--bn-space-sm);
    max-width: none;
    margin: 2.5rem 0 1rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--bn-colour-keyline);
}

/* The inner heading carries the type and nothing else — no margin of its own
   (the base h1 rule sets one), no reading-width cap (the `h1, h2, h3,
   .description` group in templates/report.css would otherwise re-apply it),
   and no rule (the wrapper owns that). `min-width: 0` lets a long title wrap
   inside its flex item rather than push the action off the right edge. */
.section-heading > :is(h1, h2) {
    margin: 0;
    max-width: none;
    min-width: 0;
    border-bottom: none;
    padding-bottom: 0;
}

/* The action slot. Deliberately the same construction as
   `.framework-section-actions` (organisms/codebook-panel.css) one scale down —
   flex row, centred, `--bn-space-sm` between siblings, never shrinks — so the
   three title-left / action-right rows a lens can stack (zone title, framework
   header, group header) are one pattern at three sizes rather than three
   patterns. The atom owns the space between title and action via `gap`, so
   this slot carries no margins of its own. */
.section-heading-action {
    display: flex;
    align-items: center;
    gap: var(--bn-space-sm);
    flex-shrink: 0;
    /* Stays right-aligned when it wraps onto a line of its own. */
    margin-left: auto;
}

/* --- atoms/lead-paragraph.css --- */
/* Atom: lead paragraph — a description whose first sentence carries the claim.
   ==========================================================================

   One paragraph, two ranks: a leading sentence in normal ink, the sentences
   after it in a tint. Nothing is truncated — the whole text stays for anyone
   who reads it, and a skimmer gets the claim without having to decide to skip
   anything. It is the answer to a description being "good but too long": the
   length was never the problem, the missing rank was.

   THE TREATMENT IS COLOUR, NOT WEIGHT — variant A, chosen 31 Aug 2026 from
   `docs/mockups/lead-sentence-playground.html`, which renders eight
   combinations of weight and tint against this exact text and pairs them with
   the navigator's second line. Go back there before changing any value here;
   it is the cheapest way to see a proposal beside the seven alternatives, in
   both palettes and both appearances, without touching the app.

   Two reasons colour won. First, weight is already spent: `emphasis` marks
   headings and labels, `starred` marks starred quotes, `strong` marks
   destructive verbs and page titles — a fourth weight-based meaning inside a
   paragraph competes with all three. Second, and the reason it is visible at a
   glance rather than on inspection: a bolded run inside body prose reads as
   emphasis-in-a-sentence ("this word matters"), where a tint reads as rank
   ("this part is subordinate"). The playground's variant B is the weight
   version and shows the difference plainly.

   The weight tokens below therefore resolve to the SAME value. They exist so
   the decision stays reversible in one place, not because the two are expected
   to differ.

   THE TINT HAS EXACTLY ONE CANDIDATE. `--bn-colour-muted` is the only
   non-primary text colour clearing 4.5:1 in both schemes (4.83:1 light,
   7.44:1 dark). `--bn-colour-icon-idle` is 1.6:1 and `--bn-colour-starred` is
   2.8:1 — both unusable for prose. So "a tint" can only mean muted, and a
   lighter step would need a new token in every palette's colour contract.

   Consumers: `.pg-desc` (codebook v2 framework description) and
   `.signal-elaboration` (analysis signal cards). The signal cards reached this
   idea first and reached it the other way — same colour, heavier lead via
   `--bn-weight-starred` — and were converted here so the two cannot say the
   same thing differently.

   Splitter: `frontend/src/utils/leadSentence.tsx`. `||` where the author
   marked the break, first sentence boundary where they did not. */

:root {
    /* The claim. Normal ink, normal weight: it is not shouting, the rest is
       receding. */
    --bn-lead-colour: var(--bn-colour-text);
    --bn-lead-weight: var(--bn-weight-normal);

    /* Everything after it. The tint is the entire mechanism. */
    --bn-lead-rest-colour: var(--bn-colour-muted);
    --bn-lead-rest-weight: var(--bn-weight-normal);
}

/* The paragraph sets the RECEDED treatment and the lead overrides it. That
   order matters: the remainder is a bare text node — the splitter emits
   `<strong>lead</strong> rest` so the rest inherits — and cannot carry a class
   of its own without wrapping every description in another element.

   Consequence for consumers: a rule setting `color` on the paragraph itself
   defeats this atom. Atoms are concatenated BEFORE organisms, so an organism's
   `.pg-desc { color: … }` wins the tie on source order and the tint silently
   never appears. Both consumers had exactly that declaration; both had it
   removed. */
.bn-lead-para {
    color: var(--bn-lead-rest-colour);
    font-weight: var(--bn-lead-rest-weight);
}

/* `<strong>` because the split is semantic as well as visual — the lead IS the
   claim, and a screen reader announcing it as strong is correct. The visual
   weight is then explicitly reset to the token, so what the element MEANS and
   what it LOOKS LIKE stay separate knobs. */
.bn-lead-para strong {
    color: var(--bn-lead-colour);
    font-weight: var(--bn-lead-weight);
}

/* TWO PARAGRAPHS, added 20 Sep 2026. `signal-elaboration.md` has specified
   since v0.2.0 that `||` is "a paragraph break, not a syntactic pause" and
   that the evidence renders "after a blank line". The splitter emitted
   `<strong>lead</strong> rest` — one paragraph, joined by a single space — so
   the blank line the prompt promises had never existed and the model was
   writing against a layout it was not given.

   The claim keeps its <strong> for the semantics; the weight is still reset to
   the token by the rule above, so nothing looks bolder. The tint still comes
   from the paragraph, which `.bn-lead-rest` inherits. */
.bn-lead-para .bn-lead-claim {
    margin: 0;
}

.bn-lead-para .bn-lead-rest {
    margin: var(--bn-space-sm) 0 0;
}

/* --- atoms/moderator-question.css --- */
/* Atom: moderator-question — hover-triggered pill and expanded moderator utterance */

/* Hover zone — invisible overlay covering the first ~3 words of the quote text.
   cursor: help (native browser ? cursor) signals "hover here for info".
   Positioned absolutely relative to .quote-body. */
.quote-body { position: relative; }
.quote-hover-zone {
    position: absolute;
    top: calc(-1.1rem - 1px - 4px);
    left: 0;
    width: 14em;
    height: calc(1.6em + 1.1rem + 1px + 4px);
    cursor: help;
    z-index: 1;
}

/* "Question?" pill — drops in from above on hover, pins when clicked */
.moderator-pill {
    position: absolute;
    top: calc(-1.1rem - 1px);
    left: 0;
    display: inline-block;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-micro);
    padding: 2px 6px;
    border-radius: var(--bn-radius-sm);
    border: none;
    background: var(--bn-colour-badge-bg);
    color: var(--bn-colour-muted);
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
    z-index: 2;
    /* Float-down entrance (matching tooltip system) */
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 0.2s ease-out, transform 0.2s ease-out,
                background var(--bn-transition-fast), color var(--bn-transition-fast);
    pointer-events: none;
}

.moderator-pill.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

.moderator-pill:hover {
    background: var(--bn-colour-hover);
    color: var(--bn-colour-accent);
}

.moderator-pill.moderator-pill-active {
    background: color-mix(in srgb, var(--bn-colour-accent) 15%, transparent);
    color: var(--bn-colour-accent);
}

/* Moderator question row — sits above the quote's .quote-row, uses the same
   flex layout with a hidden timecode spacer so text aligns with the quote body. */
.moderator-question-row { margin-bottom: 0.25rem; }

/* Expanded moderator question block — block layout so long text wraps to the
   left margin, not indented past the badge. flex: 1 fills the quote-row. */
.moderator-question {
    display: block;
    flex: 1;
    min-width: 0;
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    margin-bottom: 0;
    padding-left: 0;
    animation: mod-q-reveal 0.2s ease-out;
}

/* Badge wrapper — positions the dismiss × relative to the PersonBadge */
.moderator-question-badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    margin-right: 0.4rem;
    vertical-align: baseline;
}

/* Dismiss × button — reuses the badge-delete pattern from atoms/badge.css */
.moderator-question-dismiss {
    position: absolute;
    top: calc(-0.3rem - 1px);
    right: calc(-0.3rem - 1px);
    width: calc(0.875rem + 0.5px);   /* ~14.5px */
    height: calc(0.875rem + 0.5px);
    background: var(--bn-colour-bg);
    border: none;
    border-radius: 50%;
    color: var(--bn-colour-negative);
    font-size: var(--bn-text-micro);
    font-weight: var(--bn-weight-strong);
    --bn-icon-stem: var(--bn-icon-stem-strong);  /* its icon follows the text weight */
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity var(--bn-transition-fast);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    pointer-events: none;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.16), 0 0 1px rgba(0, 0, 0, 0.06);
}

.moderator-question:hover .moderator-question-dismiss {
    opacity: 1;
    pointer-events: auto;
}

.moderator-question-text {
    font-style: italic;
}

.moderator-question-more {
    font-style: normal;
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-accent);
    cursor: pointer;
    margin-left: 0.3rem;
    border: none;
    background: none;
    padding: 0;
    font-family: var(--bn-font-mono);
}

.moderator-question-more:hover {
    text-decoration: underline;
}

@keyframes mod-q-reveal {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* --- atoms/context-expansion.css --- */
/* ── Context expansion: chevron arrows + surrounding transcript ─────── */

/*
 * .timecode-expandable wraps the timecode element (TimecodeLink or
 * plain <span>) and positions chevron arrows above/below it.
 * padding-top/bottom create hover targets without shifting layout
 * (negative margin cancels the extra space).
 */
.timecode-expandable {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    padding-top: 0.75rem;
    padding-bottom: 0.75rem;
    margin-top: -0.75rem;
    margin-bottom: -0.75rem;
    flex-shrink: 0;
}

/* Arrow buttons — invisible until parent hover */
.expand-arrow {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: none;
    border: none;
    padding: 0 0.25rem;
    cursor: pointer;
    font-size: var(--bn-text-label);
    line-height: 1;
    color: var(--bn-colour-muted);
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 1;
}

.expand-arrow[data-dir="up"] {
    top: 0.3rem;
}

.expand-arrow[data-dir="down"] {
    bottom: 0.3rem;
    transform: translateX(-50%) rotate(180deg);
}

/* Show arrows on hover over the expandable wrapper */
.timecode-expandable:hover .expand-arrow {
    opacity: 1;
}

.expand-arrow:hover {
    color: var(--bn-colour-text);
}

.expand-arrow:disabled {
    opacity: 0.3 !important;
    cursor: default;
    color: var(--bn-colour-muted);
}

/*
 * Context segment — a muted transcript line shown above or below
 * the quote. Uses the same .quote-row flex layout for grid alignment.
 */
.context-segment {
    color: var(--bn-colour-muted);
    padding: var(--bn-space-xs) 0;
    opacity: 0.7;
}

.context-segment .quote-row {
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
}

.context-segment .timecode {
    flex-shrink: 0;
}

.context-segment .context-text {
    flex: 1;
    min-width: 0;
}

.context-segment .context-speaker {
    margin-right: 0.25rem;
}

/* --- molecules/person-badge.css --- */
/* Molecule: person-badge — two-tone split speaker badge
 *
 * Structure:  .bn-person-badge > .bn-speaker-badge--split
 *               > .bn-speaker-badge-code + .bn-speaker-badge-name
 *
 * Display mode: data-person-display="code" on <html> hides the name half.
 * Hover: linked badges increase contrast (name bg lightens, code text darkens).
 */

/* Wrapper — keeps backward compat with existing selectors */
.bn-person-badge {
    display: inline-flex;
    align-items: center;
    gap: 0;
    white-space: nowrap;
}

/* Split badge container */
.bn-speaker-badge--split {
    display: inline-flex;
    align-items: center;
    gap: 0;
    padding: 0;
    border-radius: var(--bn-radius-sm);
    overflow: hidden;
    background: none;
    vertical-align: baseline;
}

/* Left half: code lozenge */
.bn-speaker-badge--split .bn-speaker-badge-code {
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    padding: var(--bn-space-xs) 0.4rem;
    background: var(--bn-colour-badge-bg);
    color: var(--bn-colour-badge-text);
    border: 1px solid var(--bn-colour-border);
    border-right: none;
    border-radius: var(--bn-radius-sm) 0 0 var(--bn-radius-sm);
    transition: color var(--bn-transition-fast);
}

/* Right half: name */
.bn-speaker-badge--split .bn-speaker-badge-name {
    font-family: var(--bn-font-body);
    font-size: var(--bn-text-badge);
    font-weight: var(--bn-weight-emphasis);
    padding: var(--bn-space-xs) 0.45rem var(--bn-space-xs) 0.35rem;
    background: var(--bn-colour-quote-bg);
    color: var(--bn-colour-text);
    border: 1px solid var(--bn-colour-border);
    border-left: none;
    border-radius: 0 var(--bn-radius-sm) var(--bn-radius-sm) 0;
    transition: background var(--bn-transition-fast);
}

/* No name available — code gets full radius */
.bn-speaker-badge--split .bn-speaker-badge-code:last-child {
    border-radius: var(--bn-radius-sm);
    border-right: 1px solid var(--bn-colour-border);
}

/* --- Hover states (linked badges only) --- */

/* Code-and-name: name bg lightens towards white */
a:hover .bn-speaker-badge--split .bn-speaker-badge-name {
    background: var(--bn-colour-bg);
}

/* Code-only / code-and-name: code text darkens towards black */
a:hover .bn-speaker-badge--split .bn-speaker-badge-code {
    color: var(--bn-colour-text);
}

/* --- Display mode toggle via data-person-display on <html> --- */

[data-person-display="code"] .bn-speaker-badge-name {
    display: none;
}

[data-person-display="code"] .bn-speaker-badge--split .bn-speaker-badge-code {
    border-radius: var(--bn-radius-sm);
    border-right: 1px solid var(--bn-colour-border);
}

/* "You are here": the badge of the session or version showing, on an ancestor (a wrapper, or the
   radio that holds the badge). The navigator's own selection vocabulary, as .toc-link.active has
   it: the selection fill (--bn-nav-selection-bg), emphasis weight, and accent text, no ring. Chosen
   for the Discussion lens's session bar (option C of the badge playground, 3 Oct 2026); shared
   since 15 Oct 2026 by the Screens lens's versions.
   Two things the plain accent did not do, both fixed here for both lenses (accessibility review,
   15 Oct 2026): it was the only cue (colour alone, 1.4.1), so the code takes the emphasis weight as
   the name half already has — the non-colour cue, and the active row's own; and the accent as text
   was 3.65:1 on the badge grey in the default light palette (1.4.3). The text is the accent mixed a
   quarter toward the palette's own text colour, which darkens it in light and lightens it in dark.
   Measured (code / name half, on the selection fill): default light 5.12 / 5.12, default dark
   5.01 / 5.01, Edo light 6.38 / 6.38, Edo dark 6.20 / 6.20 — every one past 4.5:1. No token held an
   accent that passes as text; this mix is the theme's own idiom (color-mix of two tokens). */
.bn-person-badge-here .bn-speaker-badge-code,
.bn-person-badge-here .bn-speaker-badge-name {
    background: var(--bn-nav-selection-bg);
    color: color-mix(in srgb, var(--bn-colour-accent) 75%, var(--bn-colour-text));
    font-weight: var(--bn-weight-emphasis);
}

/* Compact: the code half alone, tight, for a row of numbers in a narrow place (the Discussion
   lens's grid heads, decided 18 Oct 2026 — docs/design-discussion-lens-plan.md §3). The keyline
   and the type size stay; only the line height and padding tighten. */
.bn-person-badge-compact .bn-speaker-badge-code { line-height: 1; padding: var(--bn-space-xs) 0.3rem; }
/* Absent: not here (not asked, did not speak). The outline only, muted ink, no fill — never
   opacity, which took the text to 2.0:1 where it was tried. Built 18 Oct 2026 for the
   Discussion lens's "Not asked in" line, which the plan still lists as proposed. */
.bn-person-badge-absent .bn-speaker-badge-code { background: transparent; color: var(--bn-colour-muted); }

/* Highlighted state */
.bn-person-badge-highlighted .bn-speaker-badge-code {
    box-shadow: 0 0 0 2px var(--bn-colour-accent);
}

/* --- Sessions grid: decomposed badge + editable name --- */

.bn-session-speaker-entry {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    white-space: nowrap;
}

.bn-speaker-editable-name {
    font-family: var(--bn-font-body);
    font-size: inherit;
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
    cursor: text;
    border-radius: var(--bn-radius-sm);
    padding: var(--bn-space-xs) 0.2rem;
    min-width: 2rem;
}

.bn-speaker-editable-name:hover {
    background: var(--bn-colour-quote-bg);
}

/* The editing state lives in `molecules/editable-text.css`, which names this
   class alongside `.editable-text` — one rule for "a name, title or
   description on neutral ground", so the speakers grid and the quotes lens
   cannot drift apart. Only the metrics above are local to the speaker name.
   An edited name carries no committed mark: italic is reserved for the
   unidentified placeholder below (grey italic = unknown), and since migration
   012 the confirmed state says what "you edited this" used to (owner,
   6 Oct 2026; design-people.md §J8.8). */

/* Unidentified speaker: role word shown as a muted-italic placeholder
   (PowerPoint-title convention) to read as editable, not as a real name. */
.bn-speaker-editable-name.unnamed {
    font-weight: var(--bn-weight-normal);
    font-style: italic;
    color: var(--bn-colour-muted);
}

/* Same placeholder on the narrow-width rung, where the short form is shown
   instead. Rehomed from `molecules/name-edit.css` when that file was deleted
   on 20 Sep 2026: it was a bare `.unnamed` in the global sheet, and the two
   classes above and below are its only consumers. Deliberately NOT merged
   into one selector — the full name also drops to normal weight, the short
   one never carried emphasis to drop. */
.bn-speaker-name-short.unnamed {
    font-style: italic;
    color: var(--bn-colour-muted);
}

.bn-name-pencil {
    all: unset;
    cursor: pointer;
    font-size: var(--bn-text-micro);
    opacity: 0;
    color: var(--bn-colour-muted);
    transition: opacity var(--bn-transition-fast);
    padding: 0 0.1rem;
}

.bn-session-speaker-entry:hover .bn-name-pencil {
    opacity: 0.4;
}

.bn-name-pencil:hover {
    opacity: 0.8 !important;
}

/* --- A proposed name (design-people.md § UX iteration 3) ---
   A name the pipeline found, not yet a person's yes
   (`session_speakers.name_confirmed`): one dotted ring round the whole split
   badge, and the name in grey that darkens on hover. Saying yes in the picker
   makes both solid. The halves lose their own borders so the ring is the only
   line — the `--split` qualifier matches the specificity of the
   `.bn-speaker-badge-code:last-child` rule above, and later in the file wins,
   so a code-only badge keeps no solid edge inside the dashes. */
.bn-person-proposed .bn-speaker-badge--split {
    border: 1px dashed currentColor;
}

.bn-person-proposed .bn-speaker-badge--split .bn-speaker-badge-code,
.bn-person-proposed .bn-speaker-badge--split .bn-speaker-badge-name {
    border: none;
}

.bn-speaker-editable-name.proposed {
    font-weight: var(--bn-weight-normal);
    color: var(--bn-colour-muted);
}

.bn-session-speaker-entry:hover .bn-speaker-editable-name.proposed {
    color: var(--bn-colour-text);
}

/* --- molecules/badge-row.css --- */
/* Molecule: badge-row — badges container inside a quote card */

.quote-card .badges {
    display: flex;
    gap: var(--bn-space-sm);
    margin-top: 0.4rem;
    flex-wrap: wrap;
    opacity: 0.9;
    transition: opacity var(--bn-transition-fast);
}

.quote-card:hover .badges {
    opacity: 1;
}

/* --- molecules/bar-group.css --- */
/* Molecule: bar-group — label + bar + count row in a sentiment chart */

.sentiment-bar-group {
    display: contents;
}

/* --- molecules/editable-text.css --- */
/* Molecule: editable-text — shared editing and committed states for
   inline contenteditable fields (quotes, headings, names) */

/* ── Editing state ──────────────────────────────────────────────────────────
 *
 * THREE edit idioms ship, and they differ for a reason rather than by drift:
 *
 *   1. CROP (`.crop-editable`, below) — yellow `--bn-colour-crop-bg`. Not
 *      "edit this text" but "move this boundary": it reads as one signal with
 *      the bracket handles, and it is now the only surface on which the
 *      yellow means anything at all.
 *
 *   2. A CODE ON A TINTED CARD (`.tag-input-box` in atoms/input.css,
 *      `.tag-edit-inline` in organisms/codebook-panel.css) — page background,
 *      1px accent edge. The ground is already coloured, so the field blanks to
 *      neutral in order to read as a field.
 *
 *   3. A NAME, TITLE OR DESCRIPTION ON NEUTRAL GROUND — this rule. The ground
 *      is already page white, so the field TINTS instead.
 *
 * Same 1px accent edge either way; the fill inverts because the ground does.
 *
 * `outline`, not `border`: these are spans inside running prose, and a border
 * would add 2px and reflow the line. `outline` is drawn outside the box and
 * costs no layout — the same reason the codebook chip's cursor is an outline.
 *
 * The `[contenteditable="true"]` half is what makes this fire in the SPA AT
 * ALL. `EditableText` never adds a class for the editing state; `.editing` is
 * written by the frozen vanilla renderer alone (`theme/js/editing.js`,
 * `names.js`). So for as long as this rule keyed on `.editing`, a researcher
 * editing a theme heading in the app got the browser's own focus ring and
 * nothing else — a styled state that had never once been seen on the surface
 * it was written for. Key on the attribute: it IS the state, it needs no
 * co-operation from the component, and it cannot fall out of sync.
 */

.quote-card.editing .edit-pencil {
    color: var(--bn-colour-accent);
}

.quote-card.editing .quote-text {
    min-width: 10rem;
    cursor: text;
}

.editable-text[contenteditable="true"],
.editable-text.editing,
.bn-speaker-editable-name[contenteditable="true"] {
    outline: 1px solid var(--bn-field-edit-edge);
    outline-offset: var(--bn-field-edit-offset);
    background: var(--bn-field-edit-fill-on-page);
    border-radius: var(--bn-field-edit-radius);
    cursor: text;
}

/* The box exists at rest so entering it moves no text — padding out, margin
   back, net zero, the idiom `.group-title-text` already uses. Without it the
   tint hugs the glyphs and the heading jumps by a few pixels on every edit. */
.editable-text {
    padding: 1px 3px;
    margin: -1px -3px;
}

/* ── Committed state (dashed underline indicates edit was made) ─────────── */

/* Deliberately NOT shared with the speaker name or the codebook, which mark
   it not at all. A codebook name was never the model's to override; a speaker
   name's italic was dropped on 6 Oct 2026 so that grey italic means only
   "unknown" (`person-badge.css`). One editing signal, one committed one. */
.editable-text.edited {
    border-bottom: 1px dashed var(--bn-colour-muted);
}

/* ── Crop bracket handles ──────────────────────────────────────────────── */

.crop-handle {
    display: inline;
    font-size: 1.15em;
    font-weight: var(--bn-weight-strong);
    color: var(--bn-crop-handle-colour);
    cursor: col-resize;
    user-select: none;
    line-height: 1;
    padding: 0 1px;
    transition: color var(--bn-transition-fast);
    vertical-align: baseline;
}

/* Hide smart quotes when editing — brackets replace them */
.quote-card.editing .smart-quote {
    display: none;
}

.crop-handle:hover {
    color: var(--bn-crop-handle-hover);
}

.crop-handle.dragging {
    color: var(--bn-colour-accent);
}

/* Delayed entrance: hidden initially, fade in after 250ms */
.crop-handle.bracket-delayed {
    opacity: 0;
    visibility: hidden;
}

.crop-handle.bracket-visible {
    opacity: 1;
    visibility: visible;
    animation: bracket-fade-in 0.15s ease;
}

@keyframes bracket-fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* ── Crop editable span (hybrid mode contenteditable) ──────────────────── */

.crop-editable {
    background: var(--bn-colour-crop-bg);
    padding: var(--bn-space-xs) 0;
    border-radius: var(--bn-radius-sm);
    outline: none;
}

/* ── Crop word spans (crop/word-span mode) ─────────────────────────────── */

.crop-word {
    display: inline;
    transition: color var(--bn-transition-fast);
}

/* Included region wrapper: continuous yellow background covers words
   AND inter-word spaces — prevents white gaps between word spans */
.crop-included-region {
    background: var(--bn-colour-crop-bg);
    border-radius: 2px;
    padding: 1px 0;
}

/* Excluded words: grey + strikethrough, no yellow */
.crop-word.excluded {
    color: var(--bn-colour-muted);
    text-decoration: line-through;
    text-decoration-color: var(--bn-colour-muted);
    text-decoration-thickness: 1px;
    background: none;
}

/* ── Crop ellipsis (after commit) ──────────────────────────────────────── */

.crop-ellipsis {
    color: var(--bn-colour-muted);
    user-select: none;
    font-style: normal;
}

/* ── Undo button (replaces pencil icon for edited quotes) ──────────────── */

.undo-btn {
    position: absolute;
    top: 0.65rem;
    right: 3.35rem;
    background: none;
    border: none;
    padding: var(--bn-space-xs);
    font-size: var(--bn-text-label);
    cursor: pointer;
    color: var(--bn-colour-muted);
    line-height: 1;
    opacity: 0;
    transition: opacity var(--bn-transition-fast), color var(--bn-transition-fast);
}

blockquote:hover .undo-btn.visible {
    opacity: 1;
}

.undo-btn.visible:hover {
    color: var(--bn-colour-accent);
}

/* --- molecules/quote-actions.css --- */
/* Molecule: quote-actions — edit and starred state styles on .quote-card */

.quote-card.starred .star-btn {
    color: var(--bn-colour-starred);
}

.quote-card.starred {
    font-weight: var(--bn-weight-starred);
    /* The bar is a SECOND cue, not the mark — the glyph above is the mark and
       keeps its full contrast in both schemes. Light reads as a gentle bracket
       for the eye at 2.73 against the card. Dark shipped at 10.84 — four times
       that — and the failure isn't loudness, it's ownership: at that contrast a
       1px rule sitting in the gutter of a 2- or 3-column grid reads as a
       DIVIDER between two quotes rather than as the left bracket of the one it
       belongs to, so on a wide screen you can't tell which card it marks.
       Mixing toward the card's own background pulls it back onto its card.

       39% is tuned to DEFAULT, which it matches exactly: 10.84 -> 2.73, the
       light bar's ratio. Edo lands at 2.22 against its own light reference of
       2.72 — gentler than parity, deliberately not chased. One shared
       percentage can't satisfy both (edo would want 49%), and edo is owed a
       whole colour pass of its own; that it can't carry a formula tuned for
       default is part of why it isn't the default palette. Revisit the edo
       number in that pass, not by splitting the difference here and getting
       neither right. The glyph plus --bn-weight-starred do the actual work in
       both. */
    border-left-color: light-dark(
        var(--bn-colour-starred),
        color-mix(in srgb, var(--bn-colour-starred) 39%, var(--bn-colour-quote-bg))
    );
}

.quote-card.starred .context,
.quote-card.starred .timecode,
.quote-card.starred .speaker,
.quote-card.starred .badges {
    font-weight: var(--bn-weight-normal);
}

/* (editing/edited rules moved to molecules/editable-text.css) */

.quote-card.star-animating {
    transition: transform var(--bn-transition-normal);
    z-index: 1;
}

/* ── Bulk-action hover preview ─────────────────────────────────────────── */

/* Will-be-starred: star shifts toward filled state + accent blue tint */
.quote-card.bn-preview-star .star-btn {
    color: var(--bn-colour-accent);
    opacity: 0.6;
}

/* Will-be-unstarred: star shifts toward idle state + pale blue wash */
.quote-card.bn-preview-unstar .star-btn {
    color: var(--bn-colour-accent);
    opacity: 0.35;
}

/* Override starred quote's own star colour during unstar preview */
.quote-card.starred.bn-preview-unstar .star-btn {
    color: var(--bn-colour-accent);
    opacity: 0.35;
}

/* Will-be-hidden: force hide buttons visible + accent blue, fade quote slightly */
.quote-card.bn-preview-hide {
    opacity: 0.85;
    transition: opacity var(--bn-transition-fast);
}

.quote-card.bn-preview-hide .hide-btn {
    opacity: 1;
    color: var(--bn-colour-accent);
}

/* --- molecules/tag-input.css --- */
/* Molecule: tag-input — input wrapper with auto-suggest dropdown */

.tag-input-wrap {
    display: inline-flex;
    align-items: center;
    position: relative;
}

.tag-suggest {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 0.2rem;
    background: var(--bn-colour-bg);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-sm);
    box-shadow: 0 2px 8px var(--bn-colour-shadow);
    z-index: 50;
    /* Cap dropdown height: 24rem absolute max, but never more than 50% of
       the dynamic viewport.  Near the bottom of the page the dvh cap kicks
       in; near the top we get up to ~384px (room for ~16 tag rows). */
    max-height: min(24rem, 50dvh);
    overflow-y: auto;
    min-width: 8rem;
    width: max-content;
}

/* ── Group header (non-selectable section divider) ─────────────────── */

.tag-suggest-header {
    padding: 0.3rem 0.5rem 0.15rem;
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-muted);
    white-space: nowrap;
    user-select: none;
    border-radius: var(--bn-radius-sm);
    margin: 0.15rem 0.2rem 0;
}

/* Subtle top border between groups (not on first group) */
.tag-suggest-header:not(:first-child) {
    border-top: 1px solid var(--bn-colour-border);
    margin-top: 0.25rem;
    padding-top: 0.4rem;
}

/* ── Tag suggestion items ──────────────────────────────────────────── */

.tag-suggest-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.2rem 0.5rem 0.2rem 0.65rem;
    cursor: pointer;
    color: var(--bn-colour-text);
    white-space: nowrap;
}

.tag-suggest-item:hover,
.tag-suggest-item.active {
    background: var(--bn-colour-quote-bg);
}

/* ── Tag pill inside suggestion item ───────────────────────────────── */

.tag-suggest-pill {
    display: inline-block;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    padding: var(--bn-space-xs) 0.45rem;
    border-radius: var(--bn-radius-sm);
    background: var(--bn-colour-badge-bg);
    color: var(--bn-colour-badge-text);
    white-space: nowrap;
    line-height: 1.3;
}

/* Active pill: stronger contrast to indicate keyboard selection */
.tag-suggest-item.active .tag-suggest-pill {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: 1px;
}

/* Dark mode: white text only on the active/focused pill to signal "this is what
   Enter/Tab will apply". Non-active pills keep default badge-text colour. */
@supports (color: light-dark(#000, #fff)) {
    [data-theme="dark"] .tag-suggest-item.active .tag-suggest-pill {
        color: #ffffff;
        font-weight: var(--bn-weight-emphasis);
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .tag-suggest-item.active .tag-suggest-pill {
            color: #ffffff;
            font-weight: var(--bn-weight-emphasis);
        }
    }
}

/* ── Z-index fix: elevate quote card when dropdown is open ─────────── */
/* Each .quote-card is position:relative — sibling cards paint over the
   dropdown.  Raise the card that contains an open suggest dropdown. */
.quote-card:has(.tag-suggest) {
    z-index: 10;
}

/* ── Clip fix: drop paint containment on the card with an open dropdown ─ */
/* `.quote-group .quote-card` sets `content-visibility: auto` (blockquote.css)
   to skip off-screen render — which implies `contain: paint` and clips the
   absolutely-positioned dropdown at the card's bottom edge. Switch the one
   card with an open dropdown back to `visible` so the dropdown can overflow.
   Specificity 0,3,0 beats `.quote-group .quote-card` (0,2,0) so it wins
   regardless of source order; scoped to `.quote-group` because that's the
   only place content-visibility is set. Only ever one card at a time (tags
   are edited on one quote), so the render-skip loss is nil. */
.quote-group .quote-card:has(.tag-suggest) {
    content-visibility: visible;
}

/* ── Hidden-group eye icon ─────────────────────────────────────────── */

.tag-suggest-hidden-icon {
    display: inline-block;
    vertical-align: middle;
    margin-left: 0.25rem;
    opacity: 0.4;
    width: 12px;
    height: 12px;
    flex-shrink: 0;
}

/* --- molecules/sparkline.css --- */
/* Molecule: sparkline — miniature stacked bar chart */

.bn-sparkline {
    display: inline-flex;
    align-items: flex-end;
    height: 54px;
}

.bn-sparkline-bar {
    width: 5px;
    border-radius: 1px 1px 0 0;
}

/* --- molecules/search.css --- */
/* Molecule: search — collapsible search filter in the toolbar */

.search-container {
    display: flex;
    align-items: center;
    gap: var(--bn-space-sm);
    margin-right: auto;
}

.search-toggle {
    background: none;
    border: none;
    padding: 0.3rem;
    cursor: pointer;
    color: var(--bn-colour-muted);
    line-height: 1;
    transition: color var(--bn-transition-fast);
    flex-shrink: 0;
}

.search-toggle:hover {
    color: var(--bn-colour-accent);
}

.search-toggle svg {
    display: block;
    width: 15px;
    height: 15px;
}

.search-field {
    display: none;
    position: relative;
}

.search-container.expanded .search-field {
    display: block;
}

.search-input {
    font-family: var(--bn-font-body);
    font-size: var(--bn-text-label);
    padding: 0.3rem 1.6rem 0.3rem 0.5rem;
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-md);
    background: var(--bn-colour-bg);
    color: var(--bn-colour-text);
    outline: none;
    width: 14rem;
    transition: border-color var(--bn-transition-fast);
}

.search-input:focus {
    border-color: var(--bn-colour-accent);
}

.search-input::placeholder {
    color: var(--bn-colour-muted);
    font-style: italic;
}

.search-clear {
    display: none;
    position: absolute;
    right: 0.3rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 0.2rem;
    cursor: pointer;
    color: var(--bn-colour-muted);
    line-height: 1;
    transition: color var(--bn-transition-fast);
}

.search-clear:hover {
    color: var(--bn-colour-accent);
}

.search-clear svg {
    display: block;
}

.search-container.has-query .search-clear {
    display: block;
}

.search-mark {
    background: var(--bn-colour-highlight);
    border-radius: 2px;
    padding: 0 1px;
}

/* ── Tokens and suggestions (docs/design-search.md §4–§6) ──────────────
   Tokens sit before the text inside the field, as in Mail: the meaning word,
   the real badge, ▾. The suggestions list and a token's meaning menu take
   the toolbar dropdown's look (organisms/toolbar.css .view-switcher-menu). */

/* The toolbar right-aligns its items, so a field that will not shrink spills
   out of the column to the left. With tokens it shrinks, and the chips wrap
   onto a second line rather than scroll (a scrolling strip would clip each
   chip's menu). */
.search-container.has-tokens {
    min-width: 0;
    flex: 0 1 auto;
}

.search-container.has-tokens .search-field {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    min-width: 0;
    gap: var(--bn-space-xs);
    padding: 2px 1.6rem 2px 4px;
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-md);
    background: var(--bn-colour-bg);
    transition: border-color var(--bn-transition-fast);
}

.search-container.has-tokens .search-field:focus-within {
    border-color: var(--bn-colour-accent);
}

.search-container.has-tokens .search-input {
    flex: 1 1 5rem;
    min-width: 5rem;
    width: 8rem;
    border: none;
    padding-left: 2px;
    background: transparent;
}

.search-container.has-tokens .search-clear {
    display: block;
}

.search-tokens {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--bn-space-xs);
    min-width: 0;
}

.search-token-wrap {
    position: relative;
}

.search-token {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 4px 1px 7px;
    border: none;
    border-radius: var(--bn-radius-md);
    background: var(--bn-colour-quote-bg);
    font-family: var(--bn-font-body);
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    white-space: nowrap;
    cursor: pointer;
}

.search-token.selected {
    box-shadow: 0 0 0 2px var(--bn-colour-accent);
}

.search-token-disclosure {
    display: block;
    flex-shrink: 0;
}

.search-token-menu,
.search-listbox {
    position: absolute;
    top: 100%;
    left: 0;
    margin: 0.25rem 0 0;
    padding: 0.25rem;
    list-style: none;
    background: var(--bn-colour-bg);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-md);
    box-shadow: 0 4px 12px var(--bn-colour-shadow);
    z-index: 200;
}

.search-token-menu {
    min-width: 12rem;
}

.search-listbox {
    min-width: 22rem;
}

.search-token-menu li {
    display: flex;
    align-items: center;
    gap: var(--bn-space-sm);
    padding: 0.4rem 0.6rem;
    border-radius: var(--bn-radius-sm);
    font-size: var(--bn-text-label);
    color: var(--bn-colour-text);
    white-space: nowrap;
    cursor: pointer;
}

.search-token-menu li:hover,
.search-token-menu li:focus {
    background: var(--bn-colour-quote-bg);
    outline: none;
}

/* The fill alone is ~1.05:1 on the page — invisible to a keyboard user. The
   ring is what says which item has the focus (WCAG 2.4.7, 1.4.11). */
.search-token-menu li:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -2px;
}

.search-token-menu li.disabled {
    color: var(--bn-colour-muted);
    cursor: default;
}

.search-token-menu li.disabled:hover {
    background: none;
}

.search-token-menu .menu-icon {
    display: inline-block;
    width: 1em;
    text-align: center;
    color: var(--bn-colour-muted);
}

.search-token-menu li.search-token-menu-separator {
    height: 1px;
    margin: 0.25rem 0.4rem;
    padding: 0;
    background: var(--bn-colour-border);
    cursor: default;
}

.search-option {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    align-items: center;
    gap: var(--bn-space-sm);
    min-height: 1.9rem;
    padding: 0.2rem 0.5rem;
    border-radius: var(--bn-radius-sm);
    font-size: var(--bn-text-label);
    cursor: pointer;
}

.search-option.highlighted {
