   the clips at an opacity. The opacity is the design: the clip keeps its colour and the track its
   identity, and only change shows. The clip's edge is redrawn over it so a striped clip keeps its
   outline. */
.bn-tp-strip { pointer-events: none; }
.bn-tp-strip-ppt { opacity: 0.7; }
.bn-tp-strip-team { opacity: 0.75; }
.bn-tp-clip-edge { fill: none; stroke: rgb(0 0 0 / 0.25); stroke-width: 0.75; pointer-events: none; }
/* A notch where the scene changed: a short hairline just above the tracks, in the text ink. */
.bn-tp-notch { stroke: var(--bn-colour-text); stroke-width: 1; opacity: 0.6; pointer-events: none; }
.bn-tp-clip-label {
    font: var(--bn-weight-emphasis) var(--bn-tp-text-clip, var(--bn-text-badge)) var(--bn-font-body);
    pointer-events: none;
}
/* Neutral clips only; a scene-coloured clip's ink is chosen in JS by WCAG contrast. */
.bn-tp-clip-label.on-team { fill: var(--bn-colour-text); }
.bn-tp-clip-label.on-ppt { fill: light-dark(#fff, #111); }

.bn-tp-flag { cursor: pointer; }
/* A flag is a button (one Tab stop per timeline, roving): the focus ring is the banner's own
   hairline in the accent, heavier, so it reads apart from the hot (pointer) state. The doubled
   class outranks .raised and .hot (0,2,1), which come later: the flag just jumped to is the
   raised one, and its ring must still show. */
.bn-tp-flag:focus { outline: none; }
.bn-tp-flag.bn-tp-flag:focus-visible :is(line, path) { stroke: var(--bn-colour-accent); stroke-width: 2; }
/* The staff and the banner share one hairline: the border keyline at rest, the text
   ink when raised — darker, never thicker. */
.bn-tp-flag line,
.bn-tp-flag path { stroke: var(--bn-colour-border); stroke-width: 1; }
.bn-tp-flag path { fill: var(--bn-tp-flag-rest); }
.bn-tp-flag.raised line,
.bn-tp-flag.raised path { stroke: var(--bn-colour-text); }
.bn-tp-flag.raised path { fill: var(--bn-colour-bg); }
/* Directly under the pointer: the app's selected blue — ink and wash — on the same
   hairline, so it is clear a click goes there. */
.bn-tp-flag.hot line,
.bn-tp-flag.hot path { stroke: var(--bn-selection-border); }
.bn-tp-flag.hot path { fill: var(--bn-selection-bg); }
/* The label keeps the text ink: blue text on the selection wash is 3.6:1. The blue staff,
   hairline and wash carry the state. */
.bn-tp-flag text {
    font: var(--bn-weight-emphasis) var(--bn-tp-text-flag, var(--bn-text-label)) var(--bn-font-body);
    fill: var(--bn-colour-text);
}
.bn-tp-hit { cursor: pointer; }
.bn-tp-playhead { stroke: var(--bn-colour-accent); stroke-width: 1; pointer-events: none; }

.bn-tp-axis { stroke: var(--bn-colour-muted); stroke-width: 0.8; }
.bn-tp-bar { cursor: pointer; transition: opacity 0.12s; }
.bn-tp-bar:focus { outline: none; }
.bn-tp-bar.sel { stroke: var(--bn-colour-text); stroke-width: 1.25; }
/* Focus is its own ring, so a keyboard user can tell it from the selection. */
.bn-tp-bar:focus-visible { stroke: var(--bn-colour-accent); stroke-width: 2; }
/* 0.4, not lower: a dimmed bar is still a control and must keep 3:1 (WCAG 1.4.11). */
.bn-tp-bar.dim { opacity: 0.4; }
.bn-tp-unrated { fill: var(--bn-colour-muted); }
/* The invisible, wider click target over each sentiment mark (pointer only). */
.bn-tp-bar-hit { fill: transparent; cursor: pointer; }

.bn-tp-span { fill: var(--bn-colour-muted); opacity: 0.5; }
/* The chip's fill is a gradient set inline (solid, then fading out over its last 20%), so
   only its left edge is hard — on the timecode where the theme starts. */
.bn-tp-tag { fill: var(--bn-colour-badge-bg); }
/* Sans, not mono: monospace is reserved for tag text, and a theme is not a tag. */
.bn-tp-tag-text {
    font: var(--bn-weight-normal) var(--bn-tp-text-theme, var(--bn-text-label)) var(--bn-font-body);
    fill: var(--bn-colour-badge-text);
}

/* Quote popover: floats under the selected bar, over the themes track, with an
   arrow on the bar — a Mac popover. The whole popover opens the transcript; the
   faint hover tint is the affordance. Shadow: the focused-card token. */
.bn-tp-wrap { position: relative; }
.bn-tp-popover {
    position: absolute;
    z-index: 20;
    box-sizing: border-box;
    padding: var(--bn-tp-pad-popover, var(--bn-space-md));
    background: var(--bn-colour-bg);
    border-radius: var(--bn-radius-lg);
    box-shadow: var(--bn-focus-shadow);
    cursor: pointer;
    transition: background-color 0.12s ease;
}
/* The arrow: a square turned 45°, sharing the popover's ground (so it takes the
   hover tint too) and its hairline on the two outward edges. */
.bn-tp-popover::before {
    content: "";
    position: absolute;
    top: -6px;
    left: calc(var(--bn-tp-arrow-x, 24px) - 6px);
    width: 12px;
    height: 12px;
    background: inherit;
    transform: rotate(45deg);
    box-shadow: -1px -1px 0 rgba(0, 0, 0, 0.05);
    border-top-left-radius: 2px;
}
.bn-tp-popover:hover { background: var(--bn-tp-popover-hover); }
/* --bn-focus-shadow has no dark value, and a dark shadow on a dark ground is no
   edge at all; dark mode adds a faint light hairline instead. */
.bn-tp-popover { outline: 1px solid light-dark(transparent, rgb(255 255 255 / 0.1)); }
.bn-tp-popover::before { box-shadow: -1px -1px 0 light-dark(rgba(0, 0, 0, 0.05), rgb(255 255 255 / 0.1)); }
.bn-tp-meta {
    display: flex;
    align-items: center;
    gap: var(--bn-space-sm);
    flex-wrap: wrap;
    padding-right: 72px; /* room for prev / next / close */
    font-size: var(--bn-tp-text-pop-meta, var(--bn-text-caption));
    color: var(--bn-colour-muted);
}
.bn-tp-tc {
    all: unset;
    font-family: var(--bn-font-mono);
    color: var(--bn-colour-muted);
    cursor: pointer;
    border-radius: var(--bn-radius-sm);
}
.bn-tp-tc:hover { color: var(--bn-colour-text); }
.bn-tp-tc:focus-visible { outline: 2px solid var(--bn-colour-accent); outline-offset: 1px; }
.bn-tp-popover blockquote {
    margin: var(--bn-space-sm) 0 0;
    font-size: var(--bn-tp-text-pop-quote, var(--bn-text-body));
    line-height: 1.5;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    line-clamp: 4;
    overflow: hidden;
}
.bn-tp-actions {
    position: absolute;
    top: 6px;
    right: 6px;
    display: flex;
    align-items: center;
}
.bn-tp-close {
    all: unset;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: var(--bn-radius-sm);
    color: var(--bn-colour-muted);
    cursor: pointer;
}
.bn-tp-close:hover { color: var(--bn-colour-text); }
.bn-tp-close:focus-visible { outline: 2px solid var(--bn-colour-accent); outline-offset: -2px; }
.bn-tp-close svg { width: 10px; height: 10px; }

/* Previous / next: bristlenose.app's homepage carousel buttons, at 12 px (from
   26) inside a 22 px hit area, revealed on hover or keyboard focus as there. */
.bn-tp-nav { display: flex; }
.bn-tp-nav button {
    all: unset;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease-in-out;
    color: var(--bn-colour-text);
}
.bn-tp-nav button > span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.72);
    -webkit-backdrop-filter: blur(12px) saturate(1.5);
    backdrop-filter: blur(12px) saturate(1.5);
    box-shadow: 0 0.5px 1px rgba(0, 0, 0, 0.15);
    display: grid;
    place-items: center;
}
.bn-tp-nav svg { width: 6px; height: 6px; }
.bn-tp-nav button:disabled > span { opacity: 0.35; }
.bn-tp-popover:hover .bn-tp-nav button,
.bn-tp-popover:focus-within .bn-tp-nav button { opacity: 1; pointer-events: auto; }
.bn-tp-nav button:focus-visible > span { outline: 2px solid var(--bn-colour-accent); outline-offset: 1px; }
@media (prefers-color-scheme: dark) {
    .bn-tp-nav button > span { background: rgba(40, 40, 40, 0.72); border-color: rgba(255, 255, 255, 0.1); }
}

/* NEW: zoom — a mini slider between magnifiers (Photos, the Final Cut timeline),
   in the section heading's action slot; no range control ships elsewhere. */
.bn-tp-zoom { display: flex; align-items: center; gap: 2px; }
.bn-tp-zoom-btn {
    all: unset;
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    border-radius: var(--bn-radius-sm);
    color: var(--bn-colour-muted);
    cursor: pointer;
}
.bn-tp-zoom-btn:hover { color: var(--bn-colour-text); }
.bn-tp-zoom-btn:disabled { opacity: 0.4; cursor: default; }
.bn-tp-zoom-btn:focus-visible { outline: 2px solid var(--bn-colour-accent); outline-offset: 1px; }
.bn-tp-zoom-btn svg { width: 12px; height: 12px; }
.bn-tp-zoom-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 64px;
    height: 14px;
    margin: 0 2px;
    background: none;
}
.bn-tp-zoom-slider:focus-visible { outline: 2px solid var(--bn-colour-accent); outline-offset: 1px; }
/* Track and thumb ring meet 3:1 against the page (WCAG 1.4.11). */
.bn-tp-zoom-slider::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--bn-colour-muted); }
.bn-tp-zoom-slider::-moz-range-track { height: 3px; border-radius: 2px; background: var(--bn-colour-muted); }
.bn-tp-zoom-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px;
    height: 11px;
    margin-top: -4px;
    border-radius: 50%;
    background: light-dark(#fff, #d8d8dc);
    box-shadow: 0 0 0 1px var(--bn-colour-muted), 0 1px 2px rgb(0 0 0 / 0.25);
}
.bn-tp-zoom-slider::-moz-range-thumb {
    width: 11px;
    height: 11px;
    border: 0;
    border-radius: 50%;
    background: light-dark(#fff, #d8d8dc);
    box-shadow: 0 0 0 1px var(--bn-colour-muted), 0 1px 2px rgb(0 0 0 / 0.25);
}

@media (prefers-reduced-motion: reduce) {
    .bn-tapestry-preview,
    .bn-tp-pv-track,
    .bn-session-journey .bn-journey-sep,
    .bn-tapestry-toggle svg,
    .bn-tp-bar,
    .bn-tp-popover,
    .bn-tp-nav button { transition: none; }
}

@media print {
    .bn-tapestry-preview,
    .bn-tapestry-toggle,
    .bn-tp-zoom { display: none; }
}

/* ── The transcript's sticky timeline (islands/transcript/TranscriptTimeline.tsx) ──
   The same timeline, with what the reader can see drawn on it and the player's moment while media
   plays. docs/mockups/transcript-timeline-toggle.html. */
:root {
    /* The reading window is the minimap's viewport indicator: the house mark for "what you are
       looking at" (organisms/minimap.css), aliased so the family has its own names. */
    --bn-tp-window-bg: var(--bn-minimap-viewport-bg);
    --bn-tp-window-border: var(--bn-minimap-viewport-border);
}
.bn-tp-window {
    fill: var(--bn-tp-window-bg);
    stroke: var(--bn-tp-window-border);
    stroke-width: 1.5;
    pointer-events: none;
}
/* Draggable, as the minimap's viewport is: dragging scrolls the transcript. */
.bn-tp-window.draggable { pointer-events: auto; cursor: grab; }
.bn-tp-window.draggable:active { cursor: grabbing; }
/* The player's moment: accent, a notch heavier than the hover cursor (.bn-tp-playhead), with a
   head, so the two never read as one. */
.bn-tp-player { pointer-events: none; }
.bn-tp-player line { stroke: var(--bn-colour-accent); stroke-width: 1.5; }
.bn-tp-player path { fill: var(--bn-colour-accent); }

/* ── Hover thumbnail: a still of the participant's screen below the speaker lane ──
   (utils/tapestryThumb.ts). Fixed on document.body, so the slice's scroll cannot clip it;
   the popover's ground and shadow; never takes the pointer. */
.bn-tp-thumb {
    position: fixed;
    z-index: 20;
    padding: 3px;
    background: var(--bn-colour-bg);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-md);
    box-shadow: var(--bn-focus-shadow);
    pointer-events: none;
    animation: bn-tp-thumb-in 0.12s ease;
}
.bn-tp-thumb img {
    display: block;
    width: var(--bn-tp-thumb-w, 160px);
    height: auto;
    border-radius: calc(var(--bn-radius-md) - 2px);
}
.bn-tp-thumb-tc {
    display: block;
    padding: 3px 3px 0;
    font: var(--bn-text-micro) var(--bn-font-mono);
    color: var(--bn-colour-muted);
}
@keyframes bn-tp-thumb-in {
    from { opacity: 0; transform: translateY(-3px); }
}
@media (prefers-reduced-motion: reduce) {
    .bn-tp-thumb { animation: none; }
}
/* The stretch of the participant track the frame stands for. */
.bn-tp-thumb-src { fill: none; stroke: var(--bn-colour-accent); stroke-width: 1.5; pointer-events: none; }

/* --- organisms/transcription-diagnostics.css --- */
/* ── Transcription diagnostics (only with the diagnostics preference on) ──
   Inside the timeline's scroll container: the lanes scroll with the timeline, the header
   and panels stay put. Muted and colourless on purpose — content owns colour, and these
   numbers say where to listen, not how good the transcript is. */
.bn-dx {
    font: var(--bn-weight-normal) var(--bn-text-caption) var(--bn-font-body);
    color: var(--bn-colour-muted);
}
/* .bn-dx is as wide as the lanes (set inline), so these have room to stay put; the
   scroller is a size container, so 100cqi is its visible width, not its scroll width. */
.bn-tapestry-scroll:has(> .bn-dx) {
    container-type: inline-size;
}
.bn-dx-head,
.bn-dx-panels {
    position: sticky;
    left: 0;
    box-sizing: border-box;
    width: 100cqi;
}
.bn-dx-head {
    display: flex;
    align-items: baseline;
    gap: var(--bn-space-sm);
    padding: var(--bn-space-xs) 0 var(--bn-space-xs) 12px;
}
.bn-dx-toggle {
    font: var(--bn-weight-emphasis) var(--bn-text-caption) var(--bn-font-body);
    color: var(--bn-colour-text);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
}
.bn-dx-toggle:focus-visible,
.bn-dx-time:focus-visible {
    outline: none;
    box-shadow: var(--bn-focus-shadow);
    border-radius: var(--bn-radius-sm);
}
.bn-dx-chevron {
    display: inline-block;
    width: 1em;
}
.bn-dx-headline {
    font-variant-numeric: tabular-nums;
}
.bn-dx-lanes {
    display: block;
}
.bn-dx-track {
    fill: var(--bn-colour-quote-bg);
}
.bn-dx-floor {
    stroke: var(--bn-colour-muted);
    stroke-width: 1;
    stroke-dasharray: 3 3;
    opacity: 0.6;
}
.bn-dx-sound {
    fill: none;
    stroke: var(--bn-colour-text);
    stroke-width: 1;
    opacity: 0.7;
}
.bn-dx-pace {
    fill: var(--bn-colour-muted);
    opacity: 0.55;
}
.bn-dx-doubt {
    fill: var(--bn-colour-text);
}
.bn-dx-gap-found {
    fill: none;
    stroke: var(--bn-colour-muted);
    stroke-width: 1;
}
.bn-dx-gap-empty {
    fill: var(--bn-colour-text);
    opacity: 0.55;
    cursor: pointer;
}
.bn-dx-panels {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
    gap: var(--bn-space-sm) var(--bn-space-lg);
    padding: var(--bn-space-sm) 0 var(--bn-space-md) 12px;
}
.bn-dx-panel-title {
    margin: 0 0 var(--bn-space-xs);
    font: var(--bn-weight-emphasis) var(--bn-text-caption) var(--bn-font-body);
    color: var(--bn-colour-text);
}
.bn-dx-kv {
    margin: 0;
}
.bn-dx-row {
    display: flex;
    justify-content: space-between;
    gap: var(--bn-space-sm);
}
.bn-dx-row dt,
.bn-dx-row dd {
    margin: 0;
}
.bn-dx-row dt {
    white-space: nowrap;
}
.bn-dx-row dd {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--bn-colour-text);
}
.bn-dx-note {
    color: var(--bn-colour-muted);
}
.bn-dx-listen {
    margin: var(--bn-space-xs) 0 0;
}
.bn-dx-time {
    font: inherit;
    font-variant-numeric: tabular-nums;
    color: var(--bn-colour-accent);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
}

/* --- organisms/codebook-panel.css --- */
/* organisms/codebook-panel.css — Codebook page grid layout and components.
   Used only on codebook.html (standalone page opened from toolbar button).
   All values via design tokens — no hard-coded colours/spacing. */

/* ── Grid — top-aligned columns ────────────────────────────────────────── */

.codebook-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: var(--bn-space-lg);
    align-items: start;
}

/* Native CSS masonry — same progressive enhancement as .quote-group (see
   organisms/responsive-grid.css for the engine-support notes). Group cards vary
   wildly in height (a 3-tag group beside a 20-tag one), so top-aligned rows
   leave dead space under every short card. Lanes reuse the auto-fill track
   count above — the responsive column count is unchanged.

   The .framework-section-header rows span every lane (grid-column: 1 / -1), so
   they reset all lanes to a common baseline: packing is confined *within* each
   codebook section rather than running the length of the page.

   Must stay in this file, after the base rule — responsive-grid.css loads
   earlier in _THEME_FILES and would lose the display declaration on source
   order. Delete this block to revert to the rectangular grid. */
@supports (display: grid-lanes) {
    .codebook-grid {
        display: grid-lanes;
        flow-tolerance: var(--bn-flow-tolerance);
    }
}

/* ── Group column ──────────────────────────────────────────────────────── */

.codebook-group {
    border-radius: var(--bn-radius-lg);
    padding: var(--bn-space-md);
    min-height: 120px;
    position: relative;
    border: 1px solid transparent;
    transition: border-color var(--bn-transition-fast), box-shadow var(--bn-transition-fast);
    /* Grid child — no break-inside or margin needed (grid gap handles spacing) */
}

/* The group focus cursor.
 *
 * Three constraints decided this rule, in order:
 *
 * 1. QUALIFIED WITH THE BASE CLASS. `.bn-selected` alone is (0,1,0) and ties
 *    with `.codebook-group`'s own `border: 1px solid transparent` — and this
 *    file is concatenated AFTER `atoms/interactive.css`, so the tie goes to
 *    the transparent border and the cursor paints nothing. That is exactly
 *    the trap `theme/CLAUDE.md` documents for `blockquote.quote-card`, and
 *    the codebook shipped it on 12 Sep 2026 with no CSS at all.
 *
 * 2. BORDER, NOT BACKGROUND. `.bn-selected`'s `background` can never win
 *    here: the card carries an inline `backgroundColor` from `getGroupBg`,
 *    and inline beats any class. The wash is also the card's colour identity
 *    and shouldn't be overwritten. So the cursor is an edge.
 *
 * 3. ORDERED BEFORE `.drag-over`, AND VISUALLY DISTINCT FROM IT. Both are
 *    (0,2,0) in this file, so source order alone separates them: drag-over
 *    comes later and wins on the one card you are dragging onto, which is
 *    correct — during a drag the drop target is what matters. They must not
 *    look alike either, or the affordance says nothing, so drag-over keeps
 *    `--bn-focus-ring` and the cursor takes a tighter inset edge. */
.codebook-group.bn-selected {
    border-color: var(--bn-selection-border);
}

/* macOS de-emphasises selection on an inactive window. `atoms/interactive.css`
 * implements that for `.bn-selected` generally, but its rule only repaints
 * `border-left-color` — which this one overrode with the `border-color`
 * shorthand. Without this companion the codebook cursor would be the one
 * selection surface in the app that stays bright on window blur. */
.bn-window-inactive .codebook-group.bn-selected {
    border-color: var(--bn-selection-border-inactive);
}

/* A field inside the card has keyboard focus, so the card's own cursor stands
 * down. Focus in a text field is a *more precise* statement of where you are
 * than a ring round the whole card, and the two together read as two boxes:
 * concentric, same colour, ten pixels apart — which is not a thing macOS does.
 * When you rename in Finder, the row does not compete with the field.
 *
 * `:focus-within` rather than a narrower editable-only selector because every
 * focusable thing in this card (the ✕, the tag input, the three inline
 * editors) makes the same argument: something inside has the keyboard, and it
 * is drawing its own ring to say so.
 *
 * (0,3,0), and after the inactive rule so it wins that tie too — the card
 * should stand down on an inactive window as well, not merely dim. */
.codebook-group.bn-selected:focus-within {
    border-color: transparent;
}

/* EditableText in `trigger="click"` mode applied an inline `cursor: text`; the
 * span that replaced it inherits `.group-title-text { cursor: default }` — the
 * SAME class the read-only title renders — so an editable group title became
 * indistinguishable from one you cannot edit, while its own sibling subtitle
 * still showed an I-beam. Scoped to the focused card because that is exactly
 * when clicking the title renames it, and to `--editable` so a framework
 * card's title never claims to be typeable. */
.codebook-group.bn-selected .group-title-text--editable {
    cursor: text;
}

.codebook-group.drag-over {
    border-color: var(--bn-colour-accent);
    box-shadow: var(--bn-focus-ring);
}

/* ── Group header ──────────────────────────────────────────────────────── */

.group-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: var(--bn-space-sm);
    gap: var(--bn-space-xs);
}

.group-title-area {
    flex: 1;
    min-width: 0;
}

.group-title {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
    line-height: var(--bn-text-label-lh);
}

.group-title-text {
    cursor: default;
    border-radius: var(--bn-radius-sm);
    padding: 1px 3px;
    margin: -1px -3px;
}
.group-title-text:hover {
    background: var(--bn-hover-bg);
}

.group-close {
    background: none;
    border: none;
    font-size: 1rem;
    line-height: 1;
    color: var(--bn-colour-muted);
    cursor: pointer;
    padding: 0.15rem 0.3rem;
    border-radius: var(--bn-radius-sm);
    opacity: 0;
    transition: opacity var(--bn-transition-fast),
                color var(--bn-transition-fast),
                background var(--bn-transition-fast);
    flex-shrink: 0;
    margin-top: -2px;
    margin-right: -4px;
}
.codebook-group:hover .group-close {
    opacity: 0.5;
}
.group-close:hover {
    opacity: 1 !important;
    color: var(--bn-colour-text);
    background: var(--bn-colour-quote-bg);
}

/* Subtitle — click to edit */
.group-subtitle {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    margin-top: 1px;
    cursor: text;
    padding: 1px 3px;
    margin-left: -3px;
    border-radius: var(--bn-radius-sm);
    min-height: 1.2em;
    line-height: var(--bn-text-caption-lh);
}
.group-subtitle:hover {
    background: var(--bn-hover-bg-subtle);
}
/* Hug the content while editing, as the title does.
 *
 * The title renders through `EditableText as="span"` — inline, so its box
 * grows with the text. The subtitle renders `as="p"`, which is right at rest
 * (it is prose and it wraps) and wrong while editing: a block box takes the
 * full card width, so a three-word subtitle gets a field four times its
 * length. Fixed here rather than by changing the element, because `p` is the
 * correct semantics for the resting state and only the editing box is wrong.
 *
 * The `min-width` is load-bearing: an empty subtitle edits an empty string,
 * and an inline-block with no content collapses to nothing — a caret with no
 * box, which is the state you are in every time you add a subtitle. */
.group-subtitle[contenteditable="true"] {
    display: inline-block;
    min-width: 12ch;
}

/* The card's own two fields, in the card's own idiom.
 *
 * `editable-text.css` carries the house rule for a name or title being edited
 * and tints the field, because out there the ground is page white. Here the
 * ground is a group-tinted card, so a tint on a tint reads as nothing — the
 * same wall the code cursor hit at 1.01:1. These blank to page background
 * instead, which is exactly what `.tag-input-box` and `.tag-edit-inline` do
 * three inches below: one card, one idiom, whether you are naming the group or
 * naming a code inside it.
 *
 * `outline` rather than the chips' `border` because both of these are prose
 * spans in a header that has to hold its line; the edge colour is the signal
 * and the mechanism is free to differ. `.codebook-group.bn-selected
 * :focus-within` stands the CARD's edge down as this one lights, so there is
 * one accent edge on screen and it is around the thing taking the keystrokes. */
.group-title-text[contenteditable="true"],
.group-subtitle[contenteditable="true"] {
    outline: 1px solid var(--bn-field-edit-edge);
    outline-offset: var(--bn-field-edit-offset);
    background: var(--bn-field-edit-fill-on-tint);
    border-radius: var(--bn-field-edit-radius);
}

.group-subtitle.placeholder {
    font-style: italic;
    opacity: 0.45;
}

/* TagInput inside codebook groups: match upscaled badge font size */
.codebook-group .tag-input {
    font-size: var(--bn-text-label);
}

/* Group total row — aligns with tag-row count column */
.group-total-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: var(--bn-space-sm);
    padding: 0 4px 4px;
}
.group-total-label {
    font-size: var(--bn-text-badge);
    color: var(--bn-colour-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.group-total-count {
    font-size: var(--bn-text-caption);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-muted);
    font-variant-numeric: tabular-nums;
    min-width: 16px;
    text-align: right;
}

/* ── Tag list ──────────────────────────────────────────────────────────── */

.tag-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

/* ── Tag row ───────────────────────────────────────────────────────────── */

.tag-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: var(--bn-space-sm);
    padding: 3px 4px;
    border-radius: var(--bn-radius-sm);
    cursor: grab;
    transition: background var(--bn-transition-fast),
                box-shadow var(--bn-transition-fast),
                opacity var(--bn-transition-fast);
    position: relative;
}
.codebook-panel .tag-row:hover {
    background: var(--bn-hover-bg-subtle);
}
.tag-row:active {
    cursor: grabbing;
}

/* Drag states */
.tag-row.dragging {
    opacity: 0.4;
}
/* The code cursor.
 *
 * A SHAPE, not a tint. `.bn-selected`'s wash measures 1.01:1 against the
 * group-tinted card it sits on (WCAG 1.4.11 wants 3:1), and `.tag-row`
 * declares no border for its `border-left-color` to repaint — so on this one
 * element the shared state class paints an indicator nobody can see. Both
 * other `bn-selected` surfaces in the app (quote card, signal card) carry the
 * state on a border; this row was the first without one.
 *
 * Ordered BEFORE `.merge-target` deliberately: both are (0,2,0) in this file,
 * and a row that is both focused and a live merge target should show the
 * merge target — that state is momentary and destructive, the cursor is not. */
/* The code cursor marks the CHIP, not the row it sits in.
 *
 * It was a 2px bar at the row's left edge — 4px of padding away from the chip,
 * so it read as a leftover rather than a cursor, and it stayed visible after a
 * rename committed (focus correctly survives the edit) where it looked like
 * something had failed to clear.
 *
 * An `outline` is what makes this possible at all, and it is why the "solid
 * accent pill" the mockup asks for was previously recorded as blocked: `Badge`
 * applies its codebook tint as an inline `backgroundColor`, which no class can
 * beat — the same trap that made the card's wash invisible — but an outline
 * does not compete with a background at all. And this is not a new treatment:
 * the tag-suggest dropdown already marks its keyboard target exactly this way
 * (`molecules/tag-input.css:81`, "Active pill: stronger contrast to indicate
 * keyboard selection"). One idiom, two places.
 *
 * `.bn-selected`'s own wash still lands on the row and is left alone: it
 * measures ~1.01:1 against the card, so it is imperceptible rather than wrong,
 * and removing it would mean fighting the atom for no visible gain. */
.tag-row.bn-selected .badge {
    outline: 2px solid var(--bn-selection-border);
    outline-offset: 1px;
}

.bn-window-inactive .tag-row.bn-selected .badge {
    outline-color: var(--bn-selection-border-inactive);
}

/* While a field inside the row has focus, the chip's outline stands down —
 * the field draws its own keyline and two rings on one object is the fault
 * this card has now been through three times. Note `.tag-edit-inline` also
 * carries `.badge`, so without this the editing field would wear the cursor
 * outline as well as its own border. */
.tag-row.bn-selected:focus-within .badge {
    outline: none;
}

.tag-row.merge-target {
    box-shadow: 0 0 0 2px var(--bn-colour-accent);
    background: color-mix(in srgb, var(--bn-colour-accent) 6%, transparent);
}

.tag-name-area {
    display: flex;
    align-items: center;
    gap: 0;
    min-width: 0;
    position: relative;
}

/* In codebook panel, badges are primary content — sized up from 0.72rem */
.codebook-group .badge {
    font-size: var(--bn-text-label);
    padding: 0.2rem 0.5rem;
}

/* Tag badges in codebook are click-to-rename */
.codebook-group .badge-user {
    cursor: text;
}

/* Inline tag rename — matches badge dimensions */
/* Re-editing an existing code should look like typing a new one.
 *
 * It did not. This element carries `.badge` for its metrics, so it inherited
 * `--bn-colour-badge-bg` — a grey panel — and its ring was `--bn-focus-ring`,
 * which is `0 0 0 2px rgba(0, 122, 255, 0.12)`: twelve per cent alpha, so
 * "obscured" was the token doing exactly what it says rather than a rendering
 * accident. Against a tinted card it reads as nothing.
 *
 * A field being edited is a field: page background, one solid accent keyline.
 * `outline: none` stays — the keyline IS the focus indication, and a browser
 * outline on top of it would be the double ring again. */
.tag-edit-inline {
    font-family: var(--bn-font-mono);
    outline: none;
    border-radius: var(--bn-radius-sm);
    min-width: 3em;
    background: var(--bn-field-edit-fill-on-tint);
    border: 1px solid var(--bn-field-edit-edge);
    box-shadow: none;
}

/* Micro histogram bar + count */
.tag-bar-area {
    display: flex;
    align-items: center;
    gap: var(--bn-space-xs);
    min-width: 50px;
    justify-content: flex-end;
}
/* A code with quotes: the bar and count go to those quotes (Quotes lens,
   tag sidebar soloed on the code) — the same element, and the same gesture,
   as the tag sidebar's bar. A pointer, not the row's grab hand. */
.tag-bar-area--link {
    cursor: pointer;
    border-radius: var(--bn-radius-sm);
    padding: 1px 4px;
    margin: -1px -4px;
}
.tag-bar-area--link:hover {
    background: var(--bn-colour-hover);
}
.tag-bar-area--link:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -2px;
}
.tag-micro-bar {
    height: 0.6rem;
    border-radius: var(--bn-radius-sm);
    min-width: 2px;
    transition: width 0.2s ease;
}

/* ── Two-tone stacked bar (tentative + accepted) ──────────────────────
   [pale tentative | solid accepted] — solid hugs the number on the right.
   Total width ∝ (tentative + accepted). Used when autocode proposals exist. */
.tag-micro-bar-stack {
    display: flex;
    align-items: center;
    height: 0.6rem;
    min-width: 2px;
    transition: width 0.2s ease;
}
.tag-micro-bar-tentative {
    height: 100%;
    opacity: 0.28;
    transition: width 0.2s ease;
}
.tag-micro-bar-accepted {
    height: 100%;
    transition: width 0.2s ease;
}
.tag-micro-bar-stack > :first-child {
    border-radius: var(--bn-radius-sm) 0 0 var(--bn-radius-sm);
}
.tag-micro-bar-stack > :last-child {
    border-radius: 0 var(--bn-radius-sm) var(--bn-radius-sm) 0;
}
.tag-micro-bar-stack > :only-child {
    border-radius: var(--bn-radius-sm);
}

.tag-count {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    min-width: 16px;
    text-align: right;
    font-variant-numeric: tabular-nums;
}

/* ── Add tag ───────────────────────────────────────────────────────────── */

.tag-add-row {
    display: inline-flex;
    align-items: center;
    gap: 0;
    padding: 3px 4px;
    margin-top: 4px;
    cursor: pointer;
    color: var(--bn-colour-muted);
    transition: color var(--bn-transition-fast);
}
.tag-add-row:hover {
    color: var(--bn-colour-accent);
}
/* The same size and padding as the tags above it and the TagInput that replaces it on click;
   Regular, because it is a control, not a tag (docs/design-monospace-roles.md §4). */
.tag-add-badge {
    display: inline-block;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    font-weight: var(--bn-weight-mono);
    padding: var(--bn-space-xs) 0.45rem;
    border-radius: var(--bn-radius-sm);
    border: 1px dashed var(--bn-colour-border);
    background: transparent;
    color: var(--bn-colour-muted);
    transition: border-color var(--bn-transition-fast), color var(--bn-transition-fast);
    user-select: none;
}
.tag-add-row:hover .tag-add-badge {
    border-color: var(--bn-colour-accent);
    color: var(--bn-colour-accent);
}

/* Inline input for new tag */
.tag-add-input {
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-label);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-sm);
    padding: 0.2rem 0.5rem;
    outline: none;
    width: 100%;
    max-width: 160px;
    color: var(--bn-colour-text);
    background: var(--bn-colour-bg);
}
.tag-add-input:focus {
    border-color: var(--bn-colour-accent);
    box-shadow: var(--bn-focus-ring);
}

/* ── New group placeholder ─────────────────────────────────────────────── */

.codebook-group.new-group-placeholder {
    border: 1px dashed var(--bn-colour-border);
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    cursor: pointer;
    transition: border-color var(--bn-transition-fast), background var(--bn-transition-fast);
    gap: var(--bn-space-sm);
}
.codebook-group.new-group-placeholder:hover {
    border-color: var(--bn-colour-muted);
    background: var(--bn-hover-bg-subtle);
}
.new-group-icon {
    font-size: var(--bn-text-heading);
    color: var(--bn-colour-muted);
    line-height: 1;
}
.new-group-label {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
}

/* ── Drag ghost ────────────────────────────────────────────────────────── */

.drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 200;
    /* No size or padding here: the ghost is a clone of the dragged .badge and keeps its metrics,
       so the tag you carry is the tag you picked up. */
    font-family: var(--bn-font-mono);
    border-radius: var(--bn-radius-sm);
    color: var(--bn-colour-text);
    box-shadow: 0 2px 8px var(--bn-colour-shadow);
    opacity: 0.9;
    white-space: nowrap;
}

/* Tag preview in merge modal */
.tag-preview {
    display: inline;
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    padding: var(--bn-space-xs) 0.45rem;
    border-radius: var(--bn-radius-sm);
    font-weight: var(--bn-weight-mono-tag);
}

/* ── Codebook page layout ──────────────────────────────────────────────── */

.codebook-description {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    margin-bottom: var(--bn-space-lg);
}

/* ── Confirm dialog ───────────────────────────────────────────────────── */

/* Confirm dialog covers the entire group card as an opaque overlay */
.codebook-group .confirm-dialog {
    position: absolute;
    z-index: 100;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--bn-colour-bg);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-lg);
    padding: var(--bn-space-xl, 1.5rem);
    text-align: center;
    box-shadow: 0 4px 16px var(--bn-colour-shadow, rgba(0, 0, 0, 0.12));
}
.confirm-dialog-title {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
    margin: 0 0 var(--bn-space-xs);
    line-height: var(--bn-text-label-lh);
}
.confirm-dialog-body {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    margin-bottom: var(--bn-space-md);
    line-height: var(--bn-text-label-lh);
}
.confirm-dialog-actions {
    display: flex;
    gap: var(--bn-space-sm);
    justify-content: flex-end;
}
.confirm-dialog-btn {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
    padding: 0.4rem 1.2rem;
    border-radius: var(--bn-radius-sm);
    border: none;
    cursor: pointer;
    transition: background var(--bn-transition-fast), color var(--bn-transition-fast);
}
.confirm-dialog-btn--cancel {
    background: transparent;
    color: var(--bn-colour-muted);
}
.confirm-dialog-btn--cancel:hover {
    background: var(--bn-hover-bg);
    color: var(--bn-colour-text);
}
.confirm-dialog-btn--danger {
    background: var(--bn-colour-negative);
    color: white;
}
.confirm-dialog-btn--danger:hover {
    filter: brightness(0.9);
}
.confirm-dialog-btn--primary {
    background: var(--bn-colour-accent);
    color: white;
}
.confirm-dialog-btn--primary:hover {
    filter: brightness(0.9);
}

/* ── Confirm dialog as a modal ─────────────────────────────────────────── */
/* The merge and name-taken confirms are drawn by Dialog.tsx (the shared
   .bn-overlay + .bn-modal); ConfirmDialog's own card steps aside inside it,
   so there is one card, the sheet's. */
.bn-modal.confirm-dialog-modal {
    max-width: 360px;
}
.bn-modal .confirm-dialog {
    position: static;
    background: none;
    border: none;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
}

/* ── Codebook header ─────────────────────────────────────────────────── */
/* `.codebook-header` was removed 20 Aug 2026. It was a flex column wrapped
   around the zone title so the Library button could sit beside it, and it cost
   two defects: it broke the datum rule in templates/report.css (the heading
   became a grandchild, so the selector stopped matching and the title sat 40px
   low) and it truncated the keyline to the column's width instead of the
   pane's. Both are now the atom's business — `<SectionHeading action={…}>`,
   atoms/section-heading.css. Don't reintroduce a per-lens header wrapper: the
   whole point of the atom is that every lens's title row is the same box. */

/* ── Framework section header (title + author + border-bottom) ────── */
/* Mirrors .codebook-modal-header / .preview-header pattern:
   title + subtitle stacked left, action button right, 1px border-bottom. */

.framework-section-header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: var(--bn-space-md);
    border-bottom: 1px solid var(--bn-colour-keyline);
    margin: var(--bn-space-md) 0 var(--bn-space-sm);
}
.framework-section-title {
    font-size: var(--bn-text-heading);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
    line-height: var(--bn-text-heading-lh);
}
.framework-section-author {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    margin-top: 0.15rem;
}
/* Folded-codebook summary — the one-line meta that stands in for the groups
   when a codebook is switched off ("N tags · M coded"). Fades in with the fold. */
.framework-section-summary {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    margin-top: 0.25rem;
    animation: framework-summary-in var(--bn-transition-fast) ease-out;
}
@keyframes framework-summary-in {
    from { opacity: 0; }
    to { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
    .framework-section-summary { animation: none; }
}
.framework-remove-btn {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    border-color: var(--bn-colour-border);
    background: var(--bn-colour-bg);
    flex-shrink: 0;
    margin-left: var(--bn-space-lg);
    margin-top: 0.2rem;
}
.framework-remove-btn:hover {
    color: var(--bn-colour-negative);
    border-color: var(--bn-colour-negative);
}

/* ── AutoCode button + proposed count ─────────────────────────────────── */

.framework-section-actions {
    display: flex;
    align-items: center;
    gap: var(--bn-space-sm);
    flex-shrink: 0;
    margin-left: var(--bn-space-lg);
    margin-top: 0.2rem;
}

/* Framework enable/disable switch — macOS-matched metrics; blue on / grey off.
   Off collapses the framework's tag groups (fold); tags on quotes are kept. */
.framework-toggle {
    flex-shrink: 0;
    align-self: center;
    position: relative;
    width: 38px;
    height: 22px;
    border-radius: var(--bn-radius-pill);   /* clamps to half-height; survives a height change */
    border: none;
    padding: 0;
    cursor: pointer;
    background: var(--bn-colour-accent);
    transition: background var(--bn-transition-fast);
}
.framework-toggle.off {
    background: var(--bn-colour-border-hover);
}
.framework-toggle::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 18px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
    transition: left var(--bn-transition-fast);
}
.framework-toggle.off::after {
    left: 2px;
}
.framework-toggle:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: 2px;
}

.autocode-btn {
    font-family: var(--bn-font-body);
    font-size: var(--bn-text-caption);
    font-weight: var(--bn-weight-emphasis);
    padding: 0.3rem 0.7rem;
    border-radius: var(--bn-radius-sm);
    border: 1px solid var(--bn-colour-accent);
    background: var(--bn-colour-accent);
    color: #fff;
    cursor: pointer;
    transition: opacity var(--bn-transition-fast);
    display: inline-flex;
    align-items: center;
    gap: 0.3em;
    white-space: nowrap;
}

.autocode-btn:hover { opacity: 0.85; }

.autocode-btn:disabled {
    opacity: 0.5;
    pointer-events: none;
}

.autocode-btn .sparkle { font-size: 0.85em; }

.proposed-count {
    font-size: var(--bn-text-badge);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-accent);
    background: rgba(37, 99, 235, 0.08);
    padding: 0.15rem 0.5rem;
    border-radius: var(--bn-radius-pill);
    white-space: nowrap;
}

/* ── AutoCode Review modal ───────────────────────────────────────────── */
/* The backdrop, card surface, radius, shadow and motion are the shared dialog's
   (atoms/modal.css); this is only the review's own layout. */

.bn-modal.codebook-modal {
    width: 100%;
    max-width: 56rem;
    max-height: 85vh;
    padding: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.codebook-modal-header {
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid var(--bn-colour-border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    flex-shrink: 0;
}
.codebook-modal-title {
    font-size: var(--bn-text-heading);
    font-weight: var(--bn-weight-emphasis);
    --bn-icon-stem: var(--bn-icon-stem-emphasis);  /* its icon follows the text weight */
}
.codebook-modal-subtitle {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    margin-top: 0.2rem;
}
.codebook-modal-close {
    background: none;
    border: none;
    font-size: var(--bn-text-heading);
    color: var(--bn-colour-muted);
    cursor: pointer;
    padding: 0.2rem;
    line-height: 1;
}
.codebook-modal-close:hover {
    color: var(--bn-colour-text);
}

.codebook-modal-body {
    padding: 1.5rem;
    overflow-y: auto;
    flex: 1;
}

/* Picker section headers */
.picker-section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: var(--bn-space-xl) 0 var(--bn-space-md);
}
.picker-section-header:first-child {
    margin-top: 0;
}
.picker-section-title {
    font-size: var(--bn-text-badge);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--bn-colour-muted);
    font-weight: var(--bn-weight-emphasis);
}

/* Picker card list — vertical, full-width tiles (was a horizontal scroll row) */
.picker-row {
    display: flex;
    flex-direction: column;
    gap: var(--bn-space-md);
    padding-bottom: var(--bn-space-sm);
}

/* Picker card */
.picker-card {
    background: var(--bn-colour-bg);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-lg);
    padding: var(--bn-space-lg);
    cursor: pointer;
    transition: border-color var(--bn-transition-fast),
                background-color var(--bn-transition-fast);
    position: relative;
}
.picker-card:hover {
    border-color: var(--bn-colour-accent);
    background-color: var(--bn-colour-hover);
}
.picker-card.disabled {
    opacity: 0.45;
    cursor: default;
    pointer-events: none;
}
.picker-card.imported::after {
    content: "Installed";
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: var(--bn-text-micro);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-muted);
    background: var(--bn-colour-badge-bg);
    padding: 2px 6px;
    border-radius: var(--bn-radius-sm);
}
.picker-card-title {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
    margin-bottom: 0.15rem;
}
.picker-card-author {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    margin-bottom: 0.5rem;
}
.picker-card-desc {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    line-height: 1.5;
    max-width: 75ch;  /* readability at full width */
}
.picker-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: var(--bn-space-md);
}
.picker-card-coming {
    font-size: var(--bn-text-badge);
    color: var(--bn-colour-muted);
    font-style: italic;
    margin-top: 4px;
}
.picker-card.restorable {
    border-color: var(--bn-colour-accent);
}
.picker-card-restore {
    font-size: var(--bn-text-badge);
    color: var(--bn-colour-accent);
    margin-top: var(--bn-space-sm);
    font-style: italic;
}

/* Per-tile Install ↔ Uninstall toggle. Fixed min-width + centred text so the
   button footprint doesn't shift when the label swaps state. Both neutral —
   Uninstall is reversible; it only warms to danger on hover. */
.picker-card-actions {
    margin-top: var(--bn-space-md);
    display: flex;
    justify-content: flex-end;
}
/* No font-size: the label stays at .bn-btn's --bn-text-label like every other
   button. This set --bn-text-caption, a step smaller than the codebook page's
   own Install button beside it (24 Oct 2026). */
.picker-card-toggle {
    min-width: 96px;
    justify-content: center;
    text-align: center;
}
.picker-card-toggle-uninstall:hover,
.picker-card-toggle-uninstall:focus-visible {
    color: var(--bn-colour-negative);
    border-color: var(--bn-colour-negative);
}

/* ── Codebook preview ────────────────────────────────────────────────── */

.preview-back {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--bn-font-body);
    margin-bottom: var(--bn-space-lg);
    padding: 0;
}
.preview-back:hover {
    color: var(--bn-colour-accent);
}

.preview-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: var(--bn-space-xl);
    margin-bottom: var(--bn-space-lg);
    padding-bottom: var(--bn-space-md);
    border-bottom: 1px solid var(--bn-colour-border);
}
.preview-header-left {
    flex: 1;
    min-width: 0;
}
.preview-title {
    font-size: var(--bn-text-heading);
    font-weight: var(--bn-weight-emphasis);
    margin-bottom: 0.15rem;
}
.preview-subtitle {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
}
.preview-cta-help {
    font-size: var(--bn-text-badge);
    color: var(--bn-colour-muted);
    margin-top: 0.3rem;
}

.preview-body {
    display: flex;
    gap: var(--bn-space-xl);
    align-items: flex-start;
}
.preview-body-main {
    flex: 1;
    min-width: 0;
}
.preview-body-sidebar {
    width: 260px;
    flex-shrink: 0;
}

.preview-desc {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    line-height: 1.6;
    margin-bottom: var(--bn-space-lg);
}

.preview-section-label {
    font-size: var(--bn-text-badge);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--bn-colour-muted);
    font-weight: var(--bn-weight-emphasis);
    margin-bottom: var(--bn-space-md);
}

.preview-groups {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: var(--bn-space-lg);
    align-items: start;
}

.preview-author {
    background: var(--bn-colour-quote-bg);
    border-radius: var(--bn-radius-lg);
    padding: var(--bn-space-lg);
}
.preview-author-name {
    font-weight: var(--bn-weight-emphasis);
    font-size: var(--bn-text-label);
    margin-bottom: 0.25rem;
}
.preview-author-bio {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    margin-bottom: var(--bn-space-md);
    /* PROSE at a chrome size — a 90-word bio, not a footnote — so it takes the
       prose ratio rather than caption's. It was the literal 1.5, and a literal
       cannot fork: on the Mac's SF Pro ladder that left it 20% looser than the
       chrome around it (1.5 against a 1.25 caption baseline), which is why the
       bio column reads airy and overlong there. The token keeps web identical
       at 1.5 and brings the app to 1.4, in line with every other prose block.
       Shared with the v1 browse modal, deliberately — same text, same job. */
    line-height: var(--bn-text-body-lh);
}
.preview-author-links {
    display: flex;
    flex-wrap: wrap;
    gap: var(--bn-space-lg);
    font-size: var(--bn-text-caption);
}
.preview-author-links a {
    color: var(--bn-colour-accent);
    text-decoration: none;
}
.preview-author-links a:hover {
    text-decoration: underline;
}

/* --- organisms/codebook-v2.css --- */
/* ── Codebook v2 — the rail ────────────────────────────────────────────────
   Phase 2 of docs/design-codebook-v2-plan.md. Runs beside the shipped
   codebook-panel.css rather than replacing it (D29), so nothing here may
   redefine a class that file owns.

   Everything is tokens. The one value that is not a token is the switch's
   26x15, which is measured rather than chosen — see docs/mockups/
   codebook-v2-rail.html and -parity.html for the measurements. */

/* One knock-back opacity, shared by the rail, the page and the browse card.
   NOT a new value: the theme has seven disabled declarations carrying five
   different opacities and no token, and 0.5 is the plurality AND the base
   atom's (.bn-btn:disabled). D27a. */
:root { --bn-opacity-off: 0.5; }

/* ── The codebook navigator, in the standard left sidebar ─────────────────
   v2's navigation was a `<nav class="v2-rail">` inside the lens's own content
   column, restating padding, radius, hover and selection from scratch. It now
   uses `.toc-heading` and `.toc-link` from sidebar.css, exactly as the shipped
   CodebookSidebar does, so section headings, row metrics, hover underline and
   the selected treatment are inherited rather than re-declared.

   THE SELECTED ROW. The rail used `--bn-colour-active-bg` — `#f0fdf4`, the
   palette's *success* background — which rendered the current codebook mint
   green. `.toc-link.active` uses `--bn-nav-selection-bg`, a neutral grey, with
   the accent colour and emphasis weight. Selection is not success.

   What remains here is only what a two-line row with a trailing control needs
   and the base `.toc-link` does not provide. */

.v2-nav-row {
    display: flex;
    align-items: center;
    gap: var(--bn-space-sm);
    min-width: 0;
}

/* The title/provenance stack. `.toc-link` is `display: block` with a single
   line; this row carries two, so the text column owns its own flow and the
   switch stays vertically centred against the pair. */
.v2-nav-text {
    display: flex;
    flex-direction: column;
    /* 1px, matching `.session-entry-speakers` — the shipped two-line row. The
       stack had no gap at all, so line-height was doing the entire job of
       separating a title from its subtitle. */
    gap: 1px;
    min-width: 0;
    flex: 1;
}

/* `.codebook-toc-label` (from sidebar.css) supplies the title's size and
   truncation — the same span the shipped navigator uses. */

/* Provenance. A person keeps D19's weight because the name is the point —
   Jakob Nielsen is better known than his heuristics. A system fact ("On by
   default") must not borrow it: dressing a configuration state as a cultural
   figure is a category error the eye catches immediately. D23. */
.v2-nav-provenance {
    /* THE SUBTITLE STOP, not the glyph stop. This was `--bn-text-micro`
       (9.6px web / 10px desktop) — two stops below the row title, and a size
       the navigator otherwise uses for exactly two things, neither of them
       words: a thumbnail placeholder glyph and a badge. An author's name is
       prose and needs a prose size.

       `--bn-text-badge` (11.5 / 11) is where the sidebar already puts a
       subtitle: `.tag-sidebar-subtitle` sits at this stop directly beneath a
       `.tag-sidebar-header .sidebar-title` at `--bn-text-label` — the same
       title-over-subtitle relationship this row has. Sessions' second line
       (`.session-entry-date`) is a stop higher at `--bn-text-caption`, and
       deliberately so: a date and a duration are *metadata*, machine facts
       about the row. An attribution is a subtitle, which is prose about the
       thing above it. Different jobs, different stops.

       On desktop this lands on macOS body over subheadline (13 / 11), which
       is a real Apple pairing — and the 2px step separates the two ranks more
       legibly than caption's 1px would. */
    font-size: var(--bn-text-badge);
    line-height: var(--bn-text-badge-lh);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Switched off. One knock-back value, shared with the codebook page and the
   browse card — they were three declarations with three different opacities
   before D27a. `.codebook-disabled` is the shipped navigator's own modifier,
   so the muted treatment matches v1 row for row. */
.v2-nav-row.codebook-disabled .codebook-toc-label,
.v2-nav-row.codebook-disabled .v2-nav-provenance { color: var(--bn-colour-muted); }

/* Undecided-proposal count (D10). Inboard of the switch so the switch keeps the
   trailing edge (D16) and the badge never displaces it. */
.v2-nav-pending {
    flex-shrink: 0;
    font-family: var(--bn-font-body);   /* a count: figures, not mono (docs/design-monospace-roles.md §4) */
    font-size: var(--bn-text-micro);
    color: var(--bn-colour-badge-text);
    background: var(--bn-colour-badge-bg);
    border-radius: var(--bn-radius-pill);
    padding: 0.05rem 0.35rem;
    font-variant-numeric: tabular-nums;
}

/* The hover underline belongs to the TITLE, not to the whole row. `.toc-link:hover`
   (sidebar.css) decorates the anchor, and an ancestor's text-decoration is *painted
   through* its descendants: `text-decoration: none` on the count removes nothing, and
   neither does making it an atomic inline, because a flex item is blockified rather
   than inline. Both were measured before this rule was written — the count kept its
   underline in each. The only fix is to stop decorating the anchor and decorate the
   label instead, which spares the count and the provenance line alike.
   Scoped to `.v2-nav-row` so the Quotes TOC and the v1 codebook sidebar are untouched.
   `text-underline-offset` still inherits from the anchor, so the offset is unchanged. */
.toc-link.v2-nav-row:hover {
    text-decoration: none;
}

.toc-link.v2-nav-row:hover .codebook-toc-label {
    text-decoration: underline;
    text-decoration-color: var(--bn-colour-accent);
}

/* The fallback switch, at the size settled during the prototype. The platform
   control (Safari 17.4+ `<input type="checkbox" switch>`) is preferred and
   needs none of this — it brings its own spring, focus ring, Increase Contrast
   and Reduce Motion. D15. */
/* THE PLATFORM SWITCH IS SIZED HERE, NOT LEFT TO ITS INTRINSIC DEFAULT.
   `<input type="checkbox" switch>` brings its own geometry, and WebKit's
   default is a full-size control — roughly the 38x22 NSSwitch, on a row whose
   whole point is that the switch rides *beside* two lines of text without
   dominating them. So the two code paths shipped at different sizes: the
   fallback carried the settled 26x15 and the native one carried nothing but
   `flex-shrink`, which meant the surface a Mac user actually sees (embedded
   WebKit takes this branch; only the CLI SPA falls back) was the one that had
   never been sized. It read as too big because it was.

   26x15 is the size settled in `docs/mockups/codebook-v2-parity.html`, which
   paired both controls at it side by side and measured that the platform
   switch scales cleanly by CSS width/height. The ratio is the full-size
   track's, kept exactly: 38/22 = 1.727, 26/15 = 1.733.

   Nothing else is declared. The platform owns the knob, the spring curve, the
   focus ring, Increase Contrast and Reduce Motion — that is the entire reason
   for preferring this control, and restyling any of it would forfeit it. */
.v2-nav-row .enable {
    flex-shrink: 0;
    width: 26px;
    height: 15px;
}

.v2-nav-row .sw.mini {
    position: relative;
    flex-shrink: 0;
    width: 26px;
    height: 15px;
    border-radius: 7.5px;
    background: var(--bn-colour-accent);
    cursor: pointer;
    transition: background var(--bn-transition-fast);
}

.v2-nav-row .sw.mini::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 13px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #fff;
    transition: left var(--bn-transition-fast);
}

.v2-nav-row .sw.mini.offstate { background: var(--bn-colour-border-hover); }
.v2-nav-row .sw.mini.offstate::after { left: 2px; }

.v2-nav-row .sw.mini:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
    .v2-nav-row .sw.mini,
    .v2-nav-row .sw.mini::after { transition: none; }
}

/* ── Codebook v2 — the page ────────────────────────────────────────────────
   Phase 3. The group and tag rendering emits the SHIPPED unscoped classes
   (.codebook-group, .tag-row, .tag-bar-area, .badge) and adds nothing here, so
   the histogram alignment this repo has already paid for is inherited. What
   follows is only the page head, which has no shipped equivalent. */

.pg-head {
    display: flex;
    align-items: flex-start;
    gap: var(--bn-space-lg);
    margin-bottom: var(--bn-space-lg);
}

/* Two columns. The description's right edge meets the graphic's left, and the
   action trails below the graphic — the alignment the layout is built on. */
.pg-headmain { flex: 1; min-width: 0; }

.pg-side {
    /* A fixed-width GUTTER, not a fixed box (D13). The width is the contract;
       what fills it is deferred per codebook. */
    flex: 0 0 240px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: var(--bn-space-md);
}

/* The author card fills the gutter's full width. `.pg-side` is
   `align-items: flex-end`, which is right for the Uninstall button (a control
   hugging the trailing edge) and wrong for a card, which would otherwise
   shrink to its text. The card brings its own background, radius and padding
   from `.preview-author` — the shipped treatment from the codebook picker —
   and takes only its width from here. */
.pg-side .preview-author { align-self: stretch; }

/* The author's links STACK in the gutter. `.preview-author-links` is
   `flex-wrap: wrap` with a `--bn-space-lg` gap, which is right in the browse
   modal — that card is wide enough to hold three links on one row. At 240px
   only two fit, so the third wraps and the group reads as accidentally
   arranged rather than deliberately laid out: the eye sees a ragged two-then-
   one shape and looks for a meaning that isn't there. A column is
   deterministic at any count. The gap comes down with it — 1.5rem is
   inter-column air, and far too much between stacked lines. */
.pg-side .preview-author-links {
    flex-direction: column;
    gap: var(--bn-space-sm);
}

/* PARKED with its element (see CodebookV2Page): the placeholder reserved the
   gutter for a jacket / initials / headshot that has not been designed. Kept
   so restoring it stays the one-line uncomment the call site promises. */
.pg-graphic {
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: var(--bn-radius-md);
    background: var(--bn-colour-quote-bg);
}

/* The title and its action share a row: text left, control hard right, both
   aligned to the TOP so a two-line title does not drag the button down with
   it. The action was in `.pg-side` below the author card — the one control
   that decides whether this codebook is in the project sitting after the
   author's biography. */
.pg-titlerow {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--bn-space-md);
}

.pg-titletext { min-width: 0; }

/* `flex-shrink: 0` because the label is the affordance — "Uninstall" wrapping
   to two lines, or ellipsing, is worse than a narrower title. */
.pg-titleaction { flex-shrink: 0; }

.pg-title {
    font-size: var(--bn-text-title);
    font-weight: var(--bn-weight-strong);
    letter-spacing: -0.01em;
    line-height: 1.2;
}

/* Provenance. A person keeps D19's weight; a system fact does not borrow it. */
.pg-author {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
    margin-top: 0.15rem;
}

.pg-author.prov-system {
    font-weight: var(--bn-weight-normal);
    color: var(--bn-colour-muted);
}

.pg-desc {
    font-size: var(--bn-text-body);
    /* Raise the LEADING with the size. Without this the rule takes body's size
       and keeps `body`'s ratio, which is the chrome one — and the leading tokens
       are unitless, so what inherits is the ratio, not the pixel value. In the
       Mac app that meant 15px prose at 1.231 (Apple's 13/16 chrome metric): the
       only body-size prose in the app not on 21px, and 12% tighter per line than
       the quote body it sits beside. On web the gap is smaller (1.45 vs 1.5) but
       the same mistake. A token rather than a number so it forks per platform —
       1.5 on web, 1.4 on the SF Pro ladder. */
    line-height: var(--bn-text-body-lh);
    margin: var(--bn-space-md) 0 0;
    max-width: 62ch;
}

.pg-stat { font-size: var(--bn-text-label); color: var(--bn-colour-muted); margin-top: var(--bn-space-md); }

/* The Review door: the verb is the button, the counts sit on its baseline. */
.pg-review-row {
    margin-top: var(--bn-space-md);
    display: flex;
    align-items: baseline;
    gap: 0.55rem;
    flex-wrap: wrap;
}

.pg-review-meta { font-size: var(--bn-text-label); color: var(--bn-colour-text); }
.pg-review-meta .undec { color: var(--bn-colour-muted); }

/* D26 — a codebook that defines no tags says so, plainly. */
.pg-empty {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    padding: 1.5rem 0;
}

.v2-groups {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: var(--bn-space-md);
}

/* Switched off. ONE knock-back value shared with the rail — before D27a these
   were three declarations with three different opacities plus a dead fourth.
   Named -off, not -disabled: a disabled control cannot be used, whereas a
   switched-off codebook stays fully interactive. */
.pageoff .pg-title,
.pageoff .pg-author,
.pageoff .pg-stat,
.pageoff .pg-desc,
.pageoff .group-title { color: var(--bn-colour-muted); }

.pageoff .v2-groups,
.pageoff .pg-graphic { opacity: var(--bn-opacity-off); }

/* The uninstall control is EXEMPT. A disabled codebook is still uninstallable,
   and a blanket knock-back removes precisely the one control that must stay
   reachable. */
.pageoff .pg-actions { opacity: 1; }

/* The lens: rail beside content. The rail is permanent (S1) — one codebook
   always has focus, and the long scrolling page of every codebook is gone. */
/* One column. This was `240px 1fr` — the 240px being the in-lens rail's
   track. Navigation now lives in the standard left sidebar, which is a column
   of SidebarLayout's own 6-column grid, so the lens gets the full content
   width and narrows when the panel opens, as every other lens does. */
.v2-layout { min-width: 0; }

.v2-main { min-width: 0; }

/* ── The size axis — PROVISIONAL, and deliberately not in the atom ─────────
   `.bn-btn` (theme/atoms/modal.css) carries four COLOUR variants and no size
   variant, because every existing call site is a dialog action row where one
   size is correct. Codebook v2 is the first surface wanting two: a zone-title
   destination that should be findable without shouting, and a Review verb that
   must stay subordinate to Install.

   These live HERE rather than in modal.css on purpose. The size axis is listed
   as *Indicative* in the fidelity map — it is a declared gap, filed rather than
   granted — and promoting it to the shipped atom is a design-system decision
   nobody has taken. Scoped to v2, the QA comparison renders truthfully without
   that decision being made by accident.

   Purely dimensional: no colour, no new token. If v2 ships, these move up. */
.v2-layout .bn-btn-sm,
.v2-nav .bn-btn-sm,
.dl-nav .bn-btn-sm,
.section-heading .bn-btn-sm { font-size: var(--bn-text-caption); padding: 0.25rem 0.7rem; }

/* `.v2-nav` is the sidebar navigator, which is NOT inside `.v2-layout` — it is
   mounted by AppLayout in the left panel, a sibling of the lens. It carries
   Browse Library, and that button has to be the same small secondary as the
   page's Review button rather than a sidebar dialect of one.

   The gap above it is `--bn-space-lg`: the button is not another row in the
   list, it is what you do when the list has not got what you want, and at row
   spacing it reads as a fourth section heading's worth of list. Left inset
   matches `.toc-link`'s text edge so it hangs off the same margin as the rows. */
.v2-nav .bn-btn-sm,
.dl-nav .bn-btn-sm { margin: var(--bn-space-lg) var(--bn-space-sm) 0; }  /* + the Discussion lens's navigator (Add your guide…) */

.v2-layout .bn-btn-lg,
.section-heading .bn-btn-lg { font-size: var(--bn-text-body); padding: 0.5rem 1.15rem; }

/* ── Codebook v2 — the browse grid ────────────────────────────────────────
   Phase 4. The cards are the SHIPPED .picker-card* classes; only the grid, the
   footrow and the version chip are new, because the shipped picker laid its
   cards out differently. */


.v2-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: var(--bn-space-md);
}

.v2-card-grid .picker-card {
    position: relative;
    display: flex;
    flex-direction: column;
}

.v2-card-grid .picker-card:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -2px;
}

/* Version renders only when present (D12) — no dash, no placeholder — so this
   never styles an empty span. */
.picker-card-version {
    font-family: var(--bn-font-mono);
    font-size: var(--bn-text-badge);
    font-weight: var(--bn-weight-mono);
    color: var(--bn-colour-muted);
}

/* The card names a codebook the way the page and the sidebar do (D19): the
   author at emphasis weight in body ink, and the title one clear step above it
   at the page title's weight, since 490 over 490 reads as two equal lines.
   v1's muted author in codebook-panel.css was the one site D19 missed. Chosen
   from docs/mockups/codebook-browse-card-author.html, 24 Oct 2026. */
.v2-card-grid .picker-card-title { font-weight: var(--bn-weight-strong); }
.v2-card-grid .picker-card-author {
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
}

/* A system fact does not borrow the author's weight (D23). Same specificity as
   the author rule above, and after it, so it wins. */
.v2-card-grid .picker-card-author.prov-system,
.picker-card-author.prov-system {
    font-weight: var(--bn-weight-normal);
    color: var(--bn-colour-muted);
}

/* Status and the one action, on one row. `margin-top: auto` pins it to the
   bottom so a short description does not float the button up the card and
   leave the grid ragged. */
.picker-card-footrow {
    margin-top: auto;
    padding-top: var(--bn-space-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--bn-space-sm);
}

.picker-card-status {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    font-variant-numeric: tabular-nums;
}

/* Switched off — the SAME knock-back as the rail and the page, on one token.
   Deliberately NOT the shipped `.picker-card.disabled`, which also sets
   pointer-events:none: a switched-off codebook stays fully interactive. */
.v2-card-grid .picker-card.off2 .picker-card-title,
.v2-card-grid .picker-card.off2 .picker-card-author,
.v2-card-grid .picker-card.off2 .picker-card-desc,
.v2-card-grid .picker-card.off2 .picker-card-status { color: var(--bn-colour-muted); }

.v2-card-grid .picker-card.off2 { opacity: var(--bn-opacity-off); }

/* The uninstall control is EXEMPT, on the card exactly as on the page: a
   blanket knock-back removes precisely the one control that must stay
   reachable on a disabled codebook (D27). */
.v2-card-grid .picker-card.off2 .picker-card-toggle { opacity: 1; }

/* ── Codebook v2 — the uninstall confirmation ─────────────────────────────
   Phase 5. Reuses the shipped .bn-modal-overlay / .bn-modal shell; only the
   body needs rules, because the sheet's whole job is a short measured list. */

.v2-uninstall-sheet { max-width: 28rem; }

.v2-uninstall-title {
    font-size: var(--bn-text-heading);
    font-weight: var(--bn-weight-strong);
    margin: 0 0 var(--bn-space-md);
}

.v2-uninstall-lead {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    margin: 0 0 var(--bn-space-sm);
}

/* Counted losses, one per line. A researcher weighs a list; they cannot weigh
   "this cannot be undone". */
.v2-uninstall-losses {
    margin: 0 0 var(--bn-space-md);
    padding-left: 1.1rem;
    font-size: var(--bn-text-label);
    color: var(--bn-colour-text);
}

.v2-uninstall-losses li { margin-bottom: 0.15rem; }

/* --- organisms/sidebar.css --- */
/* Dual-sidebar layout — 6-column grid for serve-mode Quotes tab.
   [toc-rail | toc-sidebar | center | minimap | tag-sidebar | tag-rail]

   Minimap sits between center content and the tag sidebar (VS Code-style)
   so it stays in the same visual position whether tags are open or closed.
   The tag rail's drag handle is the rightmost element — dragging it open
   reveals the tag sidebar without the minimap breaking the illusion.

   Inert in static render path — .layout wrapper exists only in React tree.
   Design reference: docs/mockups/mockup-sidebar-tags.html
   Design doc: docs/design-sidebar.md */

/* ── Grid definition ──────────────────────────────────────────── */

.layout {
    display: grid;
    grid-template-columns:
        var(--bn-rail-width)                          /* 1: toc rail    */
        0px                                           /* 2: toc sidebar */
        1fr                                           /* 3: center      */
        var(--bn-minimap-width)                       /* 4: minimap     */
        0px                                           /* 5: tag sidebar */
        var(--bn-rail-width);                         /* 6: tag rail    */
    /* Minus everything body pads with — the top only, since 20 Sep 2026
       (report.css: body's bottom pad moved onto `.center` below so the sticky
       panels, which live in this row, can reach the window bottom). A bare 100vh
       here puts every lens over the viewport by the padding, which is a
       scrollbar that scrolls the padding and nothing else.

       This floor is also what puts the Signals heatmap pane on the window
       bottom when the lens is short (inspector.css grows into it).

       CURRENTLY MASKED on every lens, and measured so: `.toc-rail`
       and `.toc-sidebar` are STICKY at `height: 100vh`, sticky is in flow, so
       they stretch the grid row to the full viewport height regardless of what
       this floor says. /sessions/ and /codebook/ still measure 64px over. This
       rule is right and inert; the rails are the remaining cause and changing
       them is whole-app geometry, not a scrollbar fix. */
    min-height: calc(100vh - var(--bn-toolbar-inset, 0px) - var(--bn-space-xl));
}

/* TOC sidebar push-open: hide rail (0), show sidebar, keep center */
.layout.toc-open {
    grid-template-columns:
        0px
        var(--toc-width, var(--bn-sidebar-width))
        1fr
        var(--bn-minimap-width)
        0px
        var(--bn-rail-width);
}

/* Tag sidebar open: hide tag rail (0), show tag sidebar */
.layout.tags-open {
    grid-template-columns:
        var(--bn-rail-width)
        0px
        1fr
        var(--bn-minimap-width)
        var(--tags-width, var(--bn-sidebar-width))
        0px;
}

/* Both open */
.layout.toc-open.tags-open {
    grid-template-columns:
        0px
        var(--toc-width, var(--bn-sidebar-width))
        1fr
        var(--bn-minimap-width)
        var(--tags-width, var(--bn-sidebar-width))
        0px;
}

/* No-right-sidebar + TOC open: 3-column layout with sidebar expanded */
.layout.layout-no-right.toc-open {
    grid-template-columns:
        0px                                           /* 1: rail hidden     */
        var(--toc-width, var(--bn-sidebar-width))     /* 2: toc sidebar     */
        1fr                                           /* 3: center          */
        var(--bn-rail-width);                         /* 4: right spacer    */
}

.layout.layout-no-right.toc-open > .center {
    grid-column: 3;
}

/* Symmetric rail — tabs without a right sidebar (Codebook, Sessions,
   Dashboard, Analysis, About).  Left rail + center + matching right spacer
   so margins are balanced on wide monitors.  `.layout-inert` is the
   non-interactive variant (empty rail div, no button). */
.layout.layout-no-right,
.layout.layout-inert {
    grid-template-columns:
        var(--bn-rail-width)   /* 1: toc rail       */
        1fr                    /* 2: center          */
        var(--bn-rail-width);  /* 3: right spacer   */
}

.layout.layout-no-right > .center,
.layout.layout-inert > .center {
    grid-column: 2;
}

/* ── Desktop embedded: drop the icon rails ────────────────────────
   In the macOS app the sidebars are toggled from the NATIVE toolbar
   (and keyboard `[` / `]`), so the web icon rails + their close-× are
   redundant chrome. One token override collapses every rail track in
   every grid-template-columns variant (closed, toc-open, tags-open,
   both, no-right, inert); `display: none` on the rail divs stops the
   0-width box still painting its 1px border. The native NSSplitView
   divider draws the left edge, the window edge bounds the right.
   Overlay/hover-peek mode is unreachable here (it was rail-only) — TOC
   becomes closed↔push only, like the tag side. Browser is untouched:
   `.embedded` is set from isEmbedded() (SidebarLayout.tsx). */
.layout.embedded { --bn-rail-width: 0px; }

.layout.embedded .toc-rail,
.layout.embedded .tag-rail { display: none; }

/* The base right gutter (--bn-gutter-right: 0.5rem) was sized assuming a
   36px rail sat beyond it — but on tabs without a minimap that leaves
   content 24px closer to the right edge than the left (browser: 92px
   left vs 68px right; embedded: 8px vs 32px). Restore a right inset
   matching the left so the margins are actually balanced. Applies in
   BOTH surfaces: the app (rail width 0, webview butts the window edge)
   and the browser (empty right spacer rail — the balanced-margins intent
   it was added for). Quotes keeps 0.5rem — its minimap column supplies
   the right-side separation, so it's the full layout, not -no-right. */
.layout.layout-no-right > .center,
.layout.layout-inert > .center {
    --bn-center-pad-right: var(--bn-gutter-left);
}

/* Embedded body pads 0 horizontally (report.css: the 24px flank showed the
   window surface through the transparent body as a white gutter beside the
   panels). The panels are now flush with the split divider / window edge; the
   prose gets those 24px back wherever NO panel stands between it and an edge,
   so every current text position is preserved and only the strip is gone. */
.layout.embedded:not(.toc-open) > .center {
    --bn-center-pad-left: calc(var(--bn-gutter-left) + var(--bn-space-lg));
}

.layout.embedded.layout-no-right > .center,
.layout.embedded.layout-inert > .center {
    --bn-center-pad-right: calc(var(--bn-gutter-left) + var(--bn-space-lg));
}

.layout.embedded:not(.tags-open) > .minimap-slot {
    --bn-minimap-extra-pad-r: var(--bn-space-lg);
}

/* Animated slide — set before state change, cleared on transitionend. An
   attribute, not a class: React rewrites .layout's className on the re-render
   the state change causes, which dropped a class before the columns moved. */
.layout[data-animating] {
    transition: grid-template-columns 75ms ease;
}

@media (prefers-reduced-motion: reduce) {
    .layout[data-animating] { transition: none; }

    /* Overlay: instant open/close, no motion */
    .layout.toc-overlay .toc-sidebar,
    .layout.toc-overlay .toc-rail .rail-btn,
    .layout.toc-overlay .toc-sidebar-header .sidebar-close,
    .layout.toc-overlay.overlay-ios .toc-sidebar-body,
    .layout.toc-closing .toc-sidebar,
    .layout.toc-closing .toc-rail .rail-btn,
    .layout.toc-closing .toc-sidebar-header .sidebar-close,
    .layout.toc-closing.overlay-ios .toc-sidebar-body {
        animation: none;
    }
}

/* Overlay mode uses its own animation, not grid transition */
.layout.toc-overlay[data-animating] {
    transition: none;
}

/* ── Column 1: Left icon rail ─────────────────────────────────── */

.toc-rail {
    grid-column: 1;
    position: sticky;
    top: 0;
    height: 100vh;
    align-self: start;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: var(--bn-space-md);
    border-right: 1px solid var(--bn-colour-border);
    background: var(--bn-colour-bg);
    z-index: 50;
    overflow: hidden;
}

/* Rail hidden only in push mode — stays visible in overlay mode */
.layout.toc-open .toc-rail { display: none; }

.rail-btn {
    background: none;
    border: none;
    padding: 6px;
    color: var(--bn-colour-muted);
    cursor: pointer;
    border-radius: var(--bn-radius-sm);
    transition: background var(--bn-transition-fast), color var(--bn-transition-fast);
    line-height: 1;
}

.rail-btn:hover {
    background: var(--bn-colour-hover);
    color: var(--bn-colour-accent);
}

.rail-btn:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -2px;
}

/* ── Column 2: Left sidebar (TOC) ────────────────────────────── */

.toc-sidebar {
    grid-column: 2;
    grid-row: 1;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bn-colour-inspector-bg);
    border-right: 1px solid var(--bn-colour-border);
    /* Flex column, like .tag-sidebar. Without it the `.toc-sidebar-body
