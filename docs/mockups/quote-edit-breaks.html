.signal-card-quotes blockquote.bn-dissenting {
    box-shadow: inset 2px 0 0 var(--bn-colour-border-hover);
}

/* Readings folded into this card — the same evidence in another codebook's
   vocabulary. Quiet by design: the card's own finding is what is being read,
   and this says only that the place was read another way too. It is here
   rather than nowhere because the fold rule deletes nothing, and a reading
   that exists in no other card would otherwise be lost silently. */
.signal-card-alternates {
    font-size: var(--bn-text-badge);
    line-height: var(--bn-text-badge-lh);
    color: var(--bn-colour-muted);
    margin-top: var(--bn-space-sm);
}

.signal-card-alternate {
    font-weight: var(--bn-weight-emphasis);
}

/* Waiting for a finding. The lens fetches twice — once for the cards, then
   again for their elaborations — so this is the state of every card until the
   second fetch lands. A skeleton rather than a fallback string: the only
   fallback available was the location, which is the heading directly above
   and is the one thing a headline must never be. Sized like the headline so
   the card does not grow one under the reader when it arrives.

   IT MUST MOVE, and until 20 Sep 2026 it did not. Reported from a screenshot as
   "invisible titles": a motionless grey block is indistinguishable from a
   heading that failed to render, and the reader has no way to tell which they
   are looking at. It also lasts far longer than "a few seconds" whenever the
   cache is cold — `_elaborate_top_signals` generates INLINE in that request, and
   the same commit that added this skeleton also put the prompt's SHA in the
   cache key (invalidating every stored elaboration) and replaced the top-ten cap
   with a payload budget (so every card needs a call, not ten). Three reasonable
   changes that between them made a silent block the whole first-load experience.

   Gates match atoms/shimmer.css exactly, because this is the same signal —
   indeterminate work with no ETA — in the one shape the shimmer cannot take,
   since that atom clips its gradient to TEXT and this element has none. Both
   gates must pass or it degrades to the static block, which is the old
   behaviour and is still correct for someone who asked for no motion. */
.signal-card-location-pending {
    height: var(--bn-text-heading);
    width: 42%;
    min-width: 8rem;
    border-radius: var(--bn-radius-sm);
    background: var(--bn-colour-hover);
}

@keyframes bn-pending-breathe {
    50% { opacity: 0.45; }
}

@media (prefers-reduced-motion: no-preference) {
    :root:not([data-analysis-animation="off"]) .signal-card-location-pending {
        animation: bn-pending-breathe 1.6s ease-in-out infinite;
    }
}

/* --- organisms/inspector.css --- */
/* ── Inspector panel — collapsible bottom heatmap pane ──── */

/* Signals scrolls the PAGE, like every other lens (26 Sep 2026). The heatmap
   pane is pinned to the window bottom with `position: sticky; bottom: 0`
   (Panel shell, below) — the primitive the side panels use at the top edge.

   Until then this was the one lens with a private scroll model: the grid
   capped to the viewport, `overflow: hidden` down the chain, and the cards
   scrolling inside .signals-center. Every Signals-only layout bug of Sep 2026
   came from it — a phantom page scrollbar (306a7efd), the pane stopping a pad
   short of the window bottom (1c563b29), the left panel's band clipped 32px
   low (4c678097), the heading cut off 32px under the toolbar in the app, and
   the card shadows clipped at the scroll edge. The mockup that measured the
   swap: docs/mockups/signals-heatmap-sticky-pane.html.

   KEEP THIS CHAIN FREE OF `overflow: hidden | auto | scroll`. Any ancestor of the pane that clips or
   scrolls (.layout, .center, .bn-main, .signals-layout) becomes the pane's
   sticky reference, and the pane quietly stops pinning to the window.
   tests/test_signals_sticky_pane_css.py holds the line. */

/* Two rules stay Signals-specific. (1) No bottom pad on .center: the pad sits
   below the pane, so at scroll end a sticky pane would rest 32px off the
   window bottom — the 1c563b29 bug, which the mockup reproduced exactly. */
.layout > .center:has(.signals-layout) {
    padding-bottom: 0;
}

/* (2) The report footer stays hidden — browser only, the app renders none.
   Shown, it arrives after the pane at scroll end and carries it off its pin.
   The footer is a sibling of <main.bn-main>, not of .signals-layout, so the
   combinator reaches up to .center. */
.center:has(.signals-layout) > .report-footer {
    display: none;
}

/* The pinned pane covers the bottom of the window, so everything in the card
   list carries a bottom scroll-margin as tall as the pane: scroll-into-view (a
   heatmap-cell click, the left panel) and focus scrolling (Tab) land it ABOVE
   the pane, not behind it. Measured without: a jump with the pane at 45% left
   the card 73px under it.

   On the targets, NOT `scroll-padding-bottom` on <html> (the first cut). Page
   padding also reserves the strip the pane itself sits in, so focusing a
   control INSIDE the pane — a tab, the grip — scrolled the page to "reveal"
   something already on screen: +19 to +523px, measured in WebKit and Chromium
   (review, 26 Sep 2026). Margins on targets are the house pattern
   (toolbar.css, transcript.css). InspectorPanel publishes the pane's live
   height on <html>; it inherits down to here. */
.signals-center * {
    scroll-margin-bottom: var(--bn-inspector-pane-height, 28px);
}

/* A short lens must still put the pane on the window bottom. Sticky only
   LIFTS an element that would fall below the window; it never pulls one down,
   so with three cards the pane would sit under the last one, mid-window. The
   chain therefore grows to fill the grid row, whose floor is the viewport
   (sidebar.css `.layout` min-height) — by flex-grow, never a height or an
   overflow, so nothing here can become a clipping ancestor. With long content
   these grow by nothing and size to the cards. */
.bn-main:has(.signals-layout) {
    flex: 1 0 auto;
}

/* Full column width: bleeds out of .center's side padding (the properties
   sidebar.css publishes) so the heatmap bar runs edge to edge like a panel —
   to the left panel's keyline and the window edge — and .signals-center takes
   the same padding back, so the cards stay on the shared content edge. */
.signals-layout {
    display: flex;
    flex-direction: column;
    flex: 1 0 auto;
    margin-left: calc(-1 * var(--bn-center-pad-left, 0px));
    margin-right: calc(-1 * var(--bn-center-pad-right, 0px));
}

.signals-center {
    flex: 1 0 auto;   /* pushes the pane to the bottom of a short lens */
    /* Takes back exactly the side padding .signals-layout bled out of, so the
       cards sit on the shared content edge — and, with no scroll edge beside
       them any more, their shadows are never clipped.

       Top padding is 0 so the first heading flushes to the same datum as every
       other lens's first content. Bottom keeps space-lg so the last card
       clears the pane at scroll end. */
    padding: 0 var(--bn-center-pad-right, 0px) var(--bn-space-lg) var(--bn-center-pad-left, 0px);
}

/* ── Panel shell ────────────────────────────────────────── */

.inspector-panel {
    flex-shrink: 0;
    /* Pinned to the window bottom while the page scrolls. It stays in flow at
       the end of the lens, so the last card ends above it with no padding.
       The opaque background matters now: cards scroll behind it. z-index 2
       lifts it over the cards (position: relative, z auto) and nothing else. */
    position: sticky;
    bottom: 0;
    z-index: 2;
    /* A pane taller than the window would push its own handle off the top,
       with no way to drag it back. The store allows 600px whatever the window;
       this keeps the handle reachable and a band of cards above it. */
    max-height: calc(100vh - 3 * var(--bn-space-xl));
    max-height: calc(100dvh - 3 * var(--bn-space-xl));
    border-top: 1px solid var(--bn-colour-border);
    background: var(--bn-colour-bg);
    display: flex;
    flex-direction: column;
    transition: height 75ms cubic-bezier(0, 0, 0.2, 1);  /* decelerate — matches sidebar reveal */
    overflow: hidden;
    height: var(--inspector-height);
}

.inspector-panel.collapsed {
    height: auto !important;
}

/* During closing animation, keep height at last known value (set via React style prop).
   No transition — clip-path keyframe handles the visual. */
.inspector-panel.closing {
    transition: none;
}

/* Disable transition during pointer drag */
body.dragging-v .inspector-panel {
    transition: none !important;
}

/* Vertical drag cursor — override sidebar's col-resize */
body.dragging-v {
    user-select: none;
    cursor: ns-resize !important;
}

body.dragging-v * {
    cursor: ns-resize !important;
}

/* ── Handle bar ─────────────────────────────────────────── */

.inspector-handle {
    display: flex;
    align-items: center;
    gap: var(--bn-space-sm);
    padding: 0 var(--bn-space-md);
    /* A 28pt pitch in both states, on the 4pt grid: 1pt keyline + 27pt fill,
       the unit Safari's Web Inspector bar repeats on (measured 26 Sep 2026).
       The fill is 27 and the bar's own bottom line — drawn only when open —
       sits OUTSIDE it (content-box), so collapsed = pane keyline 1 + 27 = 28,
       and open = pane keyline 1 + 27 to the next line, the tabs row's. As
       border-box at 1.75rem the fill grew to 28 once the bottom line went, and
       the closed pane stood 29. COLLAPSED_HEIGHT (useVerticalDragResize.ts)
       and the auto-height sum (InspectorPanel.tsx) both assume this. */
    box-sizing: content-box;
    height: calc(1.75rem - 1px);
    min-height: calc(1.75rem - 1px);
    user-select: none;
    border-bottom: 1px solid var(--bn-colour-border);
    /* Chrome, not content: the same tint as the left panel (.toc-sidebar) so
       the bar reads as another panel edge. Only the bar — the heatmap body
       below it stays on --bn-colour-bg. The keyline above is the panel's
       border-top, already --bn-colour-border like the left panel's. */
    background: var(--bn-colour-inspector-bg);
}

.collapsed .inspector-handle {
    border-bottom: none;
}

/* Grid icon / close × toggle button */
.inspector-icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border: none;
    background: none;
    /* Text colour, not muted: the grid glyph is the web twin of the Mac
       toolbar's square.grid.2x2, which draws in the primary label colour. */
    color: var(--bn-colour-text);
    cursor: pointer;
    border-radius: var(--bn-radius-sm);
    padding: 0;
    flex-shrink: 0;
}

.inspector-icon-btn:hover {
    background: var(--bn-colour-hover);
    color: var(--bn-colour-text);
}

/* Title text — the same heading as the left panel's "Signals"
   (`.toc-sidebar-header .sidebar-title`, sidebar.css): label size, emphasis
   weight, text colour. Two panel headings in one lens, one typography. */
.inspector-handle-title {
    font-size: var(--bn-text-label);
    line-height: var(--bn-text-label-lh);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
    cursor: default;
}

/* Shimmer teaching animation — plays when a signal card is focused
   while the panel is collapsed. sessionStorage counter: max 3 times. */
@keyframes inspector-shimmer {
    0%   { color: var(--bn-colour-text); }
    25%  { color: var(--bn-colour-accent); }
    50%  { color: var(--bn-colour-text); }
    75%  { color: var(--bn-colour-accent); }
    100% { color: var(--bn-colour-text); }
}

.inspector-handle-title.shimmer {
    animation: inspector-shimmer 1.2s ease-out;
}

/* Grab handle — click to open, click+drag to resize */
.inspector-handle-grip {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    height: 100%;
}

/* When panel is open, grip is for resize */
.inspector-panel:not(.collapsed) .inspector-handle-grip {
    cursor: ns-resize;
}

.inspector-handle-grip::before {
    content: "";
    display: block;
    width: 32px;
    height: 3px;
    border-radius: 2px;
    background: var(--bn-colour-border);
    transition: background var(--bn-transition-fast);
}

.inspector-handle-grip:hover::before {
    background: var(--bn-colour-border-hover);
}

/* ── Open / close content animations ──────────────────────
   Vertical clip-path reveal/hide mirroring the TOC sidebar's
   toc-reveal / toc-hide keyframes (75ms, material easing).  */

@keyframes inspector-reveal {
    from { clip-path: inset(100% 0 0 0); opacity: 0; }
    to   { clip-path: inset(0);           opacity: 1; }
}

@keyframes inspector-hide {
    from { clip-path: inset(0);           opacity: 1; }
    to   { clip-path: inset(100% 0 0 0); opacity: 0; }
}

/* Content reveals on open */
.inspector-panel:not(.collapsed):not(.closing) .inspector-tabs,
.inspector-panel:not(.collapsed):not(.closing) .inspector-body {
    animation: inspector-reveal 75ms cubic-bezier(0, 0, 0.2, 1) both;
}

/* Content hides on close */
.inspector-panel.closing .inspector-tabs,
.inspector-panel.closing .inspector-body {
    animation: inspector-hide 75ms cubic-bezier(0.4, 0, 1, 1) both;
}

/* Disable content animations during pointer drag */
body.dragging-v .inspector-tabs,
body.dragging-v .inspector-body {
    animation: none !important;
}

/* ── Source tabs ─────────────────────────────────────────── */

.inspector-tabs {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 var(--bn-space-sm);
    height: 2rem;
    min-height: 2rem;
    border-bottom: 1px solid var(--bn-colour-border);
    overflow-x: auto;
    flex-shrink: 0;
}

.inspector-tab {
    display: flex;
    align-items: center;
    padding: 0 var(--bn-space-md);
    height: 100%;
    font-family: var(--bn-font-body);
    font-size: var(--bn-text-label);
    line-height: var(--bn-text-label-lh);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-muted);
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    transition: color var(--bn-transition-fast);
    border: none;
    background: none;
}

.inspector-tab:hover { color: var(--bn-colour-text); }
.inspector-tab.active { color: var(--bn-colour-text); }

.inspector-tab.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: var(--bn-space-sm);
    right: var(--bn-space-sm);
    height: 2px;
    background: var(--bn-colour-accent);
    border-radius: 1px;
}

/* ── Heatmap body ───────────────────────────────────────── */

.inspector-body {
    flex: 1;
    overflow: auto;
    /* No top padding — sticky thead must sit flush against the tab bar. */
    padding: 0 var(--bn-space-md) var(--bn-space-md);
}

/* Sticky column headers when scrolling tall matrices */
.inspector-body .analysis-heatmap thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--bn-colour-bg);
}

/* ── Section/Theme toggle — lives in the table top-left cell ── */

.dimension-toggle {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-sm);
    overflow: hidden;
}

.dimension-btn {
    border: none;
    background: none;
    font-family: var(--bn-font-body);
    font-size: var(--bn-text-caption);
    line-height: var(--bn-text-caption-lh);
    font-weight: var(--bn-weight-normal);
    color: var(--bn-colour-muted);
    padding: var(--bn-space-xs) var(--bn-space-sm);
    cursor: pointer;
    transition: all var(--bn-transition-fast);
}

.dimension-btn:first-child {
    border-right: 1px solid var(--bn-colour-border);
}

.dimension-btn:hover {
    background: var(--bn-colour-hover);
    color: var(--bn-colour-text);
}

.dimension-btn:focus-visible {
    /* Inset: the toggle clips its children (overflow: hidden), so an outset
       ring would be cut off at the edges the buttons share with it. */
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: -2px;
}

.dimension-btn.active {
    background: var(--bn-colour-hover);
    /* Body ink, not accent: accent on the hover tint measures 3.51:1 (light)
       and 4.01:1 (dark) in the default palette, under AA's 4.5:1 for 12px
       text. The tint and the weight carry "selected". */
    color: var(--bn-colour-text);
    font-weight: var(--bn-weight-emphasis);
}

/* ── Collapsed hides tabs + body ────────────────────────── */

.collapsed .inspector-tabs,
.collapsed .inspector-body {
    display: none;
}

/* ── Row label truncation ───────────────────────────────── */

.inspector-body .analysis-heatmap td:first-child {
    max-width: 200px;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
}

/* --- organisms/settings.css --- */
/* --- Settings panel --- */

.bn-setting-group {
    border: none;
    padding: 0;
    margin: 0 0 var(--bn-space-lg) 0;
}

.bn-setting-group legend {
    font-weight: var(--bn-weight-emphasis);
    font-size: var(--bn-text-label);
    color: var(--bn-colour-text);
    margin-bottom: var(--bn-space-sm);
}

.bn-radio-label {
    display: flex;
    align-items: center;
    gap: var(--bn-space-xs);
    padding: var(--bn-space-xs) 0;
    cursor: pointer;
    font-size: var(--bn-text-label);
    color: var(--bn-colour-text);
}

.bn-radio-label input[type="radio"] {
    accent-color: var(--bn-colour-accent);
    margin: 0;
}

.bn-setting-description {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    margin: 0 0 var(--bn-space-sm) 0;
    line-height: var(--bn-text-label-lh);
}

.bn-locale-select,
.bn-palette-select {
    font-size: var(--bn-text-label);
    padding: var(--bn-space-xs) var(--bn-space-sm);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-sm);
    background: var(--bn-colour-bg);
    color: var(--bn-colour-text);
    cursor: pointer;
    min-width: 10rem;
}

.bn-locale-select:hover,
.bn-palette-select:hover {
    border-color: var(--bn-colour-border-hover);
}

.bn-locale-select:focus,
.bn-palette-select:focus {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: 1px;
    border-color: var(--bn-colour-accent);
}

/* --- Configuration reference --- */

.bn-config-ref {
    margin-top: var(--bn-space-md);
}

.bn-config-ref-intro {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    margin: 0 0 var(--bn-space-lg) 0;
    line-height: var(--bn-text-label-lh);
}

.bn-config-ref-intro code {
    font-size: var(--bn-text-label);
    background: var(--bn-hover-bg);
    padding: 0.1em 0.35em;
    border-radius: var(--bn-radius-sm);
}

/* Category chips — horizontal scrollable row */

.bn-config-ref-chips {
    display: flex;
    flex-wrap: wrap;
    gap: var(--bn-space-xs);
    margin-bottom: var(--bn-space-lg);
}

.bn-config-ref-chip {
    font-size: var(--bn-text-label);
    padding: 0.25em 0.65em;
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-pill);
    background: none;
    color: var(--bn-colour-muted);
    cursor: pointer;
    transition: color var(--bn-transition-fast), border-color var(--bn-transition-fast),
                background var(--bn-transition-fast);
    white-space: nowrap;
}

.bn-config-ref-chip:hover {
    color: var(--bn-colour-text);
    border-color: var(--bn-colour-border-hover);
    background: var(--bn-hover-bg);
}

/* Category sections */

.bn-config-ref-section h3 {
    font-size: var(--bn-text-label);
    font-weight: var(--bn-weight-emphasis);
    margin: var(--bn-space-lg) 0 var(--bn-space-sm) 0;
    padding-bottom: var(--bn-space-xs);
    border-bottom: 1px solid var(--bn-colour-border);
    color: var(--bn-colour-text);
}

/* Individual setting rows — CSS grid */

.bn-config-ref-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    grid-template-rows: auto auto;
    gap: 0 var(--bn-space-md);
    align-items: baseline;
    padding: var(--bn-space-sm) 0;
    border-bottom: 1px solid var(--bn-hover-bg);
    font-size: var(--bn-text-label);
}

.bn-config-ref-label {
    color: var(--bn-colour-text);
    grid-column: 1;
    grid-row: 1;
}

.bn-config-ref-value {
    grid-column: 2;
    grid-row: 1;
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
}

.bn-config-ref-file {
    grid-column: 3;
    grid-row: 1;
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    background: var(--bn-hover-bg);
    padding: 0.15em 0.5em;
    border-radius: var(--bn-radius-pill);
    white-space: nowrap;
    cursor: help;
}

.bn-config-ref-meta {
    grid-column: 1 / -1;
    grid-row: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: var(--bn-space-sm);
    min-height: 0;
}

.bn-config-ref-envvar {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    cursor: pointer;
    transition: color var(--bn-transition-fast);
}

.bn-config-ref-envvar:hover {
    color: var(--bn-colour-text);
}

.bn-config-ref-envvar.copied {
    color: var(--bn-colour-accent);
}

.bn-config-ref-envvar .bn-icon {
    margin-inline-start: 0.25em;
}

.bn-config-ref-options {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    opacity: 0.7;
}

/* Pipeline view — read-only mixture-of-models display in Settings */

.bn-pipeline-view {
    display: flex;
    flex-direction: column;
    gap: var(--bn-space-md);
}

/* v4 — sectioned-flat matrix: one <table> per stage-profile cluster, providers
   as typographic colgroup headings, per-model rows with two glyph columns
   (Availability + Quality) and a Why column. Glyph colours reuse existing
   sentiment + neutral tokens — no new colour vocabulary (a11y lock). */

.bn-pipeline-stage-group {
    display: flex;
    flex-direction: column;
    gap: var(--bn-space-xs);
}

.bn-pipeline-stage-group-heading {
    font-size: var(--bn-text-caption);
    font-weight: var(--bn-weight-emphasis);
    letter-spacing: 0.04em;
    color: var(--bn-colour-muted);
    margin: 0;
}

.bn-pipeline-matrix {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--bn-text-label);
    /* Fixed layout + shared colgroup widths so the 4 columns line up across
       every stage table (transcription / anonymisation match the LLM tables),
       letting the eye scan all four columns straight down the page. */
    table-layout: fixed;
}

.bn-pipeline-col-model {
    width: 40%;
}

.bn-pipeline-col-avail,
.bn-pipeline-col-quality {
    width: 2.5em;
}

/* .bn-pipeline-col-notes takes the remaining width (no explicit rule). */

/* Symbol key — compact legend above the tables. Availability / Quality
   subheadings group their glyphs; glyphs reuse the table colour classes so
   the legend's marks match the cells exactly. */
.bn-pipeline-key {
    display: flex;
    flex-direction: column;
    gap: var(--bn-space-xs);
    margin: var(--bn-space-sm) 0 var(--bn-space-md);
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
}

.bn-pipeline-key-group {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: var(--bn-space-xs) var(--bn-space-md);
}

.bn-pipeline-key-label {
    font-size: var(--bn-text-badge);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.bn-pipeline-key-item {
    white-space: nowrap;
}

/* Visible column header — first table only (Model / Notes labels). */
.bn-pipeline-col-head {
    text-align: left;
    font-size: var(--bn-text-badge);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0 var(--bn-space-md) var(--bn-space-xs);
}

.bn-pipeline-provider-heading th {
    text-align: left;
    font-weight: var(--bn-weight-strong);
    color: var(--bn-colour-text);
    padding: var(--bn-space-sm) var(--bn-space-xs) var(--bn-space-xs);
}

.bn-pipeline-row-name {
    text-align: left;
    font-weight: var(--bn-weight-normal);
    color: var(--bn-colour-text);
    padding: var(--bn-space-xs) var(--bn-space-md);
}

/* Collapsed-provider rows (no model granularity, or all-unavailable) render at
   provider level — bold + flush-left, peers of the expanded provider heading —
   so ChatGPT / Gemini / MLX read as backends, not Claude's children. */
.bn-pipeline-row-name-provider {
    font-weight: var(--bn-weight-strong);
    padding-left: var(--bn-space-xs);
}

.bn-pipeline-avail-cell,
.bn-pipeline-quality-cell {
    text-align: center;
    width: 2.5em;
    white-space: nowrap;
}

.bn-pipeline-why-cell {
    color: var(--bn-colour-muted);
    padding: var(--bn-space-xs);
    font-size: var(--bn-text-caption);
}

.bn-pipeline-glyph {
    font-weight: var(--bn-weight-strong);
}

.bn-pipeline-badge {
    color: var(--bn-colour-muted);
    font-weight: var(--bn-weight-normal);
}

/* Availability glyph colours — MessageKind vocabulary (shared with CLI/doctor). */
.bn-pipeline-avail-ok {
    color: var(--bn-sentiment-satisfaction);
}

.bn-pipeline-avail-error {
    color: var(--bn-sentiment-confusion);
}

.bn-pipeline-avail-skip {
    color: var(--bn-colour-muted);
}

/* Quality glyph colours — editorial vocabulary; sentiment-token mapping. */
.bn-pipeline-quality-excellent,
.bn-pipeline-quality-good {
    color: var(--bn-sentiment-satisfaction);
}

.bn-pipeline-quality-marginal {
    color: var(--bn-sentiment-surprise);
}

.bn-pipeline-quality-avoid {
    color: var(--bn-sentiment-confusion);
}

.bn-pipeline-quality-untested {
    color: var(--bn-colour-muted);
}

/* Synthesised rows (Azure deployment, pulled Ollama, dispatched-not-catalogued)
   — italic signals "from your settings, not our catalogue." */
.bn-pipeline-synthesised-row .bn-pipeline-row-name {
    font-style: italic;
}

/* Current dispatch row — the selection wash used app-wide for selected quotes
   & signal cards (.bn-selected): --bn-selection-* tokens + accent leading edge.
   Read-only here ("in use") rather than user-selected, but visually coherent. */
.bn-pipeline-model-row[aria-current="true"] {
    background: var(--bn-selection-bg);
}

.bn-pipeline-model-row[aria-current="true"] .bn-pipeline-row-name {
    box-shadow: inset 2px 0 0 var(--bn-selection-border);
}

/* Inactive window — selection recedes to grey (macOS convention), matching
   the .bn-selected behaviour in atoms/interactive.css. */
.bn-window-inactive .bn-pipeline-model-row[aria-current="true"] {
    background: var(--bn-selection-bg-inactive);
}

.bn-window-inactive .bn-pipeline-model-row[aria-current="true"] .bn-pipeline-row-name {
    box-shadow: inset 2px 0 0 var(--bn-selection-border-inactive);
}

.bn-pipeline-host {
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
    border-top: 1px solid var(--bn-colour-border);
    padding-top: var(--bn-space-sm);
    margin: var(--bn-space-sm) 0 0;
}

/* Visually-hidden text for screen readers — paired with aria-hidden glyphs. */
.bn-sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
}

/* --- organisms/modal-nav.css --- */
/* --- ModalNav — reusable sidebar-nav modal layout ---
   Generic two-column shell: sidebar navigation + content pane.
   Used by Settings, Help, and future modals.

   Size is NOT set here — each consumer applies its own class
   (.settings-modal, .help-modal, etc.) with max-width/height.
   The base .modal-nav-shell class provides the flex column layout
   that every consumer needs. */

/* ── Shell (every ModalNav consumer needs this) ── */

.modal-nav-shell {
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Title bar — sits above the two-column layout */
.modal-nav-title {
    margin: 0;
    padding: var(--bn-space-lg) var(--bn-space-xl);
    padding-bottom: var(--bn-space-md);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
    flex-shrink: 0;
}

/* Two-column flex: sidebar + content */
.modal-nav {
    display: flex;
    flex: 1;
    min-height: 0; /* allow children to scroll */
}

/* ── Sidebar nav ── */

.modal-nav-sidebar {
    /* A floor, not a width: the column grows to its longest label
       ("Конфиденциальность", "LLM-palveluntarjoaja") instead of scrolling
       sideways and clipping it (overflow-y: auto makes overflow-x auto too).
       The content pane beside it has min-width: 0 and gives way. A control's
       label is never cut (owner rule, 9 Nov 2026). */
    min-width: 11rem;
    flex-shrink: 0;
    border-right: 1px solid var(--bn-colour-border);
    overflow-y: auto;
    padding: var(--bn-space-md) 0;
}

.modal-nav-list {
    list-style: none;
    margin: 0;
    padding: 0;
}

.modal-nav-list li {
    list-style: none;
}

.modal-nav-item {
    display: flex;
    align-items: center;
    gap: var(--bn-space-xs);
    width: 100%;
    padding: var(--bn-space-xs) var(--bn-space-md);
    border: none;
    background: none;
    font-family: inherit;
    font-size: var(--bn-text-label);
    line-height: var(--bn-text-label-lh);
    color: var(--bn-colour-text);
    cursor: pointer;
    border-radius: var(--bn-radius-sm);
    transition: background var(--bn-transition-fast);
    text-align: left;
}

.modal-nav-item:hover {
    background: var(--bn-colour-hover);
}

.modal-nav-item.active {
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-accent);
    background: var(--bn-colour-hover);
}

/* Disclosure arrow */
.modal-nav-arrow {
    display: inline-flex;
    font-size: 0.85em;     /* a stroked chevron needs more room than the old solid ▶ at 0.6em */
    transition: transform var(--bn-transition-fast);
    flex-shrink: 0;
    width: 1em;
    justify-content: center;
}

.modal-nav-arrow.expanded {
    transform: rotate(90deg);
}

@media (prefers-reduced-motion: reduce) {
    .modal-nav-arrow {
        transition: none;
    }
}

/* Sub-items (indented under disclosure) */
.modal-nav-sub-list {
    list-style: none;
    margin: 0;
    padding: 0;
}

.modal-nav-sub {
    padding-left: calc(var(--bn-space-md) + 1rem);
    color: var(--bn-colour-muted);
}

.modal-nav-sub.active {
    color: var(--bn-colour-accent);
}

/* Optional search slot above nav list */
.modal-nav-search {
    padding: 0 var(--bn-space-md) var(--bn-space-sm);
}

/* ── Content pane ── */

.modal-nav-content {
    flex: 1;
    overflow-y: auto;
    padding: var(--bn-space-md) var(--bn-space-lg) var(--bn-space-lg);
    min-width: 0; /* prevent flex blowout */
}

.modal-nav-content-heading {
    margin: 0 0 var(--bn-space-md) 0;
    font-size: var(--bn-text-heading);
    line-height: var(--bn-text-heading-lh);
    font-weight: var(--bn-weight-emphasis);
    color: var(--bn-colour-text);
    outline: none; /* receives programmatic focus, not keyboard focus */
}

/* ── Dropdown (narrow viewports, ≤500px) ── */
/* @media uses --bn-breakpoint-compact value (500px) */

.modal-nav-dropdown {
    display: none;
}

@media (max-width: 500px) {
    .modal-nav-sidebar {
        display: none;
    }

    .modal-nav-dropdown {
        display: block;
        padding: 0 var(--bn-space-md) var(--bn-space-sm);
        flex-shrink: 0;
    }

    .modal-nav-dropdown select {
        width: 100%;
    }

    .modal-nav {
        flex-direction: column;
    }

    .modal-nav-content {
        padding: var(--bn-space-md);
    }
}

/* The overlay transition is the shared dialog's (atoms/modal.css). */

/* --- organisms/settings-modal.css --- */
/* --- Settings modal — size overrides for ModalNav shell ---
   Layout, nav, transitions live in modal-nav.css (generic organism).
   This file only sets dimensions specific to the Settings modal. */

.settings-modal {
    max-width: 42rem;
    height: min(32rem, 80vh);
}

@media (max-width: 500px) {
    .settings-modal {
        height: min(32rem, 90vh);
    }
}

/* --- templates/report.css --- */
/* Template: report — page-level layout, typography, and base elements */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
}

body {
    font-family: var(--bn-font-body);
    font-size: var(--bn-text-label);
    line-height: var(--bn-text-label-lh);
    color: var(--bn-colour-text);
    background: var(--bn-colour-bg);
    margin: 0;
    /* No bottom padding on body (20 Sep 2026). The sidebars are sticky INSIDE
       the .layout grid, so anything body pads below the grid is ground a panel
       can never cover: scrolled to the end, the panel stopped one padding short
       of the window bottom and the (transparent, embedded) body showed the
       window surface there — a white bar under the pale panel on macOS 27. The
       bottom breathing room now lives on `.layout > .center` (sidebar.css) for
       the SPA and on `article` below for the static render, both of which sit
       inside the row the panels span. */
    padding: var(--bn-space-xl) var(--bn-space-lg) 0;
}

/* Translucent chrome (spike): when the SPA runs inside the macOS WKWebView
   the WebView paints transparent (WebView.swift: drawsBackground=false) and
   extends behind the unified toolbar, so a solid body background would cover
   the vibrancy the toolbar frost is trying to sample. main.tsx sets
   [data-embedded="true"] on <html> before first paint.

   The extended WebView also means the top of `body` sits BEHIND the toolbar;
   BridgeHandler.syncToolbarInset pushes the titlebar+toolbar delta as
   `--bn-toolbar-inset` on <html> at `ready`. Add it to the existing top pad
   so first-of-content is fully out from under the frost. The `, 0px` fallback
   keeps non-embedded (browser/serve) surfaces on the current spacing.

   The horizontal padding goes to 0 here, not just the top. Until 20 Sep 2026
   this override replaced padding-top ONLY, so the 24px `--bn-space-lg` flank
   survived into the app — and because the body is transparent it showed the
   WINDOW surface through it: a strip between the native sidebar and the
   content-nav panel (and again past the tag sidebar) that read as a failed
   join. Measured on macOS 27 as pure #ffffff beside a #f9f9f9 panel. The
   panels must be flush with the split divider and the window edge; the prose
   keeps its distance via `.center` padding (sidebar.css § "Desktop embedded"). */
html[data-embedded="true"] body {
    background: transparent;
    /* Dark only: the paper is a real surface, not the window material. The material
       reads as the sidebar's tint (a wallpaper-dependent olive, about as light as the
       sidebar itself), which made the content paper the same weight as the native
       sidebar and lighter than every panel on it. Light mode keeps the translucent
       body. `light-dark()` is supported by every WKWebView the floor allows. */
    background: light-dark(transparent, var(--bn-colour-paper));
    padding-top: calc(var(--bn-toolbar-inset, 0px) + var(--bn-space-xl));
    padding-left: 0;
    padding-right: 0;
}

article {
    max-width: none;
    margin: 0 auto;
    padding: 0 var(--bn-space-lg) var(--bn-space-xl);
}

/* Single-column elements keep the reading-width cap on wide screens.
   The dashboard is deliberately NOT capped — it fills the lens width like every
   other tab (full-span panes stretch; the two nav lists share a flush 1fr 1fr row). */
h1, h2, h3, .description {
    max-width: var(--bn-max-width);
}

h1 {
    font-size: var(--bn-text-display);
    font-weight: var(--bn-weight-strong);
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
}

h2 {
    font-size: var(--bn-text-title);
    font-weight: var(--bn-weight-emphasis);
    margin: 2.5rem 0 1rem;
    padding-bottom: 0.4rem;
    /* A section divider is a *structural* concern, not a *reading-width* one:
       un-cap so the rule spans the full pane (overriding the reading-width
       cap the h1/h2/h3/.description group sets above). 1px is the canonical
       divider weight, matching .framework-section-header (codebook). This
       retires the old 2px reading-width-capped treatment (D7 in
       docs/design-improvement-opportunities.md) — every h2 is now one
       consistent 1px full-pane divider. See docs/design-lens-template.md
       § Keylines. */
    max-width: none;
    border-bottom: 1px solid var(--bn-colour-keyline);
}

/* The .section-heading ATOM moved to atoms/section-heading.css (6 Aug 2026).
   Only its page-layout rule stays here: an atom should not know where on a
   page it sits. */


/* First zone-title on a lens sits flush at the content datum (no top gap).
   Quotes: the first <section> in <main> ("Sections", before "Themes").
   Analysis: the first heading in the scroll pane ("Sentiment", before "Tag").
   Browser: flush at the body top-pad. The app's absolute datum is re-scoped
   with the toolbar-inset fix (Phase B); this rule is surface-agnostic. */
.center > main > section:first-of-type > .section-heading,
.signals-center > .section-heading:first-of-type {
    margin-top: 0;
}

h3 {
    font-size: var(--bn-text-heading);
    font-weight: var(--bn-weight-emphasis);
    margin: 1.8rem 0 0.25rem;
}

.bn-about {
    display: flex;
    gap: var(--bn-space-xl);
    align-items: flex-start;
}

.bn-about-sidebar {
    width: 180px;
    flex-shrink: 0;
    position: sticky;
    top: 1rem;
}

.bn-about-sidebar button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 0.5rem 0;

    border: none;

    transition: color var(--bn-transition-fast);

.bn-about-sidebar button:hover {

}

.bn-about-sidebar button.active {

.bn-about-content {

    min-width: 0;
}

.bn-about-content h2 {
    margin-top: 0;
}

.bn-about-content h3 {

}

.bn-about-content h4 {

    font-size: var(--bn-text-label);
}

.bn-about-citation {
    margin-bottom: 1rem;
    padding-left: 1.5rem;
    text-indent: -1.5rem;
    font-size: var(--bn-text-label);

.bn-about-citation a {

    text-decoration: none;
}

.bn-about-citation a:hover {

}

.bn-about-citation .summary {

    padding-left: 1.5rem;
    color: var(--bn-colour-muted);

}

.bn-about-footer {
    margin-top: 1.5rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--bn-colour-border);
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
}

hr {
    border: none;
    border-top: 1px solid var(--bn-colour-keyline);
    margin: var(--bn-space-xl) 0;
}

.description {
    color: var(--bn-colour-muted);
    margin-top: 0;
    margin-bottom: 1rem;
}

/* Tables */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--bn-text-label);
    margin: 1rem 0;
}

th {
    text-align: left;
    font-weight: var(--bn-weight-emphasis);
    padding: 0.6rem var(--bn-space-md);
    border-bottom: 2px solid var(--bn-colour-border);
    white-space: nowrap;
}

td {
    padding: 0.5rem var(--bn-space-md);
    border-bottom: 1px solid var(--bn-colour-border);
    vertical-align: top;
}

tr:last-child td {

}

th.bn-sortable {

    user-select: none;
}

th.bn-sortable:hover {
    color: var(--bn-colour-accent);
}

.bn-sort-arrow {
    font-size: 0.65em;
    margin-left: 0.25em;
    vertical-align: middle;
}

.bn-sort-ghost {
    opacity: 0.2;
}

.bn-sort-active {
    opacity: 0.6;
}

td a {
    color: var(--bn-colour-accent);
    text-decoration: none;
}

td a:hover {
    text-decoration: underline;
}

/* Session table */
.bn-session-table {
    margin: 0;
}

.bn-session-table tr {
    border-bottom: 1px solid var(--bn-colour-border);
}

.bn-session-table tr:last-child {
    border-bottom: none;
}

.bn-session-table td {
    border-bottom: none;
}

.bn-session-table tbody tr[data-session] {

.bn-session-table tbody tr[data-session]:hover {

.bn-session-moderators {

.bn-session-speakers {

    gap: 0.25rem;
    white-space: nowrap;

.bn-session-meta {
    /* Start column is the only shrinkable column in the row (all others are
       nowrap or fixed-width), so auto table-layout dumps all shrink pressure

       widths. A floor keeps the path readable (a couple of words per line)
       while the date above it still wraps freely. */
    min-width: 12rem;
}

.bn-session-journey {
    font-size: var(--bn-text-label);
    color: var(--bn-colour-muted);
    margin-top: 0.25rem;
    white-space: normal;
}

.bn-session-id {
    white-space: nowrap;
}

.bn-session-duration {
    text-align: right;
    white-space: nowrap;
}

.bn-interviews-link {
    --bn-icon-stem: var(--bn-icon-stem-emphasis);  /* the folder sits beside the column's emphasis text */
    color: var(--bn-colour-accent);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
}

.bn-interviews-link:hover {
    text-decoration: none;
    opacity: 0.8;
}

.bn-folder-icon {
    flex-shrink: 0;
}

/* --- templates/focus-mode.css --- */
/* Template: focus-mode — distraction-free reading state for the report.
   Spec: docs/design-focus-mode.md

   Two hooks on <html>, each with one job:

     .bn-focus-ready   Added once when the SPA mounts, never removed.
                       Declares the transitions, so the fade is symmetric in
                       AND out — a transition declared only under
                       .bn-focus-mode would vanish the instant that class is
                       removed, snapping the way back. Also confines the
                       transition overrides to SPA surfaces: the static render
                       never sets it and is untouched by this file.

     .bn-focus-mode    Toggled. Declares the receded values only.

   Two axes, per the design doc:

     1. What stays lit    Quote text, speaker code, stars (starred or not),
                          selection + keyboard focus. Chrome recedes.
     2. What stays live   Anything the researcher acts THROUGH stays
                          interactive and returns to full presence while
                          engaged. Receding is a resting state, never a
                          disabled one — `pointer-events: none` below applies
                          only to resting decorative chrome, and lifts the
                          moment the card is hovered or holds focus.

   The ground is never touched. No `background` on html/body, no palette
   token — recede-only in every appearance, so this composes with default and
   edo, light and dark, with zero per-palette overrides. */

/* ── Transitions (always live, so the exit is symmetric) ───────────────── */

.bn-focus-ready blockquote.quote-card {
    transition: background var(--bn-focus-dur) var(--bn-focus-ease),
                border-left-color var(--bn-focus-dur) var(--bn-focus-ease);
}

.bn-focus-ready .quote-card .badges,
.bn-focus-ready blockquote .timecode,
.bn-focus-ready blockquote .context,
.bn-focus-ready .bn-group-header,
.bn-focus-ready .description {
    transition: opacity var(--bn-focus-dur) var(--bn-focus-ease);
}

/* ── Card dissolve ─────────────────────────────────────────────────────── */

/* The :not() guards are load-bearing, not defensive. `.bn-focused` and
   `.bn-selected` express themselves through `background`
   (atoms/interactive.css) — the same property this rule sets. Without the
   guards, focus mode wins on source order and silently blinds selection: the
   mode renders perfectly and only breaks when someone tries to multi-select.
   Pinned by tests/test_focus_mode_css.py. */
.bn-focus-mode blockquote.quote-card:not(.bn-selected):not(.bn-focused) {
    background: transparent;
    border-left-color: color-mix(in srgb, var(--bn-colour-border) var(--bn-focus-outline-mix), transparent);
}

/* The starred border dissolves with everything else — reversed 3 Aug 2026.
   It was briefly exempt on the reasoning that a star is the researcher's own
   mark and axis 1 keeps those lit. Wrong, and the mockup made it obvious: at
   --bn-colour-starred on a dissolved field it was the loudest thing in the
   column, and it was shouting on *every* starred card at once. A mark that
   reads well on one object reads as noise on twenty. What still marks a
   starred quote: the star glyph at full strength, and the heavier
   --bn-weight-starred body text, which Focus never touches. Two cues, both
   in-content, neither shouting. See § The one-ring rule. */

/* ── The keyboard cursor ───────────────────────────────────────────────── */

/* Nothing here. The cursor's dark-mode accent ring lives in
   `atoms/interactive.css` on `blockquote.quote-card.bn-focused`, because it
   earns its place in ordinary reading too — not only in Focus Mode.

   It was briefly defined here at (0,3,1), which silently out-specified
   `.bn-window-inactive blockquote.quote-card.bn-focused` (the same (0,3,1) but
   earlier in the concatenation), so the ring kept glowing while the app wasn't
   accepting input. Moving it to (0,2,1) in interactive.css restores the
   inactive-window recede. Don't re-add a Focus-scoped copy — Focus Mode needs
   no cursor rule of its own, and a second one would reintroduce that bug. */

/* ── Chrome recedes ────────────────────────────────────────────────────── */

.bn-focus-mode .quote-card .badges,
.bn-focus-mode blockquote .timecode,
.bn-focus-mode blockquote .context {
    opacity: var(--bn-focus-ghost-opacity);
}

/* Resting decorative chrome drops out of hit-testing and tab order — you
   can't click a chip you can't see. The hover/focus rules below lift this,
   and the card itself stays hoverable throughout (pointer-events on a child
   never blocks the parent), so the reveal fires normally. */
.bn-focus-mode .quote-card .badges {
    pointer-events: none;
}

/* Headings dim less — they're wayfinding, not noise.

   `.description` (the section/theme blurb) sits at the same depth. It is a
   SIBLING of .bn-group-header, not a child (QuoteGroup.tsx renders the header
   div and then the <p>), which is why an earlier rule targeting only the
   header left every description at full strength — and since they're
   full-sentence prose in --bn-colour-muted, they read as body text and were
   the loudest non-quote thing on the page. Same component renders both
   sections and themes, so one selector covers all four cases. */
.bn-focus-mode .bn-group-header,
.bn-focus-mode .description {
    opacity: var(--bn-focus-heading-opacity);
}

/* ── Axis 2: engaged chrome returns to full presence ───────────────────── */

.bn-focus-mode .quote-card:hover .badges,
.bn-focus-mode .quote-card:focus-within .badges,
.bn-focus-mode .quote-card.bn-focused .badges,
.bn-focus-mode .quote-card:hover .timecode,
.bn-focus-mode .quote-card:focus-within .timecode,
.bn-focus-mode .quote-card.bn-focused .timecode,
.bn-focus-mode .quote-card:hover .context,
.bn-focus-mode .quote-card:focus-within .context,
.bn-focus-mode .quote-card.bn-focused .context {
    opacity: 1;
}

.bn-focus-mode .quote-card:hover .badges,
.bn-focus-mode .quote-card:focus-within .badges,
.bn-focus-mode .quote-card.bn-focused .badges {
    pointer-events: auto;
}

/* Both the group header and the description carry editable text with an inline
   pencil. Dimmed-while-you-type is exactly the axis-2 violation this file
   exists to avoid — and it's the quieter kind, because the text still commits,
   it just looks broken while you work. */
.bn-focus-mode .bn-group-header:hover,
.bn-focus-mode .bn-group-header:focus-within,
.bn-focus-mode .description:hover,
.bn-focus-mode .description:focus-within {
    opacity: 1;
}

/* ══ The Signals lens ═════════════════════════════════════════════════════
   Spec: docs/design-focus-mode-signals.md. Mockup: docs/mockups/signals-focus-mode.html.

   The same two axes, applied to the signal card. Nothing below names a value
   of its own: every opacity is one of the two knobs above, every fade is the
   shared duration and ease, and the outline is the shared mix — so speed and
   depth are tuned once, in tokens.css, for both lenses.

   Before this section existed the mode still LEAKED onto this lens (the class
   lives on <html> and the store survives navigation) as a half-state made of
   whichever quote-card selectors happened to match signal-card markup: the
   source banner at 0.4, timecodes at 0.14 — except a sequence's continuation
   timecodes, which the organism holds at 0.6 at a higher specificity and which
   therefore ended up BRIGHTER than the run's first. */

/* ── Transitions (always live, so the exit is symmetric) ───────────────── */

.bn-focus-ready .signal-card {
    transition: background var(--bn-focus-dur) var(--bn-focus-ease),
                border-color var(--bn-focus-dur) var(--bn-focus-ease);
}

.bn-focus-ready .signal-card-quotes {
    transition: background var(--bn-focus-dur) var(--bn-focus-ease);
}

.bn-focus-ready .signals-center > .section-heading,
.bn-focus-ready .signal-card-location,
.bn-focus-ready .signal-elaboration,
.bn-focus-ready .signal-card-hero,
.bn-focus-ready .signal-card-alternates,
.bn-focus-ready .signal-card-footer,
.bn-focus-ready .signal-card-quotes .signal-quote-tag,
.bn-focus-ready .signal-card-quotes .intensity-dots,
.bn-focus-ready .signal-card-quotes blockquote .timecode {
    transition: opacity var(--bn-focus-dur) var(--bn-focus-ease);
}

/* ── Card dissolve ─────────────────────────────────────────────────────── */

/* Same guard as the quote card, same reason: `.signal-card.bn-selected` is
   the inspector-pointed card and expresses itself through `background`. The
   fused stack's seam is a card's own border, so it survives as a faint line. */
.bn-focus-mode .signal-card:not(.bn-selected) {
    background: transparent;
    border-color: color-mix(in srgb, var(--bn-colour-border) var(--bn-focus-outline-mix), transparent);
}

/* The quote box is a second container inside the first. Dissolving one and
   not the other leaves a slab inside a ghost. */
.bn-focus-mode .signal-card:not(.bn-selected) .signal-card-quotes {
    background: transparent;
}

/* ── Wayfinding dims less ─────────────────────────────────────────────── */

/* The location heading is this lens's `.bn-group-header`. The headline and
   the claim are the machine's reading of the quotes — the same object a theme
   title + description is on the Quotes lens — and take the same treatment:
   legible enough to know which finding you are under, not competing with the
   evidence. Chosen over keeping them lit (docs/design-focus-mode-signals.md
   § 3): lit, the same key would privilege the machine's words here and the
   participants' words one lens over. */
.bn-focus-mode .signals-center > .section-heading,
.bn-focus-mode .signal-card-location,
.bn-focus-mode .signal-elaboration {
    opacity: var(--bn-focus-heading-opacity);
}

/* ── Chrome recedes ────────────────────────────────────────────────────── */

.bn-focus-mode .signal-card-hero,
.bn-focus-mode .signal-card-alternates,
.bn-focus-mode .signal-card-footer,
.bn-focus-mode .signal-card-quotes .signal-quote-tag,
.bn-focus-mode .signal-card-quotes .intensity-dots {
    opacity: var(--bn-focus-ghost-opacity);
}

/* (0,3,1) on purpose. `.signal-card-quotes blockquote.seq-middle .timecode`
   holds continuation timecodes at 0.6 (organisms/signals.css) at that same
   specificity, so the quote-card ghost rule above — (0,2,1) — loses to it.
   Equal specificity, later file: this one wins. Pinned by
   tests/test_focus_mode_css.py. */
.bn-focus-mode .signal-card-quotes blockquote .timecode {
    opacity: var(--bn-focus-ghost-opacity);
}

/* Resting decorative chrome leaves hit-testing. The tag chips on a signal
   quote are readonly and the dots are a title-only glyph. The hero chip and
   the footer toggle are CONTROLS and keep their pointer-events — they recede
   at rest and return on engagement, never disabled (axis 2). */
.bn-focus-mode .signal-card-quotes .signal-quote-tag,
.bn-focus-mode .signal-card-quotes .intensity-dots {
    pointer-events: none;
}

/* ── Axis 2: engaged chrome returns to full presence ───────────────────── */

/* A hero whose working is open is engaged whether or not the pointer is on
   it — the researcher opened it, and the metrics beneath are never receded. */
.bn-focus-mode .signal-card:hover .signal-card-hero,
.bn-focus-mode .signal-card:focus-within .signal-card-hero,
.bn-focus-mode .signal-card-hero[aria-expanded="true"],
.bn-focus-mode .signal-card:hover .signal-card-alternates,
.bn-focus-mode .signal-card:focus-within .signal-card-alternates,
.bn-focus-mode .signal-card:hover .signal-card-footer,
.bn-focus-mode .signal-card:focus-within .signal-card-footer,
.bn-focus-mode .signal-card:hover .signal-quote-tag,
.bn-focus-mode .signal-card:focus-within .signal-quote-tag,
.bn-focus-mode .signal-card:hover .intensity-dots,
.bn-focus-mode .signal-card:focus-within .intensity-dots,
.bn-focus-mode .signal-card:hover .signal-card-quotes blockquote .timecode,
.bn-focus-mode .signal-card:focus-within .signal-card-quotes blockquote .timecode,
.bn-focus-mode .signal-card:hover .signal-card-location,
.bn-focus-mode .signal-card:focus-within .signal-card-location,
.bn-focus-mode .signal-card:hover .signal-elaboration,
.bn-focus-mode .signal-card:focus-within .signal-elaboration,
.bn-focus-mode .signals-center > .section-heading:hover,
.bn-focus-mode .signals-center > .section-heading:focus-within {
    opacity: 1;
}

.bn-focus-mode .signal-card:hover .signal-quote-tag,
.bn-focus-mode .signal-card:focus-within .signal-quote-tag,
.bn-focus-mode .signal-card:hover .intensity-dots,
.bn-focus-mode .signal-card:focus-within .intensity-dots {
    pointer-events: auto;
}

/* Engagement restores the ORDINARY reading, and 0.6 is the ordinary reading
   for a continuation timecode. That number is the sequence treatment's own
   (organisms/signals.css), not a Focus value — it stays a literal there and
   is quoted here. */
.bn-focus-mode .signal-card:hover .signal-card-quotes blockquote.seq-middle .timecode,
.bn-focus-mode .signal-card:hover .signal-card-quotes blockquote.seq-last .timecode,
.bn-focus-mode .signal-card:focus-within .signal-card-quotes blockquote.seq-middle .timecode,
.bn-focus-mode .signal-card:focus-within .signal-card-quotes blockquote.seq-last .timecode {
    opacity: 0.6;
}

/* ── Print — Focus is a reading state, not a property of the artefact ──── */

/* A printout is a deliverable someone else reads. Faded tags and ghosted
   timecodes on paper are a defect, not a mode — so print always gets the full
   report, whatever the screen is doing. Same reasoning as print.css forcing
   the light colour-scheme. */
@media print {
    .bn-focus-mode .quote-card .badges,
    .bn-focus-mode blockquote .timecode,
    .bn-focus-mode blockquote .context,
    .bn-focus-mode .bn-group-header,
    .bn-focus-mode .description {
        opacity: 1;
    }

    .bn-focus-mode .quote-card .badges {
        pointer-events: auto;
    }

    .bn-focus-mode blockquote.quote-card:not(.bn-selected):not(.bn-focused) {
        background: var(--bn-colour-quote-bg);
    }

    /* On paper a starred quote keeps its marked edge, so the border restore
       must exclude `.starred` explicitly.

       An earlier comment here claimed `.quote-card.starred`
       (molecules/quote-actions.css) was "more specific and wins". It isn't:
       that selector is (0,2,0) and this one is (0,4,1) — four classes plus an
       element. The restore was silently overriding --bn-colour-starred with
       --bn-colour-border, so printing from Focus Mode stripped the starred
       edge: the exact opposite of the stated intent, in the one output nobody
       re-reads before sending. Count specificity, don't assert it. */
    .bn-focus-mode blockquote.quote-card:not(.bn-selected):not(.bn-focused):not(.starred) {
        border-left-color: var(--bn-colour-border);
    }

    /* The Signals lens, same reasoning. */
    .bn-focus-mode .signals-center > .section-heading,
    .bn-focus-mode .signal-card-location,
    .bn-focus-mode .signal-elaboration,
    .bn-focus-mode .signal-card-hero,
    .bn-focus-mode .signal-card-alternates,
    .bn-focus-mode .signal-card-footer,
    .bn-focus-mode .signal-card-quotes .signal-quote-tag,
    .bn-focus-mode .signal-card-quotes .intensity-dots,
    .bn-focus-mode .signal-card-quotes blockquote .timecode {
        opacity: 1;
    }

    .bn-focus-mode .signal-card-quotes .signal-quote-tag,
    .bn-focus-mode .signal-card-quotes .intensity-dots {
        pointer-events: auto;
    }

    .bn-focus-mode .signal-card:not(.bn-selected) {
        background: var(--bn-colour-bg);
        border-color: var(--bn-colour-border);
    }

    .bn-focus-mode .signal-card:not(.bn-selected) .signal-card-quotes {
        background: var(--bn-colour-quote-bg);
    }
}

/* ── Reduce Motion — snap, don't fade ──────────────────────────────────── */

@media (prefers-reduced-motion: reduce) {
    .bn-focus-ready blockquote.quote-card,
    .bn-focus-ready .quote-card .badges,
    .bn-focus-ready blockquote .timecode,
    .bn-focus-ready blockquote .context,
    .bn-focus-ready .bn-group-header,
    .bn-focus-ready .description,
    .bn-focus-ready .signal-card,
    .bn-focus-ready .signal-card-quotes,
    .bn-focus-ready .signals-center > .section-heading,
    .bn-focus-ready .signal-card-location,
    .bn-focus-ready .signal-elaboration,
    .bn-focus-ready .signal-card-hero,
    .bn-focus-ready .signal-card-alternates,
    .bn-focus-ready .signal-card-footer,
    .bn-focus-ready .signal-card-quotes .signal-quote-tag,
    .bn-focus-ready .signal-card-quotes .intensity-dots,
    .bn-focus-ready .signal-card-quotes blockquote .timecode {
        transition-duration: 0s;
    }
}

/* --- molecules/transcript-annotations.css --- */
/* Molecule: transcript-annotations — right-margin annotations on transcript pages.
   Shows section/theme labels and tag badges alongside quoted segments.

   Layout: the annotation lives in a real grid column (the 4th track of
   .transcript-body, added at the breakpoint in templates/transcript.css) — NOT
   absolutely positioned. Being in flow means a tall annotation grows its grid
   row, pushing the next segment down instead of overlapping it. Below the
   breakpoint it drops inline under the segment text. Repetition is suppressed
   in TranscriptPage (first-occurrence-per-run), which is what replaced the
   earlier vertical extent bars. */

.transcript-segment {
    position: relative;
}

/* Right-margin annotation container */
.segment-margin {
    font-size: var(--bn-text-caption);
    line-height: var(--bn-text-caption-lh);
    display: flex;
    flex-direction: column;
    gap: var(--bn-space-xs);
}

/* Wide + medium (≥800px): the annotation is the 4th grid column. Its height
   grows the row → no overlap between adjacent annotations. */
@media (min-width: 800px) {
    .segment-margin {
        grid-column: 4;
        align-self: start;
    }
}

/* Narrow (<800px): inline below the segment text, aligned with the body column */
@media (max-width: 799px) {
    .segment-margin {
        grid-column: 3 / -1;
        align-self: start;
        margin: var(--bn-space-xs) 0 var(--bn-space-sm);
    }
}

/* Individual annotation block (one per quote in this segment) */
.margin-annotation {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

/* Section/theme label — wraps in the narrow column (no ellipsis truncation) */
.margin-label {
    color: var(--bn-colour-accent);
    font-weight: var(--bn-weight-emphasis);
    text-decoration: none;
    max-width: 100%;
    transition: color var(--bn-transition-fast);
}

.margin-label:hover {
    color: var(--bn-colour-text);
}

/* Tag badges row in margin */
.margin-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    overflow: visible; /* allow delete × circles to protrude */
    padding-top: 2px;  /* room for × circle above badges */
    padding-right: 2px; /* room for × circle to the right */
}

/* Margin tags match the quotes + codebook lenses (--bn-text-badge, 11px);
   only the padding is tightened for the dense margin context. */
.margin-tags .badge {
    padding: 1px 4px;
    line-height: 1.4;
}

/* --- templates/transcript.css --- */
/* Template: transcript — per-participant transcript page layout */

.transcript-meta {
    color: var(--bn-colour-muted);
    font-size: var(--bn-text-label);
    margin-bottom: var(--bn-space-md);
}

/* ── Sticky journey header ────────────────────────────────────────────── */

.bn-transcript-journey-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bn-colour-bg);
    box-shadow: 0 4px 12px var(--bn-colour-shadow);
    padding: var(--bn-space-xs) var(--bn-space-md) var(--bn-space-xs) 0;
    display: flex;
    align-items: center;
    gap: var(--bn-space-md);
}

/* Participant badges — the persistent "who is p2" answer. Never shrink; the
   journey chain absorbs the squeeze (it already scrolls with edge fades). */
.bn-transcript-journey-header__people {
    display: flex;
    align-items: center;
    gap: var(--bn-space-sm);
    flex-shrink: 0;
}

/* Journey chain: horizontal scroll mode on transcript pages */
.bn-session-journey--overflow {
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    -ms-overflow-style: none;
    flex: 1;
    min-width: 0;
}

.bn-session-journey--overflow::-webkit-scrollbar {
    display: none;
}

/* Fade masks for overflow edges */
.bn-journey--fade-right {
    mask-image: linear-gradient(to right, black 0, black calc(100% - 2rem), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, black 0, black calc(100% - 2rem), transparent 100%);
}

.bn-journey--fade-left {
    mask-image: linear-gradient(to right, transparent 0, black 2rem, black 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0, black 2rem, black 100%);
}

.bn-journey--fade-both {
    mask-image: linear-gradient(to right, transparent 0, black 2rem, black calc(100% - 2rem), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0, black 2rem, black calc(100% - 2rem), transparent 100%);
}

/* ── Journey chain or session timeline (docs/mockups/transcript-timeline-toggle.html) ──
   The header row is a size container, so the split control can drop its label when the row is
   narrow however wide the window is (the sidebars take their share first). */
.bn-transcript-journey-header { container: bn-journey-header / inline-size; }

/* The split control (islands/transcript/TimelineSplit.tsx): the house segmented control
   (.dimension-toggle + .dimension-btn, organisms/inspector.css) with two segments, inside the
   Export menu's positioning wrapper — the toggle clips its children, so the menu is its sibling.
   Pressed is .dimension-btn.active as shipped; only the icon turns accent. */
.bn-timeline-split { flex-shrink: 0; margin-left: auto; position: relative; }
.bn-timeline-split .dimension-toggle { vertical-align: middle; }
.bn-timeline-split .dimension-btn { display: inline-flex; align-items: center; gap: var(--bn-space-sm); }
.bn-timeline-split .dimension-btn .bn-icon { width: 14px; height: 14px; }
.bn-timeline-split .dimension-btn.active .bn-icon { color: var(--bn-colour-accent); }
.bn-timeline-split__more { padding-inline: var(--bn-space-sm); }
.bn-timeline-split__more .bn-icon { width: 11px; height: 11px; }
.bn-timeline-split__more[aria-expanded="true"] { background: var(--bn-colour-hover); color: var(--bn-colour-text); }
/* A narrow row keeps the icon; the button's name and tooltip carry the word. */
@container bn-journey-header (max-width: 720px) {
    .bn-timeline-split__label { display: none; }
}
/* The menu: the Export menu's classes, with a muted trailing hint where a Mac menu puts its key
   equivalent. */
/* Wider than the Export menu's 14rem: the hints ride on the same line. */
.bn-timeline-split .export-dropdown-menu { min-width: 19rem; }
.bn-timeline-menu-hint {
    margin-left: auto;
    padding-left: var(--bn-space-lg);
    font-size: var(--bn-text-caption);
    color: var(--bn-colour-muted);
}

/* The timeline on: the row wraps, the chain gives up its place, and the timeline takes a
   full-width second line of the same sticky header. */
.bn-transcript-journey-header--timeline { flex-wrap: wrap; row-gap: 0; }
.bn-transcript-journey-header--timeline .bn-session-journey { display: none; }
.bn-transcript-timeline { flex: 1 0 100%; min-width: 0; }
/* A window too short to read under a stuck timeline (a small window, or the page zoomed to
   200–400%: WCAG 1.4.10): the header scrolls with the page instead of staying over it. */
@media (max-height: 30rem) {
    .bn-transcript-journey-header--timeline { position: static; }
}

@media print {
    .bn-timeline-split { display: none; }
}

/* Selector — reusable dropdown primitive (bn-selector) */
.bn-selector {
    position: relative;
    flex-shrink: 0;
}

.bn-selector__trigger {
    all: unset;
    font: inherit;
    font-size: var(--bn-text-label);
    font-weight: 600;
    color: inherit;
    cursor: pointer;
    white-space: nowrap;
    padding: 0;
    border: none;
    border-radius: 0;
    display: flex;
    align-items: center;
    gap: 0.3rem;
}

.bn-selector__trigger:hover {
    color: var(--bn-colour-accent);
}

.bn-selector__trigger:focus-visible {
    outline: 2px solid var(--bn-colour-accent);
    outline-offset: 2px;
}

.bn-selector__caret {
    font-size: var(--bn-text-badge);
    opacity: 0.6;
}

.bn-selector__menu {
    position: absolute;
    top: calc(100% + 4px);
    left: -0.75rem;  /* outdent by item padding so menu text aligns with trigger */
    z-index: 20;
    background: var(--bn-colour-bg);
    border: 1px solid var(--bn-colour-border);
    border-radius: var(--bn-radius-sm);
    box-shadow: 0 4px 12px rgb(0 0 0 / 0.12);
    list-style: none;
    margin: 0;
    padding: 0.25rem 0;
    max-height: 20rem;
    overflow-y: auto;
}

.bn-selector__item {
    all: unset;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.75rem;
    color: inherit;
    text-decoration: none;
    font-size: var(--bn-text-label);
    line-height: var(--bn-text-label-lh);
    cursor: pointer;
    white-space: nowrap;
    box-sizing: border-box;
}

.bn-selector__item:hover {
    background: var(--bn-colour-hover, #f0f0f0);
}

.bn-selector__item--active {
    color: var(--bn-colour-accent);
}

/* Session-specific: secondary detail line (date) */
.bn-selector__detail {
    font-size: var(--bn-text-caption);
    font-weight: 400;
    color: var(--bn-colour-muted);
}

/* Plain session label when there is only one session (no dropdown) */
.bn-session-selector__label {
    font-size: var(--bn-text-label);
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
}

/* Segments need scroll-margin to not hide behind sticky header. The body sits inside the gutter's
   sheet since 3baf841f (17 Oct 2026), so the sibling is the sheet, not the body: the old
   `~ .transcript-body` matched nothing, and a journey-chain click landed under the header. */
.bn-transcript-journey-header ~ :is(.transcript-body, .bn-transcript-sheet) .transcript-segment[id] {
    scroll-margin-top: var(--bn-journey-header-height, 3rem);
}

/* ── Session roles (moderator/observer line) ────────────────────────── */

.bn-transcript-roles {
    color: var(--bn-colour-muted);
    font-size: var(--bn-text-label);
    margin: var(--bn-space-lg) 0 0;
    line-height: 1.5;
}

.bn-transcript-roles__person {
    white-space: nowrap;
}

.bn-transcript-roles__name {
    margin-left: 0.25rem;
}

/* ── Transcript body ─────────────────────────────────────────────────── */

.transcript-body {
    margin-top: var(--bn-space-lg);
    position: relative;
    display: grid;
    /* Timecode: ~4.5rem for [HH:MM:SS] in monospace.
       Badge: right-aligned in a 2.2rem slot (fits p1–p99, m1–m99).
       Body: remaining space for text. */
    grid-template-columns: 4.5rem 2.2rem 1fr;
    gap: 0 0.5rem;
}

/* At the annotation breakpoint (see molecules/transcript-annotations.css) the
   body gains a 4th column for margin annotations. clamp() narrows it as the
   window narrows, so section/theme labels wrap at medium widths and fit at wide. */
@media (min-width: 800px) {
    .transcript-body {
        grid-template-columns: 4.5rem 2.2rem 1fr clamp(8.5rem, 13vw, 12.5rem);
    }
}

/* SPECIAL CASE — do NOT normalise this to a leading token.
   The 1.7 here is STRUCTURAL, not typographic. This row is a baseline-aligned
   grid (`align-items: baseline`), and the 1.7 sets the rhythm the timecode and
   speaker-badge columns align to; `.segment-body` inside deliberately resets to
   the prose token for the text itself. Pull this onto --bn-text-*-lh and the
   timecode stops sitting on the first line of its segment.
   It is also the largest leading in the theme, which makes it the most obvious
   target for a normalising sweep — hence this comment. Any change here wants
   the transcript page open beside it.
   See docs/design-native-typography-grid.md § Leading. */
.transcript-segment {
    display: grid;
    grid-template-columns: subgrid;
    grid-column: 1 / -1;
    align-items: baseline;
    margin: 0.5rem 0;
    line-height: 1.7;
}

.transcript-segment .timecode {
    white-space: nowrap;
    justify-self: start;
}

/* The timecode's non-editable island is the grid item now; it sits as the
   timecode did. */
.transcript-segment .segment-timecode-cell {
    white-space: nowrap;
    justify-self: start;
}

.transcript-segment .segment-body {
    min-width: 0;
    font-size: var(--bn-text-body);
    line-height: var(--bn-text-body-lh);
}

.transcript-segment .segment-speaker {
    white-space: nowrap;
    justify-self: end;
}

/* A paragraph that begins a sentence draws its first letter as a capital
   (design-transcript-editing.md, option C): display only, and it follows the
   paragraph's lang, so Turkish i becomes İ. Scripts without case are untouched. */
.transcript-segment .segment-body.bn-sentence-start::first-letter {
    text-transform: uppercase;
}

/* The transcript is one editable region (a caret for split and join); it
   draws no focus ring, as the paragraphs did not. */
.transcript-body[contenteditable="true"]:focus {
    outline: none;
}

/* Someone spoke and nothing usable was heard: an annotation, not words. Drawn
   like the timecode, never like speech, so it cannot read as something said. */
.segment-inaudible {
    color: var(--bn-colour-muted);
    font-style: italic;
    user-select: none;
}

.segment-moderator .segment-body {
    color: var(--bn-colour-muted);
}

.segment-moderator .segment-speaker .badge {
    opacity: 0.55;
}

/* Quoted segments — non-quoted participant text knocked back */
.transcript-segment:not(.segment-quoted):not(.segment-moderator) .segment-body {
    opacity: 0.6;
}

/* Inline citation highlight — wraps the verbatim excerpt within a segment.
   Currently invisible while we rethink the visual treatment; the <mark>
   elements and --bn-colour-cited-bg token are preserved so this can be
   re-enabled by restoring `background: var(--bn-colour-cited-bg)`. */
.bn-cited {
    background: transparent;
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
}

/* The paragraph a link landed on flashes (atoms/arrival.css); its corners
   round while it does. `[data-arrived]` in the app, `.anchor-highlight` from
   the sealed static render's transcript-names.js. */
.transcript-segment[data-arrived],
.transcript-segment.anchor-highlight {
    border-radius: var(--bn-radius-sm);
}

@media print {

    .star-btn { display: none; }

    .hide-btn { display: none; }
    .bn-hidden-badge { display: none; }
    .badge-add { display: none; }
    .badge-restore { display: none; }
    .tag-input-wrap { display: none; }
    .tag-suggest { display: none; }

    .badge-ai::after, .badge-ai-delete { display: none; }

    .footer-logo-picture { display: none; }
    .bn-timecode-glow { box-shadow: none; border-left-color: inherit; animation: none; }

    /* The keyboard cursor is a screen affordance. Its dark-mode accent ring

       it now applies in ordinary reading too — not just Focus Mode — so the

    blockquote.quote-card.bn-focused { box-shadow: none; }

/* --- templates/export.css --- */
/* ==========================================================================
   Export mode — read-only overrides
   ==========================================================================
   Applied when <body class="bn-export-mode">.  Hides all mutation
   affordances so the exported report looks like a finished document,
   not an editing environment.
   ========================================================================== */

/* --- Quote card actions (star, hide, undo, add-tag, restore) --- */
.bn-export-mode .star-btn,
.bn-export-mode .hide-btn,
.bn-export-mode .undo-btn,
.bn-export-mode .badge-add,
.bn-export-mode .badge-restore,
.bn-export-mode .moderator-pill {
  display: none !important;
}

/* --- Badge delete/accept/deny buttons (keep badges, hide controls) ---
   The accept/deny compartments live inside .badge-action-pill and are named
   .badge-action-accept / .badge-action-deny (the pill replaced the old inline
   ✓/✗ — see docs/design-badge-action-pill.md). This rule named the pre-pill
   .badge-accept / .badge-deny for a while and so matched nothing; hide the
   container, which covers both compartments however they are named inside. */
.bn-export-mode .badge-delete,
.bn-export-mode .badge-ai-delete,
.bn-export-mode .badge-action-pill {
  display: none !important;
}

/* --- Pencil edit icons (headings, names) --- */
.bn-export-mode .edit-pencil,
.bn-export-mode .edit-pencil-inline,
.bn-export-mode .bn-name-pencil {
  display: none !important;
}

.bn-export-mode .editable-text,
.bn-export-mode .bn-speaker-editable-name {
  cursor: default !important;
}

/* --- Tag input ("+ tag" links in codebook and quotes) ---
   .tag-input-wrap is the container TagInput renders (input + ghost layer +
   sizer); hiding it covers the whole widget however its innards are named.
   .tag-add-row is the codebook group's "+ tag" row — it is NOT gated by
   isReadOnly in CodebookPanel, so this rule is the only thing hiding it. */
.bn-export-mode .tag-input-wrap,
.bn-export-mode .tag-add-row {
  display: none !important;
}

/* --- Hidden-quote counter (unhide controls) ---
   Counter renders .bn-hidden-badge, not .bn-counter (that name survives only as
   a data-testid).  Hide the badge and the whole dropdown goes with it. */
.bn-export-mode .bn-hidden-badge {
  display: none !important;

/* --- Codebook mutation controls ---
   `.codebook-picker-btn` (the browse-header button) and `.autocode-btn` were

   gated in JSX by `isExportMode()` rather than hidden by CSS — which is the
   mechanism this file's own failure message prefers, since a JSX gate cannot
   go stale the way a selector can. The two remaining rules still match live
   controls in the shipped lens. */
.bn-export-mode .new-group-placeholder,
.bn-export-mode .framework-remove-btn {
  display: none !important;
}

/* --- Codebook drag handles --- */
.bn-export-mode [draggable="true"] {
  cursor: default !important;
  -webkit-user-drag: none;
}

/* --- Language picker ---
   The export carries only the chosen language and its fallback chain (since
   23 Aug 2026), so a picker offering 22 would offer 21 that resolve to English.
   Gated in JSX too — SettingsModal and SettingsPanel both check isExportMode()

.bn-export-mode .bn-locale-group {
  display: none !important;
}

/* --- Export button itself ---
   No rule needed: ExportDropdown returns null under isExportMode(), so the

/* ════ page chrome (mk-), not product ════ */
body { margin: 0; background: var(--bn-colour-bg); color: var(--bn-colour-text); }
.quote-group .quote-card { content-visibility: visible; }
.mk-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
    padding: 10px 16px;
    font: var(--bn-text-label)/1.4 var(--bn-font-body);
    background: var(--bn-colour-inspector-bg, var(--bn-colour-hover));
    border-bottom: 1px solid var(--bn-colour-border);
}
.mk-bar label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.mk-built, .mk-num { color: var(--bn-colour-muted); font-family: var(--bn-font-mono); font-size: var(--bn-text-caption); }
.mk-label { color: var(--bn-colour-muted); }
.mk-sep { width: 1px; height: 18px; background: var(--bn-colour-border); }
.mk-key { margin: 12px 16px 0; font: var(--bn-text-caption)/1.4 var(--bn-font-body); color: var(--bn-colour-muted); }
.mk-key-artefact, .mk-key-comment {
    font-family: var(--bn-font-mono); padding: 1px 6px; border-radius: 3px; margin-right: 4px;
    border: 1px solid var(--bn-colour-border);
}
.mk-key-comment {
    border: 4px solid transparent; border-left: 2px solid var(--bn-colour-muted);
    background: linear-gradient(var(--bn-colour-bg), var(--bn-colour-bg)) padding-box,
        repeating-linear-gradient(135deg, var(--bn-colour-border) 0 3px, transparent 3px 6px) border-box;
}
.mk-cols { display: flex; flex-wrap: wrap; gap: 24px; padding: 16px; align-items: flex-start; }
.mk-col { flex: 1 1 560px; min-width: 0; }
.mk-frame { border: 1px solid var(--bn-colour-border); border-radius: 8px; overflow: hidden; }
.mk-frame-bar {
    font: var(--bn-text-caption)/1 var(--bn-font-mono); color: var(--bn-colour-muted);
    padding: 7px 10px; border-bottom: 1px solid var(--bn-colour-border); background: var(--bn-colour-hover);
}
.mk-stage { padding: 8px 24px 24px; overflow-x: auto; }
.mk-stage .quote-group { display: grid; grid-template-columns: minmax(0, 1fr); }
.mk-comment {
    margin-top: 16px; padding: 4px 16px 12px;
    font: var(--bn-text-label)/1.45 var(--bn-font-body);
    border: 7px solid transparent; border-left: 3px solid var(--bn-colour-muted);
    background: linear-gradient(var(--bn-colour-bg), var(--bn-colour-bg)) padding-box,
        repeating-linear-gradient(135deg, var(--bn-colour-border) 0 5px, transparent 5px 10px) border-box;
}
.mk-comment h3 { font-size: var(--bn-text-label); font-weight: var(--bn-weight-emphasis); margin: 12px 0 6px; }
.mk-log { list-style: none; margin: 0; padding: 0; font-family: var(--bn-font-mono); font-size: var(--bn-text-caption); min-height: 9em; }
.mk-log li { padding: 1px 0; }
.mk-log-key { color: var(--bn-colour-muted); }
.mk-log-write { color: var(--bn-colour-accent); }
.mk-log-empty { color: var(--bn-colour-muted); font-family: var(--bn-font-body); }
.mk-rows { border-collapse: collapse; width: 100%; }
.mk-rows th, .mk-rows td { text-align: left; vertical-align: top; padding: 5px 8px; border-top: 1px solid var(--bn-colour-border); }
.mk-rows th[scope="row"] { width: 34%; font-weight: var(--bn-weight-normal); }
.mk-rows-group th { padding-top: 14px; border-top: none; color: var(--bn-colour-muted); font-weight: var(--bn-weight-emphasis); }
.mk-rows kbd { font-family: var(--bn-font-mono); font-size: var(--bn-text-caption); }
.mk-rows tr.mk-diff td, .mk-rows tr.mk-diff th[scope="row"] { background: color-mix(in srgb, var(--bn-colour-highlight) 55%, transparent); }
.mk-rows tr.mk-same { color: var(--bn-colour-muted); }
.mk-tag {
    margin-left: 6px; font: var(--bn-text-micro)/1 var(--bn-font-mono); text-transform: uppercase;
    padding: 1px 4px; border-radius: 3px; border: 1px solid var(--bn-colour-border); color: var(--bn-colour-muted);
}
.mk-tag-open { border-color: var(--bn-colour-accent); color: var(--bn-colour-accent); }

</style>
