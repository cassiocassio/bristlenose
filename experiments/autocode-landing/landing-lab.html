/* Quote cards (stand-in) */
.qc { padding: 10px 12px 8px; border-bottom: 1px solid var(--bn-colour-border); }
.qc .meta { font-family: var(--bn-font-mono); font-size: 11px; color: var(--bn-colour-accent); display: flex; gap: 8px; }
.qc .meta .sp { color: var(--bn-colour-muted); }
.qc .tx { font-size: 14px; line-height: 1.45; margin: 3px 0 4px; }
.qc .tags { display: flex; gap: 4px; flex-wrap: wrap; }
.reserve .qc .tags { min-height: 22px; }
.qc[data-hidden] { display: none; }
.newpill { position: sticky; top: 30px; z-index: 6; margin: 6px auto; display: block; width: max-content;
  background: var(--bn-colour-accent); color: #fff; border: 0; border-radius: 999px; padding: 3px 12px;
  font: inherit; font-size: 12px; cursor: pointer; }
.newpill[hidden] { display: none; }
.still .badge-proposed { animation: none !important; opacity: .72; }
.rm *, .rm *::before, .rm *::after { animation: none !important; transition: none !important; }

/* Histogram */
.hist { padding: 10px 12px 4px; }
.hplot { position: relative; height: 150px; display: grid; grid-template-columns: repeat(20, 1fr); gap: 1px;
  align-items: end; border-bottom: 1px solid var(--bn-colour-border); }
.bin { display: flex; flex-direction: column-reverse; justify-content: flex-start; height: 100%; }
.bin.sq { flex-wrap: wrap-reverse; flex-direction: row; align-content: flex-start; gap: 1px; justify-content: center; }
.seg { width: 100%; transition: height .4s ease; }
.seg.acc { background: oklch(62% 0.13 150); }
.seg.ten { background: oklch(78% 0.12 75); opacity: .55; }
.seg.exc { background: var(--bn-bar-none); }
.sqi { width: 7px; height: 7px; border-radius: 1px; }
.sqi.ten { opacity: .45; outline: 1px dashed currentColor; outline-offset: -1px; }
.sqi.exc { background: var(--bn-bar-none) !important; }
.line { position: absolute; top: -4px; bottom: 0; width: 2px; background: var(--bn-colour-accent); transition: left .5s ease; }
.line.lo { background: var(--bn-colour-muted); }
.hax { display: flex; justify-content: space-between; font-family: var(--bn-font-mono); font-size: 10px; color: var(--bn-colour-muted); padding-top: 2px; }
.hmeta { font-family: var(--bn-font-mono); font-size: 10.5px; color: var(--bn-colour-muted); margin: 4px 0 0; display: flex; gap: 12px; flex-wrap: wrap; }
.cbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; padding: 6px 8px 20px; }
.cbcard { border: 1px solid var(--bn-colour-border); border-radius: var(--bn-radius-md); padding: 4px 0 6px; }
.cbcard .tgrp { color: var(--bn-colour-text); }

/* chip inside the quotes pane (CLI surface) */
.lab-chipstack { position: sticky; bottom: 10px; display: flex; justify-content: flex-end; padding: 0 10px; pointer-events: none; }
.lab-chipstack[hidden] { display: none; }

/* timeline */
.tl { height: 190px; border-top: 1px solid var(--bn-colour-border); padding: 6px 12px; display: grid; grid-template-columns: 1fr 260px; gap: 12px; }
.tl canvas { width: 100%; height: 170px; display: block; }
.stats { font-family: var(--bn-font-mono); font-size: 11px; line-height: 1.55; color: var(--bn-colour-muted); }
.stats b { color: var(--bn-colour-text); font-weight: 600; }
</style>
</head>
<body>
<header class="top">
  <h1>AutoCode landing lab</h1>
  <button id="play" class="primary">▶ Play</button>
  <button id="restart">↺ Restart</button>
  <label>Speed <select id="speed"><option>1</option><option>2</option><option selected>4</option><option>8</option></select>×</label>
  <label>Preset <select id="preset">
    <option value="">—</option>
    <option value="today">Today: everything at the end</option>
    <option value="brief">The brief: per batch, predicted pace</option>
    <option value="rec">Small first batch, pace by queue</option>
  </select></label>
  <span id="clock">t = 0.0 s</span>
  <span id="studyinfo" style="color:var(--bn-colour-muted)"></span>
</header>
<div class="main">
  <aside class="knobs" id="knobs"></aside>
  <section class="stage">
    <div class="surfaces" id="surfaces">
      <div class="pane" id="sidebarPane">
        <div class="ph">Sidebar</div>
        <div class="macsb" id="macsb">
          <div class="prow"><div class="ico">❄</div><div><div class="t">Talismanic</div>
            <div class="sub" id="statusLine"></div></div></div>
        </div>
        <div id="tagSidebar"></div>
      </div>
      <div class="pane" id="quotesPane">
        <div class="ph">Quotes
          <select id="filter"><option value="">All quotes</option></select>
        </div>
        <button class="newpill" id="newpill" hidden></button>
        <div id="quotes"></div>
        <div class="lab-chipstack" id="chipstack" hidden></div>
      </div>
      <div class="pane" id="codebookPane">
        <div class="ph">Codebook</div>
        <div class="hist">
          <div class="hplot" id="hplot"></div>
          <div class="hax"><span>0.0</span><span>0.25</span><span>0.5</span><span>0.75</span><span>1.0</span></div>
          <div class="hmeta" id="hmeta"></div>
        </div>
        <div class="cbgrid" id="cbgrid"></div>
      </div>
    </div>
    <div class="tl">
      <canvas id="tl"></canvas>
      <div class="stats" id="stats"></div>
    </div>
  </section>
</div>
<script>
const D = {"framework": "uxr", "groups": [{"name": "Behaviour", "set": "ux"}, {"name": "Pain points", "set": "emo"}, {"name": "Needs and desires", "set": "emo"}, {"name": "Mental models", "set": "task"}, {"name": "Motivation", "set": "task"}, {"name": "Emotion and trust", "set": "trust"}, {"name": "Context", "set": "trust"}, {"name": "Learning", "set": "opp"}], "tags": [{"name": "workaround", "group": "Behaviour", "set": "ux", "idx": 0}, {"name": "habit", "group": "Behaviour", "set": "ux", "idx": 1}, {"name": "avoidance", "group": "Behaviour", "set": "ux", "idx": 2}, {"name": "say-do gap", "group": "Behaviour", "set": "ux", "idx": 3}, {"name": "error recovery", "group": "Behaviour", "set": "ux", "idx": 4}, {"name": "exploration", "group": "Behaviour", "set": "ux", "idx": 5}, {"name": "friction", "group": "Pain points", "set": "emo", "idx": 0}, {"name": "dead end", "group": "Pain points", "set": "emo", "idx": 1}, {"name": "abandonment", "group": "Pain points", "set": "emo", "idx": 2}, {"name": "lost my place", "group": "Pain points", "set": "emo", "idx": 3}, {"name": "unmet need", "group": "Needs and desires", "set": "emo", "idx": 0}, {"name": "feature request", "group": "Needs and desires", "set": "emo", "idx": 1}, {"name": "desire path", "group": "Needs and desires", "set": "emo", "idx": 2}, {"name": "expectation mismatch", "group": "Needs and desires", "set": "emo", "idx": 3}, {"name": "mental model", "group": "Mental models", "set": "task", "idx": 0}, {"name": "assumption", "group": "Mental models", "set": "task", "idx": 1}, {"name": "prior experience", "group": "Mental models", "set": "task", "idx": 2}, {"name": "misconception", "group": "Mental models", "set": "task", "idx": 3}, {"name": "goal", "group": "Motivation", "set": "task", "idx": 0}, {"name": "trigger", "group": "Motivation", "set": "task", "idx": 1}, {"name": "barrier", "group": "Motivation", "set": "task", "idx": 2}, {"name": "job-to-be-done", "group": "Motivation", "set": "task", "idx": 3}, {"name": "anxiety", "group": "Emotion and trust", "set": "trust", "idx": 0}, {"name": "trust", "group": "Emotion and trust", "set": "trust", "idx": 1}, {"name": "distrust", "group": "Emotion and trust", "set": "trust", "idx": 2}, {"name": "interruption", "group": "Context", "set": "trust", "idx": 0}, {"name": "time pressure", "group": "Context", "set": "trust", "idx": 1}, {"name": "social influence", "group": "Context", "set": "trust", "idx": 2}, {"name": "device/channel", "group": "Context", "set": "trust", "idx": 3}, {"name": "aha moment", "group": "Learning", "set": "opp", "idx": 0}, {"name": "learning curve", "group": "Learning", "set": "opp", "idx": 1}, {"name": "self-taught", "group": "Learning", "set": "opp", "idx": 2}, {"name": "expertise", "group": "Learning", "set": "opp", "idx": 3}, {"name": "first-time use", "group": "Learning", "set": "opp", "idx": 4}], "quotes": [{"id": 1, "s": "s1", "p": "p1", "tc": 55, "text": "... it\u2019s a good one. ... let\u2019s say I\u2019ve got a... was it a Ninja Foodie? It\u2019s... one of these all in one... pressure cookers, air fryers type thing. Is that the right thing?", "topic": "General context and warm-up"}, {"id": 2, "s": "s1", "p": "p1", "tc": 92, "text": "... I\u2019ve got... one of those old style crock pots that you use for fermentation.", "topic": "General context and warm-up"}, {"id": 3, "s": "s1", "p": "p1", "tc": 102, "text": "... you put the water in and it creates a seal. So it\u2019s... yeah, it\u2019s good because it\u2019s... it\u2019s a practical thing. But it\u2019s designed to... be emotive, I guess.", "topic": "General context and warm-up"}, {"id": 4, "s": "s1", "p": "p1", "tc": 119, "text": "... a lot of... household stuff... [is] quite utilitarian, which is very good. And this is... it looks like it\u2019s something from the past, but yet it\u2019s quite... modern, but it\u2019s got... basic... the design of it\u2019s good and it\u2019s got... so you put a little bit of water in it and it... so when it\u2019s fermenting, the gas can come out as well. So it\u2019s... a simple ingenious solution. Your alternatives, you just get... loads of plastic and you can get... these plastic lids that... burp things and stuff like that and... let the air out. But this is... somehow a classic design... it\u2019s a new technology. But yeah, so it looks good. It looks good and it\u2019s practical.", "topic": "General context and warm-up"}, {"id": 5, "s": "s1", "p": "p1", "tc": 183, "text": "... I think... buying something dedicated to ferment shows... that I\u2019m a bit of a cooking nerd, I guess, and I enjoy geeking out. But also... you get these... fancy... lids and stuff like that you can get for... existing stuff. But this is... it\u2019s like a... okay. It\u2019s a tried and tested solution. ... although I like tech stuff, it\u2019s... people have been using this technique for God knows how long.", "topic": "General context and warm-up"}, {"id": 6, "s": "s1", "p": "p1", "tc": 248, "text": "... we went recently... obviously it\u2019s... not just... recency... we actually went shopping for him [our child]. ... we had to get some... desk chair... because he\u2019s now spending a lot of time doing homework and stuff like that. So it\u2019s one of these things, it\u2019s almost a little bit of a rite of passage... we\u2019re shopping for him as well. And he has opinions now about... the... items in his... room and stuff like that. So it just felt... it\u2019s a different thing \u2014 we would have just gone and bought something, even if it was... for his room, we\u2019d have gone like, right, fine, this is what you want. But yeah, it\u2019s a different... experience than normal.", "topic": "IKEA general experience discussion"}, {"id": 7, "s": "s1", "p": "p1", "tc": 336, "text": "... I quite enjoy it... in a weird way because... I quite look forward to it... because in a weird way, I quite like building the furniture, like doing [something with] my hands. So... that\u2019s... a bit of like, cool, I\u2019m going to have something, get it home and... be able to put it together and feel like I\u2019ve achieved something.", "topic": "IKEA general experience discussion"}, {"id": 8, "s": "s1", "p": "p1", "tc": 360, "text": "... disappointment in a way as well sometimes. Because the rooms all look... the designs they... do look all really good. But when you get the thing home and put it in your own house, it somehow doesn\u2019t... tie together.", "topic": "IKEA general experience discussion"}, {"id": 9, "s": "s1", "p": "p1", "tc": 378, "text": "... I also... wonder that I\u2019m being lazy... And maybe there\u2019s got to be some other options out there. And we do obviously just not get... we\u2019ve got lots of stuff. I get lots of stuff, not from Ikea, but it is... pretty straightforward. But I also quite treat myself to [a] hot dog at the end as well.", "topic": "IKEA general experience discussion"}, {"id": 10, "s": "s1", "p": "p1", "tc": 451, "text": "... this is ikea.com. So this is interesting. This feels more like a corporate site than actually... it doesn\u2019t feel like a furniture [site].", "topic": "IKEA.com homepage first impressions"}, {"id": 11, "s": "s1", "p": "p1", "tc": 461, "text": "... I\u2019ve gone down here and there\u2019s... it... feels like furniture, but it... yeah, it\u2019s a corporate site. It\u2019s actually selling. So... I\u2019m initially obviously... drawn to the 'go shopping'. So I see that it feels like that\u2019s going to ikea.co.uk. So this feels like this is not the... I\u2019m not gonna be able to buy anything here. This is about Ikea itself.", "topic": "IKEA.com homepage first impressions"}, {"id": 12, "s": "s1", "p": "p1", "tc": 506, "text": "... I\u2019ve got here... these... categorizations... that I can go to, but it\u2019s... that\u2019s probably, to be honest, it\u2019s quite... busy. Maybe I\u2019m not sure if I... I assume I\u2019d be looking for... I wouldn\u2019t be coming to browse. I\u2019d probably have a specific... thing in mind... when I come to Ikea. So I\u2019d... probably... look straight for the search. ... because I find some of these taxonomies... maybe they would be helpful, but... maybe I\u2019d have to try the room seating.", "topic": "IKEA.co.uk homepage navigation"}, {"id": 13, "s": "s1", "p": "p1", "tc": 577, "text": "... the obvious thing to pick here is... kitchenware and tableware... [But] normally I would [search], but there I... saw that kitchen tableware. I mean... it\u2019s right there. If it would probably been to the right, I probably wouldn\u2019t have bothered, but you\u2019re right. I could have... searched for crock pot, but I\u2019m not going to get anything, am I? So I guess... I\u2019ve got food and stuff like that. And I guess this is the problem, isn\u2019t it? Because I\u2019m now searching for something specific [in] kitchenware.", "topic": "Kitchenware and tableware category browsing"}, {"id": 14, "s": "s1", "p": "p1", "tc": 637, "text": "This is where I\u2019m a bit tricky. Maybe it\u2019s food storage. There we go. So it\u2019s a jar and tin. ... maybe one of these... this is it. I need to get some of these jars and this is... there we go. So actually that\u2019s... so that\u2019s interesting because that\u2019s exactly what I want to do.", "topic": "Food storage jars product listing"}, {"id": 15, "s": "s1", "p": "p1", "tc": 667, "text": "Did you have a name for this? No, no. Right. No, I was just looking... I know that... I\u2019m just looking for this... jar because that\u2019s obviously what I would use.", "topic": "Food storage jars product listing"}, {"id": 16, "s": "s1", "p": "p1", "tc": 691, "text": "... I\u2019m assuming it\u2019s... Swedish. ... I\u2019m assuming [KORKEN] is... it feels like the [word for] China. I wonder if it\u2019s a slight play... on words in that... you... close this lid, right? It\u2019s like a bung of some description, a bit like a cork.", "topic": "Food storage jars product listing"}, {"id": 17, "s": "s1", "p": "p1", "tc": 742, "text": "... this is interesting. I\u2019ve got to buy... oh, you\u2019ve got to buy at least two. Fine. That\u2019s okay. ... that\u2019s interesting. I initially... got a bit confused there where it said 'add two items'. I\u2019m a bit like, what? There\u2019s no, I don\u2019t want to. Maybe I thought I\u2019d accidentally clicked it and then there\u2019s that little thing at the bottom. Fine. So it\u2019s add two items. ... a bunch of useful things.", "topic": "Product page and add to bag"}, {"id": 18, "s": "s1", "p": "p1", "tc": 770, "text": "It\u2019s trying to get me to add some other things that might work, that might go with this. So maybe I want some different jars... some details, some measuring cups, but I don\u2019t want to. So I want to go to my shopping bag.", "topic": "Cross-sell upsell modal"}, {"id": 19, "s": "s1", "p": "p1", "tc": 801, "text": "Yeah, I think so. I mean, because I think you\u2019ve got the concept of the IKEA shopping bag, haven\u2019t you? So that makes sense to me. When I\u2019m initially [saw] 'shopping bag', I thought of... how you go to... the marketplace and they give you... the blue bags. So that\u2019s what... so that made sense to me.", "topic": "Shopping bag and delivery options"}, {"id": 20, "s": "s1", "p": "p1", "tc": 820, "text": "... I think if it was a different... website, it probably would feel a bit weird because you\u2019re used to... a cart or something like that.", "topic": "Shopping bag and delivery options"}, {"id": 21, "s": "s1", "p": "p1", "tc": 840, "text": "... one thing I\u2019m interested in before I go to checkout. So here I can check delivery because what I\u2019m interested in doing is... how much is it going to cost? Because... it\u2019s only \u00a35. ... I\u2019ve got my options. It\u2019s going to cost me \u00a310 to deliver it. ... or I can click and collect. That\u2019s interesting. I hadn\u2019t thought that... [was] an option. ... That wasn\u2019t clear. That was an option. I thought I was just purely going for online.", "topic": "Shopping bag and delivery options"}, {"id": 22, "s": "s1", "p": "p1", "tc": 881, "text": "Oh, I\u2019ve got to... I\u2019ve misunderstood that. I\u2019ve got to spend \u00a310. I\u2019ve got to spend \u00a310 more... to actually be able to get this delivered. But that\u2019s... that confuses me then because... now it\u2019s here, it says it\u2019s a minimum. Oh no, I\u2019ve got to spend \u00a310 more. I\u2019ve already got \u00a35. ... and it says it here. I hadn\u2019t even missed that, but then I\u2019m finding... I\u2019m getting a bit confused now because I can click 'continue to checkout'. So I don\u2019t know what would happen if I do that, because that doesn\u2019t make sense because I don\u2019t know what\u2019s going to happen. I mean, I can add more of these.", "topic": "Shopping bag and delivery options"}, {"id": 23, "s": "s1", "p": "p1", "tc": 932, "text": "Yeah. I find that quite confusing. So I\u2019ve got to get four.", "topic": "Checkout flow and delivery selection"}, {"id": 24, "s": "s1", "p": "p1", "tc": 941, "text": "... that\u2019s fine. They\u2019re useful... So now I can continue to checkout... join or log in. ... I probably wouldn\u2019t [log in] because unless this was going to be my second purchase or something like that, I\u2019ll just continue as a guest. Okay, so it\u2019s got my postcode already. Collect. I thought I wanted to get it delivered. Can I not get it delivered? I thought I had... oh, I\u2019ve got \u00a310. Let\u2019s get loads more of these, and it\u2019s \u00a350, so I\u2019m getting confused.", "topic": "Checkout flow and delivery selection"}, {"id": 25, "s": "s1", "p": "p1", "tc": 991, "text": "Cool. Now I can continue as guest. Now I should have the option to deliver. ... I don\u2019t want it obviously expressed, so let\u2019s get [standard] selected.", "topic": "Checkout flow and delivery selection"}, {"id": 26, "s": "s1", "p": "p1", "tc": 1008, "text": "Day. Oh, yeah. Thursday the 14th. Okay. I mean, that\u2019s fine. ... and then click continue.", "topic": "Checkout flow and delivery selection"}, {"id": 27, "s": "s1", "p": "p1", "tc": 1044, "text": "... I found... the minimum order things slightly confusing. ... I think they could have... been a bit more explicit about... or even... said 'add more of these' or something. ... just... been a bit more helpful because I got a bit... yeah... I... got confused between... \u00a310 and \u00a315 and stuff. ... I think they\u2019re trying to be helpful by saying 'add \u00a310 more', but then I\u2019m just saying that you don\u2019t want to add \u00a310 more. I\u2019ve got to spend \u00a310... more than \u00a315. So... some of that stuff up front [would help].", "topic": "Overall experience reflection"}, {"id": 28, "s": "s2", "p": "p2", "tc": 39, "text": "It\u2019s an Alessi kettle. And... when I inherited the house, there was exactly the same kettle, but it was very, very old. My dad had found it in the market. And over the years, it was heavily grimed. The lid has... melted. The little bird that goes in the stopper, the whistle had also melted and it was just generally in a really terrible condition.", "topic": "Favourite household object discussion"}, {"id": 29, "s": "s2", "p": "p2", "tc": 69, "text": "And so for my birthday, my husband bought me an identical one. And yeah, it\u2019s just really nice to have that kind of continuity, even though obviously my father would be appalled at paying this price for it. And I love the kettle, but it doesn\u2019t whistle. And I\u2019m not sure why. I don\u2019t know whether it\u2019s because the whistle hasn\u2019t been milled correctly, or whether there isn\u2019t quite an airtight seal in the manufacturing of the lid and spout. I don\u2019t know, the lid, I guess. Yeah. But I love the kettle anyway.", "topic": "Favourite household object discussion"}, {"id": 30, "s": "s2", "p": "p2", "tc": 149, "text": "Yeah, I mean, I hate things that are ugly, but functional, even though it annoys me, because obviously, if they work really well, but they\u2019re ugly, that just... annoys me, because I want things that I use to be beautiful, but if the thing is beautiful, but doesn\u2019t function, that\u2019s equally annoying. So there\u2019s some kind of balance between those things. And I don\u2019t think one should have to sacrifice one for the other. But so often, it is the case. I mean, much as I love the kettle, the handle does get hot. This is a kettle that goes on the hob. And it\u2019s maybe resin or some kind of plastic material. But... you can\u2019t just pick [up] a little bit of a kettle.", "topic": "Favourite household object discussion"}, {"id": 31, "s": "s2", "p": "p2", "tc": 204, "text": "I mean, come on guys, this is a bit stupid. ... It\u2019s a kettle, right? ... You need to be able to pour it. And we talked about the whistle not working. So... the whistle is so beautiful, ... it\u2019s this little bird. So I want it to both be delightful and elegant or beautiful and fully functional, really functional.", "topic": "Favourite household object discussion"}, {"id": 32, "s": "s2", "p": "p2", "tc": 235, "text": "In the full sense of thinking about all the ways that people have to use it.", "topic": "Favourite household object discussion"}, {"id": 33, "s": "s2", "p": "p2", "tc": 321, "text": "I went with my friend Bettina when we first had this place and we were coming out for the first summer. I went out beforehand with my friend to try and buy a mattress. And... because of the difficulty of... the access to the property, the mattress had to be a rolled mattress. And we did go to IKEA and look at mattresses. But they literally only had one. And I think... I\u2019m not even sure whether it was in stock or maybe I tried it and just didn\u2019t think it was very good.", "topic": "IKEA in-store visit recall"}, {"id": 34, "s": "s2", "p": "p2", "tc": 394, "text": "Yeah. I mean, the car parking is pretty straightforward there in front of the store. But weirdly, when you go in, you\u2019re... in the food area. Well, the food area is on one side of you, which is basically the end point of the visit. And then in front of you, there\u2019s a staircase and you... I think you can either go straight and you get into all of the different areas of room types... kitchens or bedrooms or whatever, or you can go down the stairs into the marketplace where there are all the little bits of things. Obviously we wanted to look at the beds and we went straight... into [that area] to try and find [it]. But of course, because it\u2019s IKEA, you have to go all the way around the houses through all the different areas till you get to the bed bit.", "topic": "IKEA in-store visit recall"}, {"id": 35, "s": "s2", "p": "p2", "tc": 478, "text": "I mean, before you go, you... have this feeling of, wow, maybe I\u2019ll find something that\u2019s just... incredibly well designed... but cheap... within my price point... something a bit wacky, because sometimes they do... wacky things.", "topic": "IKEA in-store visit recall"}, {"id": 36, "s": "s2", "p": "p2", "tc": 518, "text": "Well, it\u2019s the... excitement because it\u2019s... could be transformative.", "topic": "IKEA in-store visit recall"}, {"id": 37, "s": "s2", "p": "p2", "tc": 536, "text": "Well, within about the first minute, I\u2019m visually exhausted, because there\u2019s just so much going on, there\u2019s so many people, everyone\u2019s funneling through these spaces. There\u2019s too much to look at. I\u2019m distracted by all of the stuff. I sometimes forget why I even came... or what the problem that I\u2019m trying to solve or the product that I\u2019m looking for. And I just go into... overwhelm.", "topic": "IKEA in-store visit recall"}, {"id": 38, "s": "s2", "p": "p2", "tc": 1157, "text": "Well, I can see the different sections across... this band across the top quite easily \u2014 that makes it easier to select stuff. I\u2019m... interested both in the bed linen... that\u2019s... right there because that\u2019s something I\u2019ve been looking at at the minute. I mean, it looks like an IKEA website.", "topic": "IKEA website homepage first impressions"}, {"id": 39, "s": "s2", "p": "p2", "tc": 1205, "text": "Yeah. Usually I\u2019m looking for something very specific.", "topic": "IKEA website homepage first impressions"}, {"id": 40, "s": "s2", "p": "p2", "tc": 1221, "text": "Wait a minute, that didn\u2019t take me to bed linen. Okay. I thought it was about bed linen, but it\u2019s just what\u2019s new. So I clicked on here where the bed linen, where you can see the bed, and it said new. So the middle tile, discover our latest news for your home, which is actually a bit weird. And I just thought, oh, it\u2019s about bed linen.", "topic": "IKEA site navigation and search"}, {"id": 41, "s": "s2", "p": "p2", "tc": 1258, "text": "Discover our latest news \u2014 news for your home. News is current affairs. If it said new things, that\u2019d be different. But that language is very odd. Discover new things for your home. But our latest news, that doesn\u2019t make any sense.", "topic": "IKEA site navigation and search"}, {"id": 42, "s": "s2", "p": "p2", "tc": 1280, "text": "Anyway, so it took me to this page, which is all new things, shop news. That\u2019s right. So I\u2019m going to go to textiles, hoping that I might get bed linen.", "topic": "IKEA site navigation and search"}, {"id": 43, "s": "s2", "p": "p2", "tc": 1304, "text": "Okay. But I\u2019m looking specifically for pillowcases. ... I\u2019m gonna go down on this side. Okay. Cushions, six more. Okay. Oh, bedding. Bedding. There\u2019s also cushions and cushion covers.", "topic": "IKEA site navigation and search"}, {"id": 44, "s": "s2", "p": "p2", "tc": 1353, "text": "No, I usually search, but you asked me what was notable on the page, so I was telling you that, but normally, yes, I would use the search button.", "topic": "IKEA site navigation and search"}, {"id": 45, "s": "s2", "p": "p2", "tc": 1371, "text": "Kind of, but not pillowcases.", "topic": "IKEA site navigation and search"}, {"id": 46, "s": "s2", "p": "p2", "tc": 1375, "text": "There\u2019s not a category for that. So... I can go to the search bar. I don\u2019t feel like such a user. Pillowcases and then size. I\u2019ve got a very specific [size], that\u2019s what I want. They\u2019ve only got one in that size and it\u2019s white. How boring. Oh, it\u2019s not even 100% cotton. Okay. Well, that\u2019s not happening.", "topic": "IKEA site navigation and search"}, {"id": 47, "s": "s2", "p": "p2", "tc": 1402, "text": "Okay. What about in cushion covers? Go back to the cushion covers. Cushion[s] \u2014 17 of those. Shape, what about size? Square.", "topic": "IKEA site navigation and search"}, {"id": 48, "s": "s2", "p": "p2", "tc": 1453, "text": "I can\u2019t believe they\u2019ll have anything nice. Hmm, it doesn\u2019t look on the face of it like they have kettles. Coffee and tea, coffee makers, teapots. I don\u2019t think they sell electrical items. I wouldn\u2019t go to IKEA for a kettle. Go to John Lewis. Okay. I think it\u2019s a dead end here. ... A teapot, but not a kettle.", "topic": "Searching for a kettle on IKEA site"}, {"id": 49, "s": "s2", "p": "p2", "tc": 1520, "text": "Yeah, well, there\u2019s nothing here I really want to buy, but just to humour you, I will.", "topic": "Adding items to shopping bag"}, {"id": 50, "s": "s2", "p": "p2", "tc": 1527, "text": "Ugh, that\u2019s so ugly. Okay, let\u2019s go with this one. Okay, I\u2019m adding it to the basket. No, I don\u2019t want all those.", "topic": "Adding items to shopping bag"}, {"id": 51, "s": "s2", "p": "p2", "tc": 1540, "text": "It\u2019s just giving me a hundred other things, but it actually did remind me that I did want tea towels. So let\u2019s see if they have any. Hmm. I\u2019m not sure I should allow the user to do such scope creep.", "topic": "Adding items to shopping bag"}, {"id": 52, "s": "s2", "p": "p2", "tc": 1570, "text": "Clicking on add to shopping bag. Okay. So what\u2019s the information around that? ... Well, I can see that it\u2019s three pounds for a four pack. So price. I\u2019m assuming that I\u2019m going to get in the four pack... one of each colour. And I didn\u2019t check the material. It\u2019s cotton. That\u2019s okay. Then 100% cotton.", "topic": "Adding items to shopping bag"}, {"id": 53, "s": "s2", "p": "p2", "tc": 1605, "text": "... I mean the quality of it. Like that little thing that the dish drain[er had].", "topic": "Adding items to shopping bag"}, {"id": 54, "s": "s2", "p": "p2", "tc": 1627, "text": "I noticed that, yeah. Yeah, but maybe leafy green. Okay, so I\u2019ve got my tea towels, and I\u2019ve got my teapot, and I\u2019m at the checkout. Okay, now the thing I want to know now...", "topic": "Shopping bag and checkout page"}, {"id": 55, "s": "s2", "p": "p2", "tc": 1648, "text": "Okay. So the most important thing to me is how long is this going to take to arrive and how much will it cost? Because if the delivery costs too high, I\u2019m just not going to do it. I\u2019m going to go to the store. And if the... delivery is too long, it\u2019s going to take too long, I\u2019m also not going to do it. So... I can\u2019t [see it] \u2014 it\u2019s not telling me either of those key bits of information.", "topic": "Shopping bag and checkout page"}, {"id": 56, "s": "s2", "p": "p2", "tc": 1677, "text": "It says check delivery. Okay, so I can put my postcode in. ... So what does it say? It says I can have delivery if I spend \u00a35 more. It doesn\u2019t look like I can have click and collect. And collect near you. Again, I have to spend \u00a35 more. So... my order looks like it\u2019s too low for me to have delivery. Oh, yeah, look, requires a minimum order value of 15 pounds. Okay.", "topic": "Shopping bag and checkout page"}, {"id": 57, "s": "s2", "p": "p2", "tc": 1738, "text": "Depends. If there was something else that tangentially I might want, like the dish drainer.", "topic": "Shopping bag and checkout page"}, {"id": 58, "s": "s2", "p": "p2", "tc": 1813, "text": "That\u2019s... that\u2019s still what they want you to do. [They] want you to look at all these other things and feel inspired. Okay, how much have I got now? Okay, now I\u2019ve got enough for... Okay. So in the right hand side area, there\u2019s quite a few little details. Mostly I just saw the price and [I] continued to check out. And then I was looking back on the other side to see, ah, great. Okay. So now I can, wait a minute.", "topic": "Shopping bag and checkout page"}, {"id": 59, "s": "s2", "p": "p2", "tc": 1860, "text": "Click and collect at Belfast. Huh? Why, why, why would I want to collect in Belfast? Okay, collect... from \u00a32 and I can have delivery. That\u2019ll be... not too bad. But why would I, why has it chosen Belfast? That\u2019s so weird. Very random.", "topic": "Checkout delivery or collect selection"}, {"id": 60, "s": "s2", "p": "p2", "tc": 1891, "text": "Yeah, I think I would choose the delivery. Okay. What happened just there? I selected delivery. I put in my [postcode], it\u2019s checked my postcode. So then I\u2019m going to go to checkout. Hmm. Okay. Well, I do have a login. ... I can continue as a guest, but I have to fill everything out.", "topic": "Checkout delivery or collect selection"}, {"id": 61, "s": "s2", "p": "p2", "tc": 1931, "text": "I don\u2019t know why it says delivery or collect, because I\u2019ve already selected delivery. Ah. Delivery. Oh, dear.", "topic": "Checkout delivery or collect selection"}, {"id": 62, "s": "s2", "p": "p2", "tc": 1950, "text": "Well, how can I change my postcode? That\u2019s where I live. ... I think it\u2019s confused because it knows that I\u2019m in Spain.", "topic": "Checkout delivery or collect selection"}, {"id": 63, "s": "s2", "p": "p2", "tc": 1994, "text": "Well, look, most of all, I\u2019m just... completely baffled by why it thinks my local store is Belfast. Like not in a million years is the postcode that I put in the closest IKEA to me. I mean, so I\u2019m just baffled by that.", "topic": "Reflection on IKEA site experience"}, {"id": 64, "s": "s2", "p": "p2", "tc": 2019, "text": "Okay. These things say available for delivery, but then when I put my postcode in, it was like, no, sorry, love, not having it.", "topic": "Reflection on IKEA site experience"}, {"id": 65, "s": "s2", "p": "p2", "tc": 2044, "text": "The thing is, here on this page, I thought I\u2019d already chosen delivery. I chose it here. When I was in the shopping bag, I already did press delivery, right? I did save, enter postcode. So now it should know that that\u2019s what the option I\u2019m going for. So I don\u2019t understand the next step. And then it\u2019s like it forgets everything.", "topic": "Reflection on IKEA site experience"}, {"id": 66, "s": "s2", "p": "p2", "tc": 2086, "text": "Yeah, well, I mean... from their side, well, I\u2019m quite excited about this dish drainer.", "topic": "Reflection on IKEA site experience"}, {"id": 67, "s": "s2", "p": "p2", "tc": 2105, "text": "Yeah. They offered me up all these ridiculous things in my basket, but actually the one thing it didn\u2019t offer me up was a thing that I think I would buy.", "topic": "Reflection on IKEA site experience"}, {"id": 68, "s": "s3", "p": "p3", "tc": 397, "text": "... a purchase I\u2019ve done maybe two years ago and about which I\u2019m still very, very happy is a... it\u2019s like a cupboard thing. It\u2019s like from... I think it\u2019s a Swiss brand called USM Haller. And it\u2019s this kind of shelving cupboard unit and you can completely configure it yourself. You can decide on do you want to have drawers or do you want to have a shelving, glass, metal, whatever. And... I absolutely love it. It\u2019s like the centerpiece in our living room.", "topic": "Favourite Household Object Discussion"}, {"id": 69, "s": "s3", "p": "p3", "tc": 436, "text": "And we, my husband and myself, we spent a long time deciding on the color and eventually we went for a bright yellow. And it\u2019s like, it makes me happy every day I walk into the living room because it\u2019s so nice and bright and shiny and it\u2019s like sunshine.", "topic": "Favourite Household Object Discussion"}, {"id": 70, "s": "s3", "p": "p3", "tc": 476, "text": "Yeah, we had, originally we had this kind of very, almost like antique wooden cabinet in the living room and it was made out of wood and maybe, I don\u2019t know, 100 years old and it was brought, I think my husband brought it into the marriage and we both hated it so much because it wasn\u2019t very useful. And so... we thought we wanted to have something more modern, more practical with more storage space. And initially I had this other kind of shelving unit in mind... which is called string... furniture.", "topic": "Favourite Household Object Discussion"}, {"id": 71, "s": "s3", "p": "p3", "tc": 516, "text": "... I looked at it in, so I researched everything online... configured it. And then we went to a shop and... I opened one of the... doors of this unit and I thought, oh my God, this is so cheap. I mean, the whole thing is not cheap, but the way the mechanism was really not nice at all. And I thought, okay, I\u2019m not spending that money to get this kind of quality, although the whole thing looks nice and fits the... our architecture of the building. I wasn\u2019t impressed by the actual... the handle haptic of that thing.", "topic": "Favourite Household Object Discussion"}, {"id": 72, "s": "s3", "p": "p3", "tc": 559, "text": "So... we were in that furniture store looking around and then they say, okay, if you want to have something you can completely configure yourself, why not choose this brand? And... this brand... USM Haller is, you can find it quite often in... doctor surgeries... and I thought, ah, I\u2019m not sure.", "topic": "Favourite Household Object Discussion"}, {"id": 73, "s": "s3", "p": "p3", "tc": 624, "text": "... I think that\u2019s it. And I think for me, it was maybe \u2014 that is also the sign of the quality \u2014 what it feels like when you open and close drawers.", "topic": "Favourite Household Object Discussion"}, {"id": 74, "s": "s3", "p": "p3", "tc": 680, "text": "Yeah. Okay. So... I don\u2019t really go to Ikea anymore to... buy furniture. Having said that... we needed... a while ago, we needed new shelving for our downstairs for our cellar because we had... we had a flooding. And... so a lot of... the stuff got destroyed in the flood. And then we thought, okay, we need to have some metal shelves in case something like this happens before.", "topic": "General IKEA Experience and Attitudes"}, {"id": 75, "s": "s3", "p": "p3", "tc": 712, "text": "And we also needed... shelving, which doesn\u2019t come up very... right down to the floor in case there was a flood. We wanted to put up stuff a little bit higher on metal shelves. And... the last time I bought... shelf stuff like this... in a DIY store, but they were so difficult to put together. We thought, okay, let\u2019s go to Ikea. And... I think I also had a look beforehand online, what they have, if they have these kinds of shelving at all. And... then we went to Ikea and I think it was pretty straightforward.", "topic": "General IKEA Experience and Attitudes"}, {"id": 76, "s": "s3", "p": "p3", "tc": 751, "text": "... we knew exactly what we wanted. And... I think I also checked online whether they had the stuff in store because... in Dusseldorf, there are two IKEA stores. And I wanted to make sure that the one closer to our house... actually stocks the stuff. So we went in there. And... the way you always have to, what it feels like going through the entire store to actually then go to the store and get to the item you want.", "topic": "General IKEA Experience and Attitudes"}, {"id": 77, "s": "s3", "p": "p3", "tc": 789, "text": "Well, I\u2019m kind of, sometimes I like looking at the stuff and... but I also get a little bit annoyed with myself because then I pick up things I see on the way to the actual part where you get the stuff out of the shelves. And I always end up with... I don\u2019t know, hangers or napkins or... candles and... these kind of items... which fill up my basket. And... before I eventually go and pick the stuff in the... warehouse part where you collect the stuff from the shelves.", "topic": "General IKEA Experience and Attitudes"}, {"id": 78, "s": "s3", "p": "p3", "tc": 860, "text": "... I think in the beginning, it\u2019s a little bit like, oh no, we have to go to Ikea and... can I be bothered? But yes, we need something. Then... usually like parking, et cetera, is fine. There\u2019s no problem. You always find a space... go in there. And then... I know sometimes how to shortcut the way through this whole shop... I mean, if you\u2019ve been there several times, you know, that you can go straight from, I don\u2019t know, the bathroom section to the kitchen section.", "topic": "General IKEA Experience and Attitudes"}, {"id": 79, "s": "s3", "p": "p3", "tc": 894, "text": "... if I\u2019m really on a mission, then I go through the exit... I enter the shop through the exit and... that\u2019s the trick. ... Exactly. That\u2019s a life hack. But... I think it also depends if I\u2019m there on my own or with my husband.", "topic": "General IKEA Experience and Attitudes"}, {"id": 80, "s": "s3", "p": "p3", "tc": 950, "text": "Okay. Right. Can you hold on? I need to go to the window. Okay. This is not my computer, so I don\u2019t really want to. I open a new tab. Here we go. Okay. So can you see Google? ... Yeah. Okay. So I would go to Ikea. Can I go to the German website?", "topic": "IKEA Website Navigation Begins"}, {"id": 81, "s": "s3", "p": "p3", "tc": 979, "text": "I go to IKEA DE, and here we are. ... okay, I declined the cookies. Right, here I am.", "topic": "IKEA Website Navigation Begins"}, {"id": 82, "s": "s3", "p": "p3", "tc": 1028, "text": "So obviously the thing I want to replace is somewhere here where it says... it\u2019s like cupboards and storage. So I go there. ... Okay. So I\u2019m here. Aufbewahrung und Schr\u00e4nke. Have a look.", "topic": "Storage and Wardrobes Category Page"}, {"id": 83, "s": "s3", "p": "p3", "tc": 1048, "text": "Okay. ... well, this is... I can already see here in the image that this is maybe something going into the direction I want. ... here, weniger chaos, mehr Wohngef\u00fchl. Oh, it\u2019s die Beste. I mean, some of the products you know from Ikea because you\u2019ve seen them by being there.", "topic": "Storage and Wardrobes Category Page"}, {"id": 84, "s": "s3", "p": "p3", "tc": 1084, "text": "Yeah, I mean, I think... for me, obviously, it\u2019s the Billy shelving... which has been around for ages and ages, but also the PAX, which is like this cupboard unit thing. And it seems that everybody has somewhere or has somewhere in some time in their life had one of the PAX units. And... we\u2019ve got one in our... walk-in cupboard. And I know that the BEST\u00c5 is more like for the living room space. So maybe that\u2019s already something good. ... I think these are probably the three... product names I know. ... okay. So I\u2019m having a look here and I can see, ooh, brown is not my color. Why do you see? I\u2019ve got this yellow thing.", "topic": "Storage and Wardrobes Category Page"}, {"id": 85, "s": "s3", "p": "p3", "tc": 1136, "text": "And... I want to replace the yellow, but I don\u2019t think yellow is IKEA\u2019s color. ... let me see, I have a look down here. ... Yeah, I\u2019m just orientating myself... just to see... what\u2019s the best way to get to what I need. Yeah, I\u2019m just having a quick look what they have. And here, okay, that\u2019s not really what I want. I think that maybe if I go, hold on, what is looking a bit like what I have is, well, not as clunky as this. ... okay, so here I can see a little bit of the colors. You see, but Ikea, they only have like the white, the brown and some, well, this is horrible.", "topic": "Storage and Wardrobes Category Page"}, {"id": 86, "s": "s3", "p": "p3", "tc": 1213, "text": "It needs to be fully configurable. So I want to decide what units I can take... I mean, this is huge. I mean, we don\u2019t have the space like... I want to have it smaller. Oh, yeah, but here it says personalisier dein BEST\u00c5. So I can personalize it. And it opens the \u2014 I think it\u2019s probably some kind of configuration.", "topic": "BEST\u00c5 Furniture Configurator"}, {"id": 87, "s": "s3", "p": "p3", "tc": 1242, "text": "Oh, it says... oh, it\u2019s currently not possible to do this. Okay. This is annoying. ... hold on, but what can I... well, let me just see, maybe.", "topic": "BEST\u00c5 Furniture Configurator"}, {"id": 88, "s": "s3", "p": "p3", "tc": 1262, "text": "Sorry, I just need to move you away. ... okay, but they have, yeah, but this is no use for me to have like the things here. Can I drag them over there? Oh, here we go. It is working. Interesting. Okay. Okay. So in theory, I could put the stuff together. ... do you know the dimensions or can you, this is already 180 is too much. How can I delete this? Can I delete this? I have no idea. Why do I do this? I just, ah, here we go. Delete. Right.", "topic": "BEST\u00c5 Furniture Configurator"}, {"id": 89, "s": "s3", "p": "p3", "tc": 1309, "text": "Yeah, so if we stay with the 120, that\u2019s probably the right size, and then I want to have, let me see, yeah, so... I can build stuff. Obviously, this is not going on top. Okay, but can I also choose the colors? Okay, I can choose the styling. Imagine I wanted to have it all in white.", "topic": "BEST\u00c5 Furniture Configurator"}, {"id": 90, "s": "s3", "p": "p3", "tc": 1368, "text": "... obviously here I can do this like in my own time, but... I felt like when I went to the shop, I think... they were using the same kind of configuration software, but the woman who was doing this... I think she had in her mind, she had so many possible solutions and ideas.", "topic": "BEST\u00c5 Furniture Configurator"}, {"id": 91, "s": "s3", "p": "p3", "tc": 1395, "text": "... because with the system we have you can configure an awful lot. I mean, you can configure the surfaces, you can... select really absolutely everything... the height of... the legs and everything and she knew all this and... she was very good in suggesting different designs and setups really quickly and showing us... whereas here yes I can do this at home but I can only build on maybe my own ideas and I don\u2019t get this input.", "topic": "BEST\u00c5 Furniture Configurator"}, {"id": 92, "s": "s3", "p": "p3", "tc": 1454, "text": "Okay. The checkout process. Yes, of course. Hold on. ... so I just do this also in white and I want, well, what\u2019s the... brown corpus and here, let\u2019s say also white and brown. Okay. It\u2019s not... the nicest design, but let\u2019s say we live with it. Yeah. So it\u2019s okay. I can already see 300 euros, obviously much cheaper than what we have. Okay. So I see the summary here. ... I see the dimensions. ... oh, you see, and here I can... check whether it\u2019s available in our shop. Dusseldorf. Here we are.", "topic": "Configured Item and Store Availability Check"}, {"id": 93, "s": "s3", "p": "p3", "tc": 1513, "text": "Oh, you see? Okay. So is there a low, it might be that some products are not available or are only a few items left. ... How do you feel about might? Yeah. I mean, I could check out what exactly. No, you see, this is frustrating. So they tell me that some products are either in low stock or are not available. I would now think that they tell me, but they don\u2019t. They don\u2019t tell me which...", "topic": "Configured Item and Store Availability Check"}, {"id": 94, "s": "s3", "p": "p3", "tc": 1552, "text": "Yeah, I mean, they could, for example, function buildKnobs() {
  const host = document.getElementById("knobs");
  host.innerHTML = "";
  for (const [group, items] of SPEC) {
    const g = document.createElement("div"); g.className = "kg"; g.textContent = group; host.append(g);
    for (const [key, label, type, opts, note] of items) {
      const row = document.createElement("div"); row.className = "k";
      const lab = document.createElement("label"); lab.textContent = label; row.append(lab);
      let input;
      if (type === "sel") {
        input = document.createElement("select");
        for (const [v, t] of opts) { const o = new Option(t, v); input.add(o); }
        input.value = K[key]; row.append(input);
      } else if (type === "text") {
        input = document.createElement("input"); input.type = "text"; input.value = K[key]; input.size = 10; row.append(input);
      } else {
        const v = document.createElement("span"); v.className = "v"; v.textContent = K[key]; row.append(v);
        input = document.createElement("input"); input.type = "range";
        [input.min, input.max, input.step] = opts; input.value = K[key]; row.append(input);
        input.addEventListener("input", () => { v.textContent = input.value; });
      }
      input.addEventListener("change", () => {
        K[key] = type === "range" ? Number(input.value) : input.value;
        restart();
      });
      if (note) { const n = document.createElement("div"); n.className = "note"; n.textContent = note; row.append(n); }
      host.append(row);
    }
  }
  const a = document.createElement("div"); a.className = "assume";
  a.innerHTML = "<b>Measured:</b> " + D.calls_ms.length + " logged AutoCode calls (median " +
    (median(D.calls_ms) / 1000).toFixed(1) + " s). <b>Assumed:</b> how call time scales with batch size; " +
    "that shuffling leaves confidences unchanged. Quote text: Talismanic, codes only.";
  host.append(a);
}

// ── helpers ───────────────────────────────────────────────────────────────────
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rng) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function median(a) { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function niceUp(x) { const steps = [5, 10, 15, 20, 25, 30, 40, 50, 60, 80, 100, 150, 200, 300, 500, 1000]; for (const s of steps) if (s >= x) return s; return Math.ceil(x / 500) * 500; }
function tagBg(t) { const tag = D.tags[t]; return `var(--bn-${tag.set}-${(tag.idx % (SLOTS[tag.set] || 5)) + 1}-bg)`; }
function barColour(t) { return `var(--bn-bar-${D.tags[t].set}, var(--bn-bar-none))`; }
function fmtTc(s) { const m = Math.floor(s / 60), r = s % 60; return `[${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}]`; }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ── simulation state ──────────────────────────────────────────────────────────
let S = null, playing = false, last = 0;
const qById = new Map(D.quotes.map(q => [q.id, q]));
const cardEls = new Map(), badgeEls = new Map(), sideRows = [], cbRows = [];

function sizeFactor(n) { return (1 - K.share / 100) + (K.share / 100) * (n / 25); }
function sampleCall(rng) {
  if (K.callMode === "replay") return D.calls_ms[Math.floor(rng() * D.calls_ms.length)] / 1000;
  const sigma = Math.log(Math.max(K.p90, K.median + 0.1) / K.median) / 1.2816;
  const z = Math.sqrt(-2 * Math.log(rng() || 1e-9)) * Math.cos(2 * Math.PI * rng());
  return K.median * Math.exp(sigma * z);
}

function plan() {
  const rng = mulberry32(K.seed);
  let order = D.quotes.map(q => q.id);
  if (K.order === "shuffled") shuffle(order, mulberry32(K.seed * 7919));
  let sizes = String(K.sizes).split(/[,\s]+/).map(Number).filter(n => n > 0);
  if (!sizes.length) sizes = [25];
  const batches = [];
  for (let i = 0, k = 0; i < order.length; k++) {
    const n = sizes[Math.min(k, sizes.length - 1)];
    batches.push({ qids: order.slice(i, i + n), n: Math.min(n, order.length - i) });
    i += n;
  }
  const lanes = Array(K.conc).fill(0);
  for (const b of batches) {
    b.dur = Math.max(1, sampleCall(rng) * sizeFactor(b.n));
    let lane = 0; for (let j = 1; j < lanes.length; j++) if (lanes[j] < lanes[lane]) lane = j;
    b.lane = lane; b.start = lanes[lane]; b.end = b.start + b.dur; lanes[lane] = b.end;
  }
  const serverEnd = Math.max(...batches.map(b => b.end));
  for (const b of batches) b.visible = K.save === "end" ? serverEnd : b.end;
  return { batches, serverEnd, arr: [...batches].sort((a, b) => a.visible - b.visible) };
}

function restart() {
  const wasPlaying = playing;
  const p = plan();
  S = {
    t: 0, ...p, ai: 0, queue: [], revealed: new Map(), rate: K.startRate, credits: 0,
    observed: [], arrivedConfs: [], finished: false, waved: false, flips: 0, held: new Set(),
    reveals: [], depth: [], lastDepthT: -1, histMax: 5, tagMax: 5, sqMode: null,
    counts: D.tags.map(() => ({ a: 0, t: 0, e: 0 })), landedQuotes: 0, serverQuotes: 0,
    firstReveal: null, doneT: null,
  };
  // squares or bars, chosen at start from what is known up front (the quote count)
  const maxStack = Math.floor(HIST_H / SQ);
  S.sqMode = K.squares === "lock" ? (D.quotes.length * 0.22 <= maxStack) : true;
  document.documentElement.classList.toggle("rm", K.rm === "on");
  document.body.classList.toggle("still", K.tentative === "still");
  document.getElementById("quotes").classList.toggle("reserve", K.reserve === "on");
  document.getElementById("chipstack").hidden = K.surface !== "cli";
  document.getElementById("macsb").style.display = K.surface === "mac" ? "" : "none";
  renderStatic();
  updateAll();
  playing = wasPlaying;
}

// ── classification ────────────────────────────────────────────────────────────
function pctLines(confs) {
  if (!confs.length) return { u: 2, l: -1 };
  const s = [...confs].sort((a, b) => b - a);
  const k = Math.max(1, Math.ceil(s.length * K.topPct / 100));
  const z = Math.ceil(s.length * K.botPct / 100);
  return { u: s[k - 1], l: z > 0 ? s[s.length - z] : -1 };
}
function currentLines() {
  if (K.lines === "fixed") return { u: K.upper, l: K.lower, pct: false };
  const L = pctLines(S.arrivedConfs);
  return { u: L.u, l: L.l, pct: true };
}
function classify(conf) {
  if (K.lines === "wave" && !S.waved) return "ten";
  const L = currentLines();
  if (conf >= L.u) return "acc";
  if (L.pct ? conf <= L.l : conf < L.l) return "exc";
  return "ten";
}

// ── static render ─────────────────────────────────────────────────────────────
function renderStatic() {
  const qhost = document.getElementById("quotes");
  qhost.innerHTML = ""; cardEls.clear(); badgeEls.clear();
  for (const q of D.quotes) {
    const el = document.createElement("div"); el.className = "qc";
    el.innerHTML = `<div class="meta"><span>${fmtTc(q.tc)}</span><span class="sp">${esc(q.p)}</span></div>` +
      `<div class="tx">${esc(q.text)}</div><div class="tags"></div>`;
    qhost.append(el); cardEls.set(q.id, el);
  }
  const filt = document.getElementById("filter");
  const keep = filt.value;
  filt.innerHTML = '<option value="">All quotes</option>' + D.tags.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join("");
  filt.value = keep;
  const rowHTML = (t) => `<span class="badge" style="background:${tagBg(t)}">${esc(D.tags[t].name)}</span>` +
    `<span class="bar"><i class="solid" style="background:${barColour(t)};width:0"></i><i class="pale" style="background:${barColour(t)};width:0"></i></span><span class="n">0</span>`;
  const side = document.getElementById("tagSidebar"); side.innerHTML = ""; sideRows.length = 0;
  const cb = document.getElementById("cbgrid"); cb.innerHTML = ""; cbRows.length = 0;
  for (const g of D.groups) {
    const h = document.createElement("div"); h.className = "tgrp"; h.textContent = g.name; side.append(h);
    const card = document.createElement("div"); card.className = "cbcard";
    card.innerHTML = `<div class="tgrp">${esc(g.name)}</div>`; cb.append(card);
    D.tags.forEach((t, i) => {
      if (t.group !== g.name) return;
      const r = document.createElement("div"); r.className = "trow"; r.innerHTML = rowHTML(i); side.append(r); sideRows[i] = r;
      const c = document.createElement("div"); c.className = "trow"; c.innerHTML = rowHTML(i); card.append(c); cbRows[i] = c;
    });
  }
  const hp = document.getElementById("hplot"); hp.innerHTML = "";
  for (let i = 0; i < BIN_N; i++) { const b = document.createElement("div"); b.className = "bin"; hp.append(b); }
  for (const cls of ["lo", "hi"]) { const l = document.createElement("div"); l.className = "line " + cls; l.id = "line-" + cls; hp.append(l); }
  document.getElementById("newpill").hidden = true;
}

// ── arrivals, reveals ─────────────────────────────────────────────────────────
function arrive(b) {
  b.arrived = true;
  S.observed.push(b.dur / sizeFactor(b.n));
  S.serverQuotes += b.n;
  let items = b.qids.filter(id => D.props[id]).map(id => ({ qid: id, b }));
  b.pending = items.length;
  S.landedQuotes += b.n - items.length;
  for (const it of items) S.arrivedConfs.push(D.props[it.qid].c);
  if (K.within === "strong") items.sort((x, y) => D.props[y.qid].c - D.props[x.qid].c);
  else if (K.within === "random") shuffle(items, mulberry32(K.seed + b.start * 1000 | 0));
  S.queue.push(...items);
  if (K.lines === "pct") reclassRevealed();
}
function reclassRevealed() {
  for (const [qid, cls] of S.revealed) {
    const n = classify(D.props[qid].c);
    if (n !== cls) { setClass(qid, n, true); S.flips++; }
  }
}
function reveal(it) {
  const p = D.props[it.qid];
  if (it.wave) { setClass(it.qid, classify(p.c), false); return; }
  setClass(it.qid, classify(p.c), false);
  it.b.pending--; S.landedQuotes++;
  if (S.firstReveal === null) S.firstReveal = S.t;
}
function setClass(qid, cls, isFlip) {
  const p = D.props[qid], t = p.t, prev = S.revealed.get(qid);
  if (prev) S.counts[t][prev[0]]--;
  S.revealed.set(qid, cls);
  S.counts[t][cls[0]]++;
  S.reveals.push({ t: S.t, cls, flip: isFlip });
  // the quote card
  const card = cardEls.get(qid), tags = card.querySelector(".tags");
  let badge = badgeEls.get(qid);
  if (cls === "exc") { if (badge) { badge.remove(); badgeEls.delete(qid); } }
  else {
    if (!badge) { badge = document.createElement("span"); tags.append(badge); badgeEls.set(qid, badge); }
    badge.className = "badge " + (cls === "acc" ? "badge-user" : "badge-proposed");
    badge.style.background = tagBg(t);
    badge.textContent = D.tags[t].name;
    if (cls === "acc") flash(badge); else if (!isFlip) appear(badge);
  }
  if (cls === "acc") { flash(sideRows[t].querySelector(".badge")); flash(cbRows[t].querySelector(".badge")); }
  applyFilter(qid, true);
  S.dirty = true;
}
function flash(el) {
  if (K.rm === "on" || !el) return;
  el.classList.remove("badge-accept-flash"); void el.offsetWidth; el.classList.add("badge-accept-flash");
}
function appear(el) {
  if (K.rm === "on") return;
  el.classList.add("badge-appearing"); setTimeout(() => el.classList.remove("badge-appearing"), 200);
}

// ── filter ────────────────────────────────────────────────────────────────────
function matches(qid, f) { const cls = S.revealed.get(qid); return cls && cls !== "exc" && String(D.props[qid].t) === f; }
function applyFilter(qid, fromLanding) {
  const f = document.getElementById("filter").value, card = cardEls.get(qid);
  if (!f) { delete card.dataset.hidden; return; }
  const m = matches(qid, f);
  if (m && fromLanding && K.filterMode === "hold" && card.dataset.hidden !== undefined) { S.held.add(qid); updatePill(); return; }
  if (m) delete card.dataset.hidden; else card.dataset.hidden = "";
}
function refilter() { S.held.clear(); for (const q of D.quotes) applyFilter(q.id, false); updatePill(); }
function updatePill() {
  const pill = document.getElementById("newpill");
  pill.hidden = S.held.size === 0; pill.textContent = `↑ ${S.held.size} new`;
}
document.getElementById("newpill").addEventListener("click", () => {
  for (const q of S.held) delete cardEls.get(q).dataset.hidden;
  S.held.clear(); updatePill();
});
document.getElementById("filter").addEventListener("change", refilter);

// ── per-frame update ──────────────────────────────────────────────────────────
function step(dt) {
  S.t += dt;
  while (S.ai < S.arr.length && S.arr[S.ai].visible <= S.t) arrive(S.arr[S.ai++]);
  const serverDone = S.ai >= S.arr.length;
  if (K.rm === "on" || K.pacing === "none") {
    while (S.queue.length) reveal(S.queue.shift());
  } else {
    const q = S.queue.length;
    if (serverDone) {
      S.rate = Math.max(S.rate, q / Math.max(K.drain, 0.05));
    } else {
      let target;
      if (K.pacing === "predict") {
        const typical = S.observed.length ? median(S.observed) : K.baseline;
        const inflight = S.batches.filter(b => b.start <= S.t && b.visible > S.t);
        let next = inflight.length ? Math.min(...inflight.map(b => b.start + typical * sizeFactor(b.n))) : S.t + typical;
        if (next < S.t + 0.5) next = S.t + 0.5;
        target = q / (next - S.t);
      } else target = q / K.horizon;
      const d = target - S.rate;
      S.rate += d > 0 ? Math.min(d, K.accel * dt) : Math.max(d, -K.decel * dt);
      S.rate = Math.max(0, Math.min(S.rate, K.maxRate));
    }
    S.credits += S.rate * dt;
    while (S.credits >= 1 && S.queue.length) { reveal(S.queue.shift()); S.credits -= 1; }
    if (!S.queue.length) S.credits = Math.min(S.credits, 1);
  }
  if (serverDone && !S.queue.length && !S.finished) {
    if (K.lines === "wave" && !S.waved) {
      // the wave: every landed tag is re-cut at the final lines, strongest first;
      // only the ones that change move, through the same paced queue
      S.waved = true;
      const items = [...S.revealed.keys()].sort((a, b) => D.props[b].c - D.props[a].c);
      for (const qid of items) if (classify(D.props[qid].c) !== S.revealed.get(qid)) S.queue.push({ qid, wave: true });
      if (!S.queue.length) { S.finished = true; S.doneT = S.t; }
    } else { S.finished = true; S.doneT = S.t; }
  }
  if (S.t - S.lastDepthT >= 0.2) { S.depth.push({ t: S.t, q: S.queue.length, r: S.rate }); S.lastDepthT = S.t; }
}

function updateAll() {
  updateStatus(); updateBars(); updateHist(); drawTimeline(); updateStats();
  document.getElementById("clock").textContent = `t = ${S.t.toFixed(1)} s`;
  S.dirty = false;
}

function updateStatus() {
  const N = D.quotes.length;
  const n = K.statusCount === "server" ? S.serverQuotes : Math.min(N, S.landedQuotes);
  const running = !S.finished;
  const line = document.getElementById("statusLine");
  line.textContent = `AutoCode · ${n} of ${N}`;
  line.classList.toggle("bn-thinking-shimmer", running);
  const stack = document.getElementById("chipstack");
  if (K.surface === "cli") {
    const title = "Bristlenose UXR Codebook";
    stack.innerHTML = running
      ? `<div class="activity-chip" data-status="running"><span class="chip-label bn-thinking-shimmer">✦ AutoCoding ${title} ${n}/${N}…</span><button class="chip-cancel">Cancel</button></div>`
      : `<div class="activity-chip" data-status="completed"><span class="chip-check">✓</span><span>✦ AutoCoded ${title} in ${fmtDur(S.doneT)}.</span></div>`;
  }
}
function fmtDur(s) { const m = Math.floor(s / 60), r = Math.round(s % 60); return m ? `${m}m ${r}s` : `${r}s`; }

function updateBars() {
  const tallest = Math.max(1, ...S.counts.map(c => c.a + c.t));
  S.tagMax = K.axis === "tallest" ? tallest : (tallest > S.tagMax ? niceUp(tallest * 1.25) : S.tagMax);
  S.counts.forEach((c, t) => {
    for (const row of [sideRows[t], cbRows[t]]) {
      if (!row) continue;
      row.querySelector(".solid").style.width = (c.a / S.tagMax * 100) + "%";
      row.querySelector(".pale").style.width = (c.t / S.tagMax * 100) + "%";
      row.querySelector(".n").textContent = c.a + c.t ? (c.t ? `${c.a}+${c.t}` : c.a) : "";
    }
  });
}

function updateHist() {
  const bins = Array.from({ length: BIN_N }, () => []);
  for (const [qid, cls] of S.revealed) {
    const c = D.props[qid].c; const i = Math.min(BIN_N - 1, Math.floor(c * BIN_N));
    bins[i].push({ qid, cls, t: D.props[qid].t });
  }
  const tallest = Math.max(1, ...bins.map(b => b.length));
  const maxStack = Math.floor(HIST_H / SQ);
  if (K.squares === "switch") S.sqMode = tallest <= maxStack;
  S.histMax = K.axis === "tallest" ? tallest : (tallest > S.histMax ? niceUp(tallest * 1.25) : S.histMax);
  const hp = document.getElementById("hplot");
  [...hp.querySelectorAll(".bin")].forEach((el, i) => {
    const b = bins[i];
    if (S.sqMode) {
      el.className = "bin sq";
      const order = { acc: 0, ten: 1, exc: 2 };
      b.sort((x, y) => order[x.cls] - order[y.cls]);
      el.innerHTML = b.map(x => `<i class="sqi ${x.cls}" style="background:${tagBg(x.t)};color:var(--bn-colour-muted)"></i>`).join("");
    } else {
      el.className = "bin";
      const n = { acc: 0, ten: 0, exc: 0 }; b.forEach(x => n[x.cls]++);
      if (el.children.length !== 3 || el.firstChild.tagName !== "DIV") el.innerHTML = '<div class="seg acc"></div><div class="seg ten"></div><div class="seg exc"></div>';
      const [a, t, e] = el.children;
      a.style.height = (n.acc / S.histMax * HIST_H) + "px";
      t.style.height = (n.ten / S.histMax * HIST_H) + "px";
      e.style.height = (n.exc / S.histMax * HIST_H) + "px";
    }
  });
  const L = currentLines();
  const lo = document.getElementById("line-lo"), hi = document.getElementById("line-hi");
  const show = !(K.lines === "wave" && !S.waved);
  hi.style.display = lo.style.display = show && S.revealed.size ? "" : "none";
  hi.style.left = `calc(${Math.min(1, L.u) * 100}% - 1px)`;
  lo.style.left = `calc(${Math.max(0, L.l) * 100}% - 1px)`;
  const tot = { a: 0, t: 0, e: 0 }; S.counts.forEach(c => { tot.a += c.a; tot.t += c.t; tot.e += c.e; });
  document.getElementById("hmeta").innerHTML =
    `<span>accepted ${tot.a}</span><span>tentative ${tot.t}</span><span>excluded ${tot.e}</span>` +
    `<span>scale ${S.sqMode ? "squares" : "0–" + S.histMax}</span>` + (S.flips ? `<span style="color:#d92d20">flips ${S.flips}</span>` : "");
}

function drawTimeline() {
  const cv = document.getElementById("tl"), dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.body);
  const ink = css.getPropertyValue("color"), muted = "#8a8f98";
  const T = Math.max(S.serverEnd + K.drain + 6, S.t + 2, S.doneT || 0);
  const X = t => 40 + (W - 50) * t / T;
  const laneH = 9, top = 4;
  g.font = "10px ui-monospace, Menlo, monospace"; g.fillStyle = muted;
  g.fillText("server", 0, top + 8);
  for (const b of S.batches) {
    const y = top + b.lane * (laneH + 2);
    g.fillStyle = "rgba(128,128,128,.18)"; g.fillRect(X(b.start), y, X(b.end) - X(b.start), laneH);
    const done = Math.min(S.t, b.end);
    if (done > b.start) { g.fillStyle = b.arrived ? "rgba(62,92,160,.75)" : "rgba(62,92,160,.35)"; g.fillRect(X(b.start), y, X(done) - X(b.start), laneH); }
    if (K.save === "end" && S.t < S.serverEnd) { /* nothing visible until the end */ }
  }
  const rY = top + K.conc * (laneH + 2) + 6;
  g.fillStyle = muted; g.fillText("screen", 0, rY + 9);
  const col = { acc: "#2f9e62", ten: "#d9a23a", exc: "#9aa0a6" };
  for (const r of S.reveals) { g.fillStyle = r.flip ? "#d92d20" : col[r.cls]; g.fillRect(X(r.t), rY, 1.5, 12); }
  const dY = rY + 22, dH = H - dY - 14;
  g.fillStyle = muted; g.fillText("queue", 0, dY + 10);
  const maxQ = Math.max(10, ...S.depth.map(d => d.q));
  g.strokeStyle = "#7b61c9"; g.lineWidth = 1.2; g.beginPath();
  S.depth.forEach((d, i) => { const x = X(d.t), y = dY + dH - d.q / maxQ * dH; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
  g.strokeStyle = "rgba(47,158,98,.8)"; g.beginPath();
  const maxR = Math.max(K.maxRate, 1);
  S.depth.forEach((d, i) => { const x = X(d.t), y = dY + dH - Math.min(d.r, maxR) / maxR * dH; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
  g.fillStyle = muted; g.fillText(`max ${maxQ}`, 0, dY + 22);
  g.strokeStyle = "#d92d20"; g.beginPath(); g.moveTo(X(S.t), 0); g.lineTo(X(S.t), H - 12); g.stroke();
  g.fillStyle = muted;
  for (let s = 0; s <= T; s += T > 200 ? 60 : T > 60 ? 15 : 5) g.fillText(s + "s", X(s) - 6, H - 2);
}

function updateStats() {
  const rv = S.reveals.filter(r => !r.flip);
  let gap = 0;
  for (let i = 1; i < rv.length; i++) gap = Math.max(gap, rv[i].t - rv[i - 1].t);
  const fmt = v => v == null ? "—" : v.toFixed(1) + " s";
  document.getElementById("stats").innerHTML =
    `batches <b>${S.batches.length}</b> (${S.batches.map(b => b.n).join(", ").slice(0, 40)})<br>` +
    `first tag on screen <b>${fmt(S.firstReveal)}</b><br>` +
    `server finished <b>${fmt(S.serverEnd)}</b><br>` +
    `screen finished <b>${fmt(S.doneT)}</b><br>` +
    `longest still gap <b>${rv.length > 1 ? gap.toFixed(1) + " s" : "—"}</b><br>` +
    `pace now <b>${S.rate.toFixed(2)}</b> tags/s · queue <b>${S.queue.length}</b><br>` +
    `<span style="color:#2f9e62">■</span> accepted <span style="color:#d9a23a">■</span> tentative ` +
    `<span style="color:#9aa0a6">■</span> excluded <span style="color:#d92d20">■</span> flipped<br>` +
    `<span style="color:#7b61c9">—</span> queue <span style="color:#2f9e62">—</span> pace`;
}

// ── loop + header ─────────────────────────────────────────────────────────────
function frame(ts) {
  const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0; last = ts;
  if (playing && !S.finished) {
    step(dt * Number(document.getElementById("speed").value));
    updateAll();
  } else if (playing && S.finished) { setPlaying(false); updateAll(); }
  requestAnimationFrame(frame);
}
function setPlaying(v) { playing = v; document.getElementById("play").textContent = v ? "❚❚ Pause" : "▶ Play"; }
document.getElementById("play").addEventListener("click", () => { if (S.finished) restart(); setPlaying(!playing); });
document.getElementById("restart").addEventListener("click", () => { restart(); setPlaying(true); });
document.getElementById("preset").addEventListener("change", e => {
  const p = PRESETS[e.target.value]; if (!p) return;
  Object.assign(K, p); buildKnobs(); restart(); setPlaying(true);
});
window.addEventListener("resize", () => S && drawTimeline());
document.getElementById("studyinfo").textContent =
  `${D.quotes.length} quotes · ${Object.keys(D.props).length} proposals · ${D.framework}`;
buildKnobs(); restart(); requestAnimationFrame(frame);
</script>
</body>
