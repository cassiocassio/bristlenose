<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:#F3F1EC;font-family:"Inter",-apple-system,"SF Pro Display",system-ui,sans-serif;color:#1d1d1f;display:flex;align-items:center}
.left{width:700px;padding:0 0 0 120px;box-sizing:border-box}
.left img{width:168px;height:168px;border-radius:38px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1{font-size:76px;line-height:1.05;margin:44px 0 22px;letter-spacing:-1.5px;font-weight:700}
p{font-size:32px;line-height:1.35;margin:0 0 36px;color:#3a3a3c}
ul{list-style:none;padding:0;margin:0;font-size:24px;line-height:1.9;color:#5a5a5e}
ul li::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:#FFE299;border:1px solid #e5c56f;margin-right:14px;vertical-align:1px}
ul li:first-child::before{background:#FFA8DB;border-color:#e58bbf}
.right{flex:1;display:flex;gap:28px;align-items:flex-start;justify-content:center;padding-right:70px}
.col{display:flex;flex-direction:column;gap:12px}
.col span{font-size:22px;font-weight:600;color:#5a5a5e;padding-left:8px}
.col img{height:900px;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.10)}
</style></head><body>
<div class="left">
<img src="fish.png" alt="">
<h1>Bristlenose board</h1>
<p>Turn quotes from your Bristlenose study into a FigJam board of sticky notes, ready to sort.</p>
<ul><li>A column per section and theme</li><li>Long quotes as grouped sets</li><li>No network access</li></ul>
</div>
<div class="right">
<div class="col"><span>Sections</span><img src="sections.png" alt=""></div>
<div class="col"><span>Themes</span><img src="themes.png" alt=""></div>
</div></body></html>
