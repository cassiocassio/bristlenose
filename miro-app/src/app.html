<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bristlenose</title>
<link rel="stylesheet" href="app.css?v=__CSS_V__">
<script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
<script src="app.js?v=__APP_V__" defer></script>
</head>
<body>
  <h1>Build a research board</h1>
  <p>Paste the board data you copied in Bristlenose, or choose the board file you downloaded. The app draws it into this board and sends it nowhere else.</p>
  <div class="paste" id="paste" tabindex="0" role="button" aria-describedby="paste-hint">
    <span id="paste-hint">Click here, then paste</span>
  </div>
  <label class="drop" id="drop">
    <input type="file" id="file" accept=".json,application/json">
    <span class="choose">Choose a board file</span>, or drop it here
  </label>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="bar" id="bar"><span id="fill"></span></div>
  <button class="stop" id="stop" type="button" hidden>Stop</button>
  <p class="small">Bristlenose turns interview recordings into a research report. bristlenose.app</p>
</body>
</html>
