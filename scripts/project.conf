# project.conf — everything in the release chain that is about THIS project.
#
# Sourced by release.sh, verify-channels.sh and check-release-ready.sh. Nothing
# here is secret: credentials live in desktop/scripts/.ship-local.conf, which is
# gitignored for a reason and is a separate file on purpose.
#
# That sentence was false for a day: check-release-ready.sh did not source this
# and carried the PyPI URL, both GitHub repos and the advisory list as literals,
# while WF_SNAP / WF_ADVISORY / ADVISORY_STREAK_MAX sat here with no consumer at
# all. A config file nobody reads is worse than a literal, because the literal at
# least does not lie about where the value lives. test-release-sh.sh now asserts
# that every name below is referenced by something — add a constant and wire it
# in the same commit, or the suite fails.
#
# WHY THIS EXISTS
#
# The release chain is ~14 project-specific literals spread across six scripts.
# That is small enough that extracting them is a config file rather than a
# rewrite — and large enough that they had already drifted into three different
# spellings of the same URL. One home, so a second project is a copy of this
# file rather than a fork of the scripts.
#
# It is NOT a plugin system. There is one project, and the abstraction that
# earns its keep is CHANNELS below: which channels exist is the real difference
# between a CLI, a Mac app, and a hybrid that is both.

# ── Identity ────────────────────────────────────────────────────────────────
PROJECT_NAME="bristlenose"                    # PyPI + Snap package name
PROJECT_DISPLAY="Bristlenose"                 # .app / .dmg filename prefix
GH_REPO="cassiocassio/bristlenose"
TAP_REPO="cassiocassio/homebrew-bristlenose"
COPR_OWNER="cassiocassio"                     # Fedora Copr owner (FAS username)
COPR_PROJECT="${PROJECT_NAME}"                # Copr project name
SITE="bristlenose.app"

# The file holding the single source of version truth. `run` reads it back after
# the bump to reconcile against the version it was asked for — a mismatch there
# is otherwise discovered after twine has consumed the wrong number immutably.
VERSION_FILE="bristlenose/__init__.py"
VERSION_REGEX='s/^__version__ *= *"\(.*\)"/\1/p'

# ── Channels ────────────────────────────────────────────────────────────────
# THE abstraction. Which channels a project ships on is the whole difference
# between a CLI (pypi homebrew snap), a Mac app (testflight dmg), and a hybrid
# that is both. verify-channels.sh iterates this rather than hardcoding rows, so
# removing a channel removes its probe, its verdict and its line in the rollup.
#
# Order is presentation only. Every channel here MUST have a probe_<name>
# function in verify-channels.sh, and the suite asserts that — a channel listed
# with no probe would otherwise be a channel silently unchecked, which is the
# defect this whole body of work exists to prevent.
CHANNELS="pypi github homebrew testflight dmg snap copr website"

# `copr` joined CHANNELS on 28 Aug 2026 — in the same commit that recorded the
# project's creation and its first succeeded build (0.28.0-1, fedora-43-x86_64),
# per docs/design-fedora-packaging.md §7's ordering. It was deliberately held
# out until then: rollup() counts `unreachable` as not-ok, so a channel listed
# before its first build reddens every release in between for a reason that is
# not a defect, and a gate that cries wolf gets switched off.

# Channels with no probe available from a developer machine. Named, not omitted:
# a channel quietly missing from CHANNELS is invisible, whereas one listed here
# reports `skipped` and says why. TestFlight needs an App Store Connect key.
CHANNELS_UNPROBEABLE="testflight"

# ── Derived. Change the identity above, not these. ──────────────────────────
PYPI_JSON="https://pypi.org/pypi/${PROJECT_NAME}/%s/json"           # %s = version
DMG_PERMALINK="https://${SITE}/dmg/${PROJECT_DISPLAY}.dmg"
DMG_SHA_URL="${DMG_PERMALINK}.sha256"
DMG_VERSIONED="${PROJECT_DISPLAY}-%s.dmg"                           # %s = version
CHANGELOG_URL="https://${SITE}/docs/changelog.html"
TAP_FORMULA_RAW="https://raw.githubusercontent.com/${TAP_REPO}/main/Formula/${PROJECT_NAME}.rb"
SDIST_NAME="${PROJECT_NAME}-%s.tar.gz"                              # %s = version
SNAP_INFO="https://api.snapcraft.io/v2/snaps/info/${PROJECT_NAME}"
# Copr's own API, unauthenticated for public projects — the same one copr-cli
# uses. Returns 404 for a project that does not exist, which is the honest
# answer before the first build rather than a false "bad".
COPR_BUILDS="https://copr.fedorainfracloud.org/api_3/build/list?ownername=${COPR_OWNER}&projectname=${COPR_PROJECT}"

# ── Workflows ───────────────────────────────────────────────────────────────
# release.yml must invoke ci.yml with the strict input; check-release-ready.sh
# parses both and fails if that chain breaks. Since the pypi required-reviewer
# hold was removed, that chain is the only thing between a tag and PyPI.
WF_CI="ci.yml"
WF_RELEASE="release.yml"
WF_SNAP="snap.yml"
WF_STRICT_INPUT="strict-macos"

# Advisory workflows: non-blocking by design, so nothing else surfaces a
# sustained red. Three in a row stops a release (release-log 0.27.0 #7).
WF_ADVISORY="perf.yml codeql.yml"
ADVISORY_STREAK_MAX=3
