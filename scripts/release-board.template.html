<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Release board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The release board — rendered from board.json inlined below by
  scripts/release-board.py. Maintainer tooling: hand-rolled tokens, not the
  design system (docs/design-release-board.md §0.6).

  RENDER RULE: every string from the data reaches the DOM through textContent
  on a node made with createElement. No innerHTML, no insertAdjacentHTML, no
  outerHTML, no document.write — test-release-board.py greps this file for
  those four names. Channel verdicts and preflight evidence are third-party
  text (Copr, the Snap store, the web host) and this page opens from file://.

  This is a SNAPSHOT. There is no live mode; regenerate and reload.
-->
<style>
  /* ── Palette ──────────────────────────────────────────────────────────
     Two axes, because a release station answers two questions at once:
     WHAT HAPPENED (ok / warn / bad / unknown / skip) and WHEN (now / ahead /
     later). Every colour below is one of those; nothing in this file should
     carry a raw hex again.

     `unknown` is violet and deliberately NOT red. "I could not ask" is not
     "the answer is no" — that distinction is the one this release machine
     keeps having to relearn (a 503 read as a verdict cost 0.31.1 a 38-minute
     wait), and a board that paints them the same colour teaches the opposite.

     Dark mode is a redefinition of the same tokens, never a second stylesheet:
     one vocabulary, two renderings. */
  :root{
    --bg:#f4f4f2; --panel:#fff; --panel-2:#fafaf8;
    --ink:#1d1d1f; --ink-2:#5b5b60; --mute:#8a8a8e;
    --rule:#e3e3e0; --rule2:#cfcfcc; --soft:#d9d9d6;
    --ok:#2e9e5b;      --ok-bg:#eaf6ee;      --ok-bd:#cfe9d8;
    --warn:#d9930d;    --warn-bg:#fff8e8;    --warn-bd:#f3dfa5;
    --bad:#d0342c;     --bad-bg:#fff1f0;     --bad-bd:#f1c9c6;
    --unknown:#6b5bd2; --unknown-bg:#f0edfd; --unknown-bd:#d5cdf5;
    --skip:#b9b9b7;    --skip-bg:#f3f3f1;    --skip-bd:#d9d9d6;
    --now:#0a66ff; --now-rgb:10,102,255;     --now-bg:#e9f0ff;     --now-bd:#bcd0ff;
    --hatch:repeating-linear-gradient(135deg,#f3f3f1 0 4px,#fff 4px 8px);
    --font:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,monospace}
  /* System by default; the toggle is an OVERRIDE. The :not([data-theme="light"])
     guard is what lets someone on a dark Mac force light and have it stick —
     without it the media query wins and the button silently does nothing. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131316; --panel:#1c1c21; --panel-2:#232329;
      --ink:#ececf0; --ink-2:#b2b2bb; --mute:#87878f;
      --rule:#2e2e36; --rule2:#3d3d47; --soft:#33333c;
      --ok:#4cc582;      --ok-bg:#12301e;      --ok-bd:#205337;
      --warn:#e3a83f;    --warn-bg:#31250c;    --warn-bd:#5b4215;
      --bad:#ff6f64;     --bad-bg:#331815;     --bad-bd:#5d2622;
      --unknown:#9e90f2; --unknown-bg:#1f1a3b; --unknown-bd:#382f66;
      --skip:#6b6b74;    --skip-bg:#202026;    --skip-bd:#32323a;
      --now:#4f8dff; --now-rgb:79,141,255;     --now-bg:#0e2344;     --now-bd:#1c3e75;
      --hatch:repeating-linear-gradient(135deg,#202026 0 4px,#1c1c21 4px 8px)}
  }
  /* Same tokens, reached by the manual override. Kept identical by
     test-release-board.py rather than by intention — two copies of a palette
     is exactly the shape that drifts, and the drift shows up as one theme
     quietly going stale. */
  :root[data-theme="dark"]{
      --bg:#131316; --panel:#1c1c21; --panel-2:#232329;
      --ink:#ececf0; --ink-2:#b2b2bb; --mute:#87878f;
      --rule:#2e2e36; --rule2:#3d3d47; --soft:#33333c;
      --ok:#4cc582;      --ok-bg:#12301e;      --ok-bd:#205337;
      --warn:#e3a83f;    --warn-bg:#31250c;    --warn-bd:#5b4215;
      --bad:#ff6f64;     --bad-bg:#331815;     --bad-bd:#5d2622;
      --unknown:#9e90f2; --unknown-bg:#1f1a3b; --unknown-bd:#382f66;
      --skip:#6b6b74;    --skip-bg:#202026;    --skip-bd:#32323a;
      --now:#4f8dff; --now-rgb:79,141,255;     --now-bg:#0e2344;     --now-bd:#1c3e75;
      --hatch:repeating-linear-gradient(135deg,#202026 0 4px,#1c1c21 4px 8px)}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:11.5px/1.3 var(--font)}
  .screen{margin:0;padding:8px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto 1fr auto;gap:8px}
  .screen>*{min-width:0}
  .top{position:relative;display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 46px 8px 14px}
  .top h1{margin:0;font-size:14px;font-weight:600}
  .top .v{font:600 15px var(--mono)}
  .top select.runpick{field-sizing:content;font:500 12px var(--font);color:var(--ink);background:var(--panel);border:1px solid var(--rule2);border-radius:6px;padding:2px 6px;height:24px;cursor:pointer;max-width:20em}
  .pastback{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline dotted;text-underline-offset:2px;cursor:pointer}
  .top select.runpick:hover{border-color:var(--now-bd)} .top select.runpick:focus-visible{outline:2px solid var(--now);outline-offset:1px}
  .top .m{color:var(--mute);font-size:11px}
  a{color:inherit;text-decoration:underline dotted;text-underline-offset:2px} a:hover{text-decoration-style:solid;color:var(--now)}
  .pill{padding:3px 9px;border-radius:12px;border:1px solid var(--rule2);font-size:11px;color:var(--mute)}
  .pill.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)} .pill.bad{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad)}
  .pill.now{background:var(--now-bg);border-color:var(--now-bd);color:var(--now);font-weight:600} .pill.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
  .pill.hatch{background:var(--hatch)}
  /* the line */
  .line{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 14px 6px;overflow-x:auto}
  .track{display:flex;align-items:flex-start;gap:0;min-width:900px}
  .station{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:64px;cursor:pointer}
  .station::before{content:"";position:absolute;top:9px;left:0;right:0;height:4px;background:var(--rule2);z-index:0}
  .station:first-child::before{left:50%} .station:last-child::before{right:50%}
  .station i{width:14px;height:14px;border-radius:50%;background:var(--panel);border:3px solid var(--rule2);z-index:1;box-sizing:border-box;margin-top:4px}
  .station.ok i{border-color:var(--ok);background:var(--ok)} .station.fail i{border-color:var(--bad);background:var(--bad)}
  .station.running i{border-color:var(--now);background:var(--now);box-shadow:0 0 0 4px var(--now-bd)} .station.skipped i{border-color:var(--skip)}
  .station.stranded i,.station.corrupt i{border-color:var(--bad);background:var(--hatch)} .station.later i,.station.not-in-this-run i{border-color:var(--soft);border-style:dotted}
  .station.gate i{width:18px;height:18px;margin-top:2px;border-width:4px} .station.hard i{border-radius:2px;width:16px;height:16px;margin-top:3px}
  .station.soft i{border-style:dashed}
  .station b{font-size:10.5px;font-weight:500;margin-top:5px;text-align:center;white-space:nowrap}
  .station small{font:10px var(--mono);color:var(--mute)}
  /* the line's replay: a control top right, a bar under the heading while replaying */
  .line h2 .r{margin-left:auto}
  .rpbtn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border:1px solid var(--rule2);border-radius:5px;background:var(--panel);color:var(--ink-2);cursor:pointer;flex:none}
  .rpbtn svg{width:13px;height:13px}
  .rpbtn:hover{color:var(--now);border-color:var(--now-bd);background:var(--now-bg)}
  .rpbtn:focus-visible,.rplive:focus-visible{outline:2px solid var(--now);outline-offset:1px}
  .rpbtn:disabled{opacity:.35;cursor:default} .rpbtn:disabled:hover{color:var(--ink-2);border-color:var(--rule2);background:var(--panel)}
  .rpbtn[aria-busy="true"]{opacity:.5;cursor:progress} .rpbtn.err{color:var(--warn);border-color:var(--warn-bd)}
  #line-replay[aria-pressed="true"]{color:var(--now);border-color:var(--now-bd);background:var(--now-bg)}
  .line.replaying{border-color:var(--warn-bd);box-shadow:0 0 0 2px var(--warn-bg)}
  .rp{display:flex;align-items:center;gap:6px;margin:0 0 8px;font:11px/1.3 var(--font);flex-wrap:wrap}
  .rptag{font-weight:600;letter-spacing:.07em;font-size:9.5px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:4px;padding:2px 5px}
  .rpcount{font:10.5px var(--mono);color:var(--mute);white-space:nowrap}
  .rpcap{font:10.5px var(--mono);color:var(--ink-2);flex:1 1 260px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rpcap.fail{color:var(--bad);font-weight:600}
  .rplive{font:inherit;font-size:11px;padding:3px 10px;border:1px solid var(--now-bd);border-radius:5px;background:var(--now-bg);color:var(--now);cursor:pointer;font-weight:600}
  .station.irrev-after{border-right:1px dashed var(--bad);padding-right:4px}
  /* main grid */
  /* three columns: before the tag · after the tag · the stream. The gutters set
     the widths by drag (persisted); double-click a gutter to reset. */
  .main{display:grid;grid-template-columns:minmax(0,var(--c1,2fr)) 18px minmax(0,var(--c2,1fr)) 14px minmax(0,var(--c3,1fr));gap:8px;min-height:0;min-width:0}
  /* 2fr : 1fr : 1fr, and the asymmetry is semantic rather than cosmetic. The
     left column is the REVERSIBLE region — preflight, the build lanes, CI,
     ratchets — which is where you diagnose, and diagnosis needs evidence on
     screen. The middle only has to confirm that an irreversible act landed,
     and the stream's natural width is a line of monospace: past ~80 columns
     extra width there is wasted, not used. The left has no such ceiling. */
  .col{display:grid;gap:8px;align-content:start;min-width:0}
  .gutter{cursor:col-resize;user-select:none;touch-action:none;border-radius:4px}
  .gutter:hover,.gutter.dragging{background:var(--now-bg)}
  .divider{writing-mode:vertical-rl;text-orientation:mixed;display:flex;align-items:center;justify-content:center;color:var(--bad);font:600 9px var(--font);letter-spacing:.14em;
    border-left:2px solid var(--bad);background:var(--bad-bg);border-radius:4px;opacity:1}
  .gutter.plain{border-left:1px solid var(--rule2);opacity:.7}
  .caphead{font:600 9px var(--font);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;padding:1px 3px 0}
  .caphead b{color:var(--ink-2);font-weight:600}
  /* Taken out of the flex flow: `margin-left:auto` only pushes it to the right
     of whatever WRAPPED LINE it lands on, which on a busy header is the middle
     of row two. Top-right means top-right. */
  .themetog{position:absolute;top:7px;right:10px;display:flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border:1px solid var(--rule2);border-radius:7px;background:var(--panel);color:var(--ink-2);cursor:pointer}
  .themetog:hover{color:var(--now);border-color:var(--now-bd);background:var(--now-bg)}
  .themetog svg{width:15px;height:15px;display:block}
  /* ── History tab: every invocation of every release (docs/design-release-board.md §9) ── */
  .seg{display:inline-flex;border:1px solid var(--rule2);border-radius:7px;overflow:hidden}
  .seg button{font:inherit;font-size:11px;padding:3px 10px;border:0;background:var(--panel);color:var(--ink-2);cursor:pointer}
  .seg button+button{border-left:1px solid var(--rule2)}
  .seg button[aria-pressed="true"]{background:var(--now-bg);color:var(--now);font-weight:600}
  .screen[data-view="history"]>:not(#top):not(#pane-history):not(#fault){display:none}
  .screen:not([data-view="history"])>#pane-history{display:none}
  #pane-history{max-height:none;resize:none}
  .hist-sum{display:flex;flex-wrap:wrap;gap:8px 18px;margin:2px 0 8px;color:var(--ink-2)}
  .hist-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
  .hist-wrap{display:flex;align-items:flex-start}
  .hist-ctl{display:flex;align-items:flex-end;margin:0 0 4px}
  .hist-ctl-l{flex:1 1 auto}
  .hist-ctl-r{flex:none;display:flex;flex-direction:column;gap:5px;padding-right:10px;box-sizing:border-box}
  .hist-ctl-r .seg{align-self:flex-start}   /* as wide as its labels, not the column */
  /* the slider one size down: a thin track and a small thumb, quieter than the control it serves */
  .hist-ctl-r input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;margin:0;background:transparent;cursor:pointer}
  .hist-ctl-r input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--rule2)}
  .hist-ctl-r input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--rule2)}
  .hist-ctl-r input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4px;border-radius:50%;background:var(--panel);border:1.5px solid var(--now);box-sizing:border-box}
  .hist-ctl-r input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--panel);border:1.5px solid var(--now);box-sizing:border-box}
  .hist-ctl-r input[type=range]:focus-visible{outline:2px solid var(--now);outline-offset:2px;border-radius:3px}
  .hist-ver{color:var(--ink-2);font-size:10.5px;line-height:1.35;min-height:2.7em}
  .hist-scroll{flex:1 1 auto;min-width:0;overflow-x:auto;padding-bottom:4px}
  .hist-fixed{flex:none;border-right:1px solid var(--rule)}
  .hist-svg{display:block;font:10.5px var(--font)}
  .hist-svg text:not([fill]){fill:var(--ink-2)}
  .hist-live .pulse{transform-box:fill-box;transform-origin:center;opacity:0}
  .hist-live.running.fresh .pulse{animation:rb-hist-pulse 1.4s ease-out infinite}
  .hist-live.running.stale .dot{fill:var(--warn);stroke:none}
  @keyframes rb-hist-pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(3.4);opacity:0}}
  .hist-svg .rowlab{fill:var(--ink)}
  .hist-svg .muted{fill:var(--mute)}
  .hist-svg .rel{cursor:pointer}
  .hist-svg .rel:focus:not(:focus-visible){outline:none}
  .hist-svg .rel:hover text,.hist-svg .rel.sel text{fill:var(--now);font-weight:600}
  /* Four equal columns, as wide as the widest needs and no wider: the controls' box takes
     one, the attempts + key box the other three through subgrid (owner, 8 Oct 2026).
     width:max-content sizes each 1fr track to the largest max-content contribution. */
  .hist-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:max-content;max-width:100%;column-gap:12px;align-items:stretch;margin:0 0 6px}
  .hist-head .hist-ctl{grid-column:1;min-width:0;margin:0;align-items:flex-start;padding:8px 12px 9px;border:1px solid var(--rule2);border-radius:6px;background:var(--panel)}
  .hist-head .hist-ctl-r{width:100% !important;padding-right:0;min-width:0}
  .hist-head .hist-ctl-l{display:none}
  .hist-ctl .hist-key{display:block;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 2px}
  .hist-legend{grid-column:2/5;min-width:0;display:grid;grid-template-columns:subgrid;align-items:start;padding:8px 12px 9px;border:1px solid var(--rule2);border-radius:6px;background:var(--panel);color:var(--ink-2);font-size:10.5px;line-height:1.35}
  .hist-legend .hist-sum{grid-column:1;min-width:0;flex-direction:column;flex-wrap:nowrap;gap:3px;margin:0;padding-right:12px;border-right:1px solid var(--rule);font-size:11px;align-self:stretch}
  .hist-keygrid{grid-column:2/4;min-width:0;display:grid;grid-template-columns:subgrid;row-gap:3px}
  .hist-legend .hist-key{grid-column:1/-1;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 2px}
  .hist-legend svg{vertical-align:-3px;margin-right:5px}
  @media (max-width: 760px){ .hist-head{grid-template-columns:minmax(0,1fr);width:auto;row-gap:10px} .hist-legend{grid-column:1;display:block} .hist-legend .hist-sum{border-right:0;padding-right:0;margin-bottom:8px} .hist-keygrid{grid-template-columns:minmax(0,1fr)} }
  .hist-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px 24px;margin-top:6px}
  .hist-cols h3{font-size:11px;margin:4px 0 6px;font-weight:600}
  table.hist-t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  table.hist-t th,table.hist-t td{text-align:left;padding:3px 8px 3px 0;border-bottom:1px solid var(--rule);vertical-align:top}
  table.hist-t th{color:var(--mute);font-weight:500}
  table.hist-t td.n,table.hist-t th.n{text-align:right}
  table.hist-t th button.sort{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  table.hist-t th button.sort:hover{color:var(--ink)}
  table.hist-t th[aria-sort="ascending"] button.sort,table.hist-t th[aria-sort="descending"] button.sort{color:var(--ink);font-weight:600}
  table.hist-t td.bar-cell{min-width:64px}
  table.hist-t td:first-child{white-space:nowrap}
  .cellbar{display:block;height:3px;margin-top:2px;background:var(--rule);border-radius:2px;overflow:hidden}
  .cellbar i{display:block;height:100%;background:var(--bad);border-radius:2px}
  ol.hist-ms{margin:0;padding-left:20px}
  ol.hist-ms li{margin:0 0 3px}
  ol.hist-ms code{font:10.5px var(--mono);color:var(--mute)}
  .hist-sel{margin:6px 0 0;color:var(--ink-2)}
  .hist-insp{flex:0 0 280px;box-sizing:border-box;overflow-y:auto;border-left:1px solid var(--rule);padding:4px 0 8px 14px;margin-left:12px;color:var(--ink-2);font-size:11px;line-height:1.4}
  .hist-slrow{display:flex;align-items:center;gap:8px} .hist-slrow input{flex:1 1 auto;min-width:40px}
  .hist-vershort{flex:none;font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .hist-insp .hist-key-2{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
  .hist-insp .hist-ver{min-height:0;font-size:11px}
  .hist-insp .hist-key{display:block;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
  .hist-insp-body>b{color:var(--ink);font:600 12px var(--mono)}
  .hist-insp ul{margin:8px 0 0;padding-left:14px} .hist-insp li{margin:0 0 6px}
  @media (max-width: 900px){ .hist-wrap{flex-wrap:wrap} .hist-insp{flex:1 1 100%;height:auto !important;max-height:260px;border-left:0;border-top:1px solid var(--rule);margin:8px 0 0;padding:8px 0 0} }
  .hist-sel li{margin:2px 0}
  /* the activity band: one skinny full-width row under the line — events belong to the whole process */
  .band{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:4px 14px;display:flex;align-items:center;gap:12px;min-height:30px}
  .band h2{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.07em;color:var(--mute);text-transform:uppercase;white-space:nowrap}
  .band h2 b{color:var(--ink);font-weight:600;letter-spacing:0;text-transform:none;font-size:11.5px;margin-left:8px}
  .band .r{font:10px var(--mono);color:var(--mute);white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .band .strip{flex:1 1 0;min-width:0;height:22px;gap:0;overflow:hidden}
  .band .strip i{flex:1 1 0;min-width:0;border-radius:0;border-right:1px solid var(--panel);box-sizing:border-box}
  .band .strip.dense i{border-right:0}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;resize:vertical;overflow:auto;min-height:44px;max-height:520px}
  .panel h2{margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;color:var(--mute);text-transform:uppercase;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .panel h2 b{color:var(--ink);font-weight:600;letter-spacing:0;text-transform:none;font-size:11.5px}
  .panel h2 .r{margin-left:auto;font:10px var(--mono);color:var(--mute);letter-spacing:0;text-transform:none}
  .nodata{color:var(--mute);font-style:italic;padding:4px 0}
  /* idle: the pane's (or element's) inputs have not been written yet — the third
     state as contrast, not just as text. Anything that HAPPENED (fail, skip,
     ran-no-sink) is full contrast. The transition is the fill-in on a live update. */
  .panel,.band,.station,.ch,.cell,.chip,.rat{transition:opacity .6s ease}
  .panel.idle,.band.idle{opacity:.42}
  .station.idle,.ch.idle,.chip.idle,.cell.idle{opacity:.38}
  @media (prefers-reduced-motion: reduce){ .panel,.band,.station,.ch,.cell,.chip,.rat{transition:none} }
  /* live: motion carries liveness, and every motion is driven by a stamp that expires */
  /* TWO ANIMATIONS, TWO MEANINGS, and they must not be confused:
     rb-pulse / .is-now = WHERE THE WORK IS, a state that persists;
     rb-glisten         = THIS JUST CHANGED, an event that passes.

  .ok>.dot{background:var(--ok)} .bad>.dot,.fail>.dot{background:var(--bad)} .warn>.dot{background:var(--warn)} .now>.dot,.running>.dot{background:var(--now);box-shadow:0 0 0 3px var(--now-bd)}

  .unreachable>.dot{border-color:var(--warn)} .stranded>.dot,.corrupt>.dot{background:var(--hatch);border-color:var(--bad)}
  .steps{display:grid;grid-template-columns:34px 1fr 150px 48px;gap:2px 8px;align-items:center;font-size:11px}
  .steps .k{font:10px var(--mono);color:var(--mute)}

  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:3px}

  .t{font:10px var(--mono);color:var(--mute);text-align:right}
  .sub{margin:2px 0 4px 34px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px 10px;font-size:10px;color:var(--mute)}

  .gate small{font-family:var(--mono);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ratchets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

  .ch.ok{border-color:var(--ok-bd)} .ch.bad{border-color:var(--bad-bd)} .ch.unreachable{border-color:var(--unknown-bd);background:var(--unknown-bg);color:var(--unknown)} .ch.no-data,.ch.skipped{opacity:.7;background:var(--hatch)}

  .ch.ok .n .dot{background:var(--ok)} .ch.bad .n .dot{background:var(--bad)} .ch.unreachable .n .dot{background:var(--warn)}
  .ch.no-data .n .dot,.ch.skipped .n .dot{background:transparent;border-color:var(--skip)}

  #pane-log{display:flex;flex-direction:column;min-height:160px;height:320px}
  #pane-log pre.logtail{flex:1;min-height:0;overflow:auto;background:var(--panel-2);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
  #pane-log select{font:10.5px var(--font);max-width:260px}
  #pane-log .follow{color:var(--now);font:10px var(--mono)}

  .conf ul{margin:0;padding-left:16px} .conf li{margin:1px 0} .conf h3{margin:6px 0 2px;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}

<body>
<div class="screen" id="screen"><div class="top"><h1>Release board</h1><span class="m">rendering…</span></div></div>
<script type="application/json" id="board-data">__BOARD_JSON__</script>
<script>

  var lineEl = function(data){

  var lh = $("h2"); add(lh, $("span",null,"THE LINE"), $("b",null, data.line.source==="steps.tbl" ? "steps.tbl" : "ledger order (no steps.tbl)"), $("span","r", (data.line.stations.length)+" stations"+(data.line.unknown_steps.length?" · "+data.line.unknown_steps.length+" unknown":"")+(data.line.ledger_unparsed?" · "+data.line.ledger_unparsed+" unparsed":"")+(data.line.ledger_partial?" · partial line":"")));

  };
  var render = function(data, root){
  var L = data.links || {channels: {}};

    // performs while reading 46 rows. Shown, and still in the title for the

    var p = $("span","pill warn", "past run · read-only · "); var a = $("button", "pastback", "back to v"+data.live.live_run); a.type = "button";
    a.addEventListener("click", function(){ var q = new URLSearchParams(location.search); q.delete("run"); location.search = q.toString(); });   // a button, not an href: the template sets href in one place

  add(top, $("span","pill "+(conf.computable ? (conf.count ? "warn" : "ok") : "hatch"), conf.computable ? ("confounded expectations: "+conf.count) : "confounded log: not computable"));
  // Theme override. The board follows the browser unless someone says
  // otherwise; the attribute is only ever set when they have. Alt-click clears
  // it, because "go back to following my system" is a real thing to want and
  // burying it in a second control is not worth the chrome.
  //
  // createElementNS, not innerHTML: the renderer has a no-DOM-sinks gate
  // because this board displays raw build logs, and a sink that is safe today

  (function(){

            if (!r.ok || !j.frames) throw new Error(j && j.error || "HTTP "+r.status);
            return j;
          });
        })
        .then(function(j){
          b.removeAttribute("aria-busy");
          if (!j.frames.length) throw new Error("no frames");
          pause();
          var att = 0, attempts = j.frames.map(function(f){ if (/^\S+\s+run started\b/.test(f.caption)) att++; return att; });
          rp = {frames: j.frames, at: 0, timer: null, attempts: attempts, ctl: rp && rp.ctl || buildCtl()};
          show(0);
          if (!reduced()) play();
        })
        .catch(function(e){ b.removeAttribute("aria-busy"); b.classList.add("err"); b.title = "replay unavailable — "+(e && e.message ? e.message : e); b.setAttribute("aria-label", b.title); });
    };
    lineHook = function(h2, data){
      var b = btn("replay", "replay this run — the whole board, every attempt, about 10 s", "line-replay");
      b.setAttribute("aria-pressed", String(!!rp));
      b.addEventListener("click", function(){ open(b); });
      add(h2, b);
    };
    document.addEventListener("keydown", function(e){
      if (!rp || e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target && e.target.tagName; if (t === "INPUT" || t === "SELECT" || t === "TEXTAREA" || (t === "BUTTON" && (e.key === " " || e.key === "Enter"))) return;
      if (e.key === "ArrowLeft") { pause(); show(rp.at - 1); e.preventDefault(); }
      else if (e.key === "ArrowRight") { pause(); show(rp.at + 1); e.preventDefault(); }
      else if (e.key === " ") { if (rp.timer) pause(); else play(); e.preventDefault(); }
      else if (e.key === "Escape") { exit(); e.preventDefault(); }
    });
  })();

  var latest = null;
  if (payload.replay) {
    // ── replay scrubber: a design tool over real frames; never on the real board ──
    var frames = payload.replay, at = frames.length - 1;
    var bar = document.createElement("div"); bar.id = "replay";
    bar.style.cssText = "position:fixed;right:12px;bottom:12px;z-index:9;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--panel);border-radius:20px;padding:6px 10px 6px 14px;font:11px/1.3 -apple-system,system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:70vw";
    var mk = function(t, title){ var b = document.createElement("button"); b.textContent = t; b.title = title; b.style.cssText = "background:var(--rule2);color:var(--panel);border:0;border-radius:14px;width:28px;height:28px;font-size:14px;cursor:pointer"; return b; };
    var prev = mk("‹", "previous ledger line (←)"), next = mk("›", "next ledger line (→)");
    var lab = document.createElement("span"); lab.style.cssText = "font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
    var tag = document.createElement("span"); tag.textContent = "REPLAY · liveness assumed"; tag.style.cssText = "font-weight:600;letter-spacing:.06em;font-size:9.5px;color:var(--warn)";
    bar.appendChild(tag); bar.appendChild(prev); bar.appendChild(lab); bar.appendChild(next);
    var show = function(i){
      at = Math.max(0, Math.min(frames.length - 1, i));
      var y = window.scrollY; render(frames[at].model); window.scrollTo(0, y);
      latest = frames[at].model; if (typeof tick === "function") tick();
      lab.textContent = "frame "+at+" of "+frames[at].of+" · "+frames[at].caption;
      prev.disabled = at === 0; next.disabled = at === frames.length - 1;
      prev.style.opacity = prev.disabled ? .35 : 1; next.style.opacity = next.disabled ? .35 : 1;
      document.body.appendChild(bar);
    };
    prev.addEventListener("click", function(){ show(at - 1); });
    next.addEventListener("click", function(){ show(at + 1); });
    document.addEventListener("keydown", function(e){ if (e.key === "ArrowLeft") show(at - 1); else if (e.key === "ArrowRight") show(at + 1); });
    show(at);
  } else {
    render(payload);
  }

  // ── the tick: ages count, running elapsed counts, freshness expires ────────
  var PANE_FRESH_S = 10; if (!payload.replay) latest = payload;
  // release.sh writes a heartbeat every cadence_s (300 by default) and calls a run stranded after three; the page agrees
  var hbStaleS = function(lv){ var c = lv && lv.heartbeat && lv.heartbeat.cadence_s; return 3 * (c || 300); };
  var tick = function(){
    var now = Date.now();
    var els = document.querySelectorAll("[data-ts]");
    for (var i = 0; i < els.length; i++) { els[i].textContent = age(els[i].getAttribute("data-ts")); var pane = els[i].closest(".panel"); if (pane) pane.classList.toggle("fresh", (now - Date.parse(els[i].getAttribute("data-ts")))/1000 < PANE_FRESH_S); }
    var since = document.querySelectorAll("[data-since]");
    var clock = latest && latest.now ? Date.parse(latest.now) : now;   // a replay frame keeps its own clock
    if (rp) clock = rp.frames[rp.at].model.now ? Date.parse(rp.frames[rp.at].model.now) : now;   // a replayed frame keeps its own clock
    for (var j = 0; j < since.length; j++) since[j].textContent = "running · "+elapsed((clock - Date.parse(since[j].getAttribute("data-since")))/1000)+(since[j].getAttribute("data-attempt") ? " · #"+since[j].getAttribute("data-attempt") : "");
    var lv = latest && latest.liveness, fresh = false;
    if (lv && lv.replay) fresh = true;
    else if (lv && lv.heartbeat && isFinite(lv.heartbeat.epoch)) fresh = (now/1000 - lv.heartbeat.epoch) < hbStaleS(lv);
    else if (lv && lv.alive && latest.header && latest.header.newest_source) fresh = (now - Date.parse(latest.header.newest_source))/1000 < hbStaleS(lv);  // a pid exists (maybe recycled), no heartbeat: trust it only while something is being written
    var run = document.querySelectorAll(".station.running, .hist-live.running");
    for (var k = 0; k < run.length; k++) { var f2 = fresh || !!rp; run[k].classList.toggle("fresh", f2); run[k].classList.toggle("stale", !f2); }   // a replayed frame's liveness is assumed
    var pill = document.getElementById("live-pill"); if (pill && latest && latest.live && !pill.getAttribute("data-unreachable")) pill.classList.toggle("stale", (now - Date.parse(latest.live.served_at))/1000 > 3 * (latest.live.poll_ms/1000) + 10);
  };
  tick(); setInterval(tick, 1000);

  if (!payload.replay && payload.live && !payload.live.past) {   // a past run is read once and never patched from this run's stream
    // ── live: SSE says "changed", the page fetches board.json and swaps only the panes whose data moved ──
    var slices = function(d){
      var m = {top: [d.version, d.phase, d.header, d.liveness && {lock: d.liveness.lock, alive: d.liveness.alive, pid: d.liveness.pid, hbs: d.liveness.heartbeat && d.liveness.heartbeat.state}, d.confounded.count, d.confounded.computable, d.live && d.live.error],
               line: d.line, "pane-activity": d.activity, "pane-preflight": d.preflight, "pane-ci": d.ci, "pane-ratchets": d.ratchets, "pane-tag": d.tag,
               "pane-channels": d.channels, "pane-clocks": d.clocks, "pane-confounded": d.confounded, "pane-log": [d.log_index, d.log_focus], "pane-events": [d.events, d.events_total, d.sink], "pane-history": [d.history, (d.line && d.line.stations || []).filter(function(s){ return /running|stranded|corrupt/.test(s.state); }).map(function(s){ return s.id+":"+s.state; }), d.liveness && [d.liveness.lock, d.liveness.alive], d.header && d.header.completed]};
      (d.build.lanes || []).forEach(function(l){ m["pane-build-"+l.id] = l; });
      return m;
    };
    var K = payload.live.token ? "?k="+encodeURIComponent(payload.live.token) : "";
    var unreachable = function(why){ var p = document.getElementById("live-pill"); if (!p) return; p.setAttribute("data-unreachable", "1"); p.classList.add("stale"); p.textContent = "live · unreachable — "+why; };
    var reachable = function(){ var p = document.getElementById("live-pill"); if (p) p.removeAttribute("data-unreachable"); };
    // the log pane never swaps: its pre is updated in place so the reader's scroll survives, and it
    // follows the bottom only while the reader is already there
    var setLog = function(sid, lines){
      var pre = document.querySelector("#pane-log pre.logtail"); if (!pre) return;
      var atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 24;
      var text = lines.join("\n"); if (pre.textContent === text && pre.getAttribute("data-log") === sid) return;
      pre.setAttribute("data-log", sid); pre.textContent = text;
      if (atBottom) pre.scrollTop = pre.scrollHeight;
    };
    var fetchLog = function(sid){
      if (typeof fetch !== "function" || !sid) return;
      fetch("/log/"+encodeURIComponent(sid)+K, {cache: "no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ if (j && j.tail) setLog(sid, j.tail); else if (j === null) setLog(sid, ["(no tail — "+sid+" has no log the server can read)"]); }).catch(function(){});
    };
    window.__showLog = function(sid){ var e = latest && latest.logs && latest.logs[sid]; if (e && e.tail) setLog(sid, e.tail); else fetchLog(sid); };
    if (payload.log_focus && !(payload.logs && payload.logs[payload.log_focus] && payload.logs[payload.log_focus].tail)) fetchLog(payload.log_focus);
    var patch = function(next){
      if (latest && latest.live && next.live && next.live.generation < latest.live.generation) return;  // an older pull landing after a newer one
      if (rp) { latest = next; return; }   // the board under replay is the reader's; "back to live" draws the newest model
      var sN = slices(next), sO = slices(latest), ids = Object.keys(sN);
      var sameShape = ids.length === Object.keys(sO).length && ids.every(function(id){ return id in sO; });
      if (!sameShape) { render(next); latest = next; tick(); return; }
      var stamp = function(){
        var hbEl = document.querySelector("[data-hb] [data-ts]"); if (hbEl && next.liveness && next.liveness.heartbeat && isFinite(next.liveness.heartbeat.epoch)) hbEl.setAttribute("data-ts", new Date(next.liveness.heartbeat.epoch*1000).toISOString());
        var pill = document.getElementById("live-pill"); if (pill) { var pa = pill.querySelector("[data-ts]"); if (pa && next.live) pa.setAttribute("data-ts", next.live.served_at); }
      };
      var moved = ids.filter(function(id){ return JSON.stringify(sN[id]) !== JSON.stringify(sO[id]) });
      if (!moved.length) { stamp(); latest = next; tick(); return; }   // nothing to draw: no detached render, but the stamps still move
      var tmp = document.createElement("div"); render(next, tmp);
      moved.forEach(function(id){
        var o = document.getElementById(id), n = tmp.querySelector("#"+(window.CSS && CSS.escape ? CSS.escape(id) : id));
        if (o && n) { o.replaceWith(n); n.classList.add("changed"); }
      });
      // the focused log's tail refreshes every pull whether or not the pane moved; the reader keeps their place
      var sid = (window.__logPick && next.log_index && next.log_index[window.__logPick]) ? window.__logPick : next.log_focus;
      if (sid) { var e = next.logs && next.logs[sid]; if (e && e.tail) setLog(sid, e.tail); else if (moved.indexOf("pane-log") >= 0) fetchLog(sid); }
      stamp();
      latest = next; tick();
    };
    var pull = function(){
      if (typeof fetch !== "function") return;
      var net = function(e){ var n = new Error("network — "+(e && e.message ? e.message : e)); n.network = true; throw n; };
      fetch("/board.json"+K, {cache: "no-store"}).catch(net).then(function(r){
        if (r.ok) return r.json().catch(net);
        return r.text().then(function(t){ var h = new Error("HTTP "+r.status+(t ? " — "+t.slice(0, 160) : "")); h.network = true; throw h; });
      }).then(function(j){ if (j && j.live) { reachable(); patch(j); } })
        .catch(function(e){ if (e && e.network) unreachable(e.message); else fault(e); });   // a renderer fault is not a network fault
    };
    var es = null;
    try { if (typeof EventSource === "function") { es = new EventSource("/events"+K); es.onmessage = function(){ pull(); }; es.onerror = function(){ /* the browser reconnects; the safety poll covers the gap and marks unreachable */ }; } } catch(e4) {}
    setInterval(pull, Math.max(2000, (payload.live.poll_ms || 1000) * (es ? 10 : 2)));
  }
  } catch (err) {
    fault(err);
    throw err;
  }
})();
</script>
</body>
</html>
